it:</strong> Agree rules of engagement; communication norms; regular meeting cadence; Plus/Delta reviews</li>\n</ul>\n", "qa": [{"q": "What is the fundamental difference between a group and a team?", "a": "A <strong>group</strong> has <em>independent tasks</em> — one person's performance does not directly affect others (e.g., passengers on a flight).<br/>A <strong>team</strong> has <em>interdependent tasks</em> — members depend on each other to achieve a shared goal (e.g., the flight crew). If one team member fails to deliver, the entire team's outcome is affected."}, {"q": "What are the four merits of working in teams?", "a": "<ul><li><strong>Efficiency and Synergy:</strong> Parallel working and complementary skills create results greater than the sum of individual contributions (2+2=5)</li><li><strong>Focus:</strong> Members specialise; the team leader keeps sight of the strategic goal</li><li><strong>Job Satisfaction:</strong> Sense of belonging, peer support, shared pride in achievement increases engagement</li><li><strong>Control:</strong> Team norms and peer expectations guide behaviour more naturally than formal management alone</li></ul>"}, {"q": "What is the ideal team size and why?", "a": "Research supports <strong>3 to 5 members</strong> as optimal. This size provides sufficient diversity of skills and perspectives while remaining small enough to coordinate efficiently. Larger teams suffer disproportionate time costs in communication, alignment, and meetings — and are more prone to social loafing (some members contributing less without it being noticed)."}]}, {"id": "b14", "icon": "🧠", "title": "Decision Making", "subtitle": "3 Individual Biases · 3 Team Biases · Flare-Focus-Follow Through", "theory": "\n<h4>Three Individual Decision-Making Biases</h4>\n<ul>\n<li><strong>Overconfidence Bias:</strong> We overestimate our own ability and judgement (nearly all drivers believe they are above average)</li>\n<li><strong>Anchoring:</strong> We lock onto the first piece of information we receive and adjust insufficiently from it, even when new data contradicts it</li>\n<li><strong>Confirmation Bias:</strong> We actively seek information that confirms our existing view and discount contradictory evidence</li>\n</ul>\n<div class=\"kbox\"><strong>Counter-measures</strong>Ask \"What if this assumption is NOT true?\" Document assumptions and test each one. In group settings, the senior person should speak LAST to prevent others from simply agreeing with authority.</div>\n<h4>Three Team Decision-Making Biases</h4>\n<ul>\n<li><strong>Sunk Cost Bias:</strong> Continuing to invest in a failing project because of what has already been spent (\"throwing good money after bad\")</li>\n<li><strong>Loss Aversion (Prospect Theory):</strong> People are more motivated to avoid a loss than to make an equivalent gain — leads to excessive risk-taking to recover losses</li>\n<li><strong>Escalation of Commitment:</strong> Increasing commitment to a failing course to avoid appearing a poor decision-maker</li>\n</ul>\n<h4>Flare – Focus – Follow Through Model</h4>\n<ul>\n<li><strong>Flare:</strong> Create choices — widen the aperture; generate diverse options; resist premature convergence on a single solution</li>\n<li><strong>Focus:</strong> Make choices — evaluate using a Decision Matrix (benefits, risks, and risk mitigation for each option)</li>\n<li><strong>Follow Through:</strong> Implement — assign clear accountability (who does what by when) and track execution</li>\n</ul>\n", "qa": [{"q": "Name and describe three individual cognitive biases that cause decision disasters.", "a": "<strong>1. Overconfidence:</strong> Overestimating one's judgement and abilities (e.g., almost all MBA students believe they will be top performers even though only 10% can be).<br/><strong>2. Anchoring:</strong> Locking onto the first piece of information received and adjusting only minimally from it, even when better data emerges.<br/><strong>3. Confirmation Bias:</strong> Selectively seeking evidence that confirms existing views and dismissing contradictory information."}, {"q": "Explain the sunk cost bias and give an organisational example.", "a": "The sunk cost bias occurs when decision-makers continue investing in a failing project because of the resources <em>already spent</em>, rather than evaluating whether future investment will generate future value.<br/><br/>Example: A company continues funding a failing IT project after spending £5m because \"we can't write off what we've already invested.\" The correct decision is to evaluate only <em>future</em> costs vs benefits, treating past expenditure as irretrievable."}, {"q": "Explain the Flare–Focus–Follow Through model for team decisions.", "a": "<strong>Flare:</strong> First, create choices — explore all possible options; widen the aperture before narrowing. Resist the urge to immediately solve.<br/><strong>Focus:</strong> Then, make choices — evaluate options using a Decision Matrix: list benefits, risks, and mitigation strategies for each option.<br/><strong>Follow Through:</strong> Finally, implement — assign explicit accountability for each action (who does what by when) and monitor execution against it."}]}, {"id": "b15", "icon": "⚔️", "title": "Conflict Management", "subtitle": "Constructive vs Destructive · Bell & Hart 8 Causes · 5 Behaviours · 3-Step Resolution", "theory": "\n<h4>Constructive vs Destructive Conflict</h4>\n<ul>\n<li><strong>Constructive:</strong> Focused on issues, not personalities. Benefits: creates innovation; surfaces problems; clarifies authority and responsibility boundaries.</li>\n<li><strong>Destructive:</strong> Personal and ad hoc. Harms: causes alienation; demoralises individuals and teams; damages working relationships and organisational performance.</li>\n</ul>\n<h4>Bell &amp; Hart's 8 Causes of Conflict</h4>\n<ul>\n<li><strong>Resources</strong> – Competition for shared assets</li>\n<li><strong>Styles</strong> – Different working approaches causing friction</li>\n<li><strong>Perceptions</strong> – Differing views on events (\"office politics\")</li>\n<li><strong>Goals</strong> – Conflicting team objectives (speed vs quality)</li>\n<li><strong>Pressures</strong> – Different deadlines causing one team to obstruct another</li>\n<li><strong>Roles</strong> – Overstepping into others' responsibilities</li>\n<li><strong>Personal Values</strong> – Asked to act against personal ethics</li>\n<li><strong>Unpredictable Policies</strong> – Inconsistent management decisions causing confusion</li>\n</ul>\n<h4>5 Common Conflict Behaviours</h4>\n<ul>\n<li><strong>Fight:</strong> Push back aggressively; amplify your position</li>\n<li><strong>Escape (Flight):</strong> Avoid the conflict entirely</li>\n<li><strong>Give Up:</strong> Disengage; show indifference</li>\n<li><strong>Compromise:</strong> Find middle ground (may produce lowest common denominator)</li>\n<li><strong>Collaborate:</strong> Explore disagreements and find a jointly superior solution (most effective for complex, important conflicts)</li>\n</ul>\n<h4>3-Step Conflict Resolution Process</h4>\n<ul>\n<li><strong>Diagnose:</strong> Is this about issues or personalities? How big is the problem? What does success look like?</li>\n<li><strong>Act &amp; Listen:</strong> Share all information freely; respect diverse perspectives; mine for conflict (draw out quiet voices); flare options before focusing</li>\n<li><strong>Reflect (Plus/Delta):</strong> After each meeting — what went well (plus)? What should change (delta)?</li>\n</ul>\n", "qa": [{"q": "Distinguish between constructive and destructive conflict.", "a": "<strong>Constructive conflict</strong> is positive and issue-focused. It creates innovation, surfaces hidden problems, and clarifies roles. The disagreement is about ideas or approaches — not people.<br/><br/><strong>Destructive conflict</strong> is personal, ad hoc, and individual-focused. It causes alienation, damages morale and relationships, and ultimately harms organisational performance. The aim should always be to keep conflict constructive."}, {"q": "Name Bell &amp; Hart's eight causes of conflict.", "a": "<strong>Resources, Styles, Perceptions, Goals, Pressures, Roles, Personal Values, Unpredictable Policies.</strong><br/>Mnemonic: <em>Really Smart People Generally Pick Reasonable Values Usually.</em>"}, {"q": "When is collaboration the preferred conflict behaviour and when is compromise more appropriate?", "a": "<strong>Collaboration</strong> is best when: the conflict is complex and important; both parties' interests are genuinely significant; a creative solution exists that meets both parties' needs; there is sufficient time to explore options thoroughly.<br/><br/><strong>Compromise</strong> is more appropriate when: a quick decision is needed; the issue is moderate in importance; both parties can give something up without major harm; a \"good enough\" solution is acceptable."}]}, {"id": "b16", "icon": "📣", "title": "Effective Business Communication", "subtitle": "Communication Process · Barriers · Hoppe's 6 Active Listening Skills · Non-verbal", "theory": "\n<h4>The Communication Process</h4>\n<p><strong>Sender → Encode → Channel → Decode → Receiver → Feedback</strong>. Feedback confirms whether the message was received as intended. \"Noise\" at any stage distorts communication.</p>\n<h4>Common Barriers to Communication</h4>\n<ul>\n<li>Emotional language (anger, fear, excitement distorting the message)</li>\n<li>Language differences or cultural communication style differences</li>\n<li>Physical noise interfering with reception</li>\n<li>Information overload or complexity</li>\n<li>Poor choice of channel for the importance of the message</li>\n<li>Technical failure causing information loss</li>\n<li>Recipient unwilling or not ready to receive the message</li>\n</ul>\n<h4>Hoppe's Six Skills of Active Listening</h4>\n<ul>\n<li><strong>1. Pay Attention:</strong> Be fully present; manage body language; operate from a place of respect</li>\n<li><strong>2. Withhold Judgment:</strong> Suspend criticism; remain open to new ideas and perspectives</li>\n<li><strong>3. Reflect:</strong> Mirror key points to confirm you understood what was said</li>\n<li><strong>4. Clarify:</strong> Ask open-ended questions to resolve ambiguities</li>\n<li><strong>5. Summarise:</strong> Restate key themes; confirm mutual understanding of actions and responsibilities</li>\n<li><strong>6. Share:</strong> Only after fully understanding the other person's perspective, introduce your own views</li>\n</ul>\n<h4>Non-verbal Communication</h4>\n<p>Facial expressions, eye contact, posture, tone of voice, and gestures often communicate more than words. Non-verbal cues can reveal true feelings even when words say otherwise. Incongruence between verbal and non-verbal signals should prompt a manager to investigate further.</p>\n<div class=\"kbox\"><strong>Channel Selection Principle</strong>The more important, sensitive, or emotionally charged the message, the more face-to-face communication is needed. Critical messages delivered via poor channels (e.g., email for redundancy announcements) cause confusion and emotional damage.</div>\n", "qa": [{"q": "List Hoppe's six active listening skills in sequence.", "a": "<strong>1. Pay Attention</strong> – Be present; manage body language<br/><strong>2. Withhold Judgment</strong> – Stay open; don't rush to critique<br/><strong>3. Reflect</strong> – Mirror key points back to confirm understanding<br/><strong>4. Clarify</strong> – Ask open-ended questions to resolve ambiguity<br/><strong>5. Summarise</strong> – Restate themes; confirm mutual understanding of next steps<br/><strong>6. Share</strong> – Only then introduce your own perspective"}, {"q": "What is 'noise' in the communication process? Give four examples.", "a": "Noise is <em>anything that distorts or prevents effective communication</em> between sender and receiver. Examples:<ul><li><strong>Emotional noise:</strong> Anger making a message seem aggressive when it isn't</li><li><strong>Language barriers:</strong> Different terminology or communication styles</li><li><strong>Physical noise:</strong> Poor phone signal, background machinery noise</li><li><strong>Information overload:</strong> Too much data at once, key message gets lost</li><li><strong>Poor channel choice:</strong> Using a phone call for a major, sensitive announcement</li></ul>"}]}, {"id": "b17", "icon": "💡", "title": "Influence Without Authority", "subtitle": "French & Raven · 5 Power Sources · 5 Influencing Strategies", "theory": "\n<h4>Why This Matters for Finance Professionals</h4>\n<p>Finance professionals regularly need to influence colleagues, project teams, and senior management without having formal authority over them. Political and influencing skills are therefore core competencies in modern management accounting roles.</p>\n<h4>French &amp; Raven's Five Sources of Power</h4>\n<ul>\n<li><strong>Reward Power:</strong> Ability to provide benefits (salary increases, recognition, promotions)</li>\n<li><strong>Coercive Power:</strong> Ability to punish or threaten disciplinary action</li>\n<li><strong>Legitimate Power:</strong> Formal authority derived from position in the hierarchy</li>\n<li><strong>Expert Power:</strong> Power from knowledge, technical skills, and expertise that others rely on</li>\n<li><strong>Referent Power:</strong> Power from being liked, respected, and admired; charisma</li>\n</ul>\n<div class=\"kbox\"><strong>Most Effective for Finance Professionals</strong>Expert power and Referent power are most sustainable when influencing without authority — they don't depend on formal position and build genuine trust and respect over time.</div>\n<h4>Five Influencing Strategies</h4>\n<ul>\n<li><strong>Rational Persuasion:</strong> Present compelling evidence, data, and logical arguments</li>\n<li><strong>Consultation:</strong> Involve others in the decision to build buy-in and ownership</li>\n<li><strong>Inspiring Appeal:</strong> Connect the request to the person's values, aspirations, or ideals</li>\n<li><strong>Coalition Building:</strong> Gain support from respected others to create momentum</li>\n<li><strong>Personal Appeal:</strong> Leverage relationships, friendship, and reciprocity</li>\n</ul>\n", "qa": [{"q": "Name French &amp; Raven's five sources of power and identify which are most useful for finance professionals.", "a": "<strong>1. Reward Power</strong> – Ability to give benefits<br/><strong>2. Coercive Power</strong> – Ability to punish<br/><strong>3. Legitimate Power</strong> – Formal hierarchical authority<br/><strong>4. Expert Power</strong> – Knowledge and expertise<br/><strong>5. Referent Power</strong> – Likability, trust, charisma<br/><br/>For finance professionals without line authority: <strong>Expert power and Referent power</strong> are most effective because they build genuine influence independent of formal position."}, {"q": "Which influencing strategy works best when a resistant colleague needs to adopt a new reporting process?", "a": "Multiple strategies combined are most effective:<ul><li><strong>Rational Persuasion</strong> – Present data on why the new process improves efficiency or reduces errors</li><li><strong>Consultation</strong> – Involve them in refining the process so they have ownership</li><li><strong>Coalition Building</strong> – Get other respected team members or the manager to also advocate for the change</li><li><strong>Inspiring Appeal</strong> – Connect the change to something they value (career development, team success, reduced workload)</li></ul>"}]}, {"id": "b18", "icon": "🤜", "title": "Negotiation", "subtitle": "BATNA · Distributive vs Integrative · Fisher & Ury · Thomas-Kilmann Styles", "theory": "\n<h4>BATNA — Best Alternative to a Negotiated Agreement</h4>\n<p>Your BATNA is the best outcome you can achieve if the current negotiation fails and no deal is reached. Knowing your BATNA sets your walk-away point — never accept less than what your BATNA offers. A strong BATNA gives negotiating confidence; a weak BATNA means you should work on improving alternatives before negotiating.</p>\n<h4>Two Negotiation Approaches</h4>\n<ul>\n<li><strong>Distributive (Win-Lose / Hard Bargaining):</strong> Fixed pie; gains for one party = losses for the other. Adversarial; suits one-off transactions where relationship doesn't matter (e.g., buying a second-hand car).</li>\n<li><strong>Integrative (Win-Win / Principled Negotiation):</strong> Expand the pie by identifying shared interests and creative solutions that satisfy both parties better than their alternatives. Ideal for ongoing relationships (suppliers, employees, clients).</li>\n</ul>\n<h4>Fisher &amp; Ury's Four Principles of Principled Negotiation</h4>\n<ul>\n<li><strong>1. Separate the people from the problem:</strong> Attack the issue, never the person. Protect the relationship while resolving the dispute.</li>\n<li><strong>2. Focus on interests, not positions:</strong> Dig beneath stated demands to understand the underlying needs driving each party's position.</li>\n<li><strong>3. Invent options for mutual gain:</strong> Brainstorm creative solutions before evaluating any. Don't prematurely commit to one approach.</li>\n<li><strong>4. Insist on objective criteria:</strong> Use external fair standards (market rates, legal precedents, independent expert opinion) to evaluate options rather than pure willpower.</li>\n</ul>\n<h4>Thomas-Kilmann Negotiation/Conflict Styles</h4>\n<p>Based on two dimensions: assertiveness and cooperativeness. Five styles: <strong>Competing</strong> (assertive, uncooperative), <strong>Collaborating</strong> (assertive, cooperative — ideal for complex issues), <strong>Compromising</strong> (middle), <strong>Avoiding</strong> (unassertive, uncooperative), <strong>Accommodating</strong> (unassertive, cooperative).</p>\n", "qa": [{"q": "What is BATNA and why must you know it before negotiating?", "a": "BATNA = <strong>Best Alternative to a Negotiated Agreement</strong> — the best result you can achieve if this negotiation fails. You must know it before negotiating because:<ul><li>It sets your <em>walk-away point</em> — never accept a deal worse than your BATNA</li><li>A strong BATNA gives you confidence to reject poor offers</li><li>A weak BATNA means you should work to improve it before entering negotiation</li><li>Understanding both your BATNA and the other party's BATNA defines the \"zone of possible agreement\"</li></ul>"}, {"q": "Distinguish between distributive and integrative negotiation.", "a": "<strong>Distributive (Win-Lose):</strong> Treats negotiation as a fixed pie — what one party gains, the other loses. Adversarial; focused on maximising own share. Best for one-off transactions where relationship is irrelevant.<br/><br/><strong>Integrative (Win-Win):</strong> Aims to expand the pie by finding creative solutions that satisfy both parties' underlying interests better than their alternatives. Collaborative; relationship-preserving; essential for ongoing partnerships, employment, and supplier relations."}, {"q": "Explain Fisher &amp; Ury's four principles of principled negotiation.", "a": "<strong>1. Separate people from the problem:</strong> Resolve the issue without damaging the relationship. Attack the problem, not the person.<br/><strong>2. Focus on interests, not positions:</strong> Understand what each party actually needs (interests), not just what they're demanding (positions). This reveals room for creative solutions.<br/><strong>3. Invent options for mutual gain:</strong> Generate multiple possible solutions before evaluating any. Brainstorm freely without commitment.<br/><strong>4. Insist on objective criteria:</strong> Evaluate options using external fair standards (market rates, legal benchmarks), not force of personality or stubbornness."}]}]}, "C": {"title": "Project Management", "icon": "📊", "lessons": [{"id": "c1", "icon": "🏗️", "title": "The Role of Projects in Business", "subtitle": "Triple Constraint · Project Lifecycle · Scope Creep · Change Programmes", "theory": "\n<h4>What is a Project?</h4>\n<p>ISO definition: <em>\"A unique set of processes, consisting of coordinated and controlled activities with start and finish dates, undertaken to achieve an objective.\"</em></p>\n<p>Key characteristics of a project: <strong>unique; coordinated and controlled; defined start and end dates; aimed at achieving a specific objective.</strong> Projects implement <em>change</em> — they are distinct from \"business as usual\" operations.</p>\n<h4>The Triple Constraint (Project Triangle)</h4>\n<div class=\"fw\"><strong>Three constraints + Quality at the centre:</strong><ul>\n<li><strong>Time</strong> – Target completion dates and deadlines</li>\n<li><strong>Cost</strong> – Budget and cost of all resources</li>\n<li><strong>Scope</strong> – The defined volume of work to be delivered (in-scope vs out-of-scope)</li>\n<li><strong>Quality</strong> – Placed at the centre; affected by any change to the three constraints</li>\n</ul></div>\n<div class=\"kbox\"><strong>Key Principle</strong>The three constraints are interdependent. Reducing time without reducing scope means either costs increase OR quality falls. A PM must always make the trade-off explicit and gain sponsor approval.</div>\n<h4>Scope Creep</h4>\n<p>Scope creep is the gradual, unauthorised addition of work to a project after scope has been agreed. It is one of the most common causes of project failure — causing cost overruns, missed deadlines, and blurred accountability. Prevention: clearly define scope upfront and enforce a formal change control process.</p>\n<h4>Four Phases of the Project Lifecycle</h4>\n<ol>\n<li><strong>Initiation:</strong> Define objectives, scope, feasibility; establish governance; align stakeholder expectations; produce the Project Initiation Document (PID)</li>\n<li><strong>Planning:</strong> Create detailed project plan; schedule tasks; develop budgets; identify risks; plan resource allocation</li>\n<li><strong>Execution and Control:</strong> Implement the plan; monitor and control progress against the plan; manage risks and changes; take corrective action</li>\n<li><strong>Handover and Closure:</strong> Transfer outputs to operational teams; close contracts; capture lessons learned; achieve formal sign-off</li>\n</ol>\n<h4>Change Programmes</h4>\n<p>Strategic change typically requires multiple interconnected projects forming a <strong>change programme</strong>. Individual projects within the programme must be coordinated to ensure overall benefits are realised and the overarching strategic goal is achieved.</p>\n", "qa": [{"q": "What is the triple constraint and why does it matter in project management?", "a": "The triple constraint consists of <strong>Time, Cost, and Scope</strong>, with <strong>Quality</strong> at the centre. These three constraints are interdependent — changing one inevitably impacts the others:<ul><li>Reduce <em>time</em> without reducing scope → Cost rises or quality falls</li><li>Reduce <em>cost</em> without reducing scope → Time increases or quality falls</li><li>Expand <em>scope</em> without increasing budget or time → Quality falls</li></ul>The PM must make all trade-offs explicit and gain approval from the project sponsor before changing any constraint."}, {"q": "What is scope creep and how is it prevented?", "a": "Scope creep is the gradual, unauthorised expansion of project scope after the original scope has been agreed — often caused by well-intentioned but informal \"can you just add...\" requests. It leads to cost overruns, missed deadlines, and team burnout.<br/><br/><strong>Prevention:</strong> (1) Define scope precisely at project initiation with clear in-scope and out-of-scope items; (2) Implement a formal change control process — all scope changes must be documented, assessed, and approved by the project sponsor; (3) Communicate approved scope to all stakeholders."}, {"q": "Name the four phases of the project lifecycle and key activities in each.", "a": "<strong>1. Initiation:</strong> Define objectives and scope; assess feasibility; establish governance; produce the PID.<br/><strong>2. Planning:</strong> Create detailed project plan; schedule tasks (Gantt); build WBS; develop budget; identify risks.<br/><strong>3. Execution and Control:</strong> Carry out the plan; monitor progress; manage risks, issues, and changes; take corrective action.<br/><strong>4. Handover and Closure:</strong> Transfer outputs to operations; formally close contracts; document lessons learned; achieve sponsor sign-off."}]}, {"id": "c2", "icon": "👔", "title": "The Role & Skills of a Project Manager", "subtitle": "Product · Process · People · 6 Core Skills · Risk Management", "theory": "\n<h4>Three Areas of PM Responsibility</h4>\n<div class=\"fw\"><strong>Product</strong> – Delivering project outputs on time, within budget, to the agreed scope and specification</div>\n<div class=\"fw\"><strong>Process</strong> – Creating the project plan; monitoring and controlling progress; taking corrective action when required</div>\n<div class=\"fw\"><strong>People</strong> – Directing and motivating the project team; communicating with stakeholders; preventing and resolving conflict; escalating major issues to the project board</div>\n<h4>Six Core PM Skills</h4>\n<ul>\n<li><strong>Scope Control:</strong> Define scope clearly at outset; manage all change requests formally; prevent unauthorised additions; review scope at each phase gate</li>\n<li><strong>Time Management:</strong> Reprioritise tasks when delays occur; think creatively to recover time; motivate team around milestone deadlines</li>\n<li><strong>Budgeting &amp; Budgetary Control:</strong> Build initial budget; monitor actual vs planned expenditure; produce regular financial forecasts; communicate variances clearly and early</li>\n<li><strong>Risk Management:</strong> Identify → Evaluate (likelihood × impact) → Control (mitigate significant risks). Maintain a risk log throughout. Review at every phase gate and when change requests arise.</li>\n<li><strong>Quality Control:</strong> Set quality standards aligned to stakeholder requirements; conduct assurance reviews; capture and apply lessons learned; pursue continuous improvement</li>\n<li><strong>Problem Solving:</strong> Quickly understand the problem; work with stakeholders to generate solutions; implement calmly and decisively; remain focused on objectives throughout</li>\n</ul>\n<div class=\"kbox\"><strong>Risk Management — Three Stages</strong>1. Identify (proactively and continuously) → 2. Evaluate (likelihood and impact matrix) → 3. Control (take action to mitigate or transfer significant risks). Maintain a risk log and review it regularly.</div>\n<h4>Industry Awareness</h4>\n<p>Helpful but NOT mandatory for a project manager. An experienced PM who understands project management methodology can operate effectively across industries by partnering with relevant subject matter experts.</p>\n", "qa": [{"q": "What are the three areas of responsibility for a project manager?", "a": "<strong>Product</strong> – Delivering the agreed outputs (scope) on time and within budget to the required specification.<br/><strong>Process</strong> – Planning; monitoring and controlling progress; managing change and risk; taking corrective action.<br/><strong>People</strong> – Motivating and directing the team; communicating with all stakeholders; preventing and resolving conflict; escalating major issues to the project board when beyond the PM's authority."}, {"q": "Describe the three stages of project risk management.", "a": "<strong>1. Identify</strong> – Proactively identify all potential risks at the start and throughout the project (including when changes are requested or issues emerge). Involve the whole team and key stakeholders.<br/><strong>2. Evaluate</strong> – For each risk, assess its <em>likelihood</em> of occurring and its potential <em>impact</em> on Time, Cost, Scope, or Quality. Prioritise the risks that score highest on both.<br/><strong>3. Control</strong> – Take action to mitigate high-priority risks (e.g., contingency plans, resource buffers). Transfer risks via insurance or contract. Record in a risk log and revisit at every phase gate."}, {"q": "Why does a project manager not need to be a subject matter expert in the project's technical domain?", "a": "Project management is a <em>discipline</em> — methodology, planning, control, stakeholder management, and risk management — that is transferable across industries. An experienced PM brings these skills and partners with relevant technical experts (specialists on the project team or external consultants) to provide domain knowledge. The PM's value is in coordination, process, and people management, not technical execution."}]}, {"id": "c3", "icon": "🛠️", "title": "Project Management Tools", "subtitle": "WBS · Gantt Chart · Critical Path Analysis · Resource Histograms · Milestones", "theory": "\n<h4>Structuring the Project: Workstreams → WBS → Work Packages</h4>\n<ul>\n<li><strong>Workstreams:</strong> High-level groupings of related project outputs. Maximum ~10 per project. Different teams can work on different workstreams simultaneously. Example: in an ERP implementation — Data Migration, System Configuration, Training, Testing.</li>\n<li><strong>Work Breakdown Structure (WBS):</strong> A hierarchical tree structure that breaks the complete project scope into manageable deliverables. Must include 100% of scope; no overlaps; focuses on outputs (not activities). It is the foundation for schedules, budgets, and risk logs.</li>\n<li><strong>Work Packages:</strong> The lowest level of the WBS. Each contains: description of the deliverable, activities required to produce it, time and cost estimates, quality standards to apply, and the team member responsible.</li>\n</ul>\n<div class=\"kbox\"><strong>WBS Golden Rule</strong>The WBS must focus on <em>deliverables (outputs)</em>, NOT activities. \"New system implemented\" = deliverable ✓. \"Implement new system\" = activity ✗. 100% scope coverage; mutually exclusive items.</div>\n<h4>Scheduling Tools</h4>\n<ul>\n<li><strong>Gantt Chart:</strong> Bar chart showing all tasks, estimated durations, dependencies (which tasks must finish before others can start), planned vs actual progress, and milestones. Widely used; easy to communicate to non-technical stakeholders.</li>\n<li><strong>Critical Path Analysis (CPA) / Network Diagram:</strong> Identifies the longest sequence of dependent tasks (the critical path). Any delay to a critical path task directly delays the project end date. Non-critical tasks have \"float\" — how much they can slip without affecting the end date.</li>\n<li><strong>Resource Histograms:</strong> Bar charts showing resource demand (e.g., person-days) over time. Identifies periods of over or under-utilisation; enables resource levelling.</li>\n</ul>\n<h4>Key Project Dates and Concepts</h4>\n<ul>\n<li><strong>Milestone:</strong> A significant progress point marking a major achievement. Not a duration — a moment in time (e.g., \"System testing complete\").</li>\n<li><strong>Implementation Date:</strong> When project outputs go \"live\" or become operational</li>\n<li><strong>Project Closure Date:</strong> When all parties agree there are no outstanding issues and the project is formally closed</li>\n<li><strong>Float / Slack:</strong> The time a non-critical-path task can be delayed without affecting the project end date</li>\n</ul>\n", "qa": [{"q": "What is a WBS and what are the characteristics of a good one?", "a": "A WBS (Work Breakdown Structure) is a <em>hierarchical tree</em> that breaks the entire project scope into manageable deliverables. Characteristics of a good WBS:<ul><li>Focuses on <strong>deliverables</strong> (outputs), not activities</li><li>Uses a <strong>hierarchical structure</strong> showing relationships between elements</li><li>Includes <strong>100% of the project scope</strong> — nothing is missing</li><li><strong>No overlaps</strong> — each element is mutually exclusive</li><li>The lowest level (work packages) can be realistically <strong>estimated, assigned, and controlled</strong></li><li>Developed <strong>collaboratively</strong> with the project team to ensure completeness</li></ul>"}, {"q": "What is the Critical Path and why is it essential for a project manager to know?", "a": "The critical path is the <em>longest sequence of dependent tasks</em> that determines the minimum overall project duration. It is essential because:<ul><li>Any delay to a critical path task <strong>directly delays the project end date</strong></li><li>The PM must give <strong>priority attention and risk management focus</strong> to critical path activities</li><li>Non-critical tasks have <strong>float</strong> (slack) — they can be delayed within their float without affecting the end date</li><li>If the project is running late, <em>\"crashing\"</em> the critical path (adding resources) is the only way to recover time</li></ul>"}, {"q": "What information can a Gantt chart provide to a project manager?", "a": "A Gantt chart shows:<ul><li>All tasks and their estimated durations</li><li>Task dependencies (which tasks must finish before others can start)</li><li>Tasks that can run in parallel</li><li>Scheduled start and end dates for each task</li><li>Milestones and key project dates</li><li>Actual progress vs planned progress (tracking variant)</li><li>Who is responsible for each task (if resource-loaded)</li></ul>It is the most widely used project scheduling and communication tool."}, {"q": "What is 'float' and how does it differ between critical and non-critical path tasks?", "a": "<strong>Float (slack)</strong> is the amount of time a task can be delayed without pushing back the project end date. Critical path tasks have <strong>zero float</strong> — any delay immediately pushes out the end date. Non-critical path tasks have <strong>positive float</strong> — they can be delayed by up to their float amount without affecting the overall project timeline. The PM can use float to reallocate resources from low-priority non-critical tasks to support critical path work."}]}, {"id": "c4", "icon": "👨‍👩‍👧‍👦", "title": "Project Organisation & Stakeholders", "subtitle": "Governance Hierarchy · PID · Power/Interest Matrix · Communication Plan", "theory": "\n<h4>Who is a Project Stakeholder?</h4>\n<p><em>\"An individual, group, or organisation with the potential to influence the project and/or with an interest in the project's outputs.\"</em> Stakeholders can be supportive, neutral, or actively opposed — and all must be identified, understood, and appropriately managed throughout the project lifecycle.</p>\n<h4>Project Governance Hierarchy</h4>\n<ul>\n<li><strong>Project Sponsor:</strong> Executive owner of the project. Secures funding; appoints the PM; makes resources available; champions the project at board level; normally chairs the project board. The PM's primary escalation point.</li>\n<li><strong>Project Board:</strong> Senior stakeholder group. Formally approves the PID; sets strategic direction; approves significant budget or scope changes; resolves issues escalated by the PM; provides governance oversight.</li>\n<li><strong>Project Client:</strong> The person or group who requested the project and represents end users. Ensures user requirements are incorporated into design.</li>\n<li><strong>Project Customer:</strong> The end users of the project outputs. Their real-world needs must be understood and built into the solution.</li>\n<li><strong>Project Manager:</strong> Responsible for delivering on time, on budget, to scope. Plans, monitors, controls, and communicates. Escalates material issues to the project board.</li>\n<li><strong>Project Team:</strong> Execute individual work packages. Cross-functional; may have dual reporting to PM and line manager. Directed by the PM day-to-day.</li>\n<li><strong>Project Suppliers:</strong> Internal or external parties providing specialist skills, services, or materials.</li>\n</ul>\n<h4>Stakeholder Management Tools</h4>\n<ul>\n<li><strong>Power/Interest Matrix:</strong> Plots stakeholders by their power to influence the project (vertical) and their interest in its outcomes (horizontal). Four quadrants: Manage closely (high power, high interest); Keep satisfied (high power, low interest); Keep informed (low power, high interest); Monitor (low power, low interest).</li>\n<li><strong>Communication Plan:</strong> Documents what information each stakeholder group needs, how it will be delivered, by whom, and at what frequency.</li>\n<li><strong>Project Initiation Document (PID):</strong> The master project document signed off by the project board at initiation. Contains: objectives, scope, governance, budget, risks, timeline, and quality standards. The PM delivers against the PID.</li>\n</ul>\n", "qa": [{"q": "Describe the roles of the Project Sponsor and Project Board.", "a": "<strong>Project Sponsor:</strong> Executive owner and champion. Secures funding; appoints and supports the PM; makes resources available; removes barriers; represents the project at board level; normally chairs the project board. The PM's primary point of escalation for issues beyond their authority.<br/><br/><strong>Project Board:</strong> Senior governance body. Formally approves the PID and authorises the budget; sets strategic direction; approves significant changes to scope, time, or cost; resolves major escalated risks and issues; provides oversight of the project on behalf of the organisation."}, {"q": "How is the Power/Interest Matrix used in stakeholder management?", "a": "The matrix plots stakeholders on two axes: their <strong>power to influence the project</strong> and their <strong>interest in the project's outcomes</strong>. It guides the level and type of engagement:<ul><li><strong>High power, high interest</strong> → Manage closely: regular updates, two-way communication, involve in decisions</li><li><strong>High power, low interest</strong> → Keep satisfied: periodic updates; don't overwhelm them</li><li><strong>Low power, high interest</strong> → Keep informed: newsletters, project updates</li><li><strong>Low power, low interest</strong> → Monitor: occasional touchpoints; flag if their status changes</li></ul>"}, {"q": "Distinguish between the 'project client' and 'project customer.'", "a": "<strong>Project Client:</strong> The person or group who <em>requested</em> the project and acts as representative of end users. They own the business requirements. Example: A Finance Director commissioning a new financial reporting system.<br/><strong>Project Customer:</strong> The people who will actually <em>use</em> the project outputs in their day-to-day work. Example: The accounts team, department managers, and external suppliers who interact with the system. The PM must understand and incorporate the customers' real needs into the design, not just the client's stated requirements."}]}, {"id": "c5", "icon": "❄️", "title": "Managing Resistance to Change", "subtitle": "Lewin's 3-Stage Model · Force Field Analysis · Kotter & Schlesinger's 6 Interventions", "theory": "\n<h4>Lewin's Three-Stage Change Model (Ice Cube Model)</h4>\n<ul>\n<li><strong>Unfreeze (Rally):</strong> Make change possible. Highlight problems with the current state; communicate the compelling case for change; build dissatisfaction with the status quo; sell the benefits of the new state. People must feel the need to change before they can.</li>\n<li><strong>Change (Drive):</strong> Implement the change. Provide training, information, coaching, and support. Acknowledge that people are adjusting to an unfamiliar environment. Expect uncertainty and some regression.</li>\n<li><strong>Refreeze (Sustain):</strong> Solidify the new state. Reward and reinforce those adopting the new approach; resolve early practical problems quickly; communicate consistent messages; ensure new behaviours feel permanent and natural. Prevent relapse to old habits.</li>\n</ul>\n<h4>Lewin's Force Field Analysis</h4>\n<p>For change to succeed, <strong>driving forces</strong> must outweigh <strong>restraining forces</strong>:</p>\n<div class=\"fw\"><strong>Driving Forces (enabling change):</strong><ul><li>Compelling case for change with evidence</li><li>Champions/advocates within the organisation</li><li>Technology that enables the new way of working</li><li>Strong leadership commitment</li></ul></div>\n<div class=\"fw\"><strong>Restraining Forces (blocking change):</strong><ul><li>Insufficient resources (time, budget, people)</li><li>Opposition from power structures or influential individuals</li><li>Reward systems still aligned with old behaviours</li><li>Employee resistance to new technology or processes</li><li>Fear of job loss or role change</li></ul></div>\n<div class=\"kbox\"><strong>Key Principle</strong>To successfully drive change: simultaneously <em>strengthen driving forces</em> AND <em>weaken restraining forces</em>. Addressing only one side is insufficient.</div>\n<h4>Kotter &amp; Schlesinger's 6 Interventions for Overcoming Resistance</h4>\n<ul>\n<li><strong>1. Education &amp; Communication:</strong> Explain the reason for change clearly and honestly. Use multiple channels and formats. Build trust. Most effective when resistance is due to misinformation or lack of understanding.</li>\n<li><strong>2. Participation:</strong> Involve staff in designing and planning the change. User input groups during design and testing. Builds ownership and leverages on-the-ground knowledge. Takes more time but produces better results.</li>\n<li><strong>3. Facilitation &amp; Support:</strong> Provide training; team building; ongoing technical support; employee assistance programmes for those struggling with change. Effective when anxiety or emotional resistance is the issue.</li>\n<li><strong>4. Negotiation:</strong> Reach win-win agreements with powerful resistant groups (trade unions, key suppliers, finance providers). Offer something of value in return for cooperation. Appropriate when a group has legitimate concerns and real power to block change.</li>\n<li><strong>5. Manipulation &amp; Co-optation:</strong> Selectively presenting information (framing); co-opting influential resistors into steering committees where they feel invested in the outcome. Fast but carries risk of backlash if people feel manipulated.</li>\n<li><strong>6. Coercion:</strong> Explicit or implicit threats of negative consequences for non-compliance. Only used as last resort or in genuine crisis. Effective short-term but severely damages trust, morale, and long-term commitment.</li>\n</ul>\n", "qa": [{"q": "Describe Lewin's three-stage change model (the ice cube model).", "a": "<strong>Unfreeze:</strong> \"Melt\" the current state. Create dissatisfaction with the status quo; build the compelling case for why change is necessary (burning platform or compelling opportunity). People must feel the need to change before they can.<br/><br/><strong>Change:</strong> \"Mould\" the new shape. Implement the change with training, information, and support. Acknowledge and manage uncertainty. Progress is rarely linear — some regression is normal.<br/><br/><strong>Refreeze:</strong> \"Solidify\" the new state. Reinforce new behaviours through rewards, quick issue resolution, and consistent messaging. The goal is that people become so comfortable with the new way that they would not want to revert."}, {"q": "What are Lewin's driving and restraining forces, and what must a PM do with them?", "a": "<strong>Driving forces</strong> push change forward: a compelling business case, champions, enabling technology, leadership commitment.<br/><strong>Restraining forces</strong> block change: insufficient resources, powerful opposition, misaligned reward systems, fear of job loss, staff resistance to new technology.<br/><br/>A PM must simultaneously <em>strengthen driving forces</em> (build the case, win advocates, remove barriers) AND <em>weaken restraining forces</em> (address fears, involve resistors, align incentives). Addressing only one side will not be sufficient for sustained change."}, {"q": "Name Kotter &amp; Schlesinger's 6 interventions for overcoming resistance to change.", "a": "<ol><li><strong>Education &amp; Communication</strong> – Explain why; use multiple channels; build trust</li><li><strong>Participation</strong> – Involve staff in designing the change; build ownership</li><li><strong>Facilitation &amp; Support</strong> – Training, coaching, and emotional support for those struggling</li><li><strong>Negotiation</strong> – Win-win agreements with powerful resistant groups</li><li><strong>Manipulation &amp; Co-optation</strong> – Frame information selectively; give resistors a role to invest them in success</li><li><strong>Coercion</strong> – Last resort; explicit or implicit threats; effective in crises but damages trust</li></ol>"}, {"q": "When would you use 'participation' vs 'coercion' as an intervention strategy?", "a": "<strong>Participation</strong> is best when: there is sufficient time; the resistors have valuable knowledge or expertise to contribute; buy-in and long-term commitment are important; and the changes will directly affect the employees' day-to-day work.<br/><br/><strong>Coercion</strong> is only appropriate as a last resort when: time is critically short (a genuine crisis); other interventions have all failed; the risk of delay outweighs the damage to morale and trust. Its use must be explicitly justified because it leaves long-lasting negative cultural effects."}]}]}};

{"id":"a1","icon":"🤝","title":"Related Party Transactions — IAS 24","subtitle":"Defining related parties · Disclosure requirements · Examples",
"theory":"<h4>What is IAS 24?</h4><p>IAS 24 ensures transparency where related party relationships exist. Without proper disclosure, related party transactions can distort financial statement analysis and mislead users.</p><h4>Defining a Related Party — Person</h4><p>A person (or close family member) is related to the reporting entity if they: (a) have control or joint control; (b) have significant influence; or (c) are key management personnel (KMP) of the entity or its parent. Close family includes spouse, children, and dependants.</p><h4>Defining a Related Party — Entity</h4><p>An entity is related if it is: a member of the same group (parent/subsidiary/fellow subsidiary); an associate or joint venture; or controlled/significantly influenced by the same KMP as the reporting entity.</p><div class='kbox'><strong>NOT Related Parties</strong>Finance providers (banks); government agencies; a single major customer or supplier (unless also an associate/controlled by KMP); two entities that simply share a director.</div><h4>Related Party Transactions</h4><p>A transfer of resources, services, or obligations between the reporting entity and a related party — regardless of whether a price is charged. Examples: sales/purchases of goods or assets; leasing; finance arrangements; guarantees; services rendered.</p><h4>Required Disclosures</h4><p>Entities must disclose: nature of relationship; transaction amounts; outstanding balances and their terms; provisions for doubtful debts; bad debt expense. Disclosure is required even if no price was charged. Intragroup transactions are eliminated on consolidation but disclosed in individual financial statements.</p>",
"qa":[
{"q":"Define a 'related party' under IAS 24 for both persons and entities.","a":"<strong>Person:</strong> A person (or close family member) is related if they have control, joint control, significant influence over the entity, or are KMP of the entity or its parent.<br><strong>Entity:</strong> An entity is related if it is a member of the same group, an associate, a joint venture, or is controlled/significantly influenced by the same persons as the reporting entity."},
{"q":"Give three examples of related party transactions that IAS 24 requires to be disclosed.","a":"(1) Sale of goods between parent and subsidiary at below-market prices; (2) A loan by a parent to a subsidiary at a below-market interest rate; (3) Provision of services between group members. Disclosure is required regardless of whether a price is charged."},
{"q":"Why are related party disclosures important for users of financial statements?","a":"Related party transactions may not be on arm's length terms — prices may differ from market rates. This can distort profitability analysis, efficiency ratios, and comparisons with competitors. Disclosure allows users to identify and adjust for these distortions when making decisions."},
{"q":"Which of the following is NOT a related party of Company X: (a) its subsidiary, (b) its bank, (c) its associate, (d) a fellow subsidiary?","a":"<strong>(b) its bank</strong> is NOT a related party. Finance providers are explicitly excluded under IAS 24 regardless of how significant the banking relationship is. The subsidiary (a), associate (c), and fellow subsidiary (d) are all related parties."}
]},
{"id":"a2","icon":"🧾","title":"Income Taxes — IAS 12","subtitle":"Current tax · Deferred tax · Temporary differences · DTL and DTA recognition",
"theory":"<h4>Introduction to IAS 12</h4><p>IAS 12 covers both current tax (taxes payable on this year's taxable profit) and deferred tax (future tax consequences of current accounting). Total tax expense = Current tax expense ± Deferred tax expense/income.</p><h4>Current Tax</h4><p>Current tax = Taxable profit × applicable tax rate. Accounting profit must be adjusted for permanent and temporary differences to arrive at taxable profit. Add back book depreciation, deduct capital allowances (tax depreciation); add back disallowed expenses (fines, entertainment).</p><h4>Permanent vs Temporary Differences</h4><ul><li><strong>Permanent differences:</strong> Items recognised for book purposes but never for tax (e.g., fines). Affect current tax only — NO deferred tax.</li><li><strong>Temporary differences:</strong> Timing differences that will reverse in future periods (e.g., different depreciation rates). Give rise to deferred tax assets or liabilities.</li></ul><h4>Deferred Tax — Balance Sheet Approach</h4><p>Compare the <strong>carrying amount</strong> (book value) of an asset/liability with its <strong>tax base</strong> (value for tax purposes):</p><div class='fw'><strong>Taxable temporary difference:</strong> Carrying amount &gt; Tax base → Deferred Tax Liability (DTL) = difference × tax rate<br><strong>Deductible temporary difference:</strong> Tax base &gt; Carrying amount → Deferred Tax Asset (DTA) = difference × tax rate</div><div class='kbox'><strong>DTA Recognition Rule</strong>A DTA can only be recognised to the extent it is <em>probable</em> that sufficient future taxable profits will be available. If losses are forecast, a DTA may not be fully recognised.</div><h4>Over/Under Provisions</h4><p>Under-provision (actual tax &gt; estimate) → add to current year charge. Over-provision (actual tax &lt; estimate) → deduct from current year charge.</p>",
"qa":[
{"q":"What is the difference between a permanent difference and a temporary difference?","a":"<strong>Permanent differences</strong> are items treated differently for book and tax purposes that will never reverse (e.g., fines). They affect current tax but create NO deferred tax.<br><strong>Temporary differences</strong> arise when income/expense is recognised in different periods for book vs tax and WILL reverse in future (e.g., accelerated tax depreciation vs straight-line book depreciation). Only temporary differences give rise to deferred tax."},
{"q":"A building has a carrying amount of $500,000 and a tax base of $350,000. The tax rate is 25%. What deferred tax arises?","a":"Carrying amount ($500k) &gt; Tax base ($350k) → Taxable temporary difference of $150,000.<br>This means future taxable profits will be higher when the difference reverses → <strong>Deferred Tax Liability (DTL)</strong><br>DTL = $150,000 × 25% = <strong>$37,500</strong>"},
{"q":"When can a deferred tax asset NOT be fully recognised?","a":"A DTA can only be recognised to the extent it is <em>probable</em> ('more likely than not') that sufficient future taxable profits will exist against which the deductible temporary differences can be utilised. If a company has a history of losses or forecasts future losses, only the portion recoverable against probable future profits may be recognised."},
{"q":"How are over-provisions and under-provisions of prior year tax treated?","a":"<strong>Over-provision</strong> (prior estimate was too high): deduct from current year tax charge (reduces the expense).<br><strong>Under-provision</strong> (prior estimate was too low): add to current year tax charge (increases the expense). Both appear in the current year's income tax note and SPLOCI."}
]},
{"id":"a3","icon":"📊","title":"Earnings Per Share — IAS 33","subtitle":"Basic EPS · WANOS · Bonus issues · Rights issues · Diluted EPS",
"theory":"<h4>Why IAS 33?</h4><p>EPS is a key investor metric. IAS 33 is mandatory for entities with publicly traded ordinary shares. Two measures must be shown on the face of the SPLOCI: <strong>Basic EPS</strong> and <strong>Diluted EPS</strong> (in cents, to one del place).</p><h4>Basic EPS = Earnings ÷ WANOS</h4><div class='fw'><strong>Earnings</strong> = Profit after tax <strong>less</strong> irredeemable preference dividends<br><strong>WANOS</strong> = Weighted Average Number of Ordinary Shares outstanding during the year</div><h4>Types of Share Issues</h4><ul><li><strong>Full market price issue:</strong> Shares issued at full market price. Time-weight from date of issue (e.g., 400k shares issued 1 April = 400k × 9/12 added to WANOS).</li><li><strong>Bonus issue:</strong> Free shares — no cash raised, no new earnings. Treat as if bonus shares were always in issue. Restate ALL prior periods. Do NOT time-weight.</li><li><strong>Rights issue:</strong> Shares issued at a discount. Contains a bonus element — requires a bonus fraction adjustment to pre-rights WANOS.</li></ul><div class='kbox'><strong>Bonus Issue Rule</strong>Because no cash is raised, there are no new earnings generated. The WANOS must be restated for ALL periods presented — you cannot time-weight a bonus issue.</div><h4>Diluted EPS</h4><p>Assumes all potential ordinary shares (convertible debt, options, warrants) were converted at the start of the year. Always ≤ Basic EPS. Shows the maximum potential dilution to investors.</p>",
"qa":[
{"q":"A company has 1,000,000 shares at 1 Jan. Issues 300,000 at full market price on 1 April. PAT = $820,000; preference dividends = $120,000. Calculate Basic EPS.","a":"<strong>Earnings</strong> = $820,000 − $120,000 = $700,000<br><strong>WANOS</strong> = 1,000,000 × 3/12 + 1,300,000 × 9/12 = 250,000 + 975,000 = 1,225,000<br><strong>Basic EPS</strong> = $700,000 ÷ 1,225,000 = <strong>57.1 cents</strong>"},
{"q":"How does a bonus issue differ from a full market price issue for EPS purposes?","a":"A <strong>full market price issue</strong> raises cash and generates new earning power — shares are time-weighted from the date of issue.<br>A <strong>bonus issue</strong> raises no cash and generates no new earnings. It merely divides the same profits into more shares. Therefore WANOS must be restated for ALL periods as if the bonus shares had always been in issue — no time-weighting. Comparatives must also be restated."},
{"q":"Why is diluted EPS always equal to or lower than basic EPS?","a":"Diluted EPS assumes all potential ordinary shares (convertibles, options) are converted at the start of the year. This increases the WANOS (denominator), which reduces EPS. Any earnings adjustment (e.g., saving of interest on converted debt) is added to the numerator but the denominator increase typically dominates. Anti-dilutive instruments are excluded."},
{"q":"What is included in the earnings figure for Basic EPS?","a":"<strong>Included:</strong> Profit after tax attributable to ordinary shareholders.<br><strong>Deducted:</strong> Dividends on <em>irredeemable</em> preference shares (equity instruments with a fixed return — reduces earnings available to ordinary shareholders). Redeemable preference dividends are already deducted as finance costs before arriving at PAT, so are not deducted again."}
]},
{"id":"a4","icon":"⚖️","title":"Provisions, Contingent Liabilities & Assets — IAS 37","subtitle":"Three recognition criteria · Legal vs constructive obligation · Contingent liabilities · Measurement",
"theory":"<h4>What is IAS 37?</h4><p>IAS 37 prevents abuse of provisions to manipulate profits. It distinguishes: provisions (recognised in SOFP); contingent liabilities (disclosed only); and contingent assets (disclosed if probable; never recognised until virtually certain).</p><h4>Provision — Three Recognition Criteria (ALL must be met)</h4><div class='fw'><ol><li>A <strong>present obligation</strong> (legal OR constructive) arising from a <strong>past event</strong></li><li>It is <strong>probable</strong> (&gt;50%) that an outflow of economic benefits will occur</li><li>The amount can be <strong>estimated reliably</strong></li></ol></div><h4>Legal vs Constructive Obligations</h4><ul><li><strong>Legal:</strong> Arises from contract, legislation, or operation of law</li><li><strong>Constructive:</strong> Arises from established past practice or specific statements creating a valid expectation (e.g., published no-quibble returns policy)</li></ul><div class='kbox'><strong>Future Operating Costs Cannot be Provided</strong>No provision for future operating costs or losses — there is no past event creating a present obligation. Example: cannot provide for machinery replacement in 3 years.</div><h4>Contingent Liabilities — Disclose, Do NOT Recognise</h4><p>Possible obligations whose existence will only be confirmed by future events not entirely within the entity's control; OR present obligations where outflow is not probable or amount cannot be reliably estimated. Disclose in notes only.</p><h4>Measurement</h4><p>Use <strong>best estimate</strong>. For large populations (e.g., warranties) use probability-weighted expected values. For long-term provisions, discount to present value using a pre-tax risk-free rate.</p>",
"qa":[
{"q":"What are the three criteria that must ALL be met before a provision can be recognised?","a":"(1) A <strong>present obligation</strong> (legal or constructive) exists as a result of a past event;<br>(2) It is <strong>probable</strong> (more than 50%) that an outflow of economic benefits will be required;<br>(3) A <strong>reliable estimate</strong> of the amount can be made.<br>If any one criterion fails, no provision is recognised."},
{"q":"What is the difference between a provision and a contingent liability?","a":"A <strong>provision</strong> meets all three recognition criteria and is <em>recognised as a liability</em> in the SOFP.<br>A <strong>contingent liability</strong> fails at least one criterion — typically outflow is only possible (not probable), or no reliable estimate exists. It is <em>disclosed in the notes</em> but NOT recognised in the SOFP."},
{"q":"Can a company provide for the cost of future major repairs to its machinery?","a":"<strong>No.</strong> No present obligation exists at the reporting date — the company could sell the machine before repair is needed. Without a past obligating event, the three recognition criteria cannot all be met. The repair cost should be recognised only when the repair is actually carried out."},
{"q":"A company sells products with a warranty. 70% no faults, 25% minor faults ($200k total cost), 5% major faults ($800k total cost). Calculate the provision.","a":"Expected value = (70% × $0) + (25% × $200,000) + (5% × $800,000)<br>= $0 + $50,000 + $40,000 = <strong>$90,000</strong>"}
]},
{"id":"a5","icon":"💰","title":"Revenue from Contracts — IFRS 15","subtitle":"5-Step Model · Performance obligations · Variable consideration · Point vs over time",
"theory":"<h4>Core Principle of IFRS 15</h4><p>Recognise revenue to depict the transfer of promised goods or services in an amount reflecting the consideration to which the entity expects to be entitled. IFRS 15 provides a single model for all contracts with customers.</p><h4>The Five-Step Model</h4><div class='fw'><strong>Step 1 — Identify the contract:</strong> Must be approved; rights identifiable; payment terms identifiable; commercial substance; collection probable.</div><div class='fw'><strong>Step 2 — Identify performance obligations:</strong> Each distinct promise to transfer a good or service. A good/service is distinct if the customer can benefit from it independently AND the promise is separately identifiable.</div><div class='fw'><strong>Step 3 — Determine the transaction price:</strong> Amount the entity expects to receive. Includes variable consideration (discounts, refunds, bonuses, penalties) — only include if highly probable no significant reversal occurs.</div><div class='fw'><strong>Step 4 — Allocate the transaction price:</strong> Allocate to each performance obligation based on relative standalone selling prices.</div><div class='fw'><strong>Step 5 — Recognise revenue when/as performance obligations are satisfied:</strong> <em>Point in time</em> (control transfers on delivery) or <em>over time</em> (continuous service).</div><div class='kbox'><strong>Warranties</strong>If customer can purchase warranty separately → separate performance obligation (IFRS 15). If not → account under IAS 37 provisions, unless the warranty provides a service beyond quality assurance.</div>",
"qa":[
{"q":"Name the five steps of the IFRS 15 revenue recognition model.","a":"1. <strong>Identify the contract</strong> with a customer<br>2. <strong>Identify the performance obligations</strong> in the contract<br>3. <strong>Determine the transaction price</strong><br>4. <strong>Allocate the transaction price</strong> to the performance obligations<br>5. <strong>Recognise revenue</strong> when (or as) each performance obligation is satisfied"},
{"q":"A company sells equipment ($5,000) and 12-month technical support ($3,000) for $8,000 total. How is revenue recognised?","a":"There are <strong>two performance obligations</strong> (both are distinct — can be sold separately):<br>• Equipment ($5,000) → recognised at a <em>point in time</em> on delivery<br>• Technical support ($3,000) → recognised <em>over time</em> evenly over 12 months ($250/month)"},
{"q":"When should variable consideration be included in the transaction price?","a":"Variable consideration should be included only when it is <strong>highly probable</strong> that including it will NOT result in a significant reversal of cumulative revenue when the uncertainty resolves. Use either the expected value method (probability-weighted) or most likely amount method."},
{"q":"What are the five criteria for a contract to exist under IFRS 15 Step 1?","a":"(1) Contract <em>approved</em> by all parties; (2) Each party's <em>rights</em> regarding goods/services identifiable; (3) <em>Payment terms</em> identifiable; (4) Contract has <em>commercial substance</em>; (5) It is <em>probable</em> that the entity will collect the consideration."}
]},
{"id":"a6","icon":"🏦","title":"Financial Instruments — IFRS 9 and IAS 32","subtitle":"Classification · Amortised cost · FVPL · FVOCI · Compound instruments · Substance over form",
"theory":"<h4>Key Definitions (IAS 32)</h4><ul><li><strong>Financial asset:</strong> Cash; equity of another entity; contractual right to receive cash or another financial asset</li><li><strong>Financial liability:</strong> Contractual obligation to deliver cash or another financial asset</li><li><strong>Equity instrument:</strong> Residual interest in assets after deducting liabilities</li></ul><h4>Classification: Substance Over Legal Form</h4><p>A redeemable preference share looks like equity but has economic substance of debt (fixed return + mandatory repayment) → classified as a <strong>financial liability</strong>.</p><h4>Financial Liabilities — Measurement (IFRS 9)</h4><ul><li><strong>Initial:</strong> All financial liabilities recognised at fair value (less transaction costs, unless FVPL)</li><li><strong>Subsequent:</strong> Usually <strong>amortised cost</strong> using the effective interest rate (EIR) method. Exception: held-for-trading liabilities → <strong>FVPL</strong></li></ul><div class='fw'><strong>Amortised Cost (per year):</strong><br>Opening balance × EIR = Finance cost in SPLOCI<br>Closing balance = Opening + Finance cost − Cash coupon paid</div><h4>Financial Assets — Three Categories (IFRS 9)</h4><ul><li><strong>Amortised cost:</strong> Business model = hold to collect; cash flows = solely payments of principal and interest (SPPI test)</li><li><strong>FVOCI:</strong> Hold to collect AND sell; or equity instruments designated FVOCI at initial recognition</li><li><strong>FVPL:</strong> Everything else — trading investments, derivatives, instruments failing SPPI test</li></ul><h4>Compound Instruments (IAS 32)</h4><p>Convertible bonds contain both a liability (obligation to repay) and an equity component (holder's conversion option). Split on issue: (1) Liability = PV of future cash flows at market rate for equivalent non-convertible debt; (2) Equity = Proceeds − Liability component.</p>",
"qa":[
{"q":"A company issues $1m bonds at 6% coupon. EIR = 8%. Issue price = $964,335. Calculate Year 1 finance cost and closing carrying amount.","a":"Finance cost = $964,335 × 8% = <strong>$77,147</strong><br>Cash paid = $1,000,000 × 6% = $60,000<br>Closing carrying amount = $964,335 + $77,147 − $60,000 = <strong>$981,482</strong>"},
{"q":"Why might a redeemable preference share be classified as a financial liability?","a":"IAS 32 requires classification based on <em>substance over legal form</em>. A redeemable preference share that: (a) pays a <em>fixed dividend</em> (contractual obligation) AND (b) must be <em>redeemed</em> (repaid) on a set date — creates contractual obligations to deliver cash. An obligation to deliver cash meets the definition of a <strong>financial liability</strong>, regardless of its legal name as a 'share'."},
{"q":"Name the three categories for classifying financial assets under IFRS 9.","a":"<strong>1. Amortised cost:</strong> Business model = hold to collect; SPPI test passed (cash flows = principal + interest only).<br><strong>2. FVOCI:</strong> Business model = hold to collect AND sell; SPPI test passed. OR equity instruments designated FVOCI on initial recognition.<br><strong>3. FVPL:</strong> Everything else — instruments failing SPPI test, trading investments, derivatives."},
{"q":"How is a compound financial instrument split on initial recognition?","a":"(1) Calculate the <em>liability component</em> = PV of future cash flows (interest + principal) discounted at the market rate for equivalent non-convertible debt; (2) <em>Equity component</em> = Total proceeds − Liability component. This split is done once only at the issue date and is not revised subsequently."}
]},
{"id":"a7","icon":"🏢","title":"Lease Accounting for Lessors — IFRS 16","subtitle":"Finance vs operating leases · Operating lease income · Net investment in finance lease",
"theory":"<h4>Classification: Finance vs Operating Lease</h4><p>Key question: does the lease transfer <strong>substantially all the risks and rewards</strong> of ownership to the lessee?</p><div class='fw'><strong>Finance lease indicators:</strong><ul><li>Ownership transfers at end of lease</li><li>Bargain purchase option exists</li><li>Lease term = major part of asset's economic life</li><li>PV of lease payments ≈ fair value of the asset</li><li>Asset so specialised only the lessee can use it</li></ul></div><div class='fw'><strong>Operating lease:</strong> None of the above apply — more like a rental arrangement.</div><h4>Operating Lease — Lessor Accounting</h4><ul><li>Continue to recognise the underlying asset in SOFP; depreciate over its <em>economic life</em> (not lease term)</li><li>Recognise lease income on a <em>straight-line basis</em> over the lease term</li><li>Timing differences between cash received and income recognised → accrual or deferral</li></ul><h4>Finance Lease — Lessor Accounting</h4><p>Lessor <strong>derecognises the asset</strong> and recognises a <strong>finance lease receivable</strong> (net investment in the lease) = PV of future lease payments at the interest rate implicit in the lease.</p><div class='fw'><strong>Finance Income (each year):</strong><br>= Opening net investment × interest rate implicit in lease<br>Net investment reduces by: (Lease payment − Finance income)</div><div class='kbox'><strong>Key Distinction</strong>Operating lease: lessor keeps the asset, earns rental income. Finance lease: lessor effectively sells the asset on credit, earns finance income on the receivable.</div>",
"qa":[
{"q":"What is the determining factor in classifying a lease as finance or operating for a lessor?","a":"Whether the lease <strong>transfers substantially all the risks and rewards incidental to ownership</strong> of the underlying asset to the lessee. If yes → finance lease. If no → operating lease. Indicators include: lease term covering most of asset's economic life; PV of payments ≈ fair value; bargain purchase option; ownership transfer at end; or asset is so specialised only the lessee can use it."},
{"q":"How does a lessor account for an operating lease in the SOFP and SPLOCI?","a":"<strong>SOFP:</strong> Continue to recognise the underlying asset (e.g., as PPE), depreciate over its <em>economic useful life</em>.<br><strong>SPLOCI:</strong> Lease payments recognised as income on a <em>straight-line basis</em> over the lease term, regardless of actual cash receipt timing. Timing differences create accruals or deferred income in the SOFP."},
{"q":"Amber Co leases a computer to Quartz Co for 2 years at $300/month starting 1 June 20X8. How much income is recognised for the year ended 31 December 20X8?","a":"Lease period to year-end = 7 months (Jun–Dec).<br>Annual income = 12 × $300 = $3,600<br>Income for 7 months = $3,600 × 7/12 = <strong>$2,100</strong>"},
{"q":"For a finance lease, what does a lessor recognise at commencement instead of the leased asset?","a":"The lessor <strong>derecognises the underlying asset</strong> and recognises a <strong>finance lease receivable</strong> equal to the net investment in the lease (PV of future lease payments at the implicit interest rate). Each year: finance income = opening receivable × implicit rate; receivable reduces by (cash received − finance income)."}
]},
{"id":"a8","icon":"💡","title":"Intangible Assets — IAS 38","subtitle":"Definition · Recognition · R&D treatment · PIRATE criteria · Subsequent measurement",
"theory":"<h4>Definition (IAS 38)</h4><p>An intangible asset is an <strong>identifiable, non-monetary asset without physical substance</strong>. Three elements: (1) <em>Identifiable</em> — separable OR arises from contractual/legal rights; (2) <em>Controlled</em> by the entity; (3) Will generate <em>future economic benefits</em>.</p><h4>Recognition Criteria</h4><p>Must meet definition PLUS: (1) probable that future economic benefits will flow to the entity; (2) cost can be measured reliably. All intangible assets initially measured at <strong>cost</strong>.</p><h4>How Acquired — Initial Measurement</h4><ul><li><strong>Separate acquisition:</strong> Cost = purchase price + directly attributable costs</li><li><strong>Business combination (IFRS 3):</strong> Fair value at acquisition date</li><li><strong>Government grant:</strong> Fair value or nominal amount</li><li><strong>Internally generated:</strong> Strict rules apply (see below)</li></ul><h4>Internally Generated — Research vs Development</h4><div class='fw'><strong>Research phase:</strong> Always expensed — cannot be capitalised.</div><div class='fw'><strong>Development phase:</strong> Capitalise ONLY if ALL six PIRATE criteria are met:<ul><li><strong>P</strong>robably complete the asset</li><li><strong>I</strong>ntention to complete and use/sell</li><li><strong>R</strong>esources adequate and available</li><li><strong>A</strong>bility to use or sell</li><li><strong>T</strong>echnical feasibility</li><li><strong>E</strong>xpected future economic benefits</li></ul></div><div class='kbox'><strong>Cannot be recognised internally:</strong> Brands, mastheads, publishing titles, customer lists, and goodwill — costs cannot be reliably distinguished from developing the business as a whole.</div>",
"qa":[
{"q":"What makes an intangible asset 'identifiable' under IAS 38?","a":"An intangible is identifiable if it is either: (a) <strong>Separable</strong> — can be separated from the entity and sold, transferred, licensed, rented, or exchanged; OR (b) Arises from <strong>contractual or other legal rights</strong>, regardless of whether those rights are transferable or separable. Goodwill fails this test — it cannot be separated and does not arise from legal rights."},
{"q":"$200k spent on basic research into a new drug; $500k on development where all IAS 38 criteria are met. How are these treated?","a":"(a) <strong>Research $200k — Expense immediately.</strong> Research can never be capitalised under IAS 38.<br>(b) <strong>Development $500k — Capitalise as intangible asset</strong> (all PIRATE criteria met). Amortise over useful life once available for use."},
{"q":"Can a company capitalise the cost of internally developing its brand?","a":"<strong>No.</strong> IAS 38 explicitly prohibits recognition of internally generated brands, mastheads, publishing titles, customer lists, and similar items. The costs of internally developing these cannot be <em>distinguished from the cost of developing the business as a whole</em>, making reliable measurement impossible."},
{"q":"What is the difference in initial measurement between an intangible acquired in a business combination vs one internally generated?","a":"<strong>Business combination:</strong> Recognised at <em>fair value</em> at acquisition date (IFRS 3), even if the acquiree had not previously recognised it — as long as it is identifiable.<br><strong>Internally generated:</strong> Recognised at <em>cost</em>, only if ALL development phase criteria (PIRATE) are met. Research costs always expensed. Many internally generated intangibles cannot be recognised at all."}
]},
{"id":"a9","icon":"🌐","title":"Integrated Reporting & Sustainability Accounting","subtitle":"IR Framework · ISSB · IFRS S1 · Key drivers · Purpose of integrated thinking",
"theory":"<h4>Why Integrated Reporting?</h4><p>Traditional financial reporting is backward-looking and focused on financial performance only. Integrated reporting (IR) communicates how an organisation's strategy, governance, performance, and prospects — in context of its external environment — <strong>create value in the short, medium, and long term</strong>.</p><h4>Institutional History</h4><p>2010: IIRC established → 2013: Original &lt;IR&gt; Framework issued → 2021: Framework revised; IIRC merges with SASB to form <strong>Value Reporting Foundation (VRF)</strong> → VRF consolidates into <strong>IFRS Foundation</strong>, which now oversees both the IASB (financial standards) and the <strong>ISSB</strong> (sustainability standards).</p><h4>Key Drivers Behind IR</h4><ul><li><strong>Global reporting trends:</strong> Demand for concise, material, decision-useful disclosures</li><li><strong>New technology:</strong> Big data and analytics enable richer, more contextual reporting</li><li><strong>Transparency and trust:</strong> Investors demand accountability beyond financial metrics</li><li><strong>Materiality:</strong> Focus on information that genuinely affects value creation decisions</li></ul><h4>IFRS Sustainability Disclosure Standards</h4><ul><li><strong>IFRS S1:</strong> General Requirements for Disclosure of Sustainability-related Financial Information</li><li><strong>IFRS S2:</strong> Climate-related Disclosures (specific requirements — see next lesson)</li></ul><div class='kbox'><strong>Important</strong>The IR Framework and ISSB standards do NOT use 'non-financial information' — all disclosed information can ultimately have a material financial impact.</div>",
"qa":[
{"q":"What is the primary objective of integrated reporting and how does it differ from traditional financial reporting?","a":"<strong>Integrated reporting</strong> communicates how strategy, governance, performance, and prospects — across multiple capitals — create value over the short, medium, and long term for multiple stakeholders.<br><strong>Traditional reporting</strong> is primarily backward-looking, focused on historical financial performance and position. It does not capture environmental, social, relational, and intellectual value drivers."},
{"q":"Trace the institutional evolution from the IIRC to the IFRS Foundation's oversight of sustainability reporting.","a":"IIRC established (2010) → original &lt;IR&gt; Framework (2013) → revised Framework (2021) → IIRC merges with SASB to form <strong>VRF</strong> → VRF consolidates into <strong>IFRS Foundation</strong> → IFRS Foundation oversees IASB (financial) and <strong>ISSB</strong> (sustainability disclosure standards)."},
{"q":"What does IFRS S1 require entities to disclose?","a":"IFRS S1 requires entities to disclose information about all <strong>material sustainability-related risks and opportunities</strong> that could reasonably be expected to affect the entity's cash flows, access to finance, or cost of capital over the short, medium, or long term. It provides the general framework within which IFRS S2 and future topical standards sit."},
{"q":"Name four key drivers behind the integrated reporting movement.","a":"(1) <strong>Global reporting trends</strong> — demand for simpler, material disclosures; (2) <strong>New technology</strong> — big data and social media enable richer contextual reporting; (3) <strong>Transparency and trust</strong> — stakeholders demand accountability for sustainability decisions; (4) <strong>Materiality</strong> — focus on information that genuinely affects value creation for investors and other stakeholders."}
]},
{"id":"a10","icon":"🏛️","title":"Value Creation & the Six Capitals","subtitle":"Value creation process · Six capitals · Content elements · Guiding principles",
