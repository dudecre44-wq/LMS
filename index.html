"theory":"<h4>What is Activity-Based Costing?</h4><p>ABC allocates indirect costs to products or services using <em>cost drivers</em> rather than volume-based methods. It is most suited to organisations with a high proportion of indirect overhead and a diverse range of production activities.</p><h4>ABC vs Traditional Absorption Costing</h4><ul><li><strong>Traditional:</strong> Variable costs allocated directly; all indirect/fixed costs absorbed using a single volume-based driver (e.g., labour hours or machine hours). Assumes all products consume overhead in proportion to volume — may be inaccurate for diverse product lines.</li><li><strong>ABC:</strong> Identifies the cost activities that drive overhead; assigns costs to cost pools per activity; allocates those costs using the specific cost driver for each activity. More accurate for diverse production environments.</li></ul><h4>The Four-Step ABC Process</h4><div class='fw'><ol><li><strong>Identify activities</strong> and collate indirect overhead into <em>cost pools</em> for each activity</li><li><strong>Determine the cost driver</strong> for each activity — the factor that best explains what causes the cost. Must be: a good explanation of the cost; relevant and identifiable; measurable; data low-cost to obtain.</li><li><strong>Calculate the overhead rate per cost driver</strong> = Cost pool total ÷ Total cost driver activity</li><li><strong>Absorb activity costs into production</strong> based on each product's usage of the cost driver</li></ol></div><h4>Types of Cost Drivers</h4><ul><li>Volume-based: number of units produced (machine maintenance)</li><li>Time-based: hours to process an order</li><li>Resource-consumption-based: floor space used (factory rent)</li></ul><div class='kbox'><strong>When to Use ABC</strong>ABC is most valuable when: (1) indirect overhead is high as a proportion of total cost; (2) products are diverse in complexity, volume, and resource consumption; (3) traditional costing is producing misleading product costs that distort pricing and profitability decisions.</div>",
"qa":[
{"q":"Why does ABC produce more accurate product costs than traditional absorption costing?","a":"Traditional absorption costing assumes all products consume overhead <em>in proportion to their production volume</em> (e.g., labour hours). This is inaccurate when products differ significantly in complexity. ABC identifies the <em>specific activities</em> that drive each cost (e.g., purchase orders, machine setups, quality inspections) and allocates costs based on each product's actual consumption of those activities — producing more accurate costs."},
{"q":"Describe the four steps of implementing ABC.","a":"(1) <strong>Identify activities</strong> — group similar overhead costs into cost pools per activity (e.g., procurement, quality control, machine maintenance); (2) <strong>Determine cost drivers</strong> — identify the factor that best explains the cost for each activity (e.g., number of purchase orders); (3) <strong>Calculate overhead rate</strong> = Cost pool ÷ Total cost driver activity; (4) <strong>Absorb costs</strong> into each product/service based on its usage of the cost driver."},
{"q":"What are the four characteristics a good cost driver must possess?","a":"(1) It should be a <strong>good explanation</strong> of the cost (logically linked to the activity); (2) It must be <strong>relevant and identifiable</strong> with the product or service; (3) It must be <strong>easily measurable</strong>; (4) The data must be <strong>relatively low cost and straightforward to obtain</strong>. If a cost driver is difficult to measure, the administrative cost of ABC may outweigh the accuracy benefit."},
{"q":"What are the advantages and disadvantages of implementing ABC?","a":"<strong>Advantages:</strong> Fairer allocation of overhead; more costing insight for pricing decisions; improved decision-making; more accurate budgeting and forecasting; better overhead control by monitoring drivers.<br><strong>Disadvantages:</strong> Time-consuming and costly to implement; resistance from senior management; risk of arbitrary cost driver selection; may not be appropriate for inventory valuation under IFRS if results differ materially from traditional methods."}
]},
{"id":"a3","icon":"🔧","title":"Activity Based Management","subtitle":"Operational ABM · Strategic ABM · Value-adding vs non-value-adding · ABM uses",
"theory":"<h4>What is ABM?</h4><p>Activity Based Management (ABM) uses information gathered from ABC to <em>manage</em> activities and improve efficiency and profitability. It extends ABC from a costing tool into a strategic management tool. ABM recognises that <strong>products consume activities, and activities consume resources</strong> — so managing activities efficiently reduces costs in the long term.</p><h4>Two Levels of ABM</h4><div class='fw'><strong>Operational ABM (Short-Term)</strong><ul><li>Examines how to perform <em>existing activities more efficiently</em> (assumes demand for activities doesn't change)</li><li>Identifies non-value-adding activities to eliminate or reduce</li><li>Reviews cost drivers to identify where efficiency can be improved</li></ul></div><div class='fw'><strong>Strategic ABM (Long-Term)</strong><ul><li>Examines <em>which activities to continue</em> and which to discontinue</li><li>Value-generating activities: continue. Non-value-generating activities: change or discontinue.</li><li>Informs product mix, product design, customer profitability, and pricing decisions</li></ul></div><h4>Value-Adding vs Non-Value-Adding Activities</h4><ul><li><strong>Value-adding:</strong> Activities customers are willing to pay for (e.g., actual manufacturing, quality inspection)</li><li><strong>Non-value-adding:</strong> Activities that consume resources but add no customer value (e.g., waiting time, rework, unnecessary movement, storage time)</li></ul><div class='kbox'><strong>ABM Provides Three Insights</strong>(1) The <em>cost</em> of activities; (2) <em>Why</em> activities are undertaken; (3) How well activities are performed. Together these enable informed decisions about what to improve, eliminate, or outsource.</div>",
"qa":[
{"q":"What is the difference between operational ABM and strategic ABM?","a":"<strong>Operational ABM</strong> focuses on performing existing activities <em>more efficiently</em> in the short term — the demand for activities is assumed unchanged. It reduces costs without changing the fundamental product/service offering.<br><strong>Strategic ABM</strong> focuses on <em>which activities to undertake at all</em> in the long term. It examines whether the cost and value of each activity justifies its continuation, informing decisions about product mix, customer selection, and outsourcing."},
{"q":"What is a 'non-value-adding activity' and give two examples?","a":"A non-value-adding (NVA) activity is one that consumes resources but does not increase the value of the product or service to the customer — customers would not be willing to pay for it if they knew it existed. Examples: (1) <strong>Rework</strong> — fixing defective goods; the customer only values the final correct product; (2) <strong>Waiting time</strong> — products or materials sitting idle between production stages."},
{"q":"How does ABM differ from ABC in its purpose and application?","a":"<strong>ABC</strong> is primarily a <em>costing technique</em> — it identifies the true cost of products/services by allocating overhead using activity cost drivers.<br><strong>ABM</strong> is a <em>management system</em> that uses the information produced by ABC to improve efficiency, eliminate NVA activities, and make better strategic decisions. ABC provides the data; ABM provides the action. ABM can operate at both operational (short-term efficiency) and strategic (long-term direction) levels."},
{"q":"Why does ABM provide particular benefit for repetitive overhead activities?","a":"Repetitive overhead activities (e.g., procurement, order processing, quality inspection) occur many times with largely predictable patterns. ABM can identify exactly what drives the cost of each repetition, establish benchmarks for efficiency, eliminate NVA steps within each process, and then reduce cost per repetition. The cumulative effect across thousands of repetitions delivers significant total cost savings."}
]},
{"id":"a4","icon":"📊","title":"Direct and Activity-Based Cost Methods","subtitle":"ABC cost hierarchy · Unit · Batch · Product · Facility costs · Customer profitability",
"theory":"<h4>The ABC Cost Hierarchy — Four Categories</h4><p>ABC categorises costs into a hierarchy based on the level at which they are driven:</p><table class='tbl'><tr><th>Level</th><th>Description</th><th>Examples</th></tr><tr><td><strong>Unit costs</strong></td><td>Directly attributable to individual units</td><td>Direct labour, direct materials, unit maintenance</td></tr><tr><td><strong>Batch costs</strong></td><td>Incurred per batch produced or series of steps</td><td>Machine set-up, purchase orders, quality inspections</td></tr><tr><td><strong>Product costs</strong></td><td>Related to the entire product line, not individual units</td><td>Product development, product-specific marketing</td></tr><tr><td><strong>Facility costs</strong></td><td>Support the overall infrastructure — not specific products</td><td>Factory rent, senior management salaries</td></tr></table><div class='kbox'><strong>Facility Costs Warning</strong>Facility costs should NOT be allocated to cost objects for decision-making. They are fixed period costs that arise regardless of whether any products are made. Allocating them leads to poor decisions — e.g., a profitable product appearing unprofitable because it is charged a share of unrelated overhead.</div><h4>Calculating Contribution and Profit by Cost Object</h4><p>Once costs are classified and allocated to cost objects: Revenue − Unit costs − Batch costs − Product costs = <strong>Product contribution</strong>. After deducting facility costs: <strong>Net profit</strong>. Comparison by cost object enables identification of high and low performers and informs resource allocation decisions.</p>",
"qa":[
{"q":"Name the four levels of the ABC cost hierarchy and give one example of each.","a":"(1) <strong>Unit costs</strong> — direct materials (cost per unit produced); (2) <strong>Batch costs</strong> — machine set-up costs (incurred each time a production batch is initiated); (3) <strong>Product costs</strong> — product development costs for a specific line (incurred whether 1 or 1,000 units are made); (4) <strong>Facility costs</strong> — factory rent (incurred regardless of production activity)."},
{"q":"Why should facility costs generally NOT be allocated to cost objects for decision-making?","a":"Facility costs are fixed period costs that arise <em>regardless</em> of whether any products are manufactured. Allocating them to products suggests that reducing or eliminating a product would save those costs — which is incorrect. Allocating facility costs can make profitable products appear unprofitable, leading to poor decisions such as discontinuing profitable lines. They should be treated as period costs and absorbed at organisational level."},
{"q":"How does direct and ABC cost analysis enable an organisation to evaluate profitability by cost object?","a":"By allocating costs using the ABC hierarchy: (1) Unit costs are directly attributed; (2) Batch costs are allocated per batch; (3) Product costs are allocated to specific product lines; (4) Facility costs remain unallocated. Revenue minus the first three levels gives the <em>contribution per product</em>. This reveals which cost objects generate value and which are loss-making — informing pricing, discontinuation, and resource allocation decisions."},
{"q":"A hotel identifies four functions: accommodation, fine dining, spa, and events. Why would a single total cost report be insufficient and how would ABC cost hierarchy help?","a":"A single total cost report only shows overall hotel profit/loss and cannot identify which functions are profitable or loss-making. Applying the ABC hierarchy allows: unit costs (food ingredients per cover) and batch costs (event setup) to be allocated to specific functions; product costs (spa marketing) to be assigned to the relevant function; facility costs (building rent) to remain unallocated. This produces a contribution statement per function, enabling targeted management action."}
]},
{"id":"a5","icon":"🎯","title":"Direct Customer and Distribution Channel Profitability","subtitle":"Customer profitability analysis · Channel analysis · Interconnections · CPA",
"theory":"<h4>Why Analyse by Customer and Channel?</h4><p>Not all customers and distribution channels generate the same level of profit. Some customers may appear to generate high revenue but consume disproportionate overhead through small orders, frequent queries, or high return rates. Customer Profitability Analysis (CPA) and distribution channel analysis reveal where value is actually being created.</p><h4>Customer Profitability Analysis</h4><p>Using ABC, allocate costs directly traceable to each customer: net revenue − product costs − customer-specific costs = <strong>customer contribution</strong>. Customer-specific costs include: special deliveries; after-sales support; bespoke packaging; account management time; discounts and rebates.</p><div class='kbox'><strong>The 80-20 Rule (Pareto Analysis)</strong>Typically, 20% of customers generate 80% of profits. Conversely, the bottom 20% of customers may actually destroy value — consuming overhead in excess of their revenue contribution. CPA makes these relationships visible.</div><h4>Distribution Channel Profitability</h4><p>Different channels (e.g., online, retail, wholesale, direct sales) have different cost structures. Analysis identifies which channels are most profitable and informs investment and pricing decisions.</p><h4>Interconnections Between Activities</h4><p>Some low-margin products or channels attract customers who also purchase higher-margin items — an <em>interconnection</em>. Example: a supermarket's low-margin food attracts footfall that leads to higher-margin clothing and electronics sales. CPA must consider the full value of a customer relationship, not just the direct margin on individual transactions.</p>",
"qa":[
{"q":"What is Customer Profitability Analysis and what costs should be allocated to individual customers?","a":"CPA allocates revenue and direct costs to individual customers (or customer segments) to establish their net contribution. Customer-specific costs to allocate include: special delivery arrangements; after-sales support and service calls; bespoke packaging; account management and sales team time; discounts, rebates, and payment terms concessions. Revenue − Customer-specific costs = Customer contribution."},
{"q":"What is the 80-20 rule in the context of customer profitability?","a":"Pareto's 80-20 rule suggests that approximately <em>80% of profits come from 20% of customers</em>. The bottom 20% of customers may be loss-making — consuming overhead (e.g., small, frequent orders; excessive service calls; bespoke requirements) in excess of their revenue contribution. CPA makes this distribution visible, enabling decisions such as focusing on the most profitable customers or renegotiating terms with loss-making accounts."},
{"q":"What is an 'interconnection' in the context of customer and channel profitability?","a":"An interconnection occurs when one low-margin product, service, or channel <em>drives sales of another higher-margin item</em>. Example: a supermarket's low-margin food essentials attract customers into the store, where they also purchase higher-margin clothing and household goods. If the food category were discontinued based solely on its own margin, the supermarket would lose the associated high-margin sales. CPA and channel analysis must account for these interdependencies."},
{"q":"Give three types of costs that are customer-specific and would be allocated in CPA.","a":"(1) <strong>Special delivery costs</strong> — e.g., express next-day delivery required by a specific customer; (2) <strong>After-sales service costs</strong> — e.g., a customer who generates a high volume of warranty claims or technical support calls; (3) <strong>Bespoke packaging or product modifications</strong> — unique specifications requested by one customer that incur additional design or production costs."}
]},
{"id":"a6","icon":"⛓️","title":"The Value Chain","subtitle":"Porter's Value Chain · Primary activities · Support activities · Competitive advantage · Linkages",
"theory":"<h4>What is the Value Chain?</h4><p>Michael Porter's value chain considers the full range of activities required for an organisation to deliver a product or service. The objective is to ensure the <strong>value added by these activities exceeds the costs incurred</strong>, thereby generating profit (margin) and competitive advantage.</p><h4>Five Primary Activities</h4><table class='tbl'><tr><th>Activity</th><th>Description</th></tr><tr><td><strong>Inbound logistics</strong></td><td>Receiving and storing raw materials; supplier relationships</td></tr><tr><td><strong>Operations</strong></td><td>Converting inputs to finished products/services</td></tr><tr><td><strong>Outbound logistics</strong></td><td>Storing and distributing finished products to customers</td></tr><tr><td><strong>Marketing &amp; sales</strong></td><td>Advertising, pricing, channel decisions, promotions</td></tr><tr><td><strong>After-sales service</strong></td><td>Installation, repair, customer support post-purchase</td></tr></table><h4>Four Support Activities</h4><ul><li><strong>Procurement</strong> — Purchasing systems for all inputs</li><li><strong>Technology</strong> — IT, R&amp;D, automation, machinery investment</li><li><strong>Human resource management</strong> — Recruitment, training, retention</li><li><strong>Firm infrastructure</strong> — Finance, legal, planning, quality management</li></ul><h4>Linkages and Competitive Advantage</h4><p>Value chain analysis identifies <em>linkages</em> between activities — where changes in one activity improve or worsen others. For example: excessive after-sales service costs may signal a problem in inbound logistics (poor raw material quality) or operations (poor manufacturing quality) — fixing the root cause in those activities eliminates downstream after-sales costs.</p><div class='kbox'><strong>Goal of Value Chain Analysis</strong>Identify actions that add value and improve linkages between primary and support activities; eliminate non-value-adding activities; maximise the 'margin' (profit) generated across the entire chain.</div>",
"qa":[
{"q":"Name Porter's five primary activities in the value chain.","a":"(1) <strong>Inbound logistics</strong> — receiving, storing, distributing inputs internally; (2) <strong>Operations</strong> — converting inputs into finished products; (3) <strong>Outbound logistics</strong> — storing and distributing outputs to customers; (4) <strong>Marketing &amp; Sales</strong> — promoting and selling products; (5) <strong>After-sales service</strong> — maintaining and enhancing the value of products post-purchase."},
{"q":"Name the four support activities in Porter's value chain and explain their role.","a":"(1) <strong>Procurement</strong> — purchasing systems and supplier management supporting all primary activities; (2) <strong>Technology</strong> — IT, R&amp;D, and automation enabling efficiency across the chain; (3) <strong>Human resource management</strong> — recruiting, training, and retaining people for all activities; (4) <strong>Firm infrastructure</strong> — finance, legal, planning systems supporting the whole organisation. Support activities are the 'overhead' of the organisation but are essential for the primary activities to function."},
{"q":"What is a 'linkage' in the value chain and why is identifying linkages important?","a":"A linkage is a relationship between two activities in the value chain where changes in one affect the cost or performance of another. Identifying linkages is important because: (1) Problems in one area may be caused by or cause issues elsewhere (e.g., high after-sales costs caused by poor quality in operations); (2) Improvements in one area can create cascading benefits; (3) Optimising activities in isolation without considering linkages can be counterproductive."},
{"q":"How can value chain analysis be used to reduce costs without harming customer value?","a":"Value chain analysis identifies: (1) <em>Which activities</em> create value for customers vs which consume costs without adding value; (2) <em>Linkages</em> between activities where improving one reduces costs elsewhere; (3) <em>Outsourcing opportunities</em> — activities where external providers can perform the function more cheaply without quality reduction; (4) <em>Technology investments</em> that automate costly manual activities. The objective is always to reduce costs where customers cannot perceive any difference in value."}
]},
{"id":"a7","icon":"🔬","title":"Functional Analysis","subtitle":"Functions vs cost · Customer value · Steps of functional analysis · Product/service optimisation",
"theory":"<h4>What is Functional Analysis?</h4><p>Functional analysis is an in-depth analysis of the relationship between <strong>product functions, their perceived value to the customer, and the cost of providing each function</strong>. Unlike cost reduction alone, functional analysis aims to identify the functions customers value most and find the most cost-effective ways to deliver them.</p><h4>Steps of Functional Analysis</h4><div class='fw'><ol><li><strong>Assemble a cross-functional team</strong> — marketing, design, manufacturing, accounting, and other relevant departments</li><li><strong>Identify the functions</strong> of the product or service — what does each component do?</li><li><strong>Determine customer perception of value</strong> for each function — via customer research</li><li><strong>Calculate the cost of each function</strong> — using ABC or direct costing</li><li><strong>Compare cost vs perceived value</strong> — identify functions where cost exceeds customer-perceived value</li><li><strong>Identify and evaluate alternatives</strong> — can functions be achieved more cheaply? Can new functions be added that increase value more than their cost?</li><li><strong>Implement and review</strong> — monitor success and apply lessons to future analysis</li></ol></div><h4>Purpose and Scope</h4><ul><li>Can be applied to products, services, overheads, and organisational structure</li><li>It is estimated that 80% of product costs are determined during design — hence functional analysis is most powerful at the design/development stage</li><li>Results in either cost reduction (maintaining customer value) or value enhancement (adding features that justify higher prices)</li></ul><div class='kbox'><strong>Key Distinction</strong>Functional analysis focuses on <em>functions</em> as the cost object (not the product itself). A function is what a component or feature <em>does</em> — e.g., &quot;provides waterproofing,&quot; &quot;reduces weight,&quot; &quot;enables GPS.&quot; Cost is then allocated to each function.</div>",
"qa":[
{"q":"What is functional analysis and how does it differ from simple cost reduction?","a":"Functional analysis is an in-depth examination of the relationship between a product's functions, the customer's perceived value of each function, and the cost of providing it. It differs from simple cost reduction because it always considers the <em>impact on customer-perceived value</em>. A cost reduction that reduces a function the customer values is counterproductive — functional analysis ensures cost changes either maintain or enhance value."},
{"q":"Why should a cross-functional team be assembled for functional analysis?","a":"Functional analysis requires input from multiple perspectives: <em>marketing</em> provides insight into customer perceptions of value; <em>design</em> understands what can be changed technically; <em>manufacturing</em> knows the production cost implications; <em>accounting</em> calculates the financial impact. No single function has all the information needed. A cross-functional team ensures recommendations are both technically feasible and financially beneficial."},
{"q":"Why is functional analysis most effective at the design and development stage of a product?","a":"Approximately <strong>80% of a product's total costs are committed at the design and development stage</strong> — choices about components, materials, manufacturing processes, and complexity are locked in early. Once manufacturing begins, cost changes become much harder and more disruptive to implement. Functional analysis at the design stage allows the organisation to build cost-efficiency into the product from the outset."},
{"q":"In functional analysis, what is being compared and what action does this comparison drive?","a":"The <strong>cost of providing each function</strong> is compared with the <strong>customer's perceived value</strong> of that function. Where cost exceeds perceived value: the function should be redesigned to cost less, replaced with a cheaper alternative, or (if customers truly don't value it) eliminated. Where a new function can be added that customers value more than its cost: add it to increase the product's appeal and justify a higher price."}
]},
{"id":"a8","icon":"✨","title":"Value Analysis and Value Engineering","subtitle":"Four aspects of value · Cost value · Exchange value · Use value · Esteem value",
"theory":"<h4>Value Analysis vs Value Engineering</h4><ul><li><strong>Value Analysis:</strong> A systematic examination of factors affecting the cost of an <em>existing</em> product/service, to achieve the specified purpose most economically at the required quality. Looks backward at current products.</li><li><strong>Value Engineering:</strong> The (re)design of an activity, product, or service so that value to the customer is enhanced while costs are reduced (or increased less than the resulting price increase). Applies to <em>new</em> products or fundamental redesigns.</li></ul><h4>The Four Aspects of Value</h4><table class='tbl'><tr><th>Aspect</th><th>Description</th></tr><tr><td><strong>Cost value</strong></td><td>The cost incurred to produce the product, service, or activity</td></tr><tr><td><strong>Exchange value</strong></td><td>The price that customers are prepared to pay (market value)</td></tr><tr><td><strong>Use value</strong></td><td>The features and usefulness — its ability to perform its intended purpose</td></tr><tr><td><strong>Esteem value</strong></td><td>The prestige or status attached by the customer (e.g., luxury brands)</td></tr></table><div class='kbox'><strong>Key Principle</strong>Any cost saving must be evaluated against its impact on exchange, use, and esteem value. A cheaper component may reduce cost value but also reduce use value (product fails earlier) and esteem value (perceived as inferior) — damaging the product's market position.</div><h4>Steps of Value Analysis</h4><ol><li>Select the product/service for analysis</li><li>Obtain information — identify uses, determine if they're fulfilled, identify alternatives and their costs</li><li>Analyse — evaluate cost savings ensuring they don't reduce value below what customers expect</li><li>Implement approved changes</li><li>Review results and apply lessons</li></ol>",
"qa":[
{"q":"Distinguish between value analysis and value engineering.","a":"<strong>Value analysis</strong> is applied to <em>existing</em> products/services — a systematic review of factors affecting cost with the aim of achieving the same quality at lower cost. <strong>Value engineering</strong> is applied to <em>new</em> products or redesigns — evaluating how to enhance customer value while controlling costs. Both use the same analytical approach but at different stages of the product lifecycle."},
{"q":"Name the four aspects of value and briefly describe each.","a":"(1) <strong>Cost value</strong> — the cost of producing the product/service; (2) <strong>Exchange value</strong> — the price customers will pay (market value); (3) <strong>Use value</strong> — the functional usefulness and ability to fulfil its intended purpose; (4) <strong>Esteem value</strong> — the prestige, status, or emotional attachment customers associate with the product (e.g., luxury goods)."},
{"q":"Why must cost savings always be evaluated against their impact on use and esteem value?","a":"The four aspects of value are interlinked. A cost saving achieved by using cheaper materials may reduce: <em>use value</em> (the product fails sooner or performs less well) and <em>esteem value</em> (customers perceive the product as inferior). If these reductions in value are perceived by customers, exchange value (market price) will fall — potentially more than the cost savings achieved. The net effect could be a fall in profitability despite lower costs."},
{"q":"What is the goal of both value analysis and value engineering?","a":"To achieve the <strong>best combination</strong> of cost, exchange, use, and esteem value. Specifically: to reduce cost value without reducing exchange, use, or esteem value below what customers expect — OR to increase exchange value (via improved use or esteem value) by more than the increase in cost value. The key is always a net improvement in the value/cost ratio for the organisation."}
]},
{"id":"a9","icon":"🏆","title":"Management Techniques for Efficiency and Quality","subtitle":"TQM · JIT production · Theory of Constraints · Costs of quality · Conformance vs nonconformance",
"theory":"<h4>Total Quality Management (TQM)</h4><p>TQM is a structured, organisation-wide approach to quality management aiming to ensure products/services meet or exceed customer expectations. It emphasises <em>prevention</em> rather than detection.</p><div class='fw'><strong>Four Principles of TQM:</strong><ol><li>'Get it right the first time' — zero defects culture; prevention costs far less than correction</li><li>Continuous improvement — always possible to make small, incremental quality improvements</li><li>Customer focus — demand-pull production; recognise customer-driven markets</li><li>Ownership and resolution of problems — empowered workforce; quality circles</li></ol></div><h4>Costs of Quality</h4><table class='tbl'><tr><th>Category</th><th>Type</th><th>Examples</th></tr><tr><td rowspan='2'><strong>Conformance</strong> (avoiding defects)</td><td>Prevention</td><td>Staff training, process design, supplier quality programmes</td></tr><tr><td>Appraisal</td><td>Inspection, testing, quality audits</td></tr><tr><td rowspan='2'><strong>Nonconformance</strong> (result of failures)</td><td>Internal failure</td><td>Rework, scrap, downtime from defects</td></tr><tr><td>External failure</td><td>Warranty claims, product recalls, lost goodwill</td></tr></table><h4>Just-In-Time (JIT) Production</h4><p>JIT reduces inventory to zero (ideally) by producing only when a customer order is received. Requires: strong supplier relationships; fast, reliable delivery; good MIS. Benefits: reduced holding costs; reduced wastage; improved cash flow. Risk: any supply disruption halts production.</p><h4>Theory of Constraints</h4><p>Identifies and eliminates production <em>bottlenecks</em> (constraints that limit throughput). The five steps: Identify the constraint → Exploit it (use it fully) → Subordinate everything else to the constraint → Elevate the constraint → Repeat for the next constraint.</p>",
"qa":[
{"q":"What are the four principles of Total Quality Management?","a":"(1) <strong>'Get it right the first time'</strong> — zero defect culture; prevention is far cheaper than correction; (2) <strong>Continuous improvement</strong> — always possible to make incremental quality improvements; (3) <strong>Customer focus</strong> — demand-pull production; recognise that quality is defined by the customer; (4) <strong>Ownership and resolution of problems</strong> — empower employees at all levels; use quality circles to collectively solve problems."},
{"q":"Classify these costs of quality: (a) product recall costs; (b) staff quality training; (c) incoming material inspection; (d) rework costs.","a":"(a) <strong>Product recall</strong> — external failure cost (nonconformance)<br>(b) <strong>Staff quality training</strong> — prevention cost (conformance)<br>(c) <strong>Incoming material inspection</strong> — appraisal cost (conformance)<br>(d) <strong>Rework</strong> — internal failure cost (nonconformance)"},
{"q":"How does JIT production support TQM and what are its risks?","a":"JIT supports TQM by: eliminating inventory holding costs; reducing the accumulation of defective stock; forcing high quality standards (defects in JIT immediately halt production — there is no buffer stock); and creating a demand-pull system that aligns to customer needs. Risks include: any supply disruption immediately halts production (zero buffer); strong supplier relationships and reliable MIS are prerequisites; unsuitable for highly variable demand patterns."},
{"q":"What is the 'Theory of Constraints' and what are the five steps?","a":"The Theory of Constraints identifies production bottlenecks that limit the system's throughput. Five steps: (1) <strong>Identify</strong> the constraint; (2) <strong>Exploit</strong> it — use the constraint to its maximum capacity; (3) <strong>Subordinate</strong> all other activities to the constraint — everything else runs at the constraint's pace; (4) <strong>Elevate</strong> the constraint — invest to increase its capacity; (5) <strong>Repeat</strong> — identify the next constraint."}
]},
{"id":"a10","icon":"♻️","title":"Business Process Improvement","subtitle":"Process re-engineering · Kaizen costing · Continuous improvement · Costs of quality reporting",
"theory":"<h4>Two Main Approaches to Business Process Improvement</h4><div class='fw'><strong>Process Re-engineering (BPR)</strong><ul><li>A <em>one-off, radical review</em> of business processes that fundamentally rethinks how the organisation operates</li><li>Starts from the customer experience endpoint and works backwards through processes</li><li>Eliminates non-value-adding activities and bottlenecks</li><li><strong>Benefits:</strong> Elimination of NVA activities; increased efficiency and profits; demand-pull focus</li><li><strong>Drawbacks:</strong> Staff demotivation risk; significant management time; short-term disruption from major changes</li></ul></div><div class='fw'><strong>Kaizen (Continuous Improvement)</strong><ul><li>A Japanese philosophy of <em>ongoing, incremental</em> improvements rather than one-off radical change</li><li>Workforce and management continuously identify and implement small improvements</li><li>Employees may set internal targets to reduce costs by a specific % each period</li><li><strong>Benefits:</strong> Culture of improvement; job satisfaction; ongoing efficiency gains</li><li><strong>Drawbacks:</strong> Can demotivate if success criteria are constantly changing; requires full workforce training and commitment</li></ul></div><h4>Kaizen Costing</h4><p>Kaizen costing is the <em>continual cost reduction</em> of existing components and products. It is applied during the <em>manufacturing phase</em> (whereas target costing is applied at the design phase). It focuses on managing the two quality cost categories: conformance (preventing failures) and nonconformance (costs from failures).</p>",
"qa":[
{"q":"Distinguish between business process re-engineering and Kaizen as approaches to improvement.","a":"<strong>BPR</strong> is a one-off, radical redesign of business processes — fundamentally rethinking how work is done, with significant short-term disruption but potentially transformational long-term benefits.<br><strong>Kaizen</strong> is ongoing, incremental improvement — small changes made continuously by an engaged workforce. Less disruptive but requires sustained commitment and cultural embedding. BPR changes the process; Kaizen continuously fine-tunes it."},
{"q":"What are the benefits and drawbacks of process re-engineering?","a":"<strong>Benefits:</strong> Elimination of non-value-adding activities; increased efficiency; increased profits; forces a customer-focused (demand-pull) perspective.<br><strong>Drawbacks:</strong> Risk of staff demotivation (fear of redundancy); requires significant management time; causes substantial short-term business disruption; if poorly managed, can destroy value rather than create it."},
{"q":"What is Kaizen costing and at what stage of the product lifecycle is it applied?","a":"Kaizen costing is the <em>continual cost reduction</em> of existing components and products through a philosophy of ongoing, incremental improvements. It is applied during the <em>manufacturing/production phase</em> — contrast with target costing, which is applied at the design stage. In Kaizen, employees and management continuously identify small improvements to reduce costs while maintaining quality."},
{"q":"How do the costs of quality feature in continuous improvement programmes?","a":"Continuous improvement focuses on reducing both: (1) <em>Nonconformance costs</em> — by eliminating defects, rework, waste, and product failures through better processes; and (2) <em>Conformance costs</em> — by making prevention and appraisal activities more efficient. Over time, well-embedded continuous improvement should reduce total quality costs by shifting investment from nonconformance (reactive, expensive) to prevention (proactive, cheaper). Quality improvement and cost reduction become complementary, not conflicting."}
]},
{"id":"a11","icon":"🎯","title":"Target Costing","subtitle":"Market-driven approach · Target cost gap · Design stage · Cost reduction techniques",
"theory":"<h4>What is Target Costing?</h4><p>Target costing is a <strong>market-driven approach</strong> (demand-pull) where the selling price is set by the market, and the required cost is derived by deducting the desired profit margin. It reverses the traditional supply-push approach (cost + markup = price).</p><div class='fw'><strong>Target Cost Formula:</strong><br>Target selling price (market-determined)<br>Less: Target profit margin (desired return)<br>= <strong>Target cost</strong><br><br>If Expected cost &gt; Target cost → <strong>Cost gap</strong> must be eliminated before launch</div><h4>Implementing Target Costing</h4><ul><li>Most effective when applied at the <em>design and development stage</em> — before manufacturing processes are locked in</li><li>At the design stage, 80% of lifetime costs are committed, so this is the most cost-effective point to reduce costs</li><li>Can also be applied during manufacture, but with greater limitations</li></ul><h4>Cost Gap Reduction Techniques</h4><ul><li>Reduce component complexity or variety (simplification/standardisation)</li><li>Change materials to lower-cost alternatives with equal quality</li><li>Increase automation to reduce labour costs</li><li>Redesign packaging to reduce material use</li><li>Use less skilled labour for certain processes</li><li>Apply value analysis and value engineering to identify NVA components</li></ul><div class='kbox'><strong>Target Costing vs Kaizen</strong>Both are continuous improvement approaches. Target costing is applied at the <em>design/pre-production stage</em> to set cost ceilings. Kaizen is applied <em>during production</em> to continuously reduce costs incrementally.</div>",
"qa":[
{"q":"Define target costing and calculate the target cost given: market price $250, desired profit margin 20%.","a":"Target costing is a market-driven approach where the selling price is set by the market and the target cost is derived by deducting the required profit.<br>Target cost = $250 × (1 − 20%) = <strong>$200</strong><br>If the expected production cost exceeds $200, there is a cost gap that must be closed before the product can be profitably launched at $250."},
{"q":"Why is target costing most effective when applied at the design stage?","a":"Approximately <strong>80% of a product's total lifetime costs are committed at the design and development stage</strong> — choices about specifications, components, materials, manufacturing processes, and automation are locked in early. Once production begins, changing these is costly and disruptive. Applying target costing at the design stage allows the organisation to build the target cost into the product's architecture from the outset."},
{"q":"List four techniques that can be used to close a target cost gap.","a":"(1) <strong>Simplification/standardisation</strong> — reduce component variety or complexity; use standard components rather than bespoke ones; (2) <strong>Material substitution</strong> — replace high-cost materials with cheaper alternatives of equal quality; (3) <strong>Increased automation</strong> — invest in machinery to replace expensive labour; (4) <strong>Value analysis/engineering</strong> — identify and eliminate non-value-adding functions or components."},
{"q":"How does target costing differ from the traditional 'cost-plus' approach to pricing?","a":"<strong>Traditional cost-plus (supply-push):</strong> Calculate expected cost → add desired markup → set selling price. The cost determines the price.<br><strong>Target costing (demand-pull):</strong> Market determines the selling price → deduct desired profit → the result is the maximum allowable cost. The price determines the cost target. Target costing is more customer-focused and competitive — particularly in markets where the selling price is set by competition."}
]},
{"id":"a12","icon":"📈","title":"Life Cycle Costing","subtitle":"Five stages · Committed vs incurred costs · Marketing strategies · Long-term profitability",
"theory":"<h4>What is Life Cycle Costing?</h4><p>Life cycle costing profiles costs and revenues over a product or service's <em>entire life</em> — from initial development through to decommissioning. Traditional costing systems focus on monthly/annual periods and miss the full picture of long-term profitability.</p><h4>The Five Stages of the Product Life Cycle</h4><table class='tbl'><tr><th>Stage</th><th>Key Characteristics</th></tr><tr><td><strong>Development</strong></td><td>High fixed costs; no sales; 80% of lifetime costs committed here</td></tr><tr><td><strong>Introduction</strong></td><td>Sales low; high marketing costs; build brand awareness; pricing strategy critical</td></tr><tr><td><strong>Growth</strong></td><td>Market share increasing; little competition; economies of scale begin</td></tr><tr><td><strong>Maturity</strong></td><td>Sales peak; market saturated; competitive pricing pressure increases</td></tr><tr><td><strong>Decline</strong></td><td>Sales falling; reduce costs; manage wind-down or discontinuation</td></tr></table><h4>Committed vs Incurred Costs</h4><p><strong>Committed costs</strong> are those that will inevitably be incurred in future periods based on decisions already made (e.g., design choices lock in future manufacturing costs). <strong>Incurred costs</strong> are those actually spent in the current period. By the end of the development stage, most costs are committed even if not yet incurred — highlighting why early decisions are critical.</p><h4>Marketing Strategies to Extend the Life Cycle</h4><ul><li><strong>Staggered entry:</strong> Phase the release of a product to different markets sequentially — extending growth and maturity phases</li><li><strong>Price skimming:</strong> Initially set a premium price (for early adopters) then reduce over time to capture a wider market</li></ul>",
"qa":[
{"q":"What are the five stages of the product life cycle and what costs dominate each?","a":"(1) <strong>Development</strong> — high R&amp;D and design costs; no revenue; most lifetime costs committed here; (2) <strong>Introduction</strong> — high marketing/advertising costs; low revenue as market awareness is built; (3) <strong>Growth</strong> — economies of scale reduce unit costs; competition increases; revenue grows rapidly; (4) <strong>Maturity</strong> — revenue peaks; competition intensifies; price pressure; (5) <strong>Decline</strong> — revenue falls; focus on cost reduction and managing wind-down or product exit."},
{"q":"Why is the distinction between 'committed' and 'incurred' costs important in life cycle costing?","a":"By the end of the development stage, approximately <strong>80% of a product's total lifetime costs are committed</strong> — decisions about design, materials, processes, and complexity lock in future costs even though they haven't been spent yet. Incurred costs only reflect what has actually been paid in a given period. Managing committed costs (by making better design decisions early) is more effective than managing incurred costs after the fact."},
{"q":"How does life cycle costing differ from traditional period-based costing?","a":"Traditional costing focuses on costs and revenues within a monthly or annual reporting period. This obscures the total profitability picture: development and launch costs in early periods may make the product appear unprofitable, while later periods show high profit without reflecting earlier investments. Life cycle costing profiles ALL costs (development through decommissioning) against ALL revenue across the complete lifecycle — enabling better decisions about launch, pricing, and discontinuation."},
{"q":"Explain 'price skimming' as a life cycle marketing strategy and its cost implications.","a":"Price skimming involves setting a <em>high initial price</em> (targeting innovators and early adopters who are willing to pay a premium for early access), then progressively reducing the price to capture larger market segments. Cost implications: (1) High initial margins help recover development costs quickly; (2) As the product moves to growth/maturity, lower prices increase volume, enabling economies of scale that reduce per-unit costs; (3) Suits products with strong brand or technological differentiation that justifies premium pricing."}
]}
]},
"B":{"title":"Managing Risk and Uncertainty","icon":"⚠️","lessons":[
{"id":"b1","icon":"🌊","title":"Business Risks","subtitle":"Strategic · Operational · Compliance · Product · Reputational risks · Categories",
"theory":"<h4>What is Business Risk?</h4><p>Business risk is an organisation's exposure to uncertain events that may <strong>reduce or increase its profits</strong>. All businesses are susceptible to business risk. Risk differs from uncertainty: <em>risk is quantifiable</em> (probabilities can be estimated); <em>uncertainty is not</em> (outcomes cannot be predicted).</p><h4>Five Categories of Business Risk</h4><table class='tbl'><tr><th>Category</th><th>Description</th><th>Examples</th></tr><tr><td><strong>Strategic</strong></td><td>Risk that the business strategy will fail; fundamental to long-term existence; assessed at board level</td><td>New competitors, technological disruption, changes in customer preferences</td></tr><tr><td><strong>Operational</strong></td><td>Risk of loss from failed processes, people, or systems; affects day-to-day operations</td><td>Machinery breakdowns, fraud, data breaches, loss of key personnel</td></tr><tr><td><strong>Compliance</strong></td><td>Risk of legal/regulatory non-compliance</td><td>Failure to meet health &amp; safety, tax, or data protection requirements</td></tr><tr><td><strong>Product</strong></td><td>Risk that products/services fail to meet customer needs</td><td>Product defects, poor design, inadequate after-sales service</td></tr><tr><td><strong>Reputational</strong></td><td>Risk that actions damage the organisation's reputation, reducing revenue</td><td>Ethical failures, poor customer service, social media incidents</td></tr></table><div class='kbox'><strong>Specific Operational Risks Often Overlooked</strong>Fraud and malfeasance risk (embezzlement, false statements to customers); Contractual inadequacy risk (poorly drafted contracts with no penalty clauses); Commodity price risk (exposure to raw material price volatility).</div>",
"qa":[
{"q":"Name the five categories of business risk.","a":"(1) <strong>Strategic</strong> — risk that the business strategy fails; (2) <strong>Operational</strong> — risk from failed processes, people, or systems; (3) <strong>Compliance</strong> — risk of failing to meet legal/regulatory requirements; (4) <strong>Product</strong> — risk that products/services fail to meet customer needs; (5) <strong>Reputational</strong> — risk that actions damage the organisation's standing and reduce revenue."},
{"q":"What is 'contractual inadequacy risk' and how is it mitigated?","a":"Contractual inadequacy risk arises when contracts are agreed and signed without full consideration of potential problems. Example: a construction company contracts to complete a building by a deadline but fails to include a clause limiting its liability for delays caused by unforeseen events — facing large financial penalties. Mitigation: careful contract review before signing; inclusion of clauses anticipating potential problems; legal review; clear force majeure provisions."},
{"q":"What is the difference between strategic risk and operational risk?","a":"<strong>Strategic risk</strong> is the risk that the overall business strategy will fail — these risks tend to be fewer in number but fundamental to the organisation's continued existence. They are assessed at board level and relate to long-term direction (competitors, technology shifts).<br><strong>Operational risk</strong> relates to the day-to-day running of the business — failures in processes, people, or systems. There are many more operational risks (machinery breakdown, fraud, IT failure) but their individual impact is typically smaller than strategic risks."},
{"q":"Why is reputational risk particularly serious for modern organisations?","a":"In the social media age, reputational damage can spread instantly and globally. One customer complaint or ethical failure can generate widespread negative publicity affecting: customer loyalty (revenue falls); share price (investor confidence drops); talent recruitment (difficulty attracting high-quality employees); supplier relationships (partners may avoid association). Reputational risk may also create follow-on legal and compliance risks. It is increasingly difficult to recover from severe reputational damage."}
]},
{"id":"b2","icon":"🎲","title":"Upside Risk and Downside Risk","subtitle":"Two-way risk · Speculative risk · Pure risk · Identifying opportunities",
"theory":"<h4>Two Types of Risk</h4><ul><li><strong>Downside risk</strong> — events that have a <em>negative</em> effect on an organisation (reduce profits). The natural focus of most risk management.</li><li><strong>Upside risk</strong> — events that have a <em>positive</em> effect (increase profits). Often overlooked but equally important to identify and exploit.</li></ul><p>Considering both together is called <strong>two-way</strong> or <strong>speculative risk</strong>. An organisation that only manages downside risk may miss beneficial opportunities.</p><h4>Downside Risk Categories</h4><ul><li><strong>Strategic risks</strong> — business strategy fails due to competition, politics, external factors</li><li><strong>Operational risks</strong> — something goes wrong in daily operations</li><li><strong>Compliance risks</strong> — legal requirements not met</li><li><strong>Product risks</strong> — product doesn't meet customer needs</li><li><strong>Reputational risks</strong> — actions damage customer relationships</li></ul><h4>Upside Risk Opportunities</h4><p>Examples of upside risks: entry into a new market earlier than competitors; adoption of a new technology that significantly reduces costs; an economic trend (e.g., growing middle class in a target market) that expands demand; an unexpected regulatory change that disadvantages competitors while benefiting the organisation.</p><div class='kbox'><strong>Pure Risk vs Speculative Risk</strong>Pure risk: only one possible outcome (loss or no loss). Example: fire destroying a building — either it burns or it doesn't. Speculative/two-way risk: both gain and loss are possible. Example: launching a new product — may succeed (upside) or fail (downside). Risk management must address both.</div>",
"qa":[
{"q":"Distinguish between upside risk and downside risk, and explain why both should be managed.","a":"<strong>Downside risk</strong> — events with a negative effect (reduce profits): competitor entry, product failure, regulatory fines. <strong>Upside risk</strong> — events with a positive effect (increase profits): new market opportunity, favourable currency movement, competitor's product recall creating demand.<br>Both should be managed because: focusing only on downside risk means organisations may miss beneficial opportunities; proactively identifying upside risks allows plans to be made to exploit them before competitors do."},
{"q":"What is 'two-way' or 'speculative' risk and how does it differ from 'pure' risk?","a":"<strong>Two-way/speculative risk</strong>: both a gain and a loss are possible outcomes. Example: acquiring a competitor — could enhance market share (gain) or overstretch resources and reduce profitability (loss). <strong>Pure risk</strong>: only two outcomes — a loss or the status quo (no gain). Example: a factory fire — either the fire occurs (loss) or it doesn't (no change). Insurance typically covers pure risks; speculative risks require strategic management."},
{"q":"Give two examples of upside risks that a sports clothing manufacturer expanding internationally might face.","a":"(1) <strong>Favourable exchange rate movements</strong> — if the organisation reports in USD but earns in a currency that strengthens, the translated revenue will be higher than forecast (upside); (2) <strong>Unexpected market growth</strong> — if golf participation grows significantly in the new market (e.g., due to a local sporting event or celebrity), demand for the organisation's golf range could exceed forecasts, creating an opportunity to capture a larger market share than planned."}
]},
{"id":"b3","icon":"🧭","title":"Risk Attitude and Risk Appetite","subtitle":"Risk seeker · Risk averse · Risk neutral · Risk capacity · Risk appetite determination",
"theory":"<h4>Risk Attitude</h4><p>Risk attitude is the chosen response to a perceived uncertainty — it reflects the board's overall approach to risk and influences decisions and actions.</p><table class='tbl'><tr><th>Attitude</th><th>Behaviour</th><th>Suited to</th></tr><tr><td><strong>Risk seeking</strong></td><td>Accepts high risk for potentially high returns; doesn't overly consider downside</td><td>Venture capital; start-ups; high-growth ambitions</td></tr><tr><td><strong>Risk averse</strong></td><td>Minimises risk exposure; only accepts additional risk if expected return is sufficiently higher</td><td>Pension funds; public utilities; family businesses</td></tr><tr><td><strong>Risk neutral</strong></td><td>Indifferent to risk; decisions based on expected (average) outcomes rather than risk level</td><td>Analytical decisions where EV calculation is reliable</td></tr></table><h4>Risk Capacity</h4><p>Risk capacity is the <em>ability</em> of the organisation to deal with risk — whether outcomes are positive or negative. It is determined by: financial resources (cash reserves, borrowing capacity); workforce capacity; operational capacity (equipment, systems).</p><h4>Risk Appetite</h4><p>Risk appetite = the amount and type of risk the organisation is <strong>willing and able</strong> to accept in pursuit of strategic objectives. It is determined by combining risk attitude (willingness) with risk capacity (ability). Risk appetite constrains the risks actually taken — the organisation should only take risks within its capacity to absorb losses.</p>",
"qa":[
{"q":"Define and distinguish between risk attitude, risk capacity, and risk appetite.","a":"<strong>Risk attitude</strong>: The subjective approach to risk — how willing decision-makers are to accept risk (risk seeking, neutral, or averse).<br><strong>Risk capacity</strong>: The objective ability to absorb the consequences of risk — determined by financial resources, workforce, and operational capacity.<br><strong>Risk appetite</strong>: The amount and type of risk the organisation is prepared to accept — determined by combining risk attitude (willingness) with risk capacity (ability). Even a risk-seeking board cannot take risks beyond the organisation's capacity to survive adverse outcomes."},
{"q":"A risk-seeking board wants to invest heavily in a new market. Why might risk capacity constrain this decision?","a":"Even if the board has a risk-seeking attitude, risk capacity determines the practical limits. If the new market investment fails, the organisation must be able to absorb the loss. Constraints on risk capacity include: insufficient cash reserves to cover investment losses; lack of management bandwidth to oversee a new venture; manufacturing capacity already at full utilisation; existing debt levels that prevent further borrowing. Exceeding risk capacity could threaten the organisation's survival."},
{"q":"A risk-neutral decision maker is choosing between: Project A (guaranteed profit $100k) and Project B (70% chance of $200k profit, 30% chance of $50k loss). Which do they prefer?","a":"Risk-neutral decision makers use <strong>expected value</strong>: Project A EV = $100,000. Project B EV = (70% × $200,000) + (30% × −$50,000) = $140,000 − $15,000 = $125,000. A risk-neutral decision maker prefers <strong>Project B</strong> (higher EV of $125,000 vs $100,000). A risk-averse decision maker might prefer Project A to avoid the possibility of a loss."}
]},
{"id":"b4","icon":"⚖️","title":"Ethical and Public Interest Aspects of Risk","subtitle":"Five ethical principles · Public interest ·  ethics · Ethical dilemmas",
"theory":"<h4>Ethical Principles for Professional Accountants</h4><p>Professional accountants (/AICPA members) are guided by ethical codes built on five core principles:</p><ul><li><strong>Integrity</strong> — honest and straightforward in all professional relationships</li><li><strong>Objectivity</strong> — not allowing bias, conflicts of interest, or undue influence to override professional judgements</li><li><strong>Professional competence and due care</strong> — maintaining professional knowledge and skills at the level required</li><li><strong>Confidentiality</strong> — not disclosing information to third parties without proper authority</li><li><strong>Professional behaviour</strong> — complying with laws and regulations; avoiding actions that discredit the profession</li></ul><h4>Public Interest</h4><p>Public interest refers to the common good and general welfare of everyone in society. Organisations are increasingly expected to balance profit-seeking with serving the public interest. Consequences of ethical failures: reputational damage; loss of customers; share price decline; potential legal consequences.</p><div class='kbox'><strong>Threats to Ethical Principles</strong>Self-interest (financial benefit); Self-review (reviewing own work); Advocacy (promoting a client/employer position); Familiarity (too close to a client/colleague); Intimidation (actual or perceived threats). Accountants must identify and manage these threats.</div><h4>Public Interest and Risk</h4><p>Organisations taking risks must consider: Are we doing the right thing ethically? What are the environmental/social implications? Ethical risk management prevents short-term profit-chasing that creates long-term reputational or legal exposure.</p>",
"qa":[
{"q":"Name the five fundamental ethical principles for professional accountants under 's Code of Ethics.","a":"(1) <strong>Integrity</strong> — honest and straightforward in all professional relationships; (2) <strong>Objectivity</strong> — not allowing bias or conflicts of interest to override professional judgement; (3) <strong>Professional competence and due care</strong> — maintaining required knowledge and skills; (4) <strong>Confidentiality</strong> — not disclosing information without proper authority; (5) <strong>Professional behaviour</strong> — avoiding actions that discredit the profession."},
{"q":"What is 'public interest' in the context of risk management for organisations?","a":"Public interest refers to the common good and general welfare of society. In the context of risk management: organisations must consider whether their risk-taking activities could harm the public (e.g., environmental damage, financial system instability, product safety failures). The consequences of ignoring public interest include regulatory intervention, reputational damage, litigation, and loss of social licence to operate — all of which ultimately damage financial performance."},
{"q":"Give an example of an ethical dilemma a management accountant might face and explain how to resolve it.","a":"A management accountant is pressured by a manager to inflate revenue figures in a board report to secure a bonus. This creates a conflict between: integrity (reporting accurately) and undue pressure (intimidation threat to ethical principles). Resolution: follow the organisation's escalation procedures (raise with a more senior manager or audit committee); refer to the ethical code; consider whether external reporting to a regulator is necessary. The accountant should not compromise integrity regardless of employment pressure."}
]},
{"id":"b5","icon":"💻","title":"Information Systems","subtitle":"EIS · MIS · TPS · Costs vs benefits of IS · Strategic vs tactical vs operational",
"theory":"<h4>Three Levels of Information Systems</h4><table class='tbl'><tr><th>Management Level</th><th>Information System</th><th>Purpose</th></tr><tr><td><strong>Strategic</strong></td><td>Executive Information System (EIS)</td><td>High-level data for strategic decisions; combines internal and external data</td></tr><tr><td><strong>Tactical</strong></td><td>Management Information System (MIS)</td><td>Summaries of detailed data for management decisions; performance reports, KPIs</td></tr><tr><td><strong>Operational</strong></td><td>Transaction Processing System (TPS)</td><td>High-volume, detailed data capture; purchase/sales ordering; accounting systems; inventory management</td></tr></table><h4>Costs of Implementing an Information System</h4><ul><li>Initial capital investment in technology (hardware and software)</li><li>Implementation and configuration costs</li><li>Staff training and change management</li><li>Ongoing maintenance, licensing, and support costs</li><li>Security and data protection infrastructure</li></ul><h4>Benefits of an Information System (Harder to Quantify)</h4><ul><li>Improved decision-making through better data quality</li><li>Cost efficiencies through automation of manual processes</li><li>Competitive advantage through superior information</li><li>Faster response to market changes</li><li>Enhanced risk management through better monitoring</li></ul><div class='kbox'><strong>Key Challenge</strong>The costs of an IS are relatively easy to identify and quantify. The benefits are often intangible and difficult to quantify — they arise from potential cost efficiencies or competitive advantage. A cost-benefit analysis must consider both financial and non-financial factors.</div>",
"qa":[
{"q":"Name the three levels of information system and the management level each serves.","a":"(1) <strong>Executive Information System (EIS)</strong> — serves strategic/board level; combines internal and external data for high-level strategic decision-making; (2) <strong>Management Information System (MIS)</strong> — serves tactical/middle management; summarises operational data into reports, KPIs, and performance metrics; (3) <strong>Transaction Processing System (TPS)</strong> — serves operational level; captures, stores, and processes high volumes of transactional data (e.g., sales, purchase orders, payments)."},
{"q":"Why are the benefits of an information system harder to evaluate than the costs?","a":"Costs are typically <em>quantifiable and immediate</em>: hardware/software purchase price, implementation fees, training costs, annual licensing. Benefits are often <em>intangible and long-term</em>: improved decision quality (hard to put a value on a better decision); competitive advantage (how much is faster data worth?); cost efficiencies (may take years to materialise). This makes the cost-benefit analysis subjective and requires judgement about how to value non-financial benefits."},
{"q":"What is a Transaction Processing System (TPS) and give three examples?","a":"A TPS captures, stores, and processes high volumes of routine transactional data that forms the foundation for higher-level management information. Examples: (1) <strong>Purchase ordering system</strong> — records all supplier purchase orders and deliveries; (2) <strong>Sales and billing system</strong> — records customer orders, deliveries, and invoices; (3) <strong>Payroll system</strong> — processes employee wages, deductions, and pension contributions. TPS data is aggregated and summarised to feed MIS and EIS."}
]},
{"id":"b6","icon":"📋","title":"Collection and Use of Information","subtitle":"Five quality criteria · Data risks · Accuracy · Timeliness · Completeness · Data regulations",
"theory":"<h4>Why Information Quality Matters</h4><p>Information is an organisation's most valuable resource. Poor quality data leads to poor decisions. The risks associated with information collection and use must be identified and mitigated.</p><h4>Five Quality Criteria for Information</h4><table class='tbl'><tr><th>Criterion</th><th>Description</th></tr><tr><td><strong>Accuracy</strong></td><td>Data must be sufficiently accurate for its intended use; captured only once; at the right level of granularity (neither too detailed nor too aggregated)</td></tr><tr><td><strong>Timeliness</strong></td><td>Data must be available quickly enough to support decisions; captured as soon as possible after the event</td></tr><tr><td><strong>Relevance</strong></td><td>Data must be relevant to its intended purpose; requirements should be periodically reviewed</td></tr><tr><td><strong>Completeness</strong></td><td>Data requirements clearly specified; collection processes ensure no significant gaps</td></tr><tr><td><strong>Consistency</strong></td><td>Data must be collected and classified in a consistent manner over time to enable meaningful comparisons</td></tr></table><h4>Data Risks</h4><ul><li>Loss or corruption of data (hardware failure, cyber attack)</li><li>Inaccuracy (manual input errors, measurement errors)</li><li>Unauthorised access or breach (privacy violations)</li><li>Physical risks to IT infrastructure (fire, flood)</li></ul><h4>Data Regulations</h4><p>Many countries have legislation on data use, typically requiring: fair use; accurate maintenance; security safeguards; only keeping data as long as necessary; only using for stated purposes. Non-compliance creates compliance risk (fines, reputational damage).</p>",
"qa":[
{"q":"Name the five quality criteria for information and briefly describe each.","a":"(1) <strong>Accuracy</strong> — sufficiently precise for intended use; captured once at the right level of detail; (2) <strong>Timeliness</strong> — available quickly enough to influence decisions; captured promptly after the event; (3) <strong>Relevance</strong> — appropriate to the decision being made; periodically reviewed as needs change; (4) <strong>Completeness</strong> — requirements clearly specified; no significant gaps in collection; (5) <strong>Consistency</strong> — collected and classified the same way over time, enabling meaningful comparisons."},
{"q":"What are the main data risks that an organisation must manage?","a":"(1) <strong>Loss or corruption</strong> — hardware failure, software error, cyber attacks; (2) <strong>Inaccuracy</strong> — manual input errors, measurement errors, system bugs; (3) <strong>Unauthorised access</strong> — hacking, internal theft, data breaches exposing personal or commercially sensitive information; (4) <strong>Physical risks</strong> — fire, flood, or theft of physical infrastructure; (5) <strong>Regulatory non-compliance</strong> — failure to adhere to data protection laws (GDPR, CCPA) resulting in fines and reputational damage."},
{"q":"Why must data be collected at 'the right level of granularity'?","a":"Granularity refers to the level of detail at which data is captured. <em>Too granular</em>: excessive data volume that is costly to store and process, overwhelming users with detail without adding insight. <em>Too aggregated</em>: key trends and anomalies at the individual level are masked. The right granularity provides sufficient uniqueness and distinctive properties to enable meaningful analysis and decisions — for example, sales data by individual product SKU rather than just by product category, if product-level decisions are needed."}
]},
{"id":"b7","icon":"🌊","title":"Big Data","subtitle":"Four Vs · Benefits · Risks · Sources · Analytics applications",
"theory":"<h4>What is Big Data?</h4><p>Big data refers to <em>extremely large, complex datasets</em> that cannot be stored or processed by conventional database software. It comprises financial and non-financial data from internal and external sources, analysed computationally to derive patterns, trends, and correlations that create competitive advantage.</p><h4>The Four Vs of Big Data</h4><table class='tbl'><tr><th>V</th><th>Description</th></tr><tr><td><strong>Volume</strong></td><td>Sheer size of data — hundreds of exabytes, growing exponentially; full population tracked, not samples</td></tr><tr><td><strong>Velocity</strong></td><td>Speed of data generation and processing — real-time streams from social media, contactless payments, SMS</td></tr><tr><td><strong>Variety</strong></td><td>Diversity of data types — structured (databases), unstructured (social media posts, video), semi-structured</td></tr><tr><td><strong>Veracity</strong></td><td>Accuracy and trustworthiness of data — big data is often messy, incomplete, or inconsistent</td></tr></table><h4>Sources of Big Data</h4><p>Social media, internet searches, computer logs, GPS tracking, streamed media, customer purchasing data, satellite imagery, financial market data, weather data, government statistics.</p><h4>Benefits vs Risks</h4><div class='fw'><strong>Benefits:</strong> Improved productivity; increased revenue from personalisation; cost savings through efficiency; enhanced risk management; real-time decision making.</div><div class='fw'><strong>Risks:</strong> Over-complexity of analytical processes; time wasted analysing irrelevant data; data security breaches; improper use of personal data (privacy); regulatory non-compliance; bias in algorithms.</div>",
"qa":[
{"q":"Name and describe the Four Vs of big data.","a":"(1) <strong>Volume</strong> — the sheer quantity of data (hundreds of exabytes); big data tracks entire populations, not samples; (2) <strong>Velocity</strong> — the speed at which data is generated and must be processed (real-time streams from social media, contactless payments); (3) <strong>Variety</strong> — the diversity of data types (structured databases, unstructured social media text/video, semi-structured logs); (4) <strong>Veracity</strong> — the accuracy and trustworthiness of the data — big data is often messy, incomplete, or inconsistent and requires cleaning."},
{"q":"What are three benefits and three risks of using big data for business decisions?","a":"<strong>Benefits:</strong> (1) Personalised marketing improves revenue; (2) Pattern recognition reduces operational waste and costs; (3) Real-time monitoring enables faster, more accurate risk management.<br><strong>Risks:</strong> (1) Over-complexity — sophisticated analysis that produces no actionable insight wastes resources; (2) Data security breaches — large datasets are attractive targets for hackers; (3) Privacy and regulatory risk — improper use of personal data breaches GDPR and similar laws, resulting in fines and reputational damage."},
{"q":"How does big data analytics differ from traditional data analysis?","a":"Traditional data analysis: uses <em>sample data</em>; structured databases; historical reporting; human analysis of reports. Big data analytics: uses the <em>full population</em> of data; combines structured and unstructured sources; real-time processing; machine learning algorithms identify patterns that human analysts would miss. Big data enables organisations to: predict future behaviour (predictive analytics); understand why patterns emerge (diagnostic analytics); and prescribe optimal actions (prescriptive analytics)."}
]},
{"id":"b8","icon":"📊","title":"Probabilistic Models","subtitle":"Expected value · Probability distributions · Standard deviation · Maximin · Maximax · Minimax regret",
"theory":"<h4>Expected Value (EV)</h4><p>Expected value is the <strong>probability-weighted average</strong> of all possible outcomes. It is the most appropriate measure for risk-neutral decision makers and for repetitive decisions.</p><div class='fw'><strong>EV = Σ (Probability × Outcome)</strong><br>Example: Outcome A: $500k (probability 0.3) + Outcome B: $800k (probability 0.5) + Outcome C: $200k (probability 0.2)<br>EV = (0.3 × 500k) + (0.5 × 800k) + (0.2 × 200k) = $150k + $400k + $40k = <strong>$590k</strong></div><h4>Decision Rules by Risk Attitude</h4><table class='tbl'><tr><th>Rule</th><th>Risk attitude</th><th>Approach</th></tr><tr><td><strong>Maximax</strong></td><td>Risk seeking</td><td>Choose the option with the highest possible payoff (best best-case)</td></tr><tr><td><strong>Maximin</strong></td><td>Risk averse</td><td>Choose the option with the highest minimum payoff (best worst-case)</td></tr><tr><td><strong>Minimax regret</strong></td><td>Risk averse</td><td>Minimise the maximum regret (opportunity cost) from choosing wrong</td></tr></table><h4>Standard Deviation as a Measure of Risk</h4><p>Standard deviation measures the spread of possible outcomes around the expected value. A higher standard deviation = more variability = more risk. It complements EV: two projects may have the same EV but very different risk profiles based on standard deviation.</p>",
"qa":[
{"q":"A project has three outcomes: profit $200k (p=0.4), profit $500k (p=0.35), loss $100k (p=0.25). Calculate the EV.","a":"EV = (0.4 × $200k) + (0.35 × $500k) + (0.25 × −$100k)<br>= $80k + $175k − $25k = <strong>$230,000</strong>"},
{"q":"Explain the maximin and maximax decision rules and the risk attitude each reflects.","a":"<strong>Maximin</strong> (risk averse): Select the option that maximises the <em>minimum possible payoff</em> — i.e., the 'best worst case.' The decision maker prioritises avoiding the worst outcome.<br><strong>Maximax</strong> (risk seeking): Select the option with the <em>highest possible payoff</em> — i.e., the 'best best case.' The decision maker focuses on the best outcome without concern for the worst."},
{"q":"What is minimax regret and when is it used?","a":"Minimax regret is a decision rule for risk-averse decision makers that minimises the maximum <em>regret</em> (opportunity cost) from making the wrong choice. For each possible scenario, calculate the best outcome that could have been achieved; regret = (best possible outcome in that scenario − actual outcome of chosen option). Then select the option that minimises the maximum regret across all scenarios."},
{"q":"Why is expected value insufficient as a sole decision criterion and when should standard deviation be considered?","a":"EV provides the average outcome but ignores <em>variability</em>. Two projects with the same EV may have very different risk profiles: Project A (EV $100k, always delivers $100k) vs Project B (EV $100k, ranging from −$200k to +$400k). The standard deviation of Project B is far higher — indicating much greater risk. Standard deviation should be considered alongside EV, especially for one-off decisions (where averaging over many repetitions isn't possible) and when the downside could be catastrophic."}
]},
{"id":"b9","icon":"🎯","title":"Calculating Risk — Sensitivity and Scenario Analysis","subtitle":"Sensitivity formula · Percentage change to zero NPV · Scenario planning · Stress testing",
"theory":"<h4>Sensitivity Analysis</h4><p>Sensitivity analysis determines by what percentage a <em>single variable</em> must change before the decision changes (i.e., NPV falls to zero). It identifies the variables to which the project is most sensitive — and therefore most risky.</p><div class='fw'><strong>Sensitivity Formula:</strong><br>Sensitivity (%) = NPV ÷ PV of the variable in question × 100<br><br>A <strong>low percentage</strong> (e.g., 2%) = <strong>high risk</strong> — only a small change eliminates all profit.<br>A <strong>high percentage</strong> (e.g., 75%) = <strong>low risk</strong> — a very large change would be needed to eliminate profit.</div><h4>Limitation of Sensitivity Analysis</h4><p>Sensitivity analysis only considers one variable at a time — unrealistic, since in practice multiple variables change simultaneously. If multiple variables need consideration, use <strong>scenario planning</strong>.</p><h4>Scenario Planning ('What-If Analysis')</h4><p>Scenario planning constructs multiple possible future scenarios (e.g., optimistic, base case, pessimistic) where several variables change simultaneously. It assesses the project's outcomes under each scenario — providing a range of possible returns without assigning probabilities.</p><h4>Stress Testing</h4><p>Stress testing evaluates the impact of a <em>high-impact, high-uncertainty</em> event (a shock scenario) on the organisation's viability. It asks: 'What if the worst realistic case happened?' Used by banks and financial institutions but applicable to any organisation with significant risk exposure.</p>",
"qa":[
{"q":"A project has NPV of $80,000 and PV of labour costs of $400,000. Calculate the sensitivity to labour costs.","a":"Sensitivity = NPV ÷ PV of variable × 100 = $80,000 ÷ $400,000 × 100 = <strong>20%</strong>. This means labour costs would need to increase by 20% before the NPV falls to zero and the project should be rejected. A 20% sensitivity indicates moderate risk — management should monitor labour costs but it is not the highest risk variable."},
{"q":"What does a sensitivity of 3% for sales revenue indicate and what action might management take?","a":"A 3% sensitivity to sales revenue means revenue only needs to fall by 3% before the project's NPV is eliminated. This indicates <strong>very high risk</strong> — the project is extremely vulnerable to even small revenue shortfalls. Management might: (1) Seek firm pre-orders or contracts before committing; (2) Re-examine the project's cost structure to increase the margin; (3) Consider whether to proceed given the high sensitivity; (4) Build in a higher contingency reserve."},
