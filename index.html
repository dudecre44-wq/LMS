"theory":"<h4>The Value Creation Process</h4><p>Organisations take <em>inputs</em> from various capitals, transform them through business activities, and produce <em>outputs</em> and <em>outcomes</em>. Value is created, maintained, or eroded across multiple capitals and stakeholder perspectives over multiple time horizons.</p><h4>The Six Capitals</h4><table class='tbl'><tr><th>Capital</th><th>Description</th></tr><tr><td><strong>Financial</strong></td><td>Pool of funds from equity, debt, or operations</td></tr><tr><td><strong>Manufactured</strong></td><td>Physical objects: buildings, machinery, infrastructure</td></tr><tr><td><strong>Intellectual</strong></td><td>IP, patents, systems, procedures, tacit knowledge</td></tr><tr><td><strong>Human</strong></td><td>People's competencies, capabilities, motivations</td></tr><tr><td><strong>Social &amp; Relationship</strong></td><td>Stakeholder relationships, brand, social licence to operate</td></tr><tr><td><strong>Natural</strong></td><td>Air, water, land, minerals, biodiversity, eco-systems</td></tr></table><h4>Eight Content Elements of an Integrated Report</h4><p>(1) Organisational overview &amp; external environment; (2) Governance; (3) Business model; (4) Risks and opportunities; (5) Strategy and resource allocation; (6) Performance; (7) Outlook; (8) Basis of preparation.</p><h4>Seven Guiding Principles</h4><p>Strategic focus; Connectivity of information; Stakeholder relationships; Materiality; Conciseness; Reliability and completeness; Consistency and comparability.</p><div class='kbox'><strong>Business Model = Central Element</strong>The business model is at the heart of the value creation process diagram — showing how inputs are transformed into outputs and outcomes, and how the capitals are increased, decreased, or transformed.</div>",
"qa":[
{"q":"Name and briefly describe the six capitals in the Integrated Reporting Framework.","a":"<strong>Financial:</strong> Pool of funds from financing or operations.<br><strong>Manufactured:</strong> Physical objects — buildings, equipment, infrastructure.<br><strong>Intellectual:</strong> Knowledge-based intangibles — IP, patents, systems, procedures.<br><strong>Human:</strong> People's competencies, capabilities, experience, motivations.<br><strong>Social &amp; Relationship:</strong> Stakeholder relationships, brand, trust, social licence to operate.<br><strong>Natural:</strong> Environmental resources — air, water, land, minerals, biodiversity."},
{"q":"What role does the business model play in the value creation process?","a":"The business model is the central element of the value creation diagram. It shows how the organisation takes <em>inputs</em> from the six capitals, performs <em>activities</em>, produces <em>outputs</em>, and generates <em>outcomes</em> — creating or destroying value in the process. It acts as a 'sense-maker' of the organisation's value proposition and helps stakeholders understand how capitals are transformed over time."},
{"q":"Name the seven guiding principles of the Integrated Reporting Framework.","a":"(1) Strategic focus and future orientation; (2) Connectivity of information; (3) Stakeholder relationships; (4) Materiality; (5) Conciseness; (6) Reliability and completeness; (7) Consistency and comparability."},
{"q":"Why does the IR Framework not use the term 'non-financial information'?","a":"Because all sustainability-related information — whether about human capital, natural resources, or stakeholder relationships — can ultimately have a <em>material financial impact</em> on the organisation. Calling information 'non-financial' risks implying it is less important. The IR Framework and ISSB standards treat all material information as potentially financially relevant."}
]},
{"id":"a11","icon":"🌱","title":"Sustainability Reporting — IFRS S2 Climate Disclosures","subtitle":"IFRS S2 objective · Physical risks · Transition risks · Opportunities · Four TCFD pillars",
"theory":"<h4>Why IFRS S2?</h4><p>Climate change creates financial risks for organisations. The ISSB issued IFRS S2 (effective for periods beginning on or after <strong>1 January 2024</strong>) to provide standardised, investor-focused information about climate-related risks and opportunities.</p><h4>Objective of IFRS S2</h4><p>Require entities to disclose material information about climate-related risks and opportunities useful to primary users (investors, lenders, creditors) in making decisions about providing resources to the entity.</p><h4>Climate-Related Physical Risks</h4><ul><li><strong>Acute:</strong> Event-driven, weather-based (storms, floods, droughts, heatwaves)</li><li><strong>Chronic:</strong> Long-term shifts in climate patterns (rising sea levels, changing precipitation, declining soil productivity)</li></ul><h4>Climate-Related Transition Risks</h4><p>Risks from efforts to move to a lower-carbon economy. Sources: Policy/legal (carbon taxes, emissions regulations); Technological (clean energy requirements); Market (consumer preference shifts); Reputational (ESG investor pressure).</p><h4>Four TCFD-Aligned Disclosure Pillars</h4><ul><li><strong>Governance:</strong> Board oversight of climate risks and opportunities</li><li><strong>Strategy:</strong> How climate affects the entity's strategy and financial planning</li><li><strong>Risk management:</strong> Processes to identify, assess, and manage climate risks</li><li><strong>Metrics &amp; targets:</strong> GHG emissions disclosures; climate targets and progress</li></ul>",
"qa":[
{"q":"What is the effective date of IFRS S2 and who are the target audience for its disclosures?","a":"Effective for annual periods beginning on or after <strong>1 January 2024</strong>. Target audience = primary users of general purpose financial reports — defined as existing and potential investors, lenders, and other creditors. Disclosures appear alongside the annual financial statements."},
{"q":"Distinguish between acute and chronic physical climate risks. Give an example of each.","a":"<strong>Acute:</strong> Event-driven, triggered by specific weather phenomena. Examples: hurricane destroying a factory; flood damaging warehouse stock.<br><strong>Chronic:</strong> Long-term climate pattern shifts. Examples: rising sea levels threatening coastal assets; sustained drought reducing agricultural yields."},
{"q":"Name four sources of climate-related transition risk.","a":"(1) <strong>Policy/legal:</strong> Carbon taxes, emissions regulations, litigation risk; (2) <strong>Technological:</strong> Requirement to switch to renewable energy; (3) <strong>Market:</strong> Consumer preference shift toward low-carbon products; (4) <strong>Reputational:</strong> ESG investor pressure, negative media, loss of social licence."},
{"q":"What are the four TCFD-aligned disclosure pillars required by IFRS S2?","a":"<strong>1. Governance:</strong> How the board oversees climate risks and opportunities.<br><strong>2. Strategy:</strong> How climate affects the entity's strategy, business model, and financial planning.<br><strong>3. Risk management:</strong> Processes for identifying, assessing, and managing climate risks.<br><strong>4. Metrics &amp; targets:</strong> GHG emissions (Scope 1, 2, 3); climate targets and progress."}
]}
]},
"B":{"title":"Financial Statement Analysis","icon":"📈","lessons":[
{"id":"b1","icon":"🔍","title":"Introduction to Financial Statement Analysis","subtitle":"Purpose · Users · Four dimensions · Methods of analysis",
"theory":"<h4>What is Financial Statement Analysis?</h4><p>FSA uses financial data to help stakeholders understand an entity's performance, position, adaptability, and prospects. It translates numbers into business insights that support decision-making.</p><h4>Four Dimensions of Interest</h4><ul><li><strong>Performance:</strong> SPLOCI focus — profitability, revenue trends, margin analysis</li><li><strong>Position:</strong> SOFP focus — asset quality, debt levels, working capital structure</li><li><strong>Adaptability:</strong> How well the entity uses resources and responds to challenges</li><li><strong>Prospects:</strong> Whether current performance and position suggest a positive or negative outlook</li></ul><h4>Key Users and Their Interests</h4><table class='tbl'><tr><th>User</th><th>Primary Interest</th></tr><tr><td>Potential shareholders</td><td>Risk vs return; share price appreciation potential</td></tr><tr><td>Existing shareholders</td><td>Performance vs expectations; dividend sustainability</td></tr><tr><td>Lenders (banks)</td><td>Interest coverage; gearing; asset security; loan covenants</td></tr><tr><td>Trade creditors</td><td>Short-term liquidity; ability to pay invoices on time</td></tr><tr><td>Management</td><td>All aspects — to drive decisions and improve performance</td></tr></table><h4>Methods of Analysis</h4><ul><li><strong>Ratio analysis:</strong> Profitability, liquidity, efficiency, gearing, investor ratios</li><li><strong>Trend analysis:</strong> Track ratios or absolute figures over multiple periods</li><li><strong>Benchmarking:</strong> Compare to industry standards, competitors, or budget</li><li><strong>Non-financial indicators:</strong> Machine downtime, staff turnover, customer satisfaction scores</li></ul><div class='kbox'><strong>Key Principle</strong>Ratios calculated in isolation without context (industry norms, prior periods, budgets) have limited value. Always interpret with reference to benchmarks and qualitative factors.</div>",
"qa":[
{"q":"What are the four dimensions stakeholders analyse in financial statements?","a":"<strong>Performance:</strong> How well is the entity generating profit (SPLOCI focus)?<br><strong>Position:</strong> What is the financial health and structure at the reporting date (SOFP focus)?<br><strong>Adaptability:</strong> How efficiently does the entity use resources and respond to change?<br><strong>Prospects:</strong> Does the current picture suggest a positive or negative outlook for the future?"},
{"q":"A bank is considering a $2m loan. What analysis would it typically perform?","a":"The bank focuses on: (1) <strong>Gearing</strong> — is existing debt already high? (2) <strong>Interest cover</strong> — can the company afford additional interest? (3) <strong>OCF ratios</strong> — is operating cash flow sufficient to service debt? (4) <strong>Liquidity</strong> — can short-term obligations be met? (5) <strong>Asset security</strong> — what collateral can be offered? It would also review existing loan covenants and check if the new debt would breach any."},
{"q":"Why is it insufficient to rely on a single year's financial statements and ratios?","a":"(1) No trends visible — is performance improving or deteriorating? (2) One-off items can distort results. (3) Seasonal businesses look different at different reporting dates. (4) No context for whether results are good or poor without a benchmark. Multi-period analysis compared to budgets, competitors, and industry norms provides far more reliable insights."}
]},
{"id":"b2","icon":"💹","title":"Profitability Ratios","subtitle":"GPM · OPM · NPM · ROCE · ROA · ROE · DuPont decomposition",
"theory":"<h4>Margin Ratios</h4><table class='tbl'><tr><th>Ratio</th><th>Formula</th><th>Indicates</th></tr><tr><td>Gross Profit Margin</td><td>Gross Profit ÷ Revenue × 100%</td><td>Core trading efficiency; pricing and COS control</td></tr><tr><td>Operating Profit Margin</td><td>EBIT ÷ Revenue × 100%</td><td>Control over operating expenses</td></tr><tr><td>Net Profit Margin</td><td>PAT ÷ Revenue × 100%</td><td>Overall profitability after interest and tax</td></tr></table><p>GPM &gt; OPM &gt; NPM — each strips out additional cost layers. A falling OPM with stable GPM signals rising operating expenses.</p><h4>Return Ratios</h4><table class='tbl'><tr><th>Ratio</th><th>Formula</th><th>Interpretation</th></tr><tr><td>ROCE</td><td>EBIT ÷ Capital Employed × 100%</td><td>Efficiency of all long-term capital</td></tr><tr><td>ROA</td><td>EBIT ÷ Total Assets × 100%</td><td>Efficiency of all assets</td></tr><tr><td>ROE</td><td>PAT ÷ Equity × 100%</td><td>Return to ordinary shareholders</td></tr></table><p>Capital employed = Total equity + Long-term debt (non-current liabilities).</p><div class='kbox'><strong>ROCE is King</strong>ROCE should exceed the weighted average cost of capital (WACC). If not, the business destroys value. DuPont decomposition: ROCE = Net profit margin × Asset turnover — reveals whether under-performance is a margin problem or an efficiency problem.</div>",
"qa":[
{"q":"Revenue $500k, COS $300k, Operating expenses $80k, Finance costs $20k, Tax $20k. Calculate GPM, OPM, NPM.","a":"GP = $500k − $300k = $200k; <strong>GPM = 40%</strong><br>EBIT = $200k − $80k = $120k; <strong>OPM = 24%</strong><br>PAT = $120k − $20k − $20k = $80k; <strong>NPM = 16%</strong>"},
{"q":"A company's gross profit margin increased but operating profit margin fell. What might explain this?","a":"GPM increased → core trading is more efficient (better pricing or lower COS). OPM fell → <em>operating expenses</em> increased disproportionately to revenue. Possible causes: increase in wages/admin costs; higher depreciation (new assets acquired); one-off restructuring costs. The business earns more from trading but spends more to manage itself."},
{"q":"What is capital employed and why is ROCE the most commonly used profitability metric?","a":"Capital employed = <strong>Total equity + Long-term (non-current) debt</strong>. ROCE is favoured because it measures how efficiently the entity generates operating profit from ALL long-term capital (both debt and equity providers). It is also independent of the financing structure, making it useful for comparison across entities with different gearing levels."},
{"q":"Why is ROE typically higher than ROCE in a geared entity?","a":"ROE uses <em>equity only</em> in the denominator (a subset of capital employed), and PAT in the numerator. Financial leverage amplifies returns to equity holders — the same operating profit is divided by a smaller equity base. However, high gearing also increases financial risk. An entity can boost ROE by increasing gearing without improving its underlying operations."}
]},
{"id":"b3","icon":"⚙️","title":"Efficiency and Activity Ratios","subtitle":"Asset turnover · WCC · Receivables days · Payables days · Inventory days",
"theory":"<h4>Key Efficiency Ratios</h4><table class='tbl'><tr><th>Ratio</th><th>Formula</th><th>Units</th></tr><tr><td>Asset turnover</td><td>Revenue ÷ Total assets</td><td>Times</td></tr><tr><td>NCA turnover</td><td>Revenue ÷ Net book value of NCA</td><td>Times</td></tr><tr><td>Receivables days</td><td>(Trade receivables ÷ Revenue) × 365</td><td>Days</td></tr><tr><td>Payables days</td><td>(Trade payables ÷ COS) × 365</td><td>Days</td></tr><tr><td>Inventory days</td><td>(Inventory ÷ COS) × 365</td><td>Days</td></tr><tr><td>Working capital cycle (WCC)</td><td>Inventory days + Receivables days − Payables days</td><td>Days</td></tr></table><h4>Interpreting the Working Capital Cycle</h4><p>The WCC measures how long it takes to convert net working capital into cash. A <strong>shorter WCC</strong> is generally better — less cash tied up. A <strong>negative WCC</strong> (common in supermarkets) means the entity is funded by its suppliers — collects cash before paying them.</p><div class='kbox'><strong>NCA Turnover Caution</strong>High NCA turnover may simply reflect old, heavily depreciated assets (low net book value). This can appear efficient but may mean the asset base needs costly replacement soon.</div><h4>Improving the WCC</h4><ul><li>Reduce inventory days: better demand forecasting, just-in-time</li><li>Reduce receivables days: tighter credit control, early payment discounts</li><li>Increase payables days: negotiate better supplier terms (without damaging relationships)</li></ul>",
"qa":[
{"q":"Revenue $1.2m, COS $800k, Receivables $150k, Inventory $100k, Payables $80k. Calculate the WCC.","a":"Receivables days = (150/1,200) × 365 = <strong>45.6 days</strong><br>Inventory days = (100/800) × 365 = <strong>45.6 days</strong><br>Payables days = (80/800) × 365 = <strong>36.5 days</strong><br>WCC = 45.6 + 45.6 − 36.5 = <strong>54.7 days</strong>"},
{"q":"What does a fall in the receivables collection period indicate?","a":"The company is collecting cash from customers <em>more quickly</em>. Generally positive — reduces bad debt risk, decreases WCC, and frees cash tied up in unpaid invoices. Possible causes: tighter credit control; early payment discounts offered; improved customer quality; removal of a significant slow-paying customer."},
{"q":"Why might a very high NCA turnover ratio NOT be a positive sign?","a":"NCA turnover = Revenue ÷ Net book value of NCA. If the NCA is old and heavily depreciated, the net book value is low — making the ratio artificially high. This does not indicate efficient use of assets; it may mean the asset base is ageing and will require costly replacement soon. Always consider the age and depreciation policy when interpreting this ratio."},
{"q":"What is a negative WCC and in what type of business is it common?","a":"A <strong>negative WCC</strong> means the entity collects cash from customers <em>before</em> paying its suppliers — operations are self-funding. Common in <em>retail businesses</em> (especially supermarkets) that: sell for cash (zero receivables days); hold inventory briefly; and have long credit terms with suppliers. Effectively, suppliers fund the business."}
]},
{"id":"b4","icon":"💧","title":"Liquidity Ratios","subtitle":"Current ratio · Quick ratio · Cash ratio · Interpretation · Sector differences",
"theory":"<h4>What is Liquidity?</h4><p>Liquidity is the ability to meet short-term obligations as they fall due. Even a profitable business can fail if it runs out of cash. Liquidity ratios compare liquid assets to current liabilities.</p><h4>Three Liquidity Ratios</h4><table class='tbl'><tr><th>Ratio</th><th>Formula</th><th>Excluded</th></tr><tr><td>Current ratio</td><td>Current assets ÷ Current liabilities</td><td>Nothing</td></tr><tr><td>Quick ratio (acid-test)</td><td>(Current assets − Inventory) ÷ Current liabilities</td><td>Inventory</td></tr><tr><td>Cash ratio</td><td>(Cash + Marketable securities) ÷ Current liabilities</td><td>All non-cash CA</td></tr></table><h4>Interpreting Liquidity Ratios</h4><ul><li>Current ratio &gt;1 is generally adequate; too high may indicate idle cash (poor asset utilisation)</li><li>Current ratio &lt;1 doesn't always indicate distress — depends heavily on the industry</li><li>Quick ratio &gt;1 is considered healthy; below 1 suggests over-reliance on inventory conversion</li></ul><div class='kbox'><strong>Context is Critical</strong>A 'good' liquidity ratio is highly industry-specific. Supermarkets operate safely with current ratios well below 1 because they generate immediate cash from sales. Always benchmark against industry norms — never interpret liquidity ratios in isolation.</div>",
"qa":[
{"q":"Cash $50k, Receivables $120k, Inventory $80k, Current liabilities $200k. Calculate current ratio, quick ratio, cash ratio.","a":"<strong>Current ratio</strong> = (50+120+80) ÷ 200 = <strong>1.25</strong><br><strong>Quick ratio</strong> = (50+120) ÷ 200 = <strong>0.85</strong><br><strong>Cash ratio</strong> = 50 ÷ 200 = <strong>0.25</strong>"},
{"q":"Why is the quick ratio considered a better test of liquidity than the current ratio?","a":"The quick ratio removes <em>inventory</em> because: (1) inventory cannot always be quickly converted to cash — it must first be sold, possibly on credit; (2) distress sales of inventory typically realise below book value; (3) converting inventory to cash can take months. The quick ratio gives a more <em>conservative and realistic</em> view of short-term liquidity."},
{"q":"Walmart consistently has a current ratio below 1. Does this indicate financial distress?","a":"<strong>No.</strong> Walmart sells for <em>immediate cash</em> (no receivables) and has <em>long credit terms with suppliers</em> (high payables). Current liabilities exceed current assets, but Walmart's powerful ongoing cash generation from operations easily covers all obligations. Liquidity ratios must always be interpreted in the context of the entity's business model and cash generation capacity."}
]},
{"id":"b5","icon":"⚖️","title":"Gearing and Capital Structure Ratios","subtitle":"Gearing methods · Interest cover · Dividend cover · Financial leverage · Risk trade-off",
"theory":"<h4>What is Gearing?</h4><p>Gearing measures the proportion of long-term financing from debt. Higher gearing = higher financial risk — more fixed obligations (interest and repayment) that must be met regardless of performance.</p><h4>Three Gearing Calculation Methods</h4><table class='tbl'><tr><th>Method</th><th>Formula</th></tr><tr><td>Debt to equity</td><td>Long-term debt ÷ Equity × 100%</td></tr><tr><td>Debt to capital employed</td><td>Long-term debt ÷ Capital employed × 100%</td></tr><tr><td>Debt to (debt + equity)</td><td>Long-term debt ÷ (LT debt + Equity) × 100%</td></tr></table><p>Long-term debt includes loans, bonds, redeemable preference shares, and lease liabilities.</p><h4>Interest Cover</h4><p>Interest cover = EBIT ÷ Finance costs. Measures how many times operating profit covers interest. Cover &lt;2× signals significant financial distress risk.</p><h4>Dividend Cover</h4><p>Dividend cover = EPS ÷ DPS (or PAT ÷ Total dividends). Cover &lt;1.5 is considered risky; cover &lt;1.0 means paying dividends from reserves — unsustainable.</p><div class='kbox'><strong>The Gearing Trade-off</strong>Debt is usually cheaper than equity (tax-deductible interest; lower required return). However, too much debt increases financial risk — the fixed interest burden can quickly create distress if profits fall. There is no universally 'correct' gearing level — it depends on stability of cash flows, asset quality, and industry norms.</div>",
"qa":[
{"q":"Equity $400k, Long-term debt $200k, EBIT $60k, Finance costs $15k. Calculate gearing (debt/equity) and interest cover.","a":"<strong>Gearing</strong> = $200k ÷ $400k × 100% = <strong>50%</strong><br><strong>Interest cover</strong> = $60k ÷ $15k = <strong>4.0 times</strong>"},
{"q":"Why is debt finance generally cheaper than equity for an organisation?","a":"(1) <strong>Tax deductibility:</strong> Interest is tax-deductible — reduces the effective cost; dividends are paid from post-tax profits. (2) <strong>Lower risk to provider:</strong> Debt providers have contractual rights to interest and repayment, often secured against assets — they require a lower return. (3) <strong>Priority on liquidation:</strong> Debt holders are repaid before equity holders, further reducing downside risk."},
{"q":"A company's dividend cover is 0.8. What does this mean and is it sustainable?","a":"Dividend cover of 0.8 means the company paid <em>more</em> in dividends than it earned in profit — it is drawing on <strong>retained earnings</strong> from previous periods. This is <em>not sustainable</em> indefinitely. Shareholders and analysts would question whether the dividend policy can be maintained without improved profitability or a dividend cut."}
]},
{"id":"b6","icon":"💸","title":"Cash Flow Ratios","subtitle":"OCF · Cash to capex · Debt service cover · Cash quality · OCF vs profit",
"theory":"<h4>Why Cash Flow Ratios?</h4><p>Financial statements use the accruals basis, which can diverge from actual cash flows. Cash is what keeps businesses alive — a company can be profitable but still fail. Cash flow ratios give a more direct view of financial health and are harder to manipulate than profit-based ratios.</p><h4>Key Cash Flow Ratios</h4><table class='tbl'><tr><th>Ratio</th><th>Formula</th><th>Purpose</th></tr><tr><td>OCF to capital employed</td><td>OCF ÷ Capital employed</td><td>Cash-based alternative to ROCE</td></tr><tr><td>Cash flow to capex</td><td>OCF ÷ Capital expenditure</td><td>Can operations fund investment?</td></tr><tr><td>Cash to total debt</td><td>OCF ÷ Total debt</td><td>Years to repay debt from operations</td></tr><tr><td>Debt service cover</td><td>(EBIT + D&amp;A) ÷ (Interest + Principal repayments)</td><td>Key bank covenant metric</td></tr></table><div class='kbox'><strong>Cash Quality Signal</strong>OCF consistently &gt; profit → high-quality earnings (strong cash conversion). OCF consistently &lt; profit → warning: aggressive revenue recognition? Rising working capital absorbing cash? Investigate.</div>",
"qa":[
{"q":"Why might OCF be considered a more reliable performance measure than net profit?","a":"OCF is harder to manipulate because: (1) It removes non-cash items (depreciation, amortisation); (2) It captures actual cash collected from customers and paid to suppliers; (3) It reflects actual tax paid not accrued; (4) Working capital changes are visible — earnings inflation through receivables growth is exposed. Profit is affected by accounting policy choices that can smooth or inflate results without changing underlying cash generation."},
{"q":"OCF = $400k, Capex = $600k, Total debt = $1,000k. Calculate cash flow to capex and cash to total debt. Interpret.","a":"<strong>Cash to capex</strong> = $400k ÷ $600k = <strong>0.67</strong> — operations only fund 67% of capex; the remainder needs external funding.<br><strong>Cash to total debt</strong> = $400k ÷ $1,000k = <strong>0.40</strong> — it would take 2.5 years of OCF to repay all debt."},
{"q":"What is debt service cover and why do banks monitor it as a covenant?","a":"Debt service cover = (EBIT + D&A) ÷ (Interest + Principal repayments). It shows whether operations generate sufficient cash to meet ALL debt obligations. Banks include it as a <em>loan covenant</em> — a minimum ratio must be maintained. If breached, the bank may demand immediate repayment or increase rates. It is a critical early warning indicator of financial distress."}
]},
{"id":"b7","icon":"📐","title":"Interpreting & Responding to Analysis Results","subtitle":"Trend analysis · Division analysis · KPIs · Non-financial indicators · Benchmarking",
"theory":"<h4>From Calculation to Interpretation</h4><p>Calculating ratios is only the first step. Interpretation requires understanding what a ratio is telling us, why it changed, and what management should do in response.</p><h4>Internal Analysis Methods</h4><ul><li><strong>Trend analysis:</strong> Track ratios over multiple periods to identify desirable or undesirable patterns. Quarterly data reveals seasonal influences.</li><li><strong>Division analysis:</strong> Look at individual business divisions — a successful division may mask a struggling one. Best performers reveal practices to roll out.</li><li><strong>KPI analysis:</strong> Measurable values indicating achievement of key organisational goals. Compare to budget, forecast, or industry targets. Also used to motivate and reward employees.</li><li><strong>Non-financial indicators:</strong> Often explain the 'why' behind financial results. Examples: machine downtime (explains rising COS); staff turnover (explains falling service quality); customer satisfaction (explains falling revenue).</li></ul><h4>External Analysis Methods</h4><ul><li><strong>Industry best practice:</strong> Best achievable in the industry — the aspirational ceiling</li><li><strong>Industry norms:</strong> Typical performance within the sector — are we above or below average?</li><li><strong>Competitor analysis:</strong> Why is a competitor outperforming? What can be learned?</li></ul><div class='kbox'><strong>Decisions Driven by Analysis</strong>Common responses: raise debt or equity; invest in or divest subsidiaries; enter or exit markets; restructure operations; change credit policies; renegotiate supplier terms; invest in productivity improvements.</div>",
"qa":[
{"q":"GPM has fallen for three consecutive quarters. How might non-financial indicators help management investigate?","a":"Management could examine: (1) <strong>Production machine downtime</strong> — breakdowns increase production costs; (2) <strong>Raw material prices</strong> — commodity price increases; (3) <strong>Staff turnover</strong> — new less-experienced workers produce more waste; (4) <strong>Supplier defect rates</strong> — poor input quality leading to rework; (5) <strong>Sales mix changes</strong> — shift to lower-margin products. Non-financial indicators identify root causes rather than just symptoms."},
{"q":"What is the difference between 'industry best practice' and 'industry norm' benchmarks?","a":"<strong>Industry best practice</strong> = the highest level of performance achievable — what top performers achieve. Sets the aspirational ceiling and identifies how much improvement is theoretically possible.<br><strong>Industry norm</strong> = typical (average) performance across the sector. Shows whether an entity is above or below average. Together they answer: (1) Is the company at least average? (2) How far below the best is it?"},
{"q":"ROCE has fallen from 18% to 11%. What actions might management consider?","a":"ROCE = EBIT ÷ Capital Employed. Actions to improve:<br><strong>Increase EBIT:</strong> Grow revenue (pricing, volume, new markets); reduce COS (supplier negotiation, efficiency); reduce operating expenses.<br><strong>Reduce capital employed:</strong> Dispose of underperforming assets; reduce working capital (tighten receivables, reduce inventory); repay debt.<br><strong>Both:</strong> Acquire high-ROCE business; divest low-ROCE division."}
]},
{"id":"b8","icon":"🔧","title":"Interpretation of Ratios — Internal Constraints","subtitle":"Capacity · Budget inflexibility · Liquidity constraints · Capital structure limits",
"theory":"<h4>What Are Internal Constraints?</h4><p>Even when FSA identifies clear improvement opportunities, internal constraints within the organisation's own control can prevent it from acting. Understanding these is essential for realistic action planning.</p><h4>Capacity Constraints</h4><ul><li><strong>Production capacity:</strong> Cannot simply produce more without checking: adequate raw material supply; sufficient machine capacity; adequate warehouse space; sufficient trained staff. Machines have maximum utilisation limits — over-burdening causes breakdowns.</li><li><strong>Service capacity:</strong> In professional services, the constraint is typically workforce capacity — hiring and training takes time and money.</li></ul><h4>Budget Inflexibility</h4><p>Budget constraints can prevent beneficial expenditures if there is insufficient flexibility to approve spending outside approved budgets. The ideal is a budget process that allows meaningful variances to be escalated and approved quickly.</p><h4>Insufficient Cash Flow / Liquidity</h4><ul><li>Slow collection of receivables (lenient credit policies)</li><li>Cash management policies avoiding reserves</li><li>Weak internal controls over working capital</li></ul><h4>Capital Structure Constraints</h4><ul><li>High existing gearing — cannot take on more debt without breaching covenants</li><li>Equity issuance not possible — private company or unfavourable market conditions</li></ul><div class='kbox'><strong>Key Distinction</strong>Internal constraints are within the entity's control and can in principle be resolved given time and resources. External constraints (next lesson) are beyond the entity's control.</div>",
"qa":[
{"q":"A manufacturer wants to increase production by 40%. What internal constraints might prevent this?","a":"(1) <strong>Raw materials:</strong> Can suppliers accommodate a 40% volume increase at short notice? (2) <strong>Machine capacity:</strong> Operating near maximum utilisation? Additional machines need capital and time. (3) <strong>Warehouse space:</strong> Can higher inventory levels be stored? (4) <strong>Workforce:</strong> Sufficient trained staff? Overtime costs? Training time for new hires? (5) <strong>Budget:</strong> Capital budget approved? Working capital funding available for higher inventory and receivables?"},
{"q":"How can an inflexible budget act as an internal constraint on performance improvement?","a":"Budgets set financial limits for each cost centre. A manager who identifies a cost-beneficial opportunity requiring above-budget spending — even with a clearly positive ROI — may be blocked by an inflexible budget process. Examples: a maintenance manager unable to repair a critical machine because the repair budget is exhausted; a sales manager unable to fund a high-return campaign because it wasn't in the annual budget. Result: missed opportunities that would have improved overall performance."},
{"q":"A company has gearing of 75% (debt/capital employed). How does this constrain improving performance?","a":"(1) <strong>Lenders may refuse additional debt</strong> — default risk too high; (2) <strong>Existing covenants</strong> may cap gearing — breaching triggers penalties or immediate repayment demands; (3) <strong>High interest burden</strong> erodes profitability and cash flow, reducing internal funds for investment; (4) <strong>Equity investors</strong> may be deterred by the high financial risk, making new equity issuance difficult or expensive."}
]},
{"id":"b9","icon":"🌍","title":"Interpretation of Ratios — External Constraints","subtitle":"Competition · Economic conditions · Regulation · Technology disruption · PESTEL",
"theory":"<h4>What Are External Constraints?</h4><p>External constraints arise from the organisation's environment and are largely beyond its control. They limit the actions available in response to FSA findings. Understanding them helps set realistic targets and explains why ratios may diverge from industry norms.</p><h4>Market and Competitive Constraints</h4><ul><li><strong>Intense competition:</strong> May prevent price increases needed to improve margins</li><li><strong>Price-sensitive customers:</strong> Switching costs are low — any price rise causes volume loss</li><li><strong>New entrants:</strong> Online competition, low-cost imports constrain pricing power and market share</li></ul><h4>Economic Conditions</h4><ul><li><strong>Recession:</strong> Reduces consumer demand; restricts ability to raise prices; increases bad debts</li><li><strong>Inflation:</strong> Increases input costs; margin compression if prices can't be raised</li><li><strong>Interest rate rises:</strong> Increases cost of debt; reduces consumer spending power</li><li><strong>Exchange rates:</strong> Adverse currency movements affect revenue and costs for international operations</li></ul><h4>Regulatory and Legal Constraints</h4><ul><li>Minimum wage legislation increasing labour costs</li><li>Environmental regulations increasing production costs</li><li>Health and safety requirements imposing capital expenditure</li></ul><h4>Technological Disruption</h4><p>Rapid technological change may make existing business models uncompetitive. Heavy investment in technology to 'keep up' constrains profitability and cash flow.</p><div class='kbox'><strong>PESTEL Framework</strong>External constraints map directly to PESTEL factors (Political, Economic, Social, Technological, Environmental, Legal). A thorough external constraint analysis considers all six dimensions.</div>",
"qa":[
{"q":"A retailer wants to improve gross profit margin. Name three external constraints that might prevent this.","a":"(1) <strong>Intense price competition</strong> — competitors match or undercut any price increases, so raising prices causes market share loss; (2) <strong>Supplier power</strong> — if key suppliers have market power, they raise input prices and squeeze COS; (3) <strong>Inflation</strong> — rising raw material or logistics costs that cannot be fully passed on to price-sensitive customers."},
{"q":"How does an economic recession create external constraints on improving financial ratios?","a":"(1) <strong>Demand falls</strong> — revenue growth becomes impossible; (2) <strong>Pricing power reduces</strong> — consumers are price-sensitive; (3) <strong>Bad debt risk increases</strong> — more customers experience financial difficulty; (4) <strong>Receivables days worsen</strong> — customers defer payment; (5) <strong>Lenders tighten credit</strong> — securing new finance becomes harder and more expensive. These constraints affect profitability, liquidity, and capital structure simultaneously."},
{"q":"Why is the distinction between internal and external constraints important for management?","a":"<strong>Internal constraints</strong> are within the organisation's control — they can in principle be resolved given time and resources. <strong>External constraints</strong> cannot be controlled; management can only adapt to them. The distinction matters because: (1) Actions for internal vs external constraints are fundamentally different; (2) Targets must reflect external realities; (3) Realistic strategic planning requires knowing which constraints are changeable."}
]},
{"id":"b10","icon":"⚠️","title":"Limitations of Financial Statement Analysis","subtitle":"Timeliness · Comparability · Window dressing · Creative accounting · International issues",
"theory":"<h4>Limitations of Financial Reporting Information</h4><ul><li><strong>Timeliness:</strong> Statements are historical — published months after year-end. Information may be 'old news' by the time it is available.</li><li><strong>Comparability — same entity over time:</strong> Acquisitions, disposals, one-off items, and accounting policy changes make year-to-year comparisons misleading.</li><li><strong>Comparability — between entities:</strong> Different accounting policies (e.g., cost model vs revaluation model for PPE) mean identical assets may be valued very differently. Cross-industry comparison is particularly difficult.</li><li><strong>Non-financial value drivers:</strong> Financial statements capture financial value but miss environmental impact, employee wellbeing, customer satisfaction, and innovation.</li></ul><h4>Limitations of Ratio Analysis Specifically</h4><ul><li><strong>No prescribed calculation:</strong> Most ratios have multiple valid formulas — gearing can be calculated three different ways. Comparing ratios calculated differently is meaningless.</li><li><strong>Window dressing:</strong> Management may manipulate year-end balances to improve ratios (e.g., collecting receivables aggressively before year-end, then extending credit immediately after).</li><li><strong>Historical data:</strong> Ratios describe the past — they don't predict the future.</li><li><strong>International matters:</strong> IFRS vs local GAAP differences; foreign exchange fluctuations; different economic cycles across countries.</li></ul><div class='kbox'><strong>Fundamental Principle</strong>No single ratio should be used in isolation. Use a range of ratios, over multiple periods, compared to appropriate benchmarks, with non-financial context. Apply professional judgement throughout.</div>",
"qa":[
{"q":"Name four key limitations of using ratio analysis to compare two companies in the same sector.","a":"(1) <strong>Different accounting policies</strong> — e.g., cost model vs revaluation model for PPE makes ROCE incomparable; (2) <strong>Different ratio calculations</strong> — if gearing is defined differently, numbers are meaningless to compare; (3) <strong>Different financial year-ends</strong> — seasonal businesses look different at different points; (4) <strong>Window dressing</strong> — year-end balances may have been managed to appear better than normal trading conditions."},
{"q":"What is 'window dressing' and give two examples.","a":"Window dressing involves actions taken around year-end specifically to make ratios appear more favourable than normal. Examples: (1) <strong>Improving current ratio:</strong> Collect all receivables aggressively in December to temporarily boost liquidity — then extend generous credit again in January; (2) <strong>Reducing gearing:</strong> Temporarily repay a short-term bank loan at year-end, then re-draw it immediately after — gearing looks lower on the balance sheet date than in practice."},
{"q":"Why is comparing financial statements across different countries particularly challenging?","a":"(1) <strong>Different standards</strong> — IFRS vs various national GAAPs; (2) <strong>Different economic cycles</strong> — companies may face very different economic conditions; (3) <strong>Exchange rate fluctuations</strong> — translating foreign statements introduces additional variability; (4) <strong>Different tax regimes</strong> — different effective tax rates affect PAT comparisons; (5) <strong>Different governance and disclosure requirements</strong> — information available may not be equivalent."}
]}
]},
"C":{"title":"Group Reporting","icon":"🏗️","lessons":[
{"id":"c1","icon":"🌐","title":"Introduction to Consolidated Financial Statements","subtitle":"Why consolidate · IFRS 10 control definition · Exemptions · Subsidiaries vs associates",
"theory":"<h4>Why Consolidate?</h4><p>When a parent controls a subsidiary, they form a <strong>group</strong>. IFRS 10 requires consolidated financial statements to present the group as a <em>single economic entity</em> — reflecting economic substance over legal form. The parent and subsidiary remain separate legal entities but are presented together.</p><h4>What is Control? (IFRS 10) — Three Conditions, ALL Required</h4><ol><li><strong>Power</strong> over the investee — ability to direct relevant activities</li><li><strong>Exposure or rights</strong> to variable returns from involvement</li><li><strong>Ability to use power</strong> to affect the amount of those returns</li></ol><p>Owning &gt;50% of ordinary shares normally gives power and control. Exactly 50% does NOT give control. Control can exist without majority shareholding through contractual arrangements or board composition.</p><h4>Required Consolidated Financial Statements</h4><ul><li><strong>CSPLOCI</strong> — Consolidated Statement of Profit or Loss and OCI</li><li><strong>CSOFP</strong> — Consolidated Statement of Financial Position</li><li><strong>CSOCIE</strong> — Consolidated Statement of Changes in Equity</li><li><strong>CSOCF</strong> — Consolidated Statement of Cash Flows</li></ul><h4>Subsidiaries vs Associates vs Joint Ventures</h4><ul><li><strong>Subsidiary (&gt;50% control):</strong> Full consolidation — 100% of all assets, liabilities, income, expenses added line by line</li><li><strong>Associate (20–50% significant influence):</strong> Equity method — single line in SOFP and SPLOCI</li><li><strong>Joint venture:</strong> Equity method</li></ul>",
"qa":[
{"q":"Under IFRS 10, what three conditions must ALL be met for an investor to 'control' an investee?","a":"(1) <strong>Power</strong> over the investee — can direct relevant activities that significantly affect returns; (2) <strong>Exposure or rights to variable returns</strong> from involvement; (3) <strong>Ability to use power</strong> to affect those returns. All three must exist simultaneously. Holding &gt;50% of voting rights is the most common way to satisfy all three."},
{"q":"What is the purpose of preparing consolidated financial statements?","a":"Consolidated statements present the parent and its subsidiaries as a <em>single economic entity</em>, reflecting economic substance over legal form. They give shareholders of the parent complete information about the group's combined assets, liabilities, income, and cash flows — including everything under the parent's control within subsidiaries. Without consolidation, shareholders could not see the full economic picture."},
{"q":"Company A owns 45% of Company B's ordinary shares. Is B a subsidiary? What accounting treatment applies?","a":"Probably <strong>not a subsidiary</strong> — 45% does not normally give control (requires &gt;50% under the simple majority rule, unless IFRS 10's other criteria are met through other means). 45% typically gives <strong>significant influence</strong>, making B an <em>associate</em> of A. Associates are accounted for using the <strong>equity method</strong> — a single line in the SOFP and SPLOCI."},
{"q":"Name the four consolidated financial statements required by IFRS 10.","a":"(1) <strong>CSPLOCI</strong> — Consolidated Statement of Profit or Loss and OCI; (2) <strong>CSOFP</strong> — Consolidated Statement of Financial Position; (3) <strong>CSOCIE</strong> — Consolidated Statement of Changes in Equity; (4) <strong>CSOCF</strong> — Consolidated Statement of Cash Flows."}
]},
{"id":"c2","icon":"📋","title":"Consolidated SPLOCI","subtitle":"100% consolidation · NCI attribution · Intragroup eliminations · Fair value adjustments · Goodwill impairment",
"theory":"<h4>Preparing the CSPLOCI — Basic Approach</h4><p>Combine <strong>100% of the parent's</strong> income/expenses with <strong>100% of the subsidiary's</strong> income/expenses line by line. This reflects the parent's <em>control</em> over the subsidiary — it controls all resources even if it owns only part of the equity.</p><h4>Non-Controlling Interest (NCI)</h4><p>Where the parent owns &lt;100% of the subsidiary, the remaining % belongs to NCI. The 'attributable to' section at the bottom of the CSPLOCI splits profit and TCI between:</p><ul><li>Parent shareholders (balancing figure)</li><li>NCI = Subsidiary's profit for the year × NCI%</li></ul><h4>Key Consolidation Adjustments</h4><div class='fw'><strong>1. Eliminate intragroup sales/purchases:</strong> Remove intragroup revenue and COS.<br>Unrealised profit in closing inventory = Group's profit margin × closing intragroup inventory held.<br>Dr Retained earnings (or COS) Cr Inventory — reduces profit and inventory.</div><div class='fw'><strong>2. Goodwill impairment:</strong> Charge to operating expenses in CSPLOCI. Reduces goodwill in CSOFP.</div><div class='fw'><strong>3. Fair value depreciation:</strong> Extra depreciation on fair value uplift of subsidiary's assets at acquisition — charged each year post-acquisition in CSPLOCI.</div><h4>Dividends</h4><p>Intragroup dividends are eliminated. Subsidiary's dividend paid to parent is removed — only subsidiary's <em>earnings</em> are included in consolidated profit.</p>",
"qa":[
{"q":"Parent P owns 75% of Subsidiary S. S has PAT of $200,000. How is this attributed in the CSPLOCI?","a":"NCI attribution = $200,000 × 25% = <strong>$50,000</strong> to NCI<br>Parent shareholders' share = $200,000 × 75% = <strong>$150,000</strong><br>Note: 100% of S's income and expenses are combined in the body of the CSPLOCI — the split only appears in the 'attributable to' section at the bottom."},
{"q":"P sells goods to S for $80,000 (P's cost was $50,000). At year-end, S holds all these goods. What CSPLOCI adjustment is needed?","a":"Unrealised intragroup profit = $80,000 − $50,000 = $30,000. This must be eliminated:<br>• Eliminate the intragroup sale ($80,000 revenue) and purchase ($80,000 COS in S) — net effect = nil in CSPLOCI<br>• Reduce profit by $30,000 (the unrealised margin) via Dr Retained earnings / Cr Inventory in CSOFP<br>Net CSPLOCI effect: profit reduced by $30,000; inventory reduced by $30,000 in CSOFP."},
{"q":"Why are 100% of a subsidiary's income and expenses consolidated even if the parent owns only 60%?","a":"Because consolidated statements reflect economic <em>control</em>, not just ownership percentage. The parent controls 100% of the subsidiary's operations — all income and expenses flow through the group. The NCI's 40% economic interest is recognised separately in the 'attributable to' section — it is a share of profit, not a reduction in what is consolidated."},
{"q":"How is goodwill impairment treated in the CSPLOCI?","a":"Goodwill impairment is recognised as an <strong>operating expense</strong> in the CSPLOCI for the year in which it arises. It reduces the carrying amount of goodwill in the CSOFP. The impairment may be split between parent and NCI depending on the NCI measurement method used at acquisition."}
]},
{"id":"c3","icon":"📊","title":"Consolidated SOFP","subtitle":"Goodwill calculation · NCI in equity · Pre vs post-acquisition reserves · Intragroup eliminations",
"theory":"<h4>Preparing the CSOFP — Basic Approach</h4><p>Add 100% of parent and subsidiary assets and liabilities line by line, then make consolidation adjustments. Replace the parent's 'Investment in subsidiary' with goodwill.</p><h4>Goodwill Calculation (IFRS 3)</h4><div class='fw'><strong>Goodwill = Cost of investment + NCI at acquisition − Fair value of net assets acquired</strong><br><br>NCI can be measured at: (a) <em>Fair value</em> (full goodwill method) or (b) <em>Proportionate share of net assets</em><br>Net assets at acquisition = Share capital + Pre-acquisition reserves + Fair value adjustments</div><h4>NCI in the CSOFP</h4><p>NCI is shown in the equity section = NCI at acquisition ± NCI's share of post-acquisition reserve changes (profits, OCI, dividends paid to NCI).</p><h4>Pre vs Post-Acquisition Reserves</h4><ul><li><strong>Pre-acquisition reserves:</strong> Part of net assets used to calculate goodwill — NOT in consolidated retained earnings</li><li><strong>Post-acquisition reserves:</strong> Group's share → consolidated retained earnings; NCI's share → NCI in equity</li></ul><h4>Key Eliminations</h4><ul><li>Eliminate parent's 'Investment in subsidiary' → replace with goodwill</li><li>Eliminate intragroup balances (receivables/payables, intragroup loans)</li><li>Eliminate unrealised profit in inventory (Dr Retained earnings; Cr Inventory)</li></ul>",
"qa":[
{"q":"P paid $600,000 to acquire 80% of S. At acquisition, S's net assets (at fair value) were $650,000. NCI is measured at proportionate share. Calculate goodwill.","a":"NCI at acquisition = 20% × $650,000 = $130,000<br>Goodwill = $600,000 + $130,000 − $650,000 = <strong>$80,000</strong>"},
{"q":"At acquisition, S had retained earnings of $100,000. At year-end, S's retained earnings are $180,000. P owns 75%. What is included in consolidated retained earnings from S?","a":"Post-acquisition earnings = $180,000 − $100,000 = $80,000<br>Group's share = 75% × $80,000 = <strong>$60,000</strong> added to consolidated retained earnings<br>NCI's share = 25% × $80,000 = $20,000 added to NCI in equity<br>The pre-acquisition $100,000 is part of net assets used to calculate goodwill — NOT in consolidated reserves."},
{"q":"P has a receivable of $50,000 from S. S has a corresponding payable of $50,000 to P. What adjustment is needed?","a":"These are <strong>intragroup balances</strong> — the group cannot owe money to itself. Eliminate: Dr Payable $50,000 (in S) / Cr Receivable $50,000 (in P). If balances don't match due to cash in transit, additional adjustments are needed for the transit item."},
{"q":"What is the difference between the full goodwill method and proportionate share method for NCI at acquisition?","a":"<strong>Full goodwill:</strong> NCI measured at <em>fair value</em> → higher goodwill figure (includes NCI's goodwill). Goodwill impairment shared between parent and NCI.<br><strong>Proportionate share:</strong> NCI measured at NCI% × fair value of net assets → lower goodwill (only parent's goodwill). Impairment only affects parent. IFRS 3 permits either method as a policy choice per acquisition."}
]},
{"id":"c4","icon":"📝","title":"Consolidated Statement of Changes in Equity","subtitle":"CSOCIE structure · TCI attribution · NCI dividends · Opening and closing equity",
"theory":"<h4>Purpose of the CSOCIE</h4><p>The CSOCIE reconciles opening and closing equity balances for both parent shareholders and NCI. It discloses: total comprehensive income, dividends paid, share issues, and other equity movements.</p><h4>Structure of the CSOCIE</h4><table class='tbl'><tr><th>Movement</th><th>Parent shareholders</th><th>NCI</th></tr><tr><td>Equity brought forward</td><td>x</td><td>x</td></tr><tr><td>Total comprehensive income</td><td>x</td><td>x</td></tr><tr><td>Dividends — parent shareholders</td><td>(x)</td><td>—</td></tr><tr><td>Dividends — NCI shareholders</td><td>—</td><td>(x)</td></tr><tr><td>Equity carried forward</td><td>x</td><td>x</td></tr></table><h4>Key Points on Each Line</h4><ul><li><strong>TCI:</strong> From the CSPLOCI — profit and OCI attributed to parent/NCI respectively</li><li><strong>Parent dividends:</strong> Reduce parent equity. NOT an expense in CSPLOCI — a distribution to owners.</li><li><strong>NCI dividends:</strong> Cash paid by the subsidiary to external NCI shareholders — reduces NCI column. Only the NCI's portion is shown (parent's portion is eliminated as intragroup).</li></ul><h4>NCI Closing Balance</h4><p>NCI closing = NCI at acquisition + NCI's cumulative share of post-acquisition reserve changes (profit, OCI) − NCI dividends paid. Alternatively: NCI% × Total subsidiary equity at reporting date.</p>",
"qa":[
{"q":"Why does the parent's dividend appear in the CSOCIE but NOT as an expense in the CSPLOCI?","a":"Dividends paid to parent shareholders are a <em>distribution to owners</em>, not an expense. They reduce retained earnings (and therefore equity) in the CSOCIE. They do not appear in the CSPLOCI because paying a dividend does not change how much profit was earned — only how it is distributed. Finance costs on <em>debt</em> instruments appear in the CSPLOCI; equity dividends do not."},
{"q":"S paid a dividend of $40,000 during the year. P owns 70% of S. How does this appear in the CSOCIE?","a":"70% × $40,000 = $28,000 → <em>eliminated</em> as intragroup (P receives this as income, cancelled in consolidation).<br>30% × $40,000 = <strong>$12,000</strong> → NCI's dividend, shown as a deduction in the NCI column of the CSOCIE. Total group equity reduces by $12,000 (the actual cash paid to external NCI shareholders)."},
{"q":"How is the NCI closing balance in the CSOCIE calculated?","a":"NCI closing = NCI at acquisition + NCI's cumulative share of all post-acquisition changes in subsidiary net assets (PAT, OCI) − NCI dividends paid.<br>Shortcut: NCI closing = NCI% × Subsidiary's total equity at the reporting date."}
]},
{"id":"c5","icon":"💵","title":"Consolidated Statement of Cash Flows","subtitle":"IAS 7 · Three classifications · Indirect method · NCI dividends · Subsidiary acquisitions",
"theory":"<h4>Purpose of the CSOCF</h4><p>The CSOCF (IAS 7) shows how cash and cash equivalents changed during the period. Cash is classified into three sections — even a profitable group can fail without cash.</p><h4>Three Sections</h4><ul><li><strong>Operating activities:</strong> Cash from principal revenue-producing activities (indirect method: start from PBT)</li><li><strong>Investing activities:</strong> Cash from acquiring/disposing of long-term assets and investments</li><li><strong>Financing activities:</strong> Cash from changes in equity and borrowings</li></ul><h4>Indirect Method — Operating Activities</h4><div class='fw'><strong>Group PBT</strong><br>Add: Depreciation, amortisation, goodwill impairment<br>Add: Finance costs (interest) / Deduct: Finance income<br>Deduct: Share of profit of associate (add back loss)<br>= Cash before working capital changes<br>± Changes in working capital<br>= Cash from operations<br>Less: Tax paid<br>= <strong>Net cash from operating activities</strong></div><h4>Group-Specific Items</h4><ul><li><strong>NCI dividends:</strong> Financing outflow (distribution to equity capital providers)</li><li><strong>Dividends from associates:</strong> Investing inflow</li><li><strong>Acquisition of subsidiary:</strong> Investing outflow = Cash paid − Cash acquired in subsidiary</li><li><strong>Goodwill impairment:</strong> Added back in operating activities (non-cash, like depreciation)</li></ul>",
"qa":[
{"q":"Under IAS 7, name the three sections and give one example for each for a manufacturing group.","a":"<strong>Operating:</strong> Cash received from customers; wages paid; income tax paid.<br><strong>Investing:</strong> Purchase of machinery; cash paid to acquire a subsidiary (net of subsidiary's cash); proceeds from property disposal.<br><strong>Financing:</strong> Proceeds from bank loan; bond repayment; dividends paid to parent shareholders; dividends paid to NCI."},
{"q":"P acquires 80% of S for $500,000. S holds $30,000 cash at acquisition. How is this shown in the CSOCF?","a":"Net cash outflow for acquisition = $500,000 − $30,000 = <strong>$470,000 net investing outflow</strong>. Under IAS 7, cash flows from acquiring subsidiaries appear in <em>investing activities</em>, net of cash held in the acquired subsidiary."},
{"q":"Why is depreciation added back to PBT in the indirect method?","a":"The indirect method starts with profit, which has already been reduced by depreciation — a <em>non-cash charge</em>. To derive actual cash from operations, all non-cash charges must be added back. Depreciation reduces profit but involves no cash outflow — the cash was spent when the asset was originally purchased (which appears as a separate investing outflow)."},
{"q":"Where do dividends paid to NCI shareholders appear in the CSOCF, and why?","a":"NCI dividends appear as a <strong>financing outflow</strong>. NCI shareholders are providers of equity capital to the group — paying dividends to them is a distribution to capital providers, equivalent to dividends paid to parent shareholders. IAS 7 treats all distributions to equity holders (including NCI) as financing activities."}
]}
]},
"D":{"title":"Long-Term Finance","icon":"💰","lessons":[
{"id":"d1","icon":"🏛️","title":"Introduction to Long-Term Finance","subtitle":"Matching principle · Types of LT finance · Debt vs equity trade-offs · Management accountant's role",
"theory":"<h4>Why Long-Term Finance?</h4><p>Long-term assets have long useful lives. The <strong>matching principle</strong> requires them to be financed by long-term funding — ensuring the organisation doesn't face a liquidity crisis if short-term funding is withdrawn before the asset has generated sufficient returns.</p><h4>Four Main Types of Long-Term Finance</h4><ul><li><strong>Debt:</strong> Borrowed at agreed interest rate, repayable over agreed period. Usually cheaper than equity due to tax deductibility and lower risk to lender.</li><li><strong>Equity (ordinary shares):</strong> Investment by shareholders in exchange for ownership and voting rights. Discretionary dividends — no mandatory return.</li><li><strong>Preference shares:</strong> Fixed dividend, no voting rights. Classified as debt if redeemable (IAS 32).</li><li><strong>Retained earnings:</strong> Internal funding from accumulated profits — cheapest source (no flotation costs, no dilution).</li></ul><h4>Debt vs Equity Trade-offs</h4><table class='tbl'><tr><th>Feature</th><th>Debt</th><th>Equity</th></tr><tr><td>Cost</td><td>Lower (tax deductible)</td><td>Higher (required return)</td></tr><tr><td>Repayment</td><td>Mandatory (contractual)</td><td>None until sale/liquidation</td></tr><tr><td>Interest/dividends</td><td>Mandatory (interest)</td><td>Discretionary (dividends)</td></tr><tr><td>Voting rights</td><td>None (usually)</td><td>Yes</td></tr><tr><td>Risk impact</td><td>Increases financial risk</td><td>Dilutes ownership only</td></tr></table><div class='kbox'><strong>Management Accountant's Role</strong>Forecasting cash flow requirements; assessing different types of finance; selecting the most appropriate and affordable source; monitoring gearing and covenant compliance; modelling the financial impact of financing decisions.</div>",
"qa":[
{"q":"Why is it important for an organisation to 'match' the maturity of its assets and liabilities?","a":"Long-term assets (10–30 year lives) funded by short-term borrowing face <em>refinancing risk</em> — the borrowing may need to be repaid before the asset has generated sufficient returns to cover it. If short-term funding is withdrawn at an inconvenient time (e.g., during a credit crunch), the organisation can face a liquidity crisis even if it is fundamentally profitable."},
{"q":"Why is debt generally cheaper than equity as a source of long-term finance?","a":"(1) <strong>Tax deductibility:</strong> Interest is tax-deductible — the after-tax cost is reduced by the tax shield; dividends are paid from post-tax profits with no benefit. (2) <strong>Lower risk to provider:</strong> Debt providers have contractual rights and often asset security — they require a lower return. (3) <strong>Priority on liquidation:</strong> Debt holders are repaid before equity holders, further reducing downside risk."},
{"q":"When might a higher gearing level than the 50% 'rule of thumb' be acceptable?","a":"Higher gearing may be acceptable when: (1) The entity has highly stable, predictable cash flows (e.g., utilities, infrastructure) that can comfortably service high debt; (2) Substantial long-term tangible assets provide good security; (3) The industry norm is higher (e.g., banks, property companies typically operate with much higher leverage). Context always matters — no universal threshold applies to all businesses."},
{"q":"What role does a management accountant play in long-term finance decisions?","a":"(1) <strong>Forecasts</strong> future cash flow requirements; (2) <strong>Assesses</strong> different types of finance and models their cost, risk, and gearing impact; (3) <strong>Evaluates feasibility</strong> given existing gearing, credit ratings, and market conditions; (4) <strong>Monitors compliance</strong> with loan covenants; (5) <strong>Models scenarios</strong> to help management understand the financial implications of different financing choices."}
]},
{"id":"d2","icon":"📜","title":"Equity Finance — Ordinary Shares","subtitle":"Nominal vs market value · Share premium · Rights issue · IPO · Advantages and disadvantages",
"theory":"<h4>Key Features of Ordinary Shares</h4><ul><li><strong>Nominal (par) value:</strong> The minimum issue price (e.g., $1/share). The excess of issue price over nominal value is the <em>share premium</em>.</li><li><strong>Market value:</strong> What the shares trade for — reflects investors' view of future earnings and growth. This is what matters to investors.</li><li><strong>Dividends:</strong> Paid at directors' discretion — not guaranteed. Vary with profitability and dividend policy.</li><li><strong>Voting rights:</strong> One vote per ordinary share at general meetings.</li><li><strong>Residual claim:</strong> Last in liquidation — after employees, creditors, tax authorities, and preference shareholders.</li></ul><h4>Methods of Issuing Ordinary Shares</h4><ul><li><strong>Rights issue:</strong> New shares offered to existing shareholders at a discount, in proportion to their holdings. Prevents dilution of proportional ownership.</li><li><strong>IPO (Initial Public Offering):</strong> First listing on a stock exchange — opens access to external public investors.</li><li><strong>Placing:</strong> Shares issued directly to selected institutional investors (faster and cheaper than IPO).</li><li><strong>Venture capital/private equity:</strong> For unlisted companies seeking pre-IPO funding.</li></ul><div class='fw'><strong>Advantages for the company</strong><ul><li>No mandatory dividends — cash can be retained if needed</li><li>No obligation to repay capital</li><li>No increase in gearing or financial risk</li></ul></div><div class='fw'><strong>Disadvantages for the company</strong><ul><li>More expensive than debt (higher required return; no tax deduction)</li><li>High administrative/legal costs for public issues</li><li>New shareholders dilute existing shareholders' control</li></ul></div>",
"qa":[
{"q":"What is the difference between nominal value, share premium, and market value?","a":"<strong>Nominal (par) value:</strong> The minimum legal issue price (e.g., $1). Recorded in share capital. Largely arbitrary.<br><strong>Share premium:</strong> Excess of issue price over nominal value (e.g., issue at $3 → share premium = $2). Recorded in a separate share premium account in equity.<br><strong>Market value:</strong> The price shares trade at in the secondary market, reflecting investors' expectations of future earnings. This is what matters to existing and potential investors."},
{"q":"A company with 10m shares offers a 1-for-4 rights issue at $2.50 (market price $3.50). How many new shares are issued and how much cash raised?","a":"New shares = 10,000,000 ÷ 4 = <strong>2,500,000 shares</strong><br>Cash raised = 2,500,000 × $2.50 = <strong>$6,250,000</strong><br>The discount to market price ($1.00 per share) compensates existing shareholders for the dilution they experience."},
{"q":"Why is the cost of ordinary equity higher than the cost of debt for a company?","a":"(1) Ordinary shareholders bear <em>more risk</em> — last in liquidation hierarchy, no guaranteed return; (2) Dividends are NOT tax-deductible — no tax shield (unlike debt interest); (3) Debt holders are protected by covenants and asset security; equity holders have no such protection. To compensate for higher risk, equity investors demand a higher return."},
{"q":"What are the main advantages of a rights issue over other methods of raising equity?","a":"(1) <strong>No dilution of proportional ownership</strong> — existing shareholders can maintain their percentage by subscribing for their rights; (2) Usually <strong>cheaper</strong> than a full IPO — smaller marketing/underwriting costs; (3) Subscription at a <strong>discount</strong> incentivises take-up; (4) Simpler regulatory process. Main risk: shareholders may be unable or unwilling to invest more, leading to undersubscription."}
]},
{"id":"d3","icon":"🎯","title":"Equity Finance — Preference Shares","subtitle":"Characteristics · Four types · Cumulative · Convertible · Participating · IAS 32 classification",
"theory":"<h4>What are Preference Shares?</h4><p>Preference shares carry a <strong>fixed dividend</strong> (as a % of nominal value), rank ahead of ordinary shareholders for dividends and in liquidation, but behind debt holders. Generally, no voting rights.</p><h4>Key Characteristics</h4><ul><li>Fixed dividend (e.g., 7% on $1 nominal = $0.07/share/year)</li><li>No voting rights in normal circumstances</li><li>Priority over ordinary shareholders for dividends and on liquidation</li><li>Dividends paid from <em>post-tax</em> profits — no tax benefit (unlike debt interest)</li><li>Can be irredeemable (equity) or redeemable (classified as debt under IAS 32)</li></ul><h4>Four Types of Preference Shares</h4><ul><li><strong>Cumulative:</strong> Unpaid dividends accumulate — must be paid in full before any ordinary dividends. Most investor-friendly.</li><li><strong>Non-cumulative:</strong> Missed dividends are lost — do not carry forward. Less attractive to investors.</li><li><strong>Participating:</strong> Fixed dividend PLUS an additional dividend if certain targets are met (e.g., profits exceed a threshold).</li><li><strong>Convertible:</strong> Can be converted into ordinary shares at a future date at a predetermined ratio. Offers fixed income now + equity upside option later.</li></ul><div class='fw'><strong>vs Debt — Advantages for the company</strong><ul><li>Dividends don't have to be paid if distributable profits are insufficient</li><li>Does not affect voting control</li></ul></div><div class='fw'><strong>vs Debt — Disadvantages for the company</strong><ul><li>More expensive than debt (dividends not tax-deductible)</li><li>Cumulative arrears must be cleared before ordinary dividends</li></ul></div>",
"qa":[
{"q":"Name the four types of preference shares and state which is most attractive to investors.","a":"(1) <strong>Cumulative</strong> — missed dividends accumulate and must be paid before ordinary dividends; (2) <strong>Non-cumulative</strong> — missed dividends are lost; (3) <strong>Participating</strong> — fixed dividend plus additional dividend if conditions met; (4) <strong>Convertible</strong> — can convert to ordinary shares at a future date.<br>Most attractive: <strong>Cumulative</strong> (protects income stream) and <strong>Convertible</strong> (fixed income now + equity upside option)."},
{"q":"How is a redeemable preference share classified under IAS 32 and why?","a":"A redeemable preference share is classified as a <strong>financial liability</strong>. Despite the legal form of 'equity,' its economic substance is debt-like: (1) It pays a <em>fixed, contractually determined</em> dividend (equivalent to interest); (2) It must be <em>redeemed</em> (repaid) on a specified date (equivalent to principal repayment). IAS 32's substance-over-form principle requires the liability classification."},
{"q":"Why is preference share finance generally more expensive for a company than debt?","a":"(1) <strong>Tax treatment:</strong> Preference dividends are paid from post-tax profits — NOT tax-deductible. Debt interest IS tax-deductible, giving a significant cost advantage; (2) <strong>Risk ranking:</strong> Preference shareholders rank below debt holders in liquidation — they bear more risk and require a higher return. Both factors make preference shares more expensive than equivalent debt financing."},
{"q":"Why might issuing preference shares address an existing shareholder's concern about dilution?","a":"Issuing preference shares raises finance without creating new <em>ordinary</em> shares. Therefore: (1) No new voting rights are created — existing ordinary shareholders maintain proportional voting control; (2) Percentage ownership of existing shareholders is unchanged; (3) Only the fixed preference dividend reduces profits available for ordinary dividends. Capital is raised without diluting equity ownership or control."}
]},
{"id":"d4","icon":"🏦","title":"Long-Term Debt Finance","subtitle":"Fixed vs floating charge · Covenants · Bank loans · Bonds · Eurobonds · Covenant breach consequences",
"theory":"<h4>Key Characteristics of Debt Finance</h4><ul><li><strong>Fixed or floating rate:</strong> Fixed rate provides cost certainty; floating rate tracks a benchmark (e.g., SOFR + margin) — cheaper initially but creates interest rate risk</li><li><strong>Secured or unsecured:</strong> Secured debt backed by assets (lower rate); unsecured backed by creditworthiness alone (higher rate)</li><li><strong>Term:</strong> Short-term (&lt;1 year), medium-term (1–7 years), long-term (&gt;7 years)</li></ul><h4>Security: Fixed vs Floating Charge</h4><ul><li><strong>Fixed charge:</strong> Secured against specific identified assets (e.g., land and buildings). Asset cannot be sold without lender consent. Strongest security for lender.</li><li><strong>Floating charge:</strong> Secured against a class of changing assets (e.g., inventory, receivables). Company can use these in normal trading. On default, charge 'crystallises' — fixes to whatever assets are in the class at that moment. Weaker than a fixed charge.</li></ul><h4>Debt Covenants</h4><p>Contractual conditions protecting the lender's position. Common covenants:</p><ul><li>Maximum gearing ratio</li><li>Minimum interest cover</li><li>Restrictions on additional debt</li><li>Restrictions on dividends and asset disposals</li></ul><div class='kbox'><strong>Covenant Breach is Serious</strong>A breach entitles the lender to demand immediate repayment of the entire loan — potentially forcing administration even in a profitable company. Management must monitor covenants continuously and take early remedial action.</div><h4>Types of Debt Finance</h4><ul><li><strong>Bank loans:</strong> Bilateral or syndicated; flexible; typically private</li><li><strong>Bonds (debentures):</strong> Traded debt securities; fixed coupon; publicly issued</li><li><strong>Eurobonds:</strong> Bonds issued in a currency other than the issuer's home currency; avoid domestic market regulation; useful for large multinationals</li></ul>",
"qa":[
{"q":"What is the difference between a fixed charge and a floating charge as security for debt?","a":"<strong>Fixed charge:</strong> Secured against a specific identified asset (e.g., a particular building). The asset cannot be sold without lender consent. In default, the lender takes possession of that specific asset. Provides the strongest security.<br><strong>Floating charge:</strong> Secured against a changing pool of assets (e.g., all inventory). The company can use these in normal trading. On default, the charge 'crystallises' — fixing itself to whatever is in the class at that moment. Weaker security because asset values fluctuate."},
{"q":"What is a debt covenant and why do lenders include them?","a":"A covenant is a contractual condition placed on the borrower restricting certain actions or requiring maintenance of financial ratios. Lenders include them to: (1) <strong>Reduce default risk</strong> — ensure the borrower maintains financial health; (2) <strong>Provide early warning</strong> of deteriorating position; (3) <strong>Protect their recovery position</strong> — prevent excessive dividends or additional debt that would reduce their claim."},
{"q":"A company's interest cover falls to 2.4x but the covenant requires minimum 3x. What are the consequences?","a":"The lender has the right to: (1) <strong>Demand immediate repayment</strong> of the entire loan (acceleration); (2) <strong>Increase the interest rate</strong> as a penalty; (3) <strong>Appoint a receiver/administrator</strong>. The company must urgently: negotiate a <em>waiver</em> (lender forgives the breach temporarily); <em>restructure</em> the facility on new terms; or find alternative funding to repay the debt. Even a profitable company can be forced into administration by a covenant breach."},
{"q":"Why might a large company issue bonds rather than borrow from a bank?","a":"(1) <strong>Lower cost:</strong> Capital markets can be cheaper than bank loans for high-credit-rated companies; (2) <strong>Greater amounts:</strong> Bond markets can accommodate very large borrowings; (3) <strong>Fixed long-term rate:</strong> Bonds provide long-term fixed-rate debt ideal for matching long-term assets; (4) <strong>No relationship dependency:</strong> Not reliant on a single bank's willingness to lend; (5) <strong>Market profile:</strong> Bond issuance raises the company's profile with institutional investors."}
]}
]}
};



const COURSE_DATA_P2 = {
"A":{"title":"Cost Competitiveness","icon":"🏭","lessons":[
{"id":"a1","icon":"💰","title":"Introduction to Managing Costs","subtitle":"CGMA Cost Transformation Model · Six elements · Cost drivers · Value vs cost reduction",
"theory":"<h4>The CGMA Cost Transformation Model</h4><p>Effective cost management is fundamental to organisational success. The CGMA Cost Transformation Model provides a logical planning and control framework for transforming and managing costs. It consists of <strong>six co-dependent elements</strong> that collectively help achieve and maintain long-term cost-competitiveness.</p><div class='fw'><strong>The Six Elements:</strong><ol><li><strong>Engendering a cost-conscious culture</strong> — All employees understand how their actions affect costs. Kaizen philosophy embeds cost-awareness at every level.</li><li><strong>Managing the risks inherent in driving cost competitiveness</strong> — Identifying and understanding business risks (competition, technology, commodity costs).</li><li><strong>Connecting products with profitability</strong> — Understanding what drives costs in each segment to maximise profits.</li><li><strong>Generating maximum value through new products</strong> — Considering costs and margins at the design stage before manufacturing processes are locked in.</li><li><strong>Incorporating sustainability to optimise profits</strong> — Reducing environmental impact while enhancing reputation.</li><li><strong>Understanding cost drivers</strong> — Cost accounting systems that identify what drives costs (ABC, value chain, beyond budgeting).</li></ol></div><h4>Beyond Cost Reduction</h4><p>The model focuses on <em>enhancing value</em> rather than solely on cost reduction. If additional costs lead to enhanced customer satisfaction, an organisation can increase selling prices or benefit from higher demand — resulting in greater profitability. Cost reduction that damages customer value is counterproductive.</p><h4>Key Cost Driver Categories</h4><ul><li><strong>Structural cost drivers:</strong> Scale, scope, experience, technology, complexity</li><li><strong>Executional cost drivers:</strong> Workforce involvement, TQM, capacity utilisation, process design</li></ul><div class='kbox'><strong>Key Principle</strong>Risk = quantifiable (probabilities can be estimated). Uncertainty = unquantifiable (outcomes cannot be predicted). Both must be considered in cost management decisions.</div>",
"qa":[
{"q":"Name the six elements of the CGMA Cost Transformation Model.","a":"(1) Engendering a cost-conscious culture; (2) Managing the risks inherent in driving cost competitiveness; (3) Connecting products with profitability; (4) Generating maximum value through new products; (5) Incorporating sustainability to optimise profits; (6) Understanding cost drivers via cost accounting systems."},
{"q":"Why is 'cost reduction' alone insufficient as a cost management strategy?","a":"Cost reduction that reduces customer value can be counterproductive — it may damage demand, reputation, and long-term profitability. The CGMA Cost Transformation Model focuses on <em>value enhancement</em>: if additional costs lead to higher customer satisfaction, the organisation can raise prices or increase demand, resulting in <em>greater</em> profitability. The goal is optimal value at optimal cost, not minimum cost."},
{"q":"What is the difference between risk and uncertainty in a cost management context?","a":"<strong>Risk</strong> is quantifiable — the likelihood of outcomes can be estimated using probabilities based on historical information (e.g., commodity price volatility). <strong>Uncertainty</strong> is unquantifiable — outcomes are unknown and cannot be statistically predicted (e.g., an unprecedented regulatory change). Risk can be incorporated into decision models; uncertainty requires scenario planning and judgement."},
{"q":"What is a 'cost-conscious culture' and how does Kaizen support it?","a":"A cost-conscious culture ensures <em>all employees</em> — including operational staff in production, marketing, and HR — understand how their daily decisions affect the organisation's costs. Kaizen, a Japanese philosophy of continuous improvement, embeds this culture by encouraging small, ongoing improvements from every level of the workforce, aligning quality, cost, and delivery improvement with overall strategy."}
]},
{"id":"a2","icon":"📐","title":"Activity-Based Costing","subtitle":"ABC vs traditional absorption · Four-step process · Cost pools · Cost drivers",
