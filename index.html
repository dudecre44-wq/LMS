// ═══════════════════════════════════════════════════════
//  SUBJECT REGISTRY
// ═══════════════════════════════════════════════════════
const SUBJECTS = {
  E2:  { key:'_e2',  order:['A','B','C'],     data:COURSE_DATA_E2,  icon:'🏢', label:'E2', name:'Enterprise Management',   total:27 },
  F2:  { key:'_f2',  order:['A','B','C','D'], data:COURSE_DATA_F2,  icon:'📑', label:'F2', name:'Financial Reporting',      total:30 },
  P2:  { key:'_p2',  order:['A','B','C','D'], data:COURSE_DATA_P2,  icon:'📊', label:'P2', name:'Mgmt Accounting',          total:50 },
  Revision: { key:'_Revision', order:['M'],             data:COURSE_DATA_Revision, icon:'🏭', label:'Revision',name:'Revise Your knowledge',           total:12 },
};

let ACTIVE = null; // no subject selected on first open

// ── Dynamic getters (all functions use these) ──────────
const CD  = () => SUBJECTS[ACTIVE].data;
const MO  = () => SUBJECTS[ACTIVE].order;
const AK  = () => SUBJECTS[ACTIVE].key;

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
const state = {
  view:'home', currentModule:null, currentLessonId:null,
  completed:new Set(), qaOpen:new Set()
};

// ═══════════════════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════════════════
function storeSave(){
  if(!ACTIVE) return;
  try{
    localStorage.setItem(AK()+'_done', JSON.stringify([...state.completed]));
    if(state.currentLessonId) localStorage.setItem(AK()+'_last', state.currentLessonId);
    if(state.currentModule)   localStorage.setItem(AK()+'_mod',  state.currentModule);
  }catch(e){}
}
function storeLoad(){
  if(!ACTIVE) return;
  try{
    const raw = localStorage.getItem(AK()+'_done');
    if(raw) JSON.parse(raw).forEach(id => state.completed.add(id));
    state.currentLessonId = localStorage.getItem(AK()+'_last') || null;
    state.currentModule   = localStorage.getItem(AK()+'_mod')  || null;
  }catch(e){}
}
function storeClear(){
  if(!ACTIVE) return;
  try{ ['_done','_last','_mod'].forEach(k => localStorage.removeItem(AK()+k)); }catch(e){}
}

// ── Update all subject progress badges ─────────────────
function updateAllBadges(){
  for(const code of Object.keys(SUBJECTS)){
    try{
      const raw  = localStorage.getItem(SUBJECTS[code].key+'_done');
      const done = raw ? JSON.parse(raw).length : 0;
      const tot  = SUBJECTS[code].total;
      const el   = document.getElementById('prog-'+code);
      if(el) el.textContent = done+'/'+tot;
    }catch(e){}
  }
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function totalLessons(){ return MO().reduce((s,k)=>s+CD()[k].lessons.length, 0); }
function moduleCompletedCount(mk){ return CD()[mk].lessons.filter(l=>state.completed.has(l.id)).length; }
function moduleLessons(mk){ return CD()[mk].lessons; }
function isLessonUnlocked(mk,idx){ return idx===0 || state.completed.has(moduleLessons(mk)[idx-1].id); }
function firstAvailableLessonId(mk){
  const ls = moduleLessons(mk);
  for(let i=0;i<ls.length;i++){ if(!state.completed.has(ls[i].id)) return ls[i].id; }
  return ls[ls.length-1].id;
}
function lessonIndex(mk,lid){ return moduleLessons(mk).findIndex(l=>l.id===lid); }

function updateBar(){
  if(!ACTIVE){ document.getElementById('progressWrap').style.display='none'; return; }
  const d=state.completed.size, t=totalLessons();
  document.getElementById('progressWrap').style.display='flex';
  document.getElementById('overallFill').style.width=(d/t*100)+'%';
  document.getElementById('overallLabel').textContent=d+' / '+t;
  const badge=document.getElementById('prog-'+ACTIVE);
  if(badge) badge.textContent=d+'/'+t;
}

// ═══════════════════════════════════════════════════════
//  SUBJECT SWITCHING
// ═══════════════════════════════════════════════════════
function switchSubject(code){
  // Save current subject progress before switching
  if(ACTIVE) storeSave();

  ACTIVE = code;
  // Reset UI state
  state.view='home'; state.currentModule=null;
  state.currentLessonId=null; state.qaOpen=new Set(); state.completed=new Set();

  // Load saved progress for this subject
  storeLoad();

  // If we have a saved lesson, jump straight to module view
  if(state.currentModule && state.currentLessonId && CD()[state.currentModule]){
    const idx = lessonIndex(state.currentModule, state.currentLessonId);
    if(idx >= 0 && isLessonUnlocked(state.currentModule, idx)){
      state.view = 'module';
    } else {
      state.currentModule = null; state.currentLessonId = null;
    }
  }

  // Update tab highlight
  document.querySelectorAll('.sub-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+code).classList.add('active');
  document.getElementById('activeSubTitle').textContent = SUBJECTS[code].name;

  updateAllBadges();
  render();
  window.scrollTo(0,0);
}

// ═══════════════════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════════════════
function goHome(){
  state.view='home'; state.currentModule=null; state.currentLessonId=null;
  render();
}
function openModule(mk){
  state.view='module'; state.currentModule=mk;
  state.currentLessonId=firstAvailableLessonId(mk);
  storeSave(); render(); window.scrollTo(0,0);
}
function reviewLesson(mk,lid,idx){
  if(!isLessonUnlocked(mk,idx)) return;
  state.currentModule=mk; state.currentLessonId=lid;
  storeSave(); render(); window.scrollTo(0,0);
}
function prevLesson(){
  const mk=state.currentModule, idx=lessonIndex(mk,state.currentLessonId);
  if(idx>0){ state.currentLessonId=moduleLessons(mk)[idx-1].id; storeSave(); render(); window.scrollTo(0,0); }
}
function markComplete(){
  const mk=state.currentModule, ls=moduleLessons(mk), idx=lessonIndex(mk,state.currentLessonId);
  state.completed.add(state.currentLessonId);
  storeSave(); updateAllBadges();
  const w=document.getElementById('ctaWrap');
  if(w) w.innerHTML='<div class="complete-zone done-state"><div class="stamp-done"><span class="si">✓</span> Saved!</div></div>';
  updateBar();
  setTimeout(()=>{
    if(idx<ls.length-1){ state.currentLessonId=ls[idx+1].id; storeSave(); render(); window.scrollTo(0,0); }
    else{ state.view='modcomplete'; render(); window.scrollTo(0,0); }
  },600);
}
function goNextModule(){
  const i=MO().indexOf(state.currentModule);
  if(i<MO().length-1) openModule(MO()[i+1]); else goHome();
}
function goNextFromReview(){
  const mk=state.currentModule, ls=moduleLessons(mk), idx=lessonIndex(mk,state.currentLessonId);
  if(idx<ls.length-1 && isLessonUnlocked(mk,idx+1)){ state.currentLessonId=ls[idx+1].id; storeSave(); render(); }
  else{ state.view='modcomplete'; render(); }
  window.scrollTo(0,0);
}
function toggleQA(key){
  state.qaOpen.has(key)?state.qaOpen.delete(key):state.qaOpen.add(key);
  const el=document.querySelector('[data-qk="'+CSS.escape(key)+'"]');
  if(el) el.classList.toggle('open');
}
function confirmReset(){
  if(confirm('Reset all progress for '+SUBJECTS[ACTIVE].label+'? This cannot be undone.')){
    state.completed.clear(); state.qaOpen.clear();
    state.currentModule=null; state.currentLessonId=null;
    storeClear(); updateAllBadges(); goHome();
  }
}

// ═══════════════════════════════════════════════════════
//  RING SVG
// ═══════════════════════════════════════════════════════
function ring(pct,sz){
  sz=sz||52; const r=sz/2-5, c=2*Math.PI*r, off=c-(pct/100*c);
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">
    <circle class="bgring" cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke-width="5"/>
    <circle class="fgring" cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke-width="5"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}

// ═══════════════════════════════════════════════════════
//  RENDER: LANDING (no subject selected)
// ═══════════════════════════════════════════════════════
function renderLanding(){
  const cards = Object.entries(SUBJECTS).map(([code,sub])=>{
    let done=0;
    try{ const r=localStorage.getItem(sub.key+'_done'); done=r?JSON.parse(r).length:0; }catch(e){}
    const pct=Math.round(done/sub.total*100);
    return `<div class="sg-card" onclick="switchSubject('${code}')">
      <div class="sg-code">${sub.icon} ${sub.label}</div>
      <div class="sg-title">${sub.name}</div>
      <div class="sg-meta">${sub.total} lessons · ${done===0?'Not started':done===sub.total?'Complete ✓':done+' of '+sub.total+' done'}</div>
      <div class="sg-bar"><div class="sg-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  return `<div class="landing">
    <h1>Your  Management Level Study Hub</h1>
    <p>All four subjects in one place. Select a subject below to pick up where you left off — progress saves automatically across sessions.</p>
    <div class="subject-grid">${cards}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  RENDER: HOME (subject selected, showing modules)
// ═══════════════════════════════════════════════════════
function resumeBadge(){
  if(state.completed.size===0) return '';
  let resumeMod=null, resumeLesson=null, resumeIdx=0;
  for(const mk of MO()){
    const ls=moduleLessons(mk);
    for(let i=0;i<ls.length;i++){
      if(!state.completed.has(ls[i].id) && isLessonUnlocked(mk,i)){
        resumeMod=mk; resumeLesson=ls[i]; resumeIdx=i; break;
      }
    }
    if(resumeMod) break;
  }
  const done=state.completed.size, tot=totalLessons();
  if(!resumeMod) return `<div class="resume-card all-done">
    <div class="rc-icon">🎓</div>
    <div class="rc-body"><strong>All ${SUBJECTS[ACTIVE].label} lessons complete!</strong><p>Review any module below.</p></div>
  </div>`;
  return `<div class="resume-card" onclick="reviewLesson('${resumeMod}','${resumeLesson.id}',${resumeIdx})">
    <div class="rc-icon">▶</div>
    <div class="rc-body">
      <strong>Continue where you left off</strong>
      <p>Module ${resumeMod} · Lesson ${resumeIdx+1}: ${resumeLesson.title}</p>
      <div class="rc-prog"><div class="rc-bar" style="width:${Math.round(done/tot*100)}%"></div></div>
      <span class="rc-label">${done} of ${tot} lessons done</span>
    </div>
    <div class="rc-arrow">→</div>
  </div>`;
}

function renderHome(){
  const cards = MO().map(k=>{
    const m=CD()[k], done=moduleCompletedCount(k), tot=m.lessons.length, pct=Math.round(done/tot*100);
    return `<div class="mp-card" onclick="openModule('${k}')">
      <div class="mp-ring">${ring(pct)}<div class="mp-letter">${k}</div></div>
      <div class="mp-body">
        <h3>${m.icon} ${m.title}</h3>
        <p>${tot} lessons · theory + Q&amp;A in each</p>
        <div class="mp-stat">${done===0?'Not started':done===tot?'Complete ✓':done+' of '+tot+' done'}</div>
      </div>
      <div class="mp-arrow">→</div>
    </div>`;
  }).join('');

  const howTo = state.completed.size===0 ? `
    <div class="hiw">
      <div class="hiw-card"><div class="hn">1</div><h4>Read the theory</h4><p>Focused summaries with key frameworks and exam tips from your source material.</p></div>
      <div class="hiw-card"><div class="hn">2</div><h4>Test yourself</h4><p>Click each question to reveal the model answer before you move on.</p></div>
      <div class="hiw-card"><div class="hn">3</div><h4>Progress saves</h4><p>Mark each lesson complete. Your place is saved — close and reopen any time.</p></div>
    </div>` : '';

  const resetBtn = state.completed.size>0 ? `
    <div style="text-align:center;margin-top:20px">
      <button class="btn-reset" onclick="confirmReset()">↺ Reset ${SUBJECTS[ACTIVE].label} progress</button>
    </div>` : '';

  return `<div class="home-wrap">
    ${resumeBadge()}
    ${howTo}
    <h3 style="margin:0 0 12px;color:var(--ink)">${SUBJECTS[ACTIVE].icon} ${SUBJECTS[ACTIVE].name} — Modules</h3>
    <div class="mp-list">${cards}</div>
    ${resetBtn}
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  RENDER: RAIL
// ═══════════════════════════════════════════════════════
function renderRail(){
  const mk=state.currentModule, m=CD()[mk], ls=m.lessons;
  const done=moduleCompletedCount(mk), pct=Math.round(done/ls.length*100);
  const items = ls.map((l,i)=>{
    const unlocked=isLessonUnlocked(mk,i), isDone=state.completed.has(l.id), isCurrent=l.id===state.currentLessonId;
    const cls='cp-item'+(isDone?' done':'')+(isCurrent?' current':'')+(!unlocked?' locked':'');
    const node=isDone?'✓':unlocked?(i+1):'🔒';
    const click=unlocked?`reviewLesson('${mk}','${l.id}',${i})`:'';
    return `<div class="${cls}" onclick="${click}">
      <div class="cp-node">${node}</div>
      <div class="cp-text">
        <div class="cp-title">${l.title}</div>
        <div class="cp-sub">${unlocked?isDone?'Completed ✓':'Lesson '+(i+1):'Locked'}</div>
      </div>
    </div>`;
  }).join('');

  return `<aside class="rail">
    <div class="rail-head">
      <div class="rh-ey">${SUBJECTS[ACTIVE].label} · Module ${mk}</div>
      <h2>${m.icon} ${m.title}</h2>
      <div class="rp-track"><div class="rp-fill" style="width:${pct}%"></div></div>
      <div class="rp-txt">${done} of ${ls.length} complete · auto-saved</div>
    </div>
    <div class="checkpoints">${items}</div>
    <div class="rail-foot">
      <button onclick="goHome()">← Module list</button>
      ${state.completed.size>0?`<button class="danger" onclick="confirmReset()">↺ Reset progress</button>`:''}
    </div>
  </aside>`;
}

// ═══════════════════════════════════════════════════════
//  RENDER: STAGE
// ═══════════════════════════════════════════════════════
function renderQA(lesson){
  return lesson.qa.map((item,i)=>{
    const key=lesson.id+'::'+i, open=state.qaOpen.has(key);
    return `<div class="qa-block${open?' open':''}" data-qk="${key}">
      <div class="qa-q" onclick="toggleQA('${key}')">
        <span class="qm">Q</span><span>${item.q}</span><span class="qch">▾</span>
      </div>
      <div class="qa-a"><div class="qa-a-in">${item.a}</div></div>
    </div>`;
  }).join('');
}

function renderStage(){
  const mk=state.currentModule, ls=moduleLessons(mk), idx=lessonIndex(mk,state.currentLessonId);
  const l=ls[idx], isDone=state.completed.has(l.id), isLast=idx===ls.length-1;
  const cta = isDone
    ? `<div class="complete-zone done-state">
        <div class="stamp-done"><span class="si">✓</span> Lesson complete — progress saved</div>
        <button class="btn-ghost" onclick="goNextFromReview()">${isLast?'Module summary →':'Next lesson →'}</button>
      </div>`
    : `<div class="complete-zone">
        <div class="cz-text"><strong>Finished this lesson?</strong><br>Mark complete to save and unlock the next.</div>
        <button class="btn-primary" onclick="markComplete()">${isLast?'🎉 Complete Module':'Mark Complete &amp; Continue →'}</button>
      </div>`;

  return `<main class="stage">
    <div class="lesson-ey">${SUBJECTS[ACTIVE].label} · Module ${mk} <span class="dot"></span> Lesson ${idx+1} of ${ls.length}</div>
    <h1 class="lesson-title">${l.icon} ${l.title}</h1>
    <div class="lesson-sub">${l.subtitle}</div>
    <div class="sec-label"><div class="sl-icon">📖</div><h3>Theory</h3></div>
    <div class="tc">${l.theory}</div>
    <div class="qa-divider"><div class="sec-label" style="margin:0"><div class="sl-icon">❓</div><h3>Practice Q&amp;A</h3></div></div>
    <div>${renderQA(l)}</div>
    <div id="ctaWrap">${cta}</div>
    <button class="nav-prev" onclick="prevLesson()" ${idx===0?'disabled':''}>← Previous lesson</button>
  </main>`;
}

// ═══════════════════════════════════════════════════════
//  RENDER: MODULE COMPLETE
// ═══════════════════════════════════════════════════════
function renderModComplete(){
  const mk=state.currentModule, m=CD()[mk];
  const i=MO().indexOf(mk), hasNext=i<MO().length-1;
  const nextMod=hasNext?CD()[MO()[i+1]]:null;
  return `<div class="mod-complete">
    <div class="mc-seal">🏅</div>
    <h2>Module ${mk} complete!</h2>
    <p>You've finished all ${m.lessons.length} lessons in <strong>${m.title}</strong>. Progress is saved — pick up any other subject from the tabs above.</p>
    <div class="mc-actions">
      <button class="btn-ghost" onclick="openModule('${mk}')">↻ Review module</button>
      ${hasNext
        ? `<button class="btn-primary" onclick="goNextModule()">Next: Module ${MO()[i+1]} — ${nextMod.title} →</button>`
        : `<button class="btn-primary" onclick="goHome()">🎓 Back to ${SUBJECTS[ACTIVE].label}</button>`}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
//  MASTER RENDER
// ═══════════════════════════════════════════════════════
function render(){
  const app = document.getElementById('app');
  if(!ACTIVE){
    app.innerHTML = renderLanding();
  } else if(state.view==='home'){
    app.innerHTML = renderHome();
  } else if(state.view==='module'){
    app.innerHTML = `<div class="module-layout">${renderRail()}${renderStage()}</div>`;
  } else if(state.view==='modcomplete'){
    app.innerHTML = renderModComplete();
  }
  updateBar();
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
updateAllBadges();
render();

</script>
</body>
</html>
