{"q":"Why is scenario planning more realistic than sensitivity analysis for multi-variable decisions?","a":"Sensitivity analysis changes <em>one variable at a time</em> while holding all others constant — unrealistic because in practice, variables are correlated. For example, if the economy enters recession, both sales volume and selling price may fall simultaneously while interest rates also change. Scenario planning constructs complete scenarios (e.g., 'base case,' 'economic recession,' 'competitor price war') where all relevant variables change together — providing a more realistic picture of the range of possible outcomes."}
]},
{"id":"b10","icon":"🌳","title":"Decision Trees — Preparation","subtitle":"Decision nodes · Chance nodes · Drawing conventions · Rollback technique · EV calculation",
"theory":"<h4>What is a Decision Tree?</h4><p>A decision tree provides a <strong>diagrammatic representation of a multi-stage decision</strong>, showing all possible decisions and outcomes. It is used to identify the most financially beneficial sequence of decisions using expected values.</p><h4>Key Symbols</h4><ul><li><strong>Square (□)</strong> — Decision node: a point where the organisation makes a choice. Draw branches for each option.</li><li><strong>Circle (○)</strong> — Chance/outcome node: a point where outcomes depend on probabilities beyond the decision maker's control. Show each outcome with its probability.</li></ul><h4>Four Steps to Prepare a Decision Tree</h4><div class='fw'><ol><li><strong>Identify all decisions</strong> that need to be made and prioritise them in logical order (left to right)</li><li><strong>Establish costs/benefits</strong> for each possible outcome and the probability of each outcome occurring</li><li><strong>Draw the decision tree</strong> from left to right using squares for decisions and circles for chance outcomes</li><li><strong>Evaluate by working backwards</strong> (right to left) — calculate EVs at each chance node; at decision nodes select the highest EV option</li></ol></div><div class='kbox'><strong>Rollback Technique</strong>Always evaluate a decision tree by working <em>right to left</em> (backwards from outcomes to initial decision). At each chance node: calculate the EV. At each decision node: select the highest EV branch and 'prune' (cross out) inferior options.</div>",
"qa":[
{"q":"What do decision nodes (squares) and chance nodes (circles) represent in a decision tree?","a":"<strong>Decision nodes (squares)</strong> represent points where the <em>organisation makes a deliberate choice</em> between two or more options — these are within the decision maker's control. <strong>Chance nodes (circles)</strong> represent points where the <em>outcome depends on external factors</em> beyond the decision maker's control — each branch shows a possible outcome with its associated probability."},
{"q":"Explain the 'rollback technique' for evaluating a decision tree.","a":"The rollback technique evaluates a decision tree by working <em>right to left</em> (from final outcomes back to the initial decision): (1) At each chance node: calculate the EV = Σ(probability × payoff) for all branches; (2) At each decision node: compare the EV of each option; select the option with the <strong>highest EV</strong>; 'prune' (cross out) inferior options; (3) Continue leftwards until reaching the initial decision node; the remaining path represents the optimal sequence of decisions."},
{"q":"What are the key limitations of decision trees?","a":"(1) <strong>Expected values may be inappropriate</strong> for one-off decisions — EV assumes many repetitions of the decision; (2) <strong>Probabilities are estimates</strong> — based on forecasts that may be inaccurate; (3) <strong>Costs and revenues are uncertain</strong> — forecasted values may not materialise; (4) <strong>Complexity</strong> — real-world decisions may have too many branches to represent clearly; (5) <strong>Risk attitude ignored</strong> — EV treats all outcomes equally regardless of their impact on the organisation's survival."}
]},
{"id":"b11","icon":"🔮","title":"Decision Trees — Value of Information","subtitle":"Perfect information · Imperfect information · EVPI · EVII calculation",
"theory":"<h4>Perfect vs Imperfect Information</h4><ul><li><strong>Perfect information</strong> — 100% accurate; tells you exactly which outcome will occur before the decision is made. Eliminates all uncertainty. Theoretical benchmark only.</li><li><strong>Imperfect information</strong> — Usually correct but can be wrong. More realistic — e.g., market research, pilot studies, expert forecasts.</li></ul><h4>Expected Value of Perfect Information (EVPI)</h4><p>The maximum amount an organisation should pay to obtain information that is 100% accurate about which state of nature will occur.</p><div class='fw'><strong>EVPI = EV with perfect information − EV without perfect information</strong><br><br>EV with perfect information = Σ (probability of state × best payoff in that state)<br>EV without = the highest EV using the decision tree without additional information</div><h4>Expected Value of Imperfect Information (EVII)</h4><p>Since perfect information is rarely available, imperfect information (e.g., market research) is more common. EVII calculates how much the imperfect information improves decision quality.</p><p>The organisation should pay for additional information only if: <strong>cost of information &lt; improvement in EV achieved</strong>.</p><div class='kbox'><strong>Key Rule</strong>EVPI sets the maximum price worth paying for any information. EVII (always ≤ EVPI) sets the maximum price worth paying for specific imperfect information. If the market research supplier quotes a fee above EVII, decline.</div>",
"qa":[
{"q":"What is the Expected Value of Perfect Information (EVPI) and how is it calculated?","a":"EVPI is the <strong>maximum</strong> a decision maker would pay for perfectly accurate information about which state of nature will occur.<br>EVPI = EV with perfect information − EV without perfect information<br>EV with perfect information = Σ (probability of state × best payoff achievable in that state). This represents what the organisation would earn if it could always choose the optimal strategy knowing the future with certainty."},
{"q":"A project decision: if Market Grows (p=0.6), best payoff is $500k; if Market Declines (p=0.4), best payoff is $100k. EV without perfect information = $280k. Calculate EVPI.","a":"EV with perfect information = (0.6 × $500k) + (0.4 × $100k) = $300k + $40k = $340k<br>EVPI = $340k − $280k = <strong>$60,000</strong><br>The organisation should pay no more than $60,000 for perfectly accurate market information."},
{"q":"If a market research firm charges $50,000 and their information will improve the EV of decisions by $35,000, should the organisation purchase the research?","a":"No. The EVII = $35,000 (the improvement in EV from the information). Since the cost of the information ($50,000) <em>exceeds</em> the benefit ($35,000), the information is not worth purchasing. A net value of −$15,000 would result from purchasing the research."}
]},
{"id":"b12","icon":"📉","title":"Sensitivity Analysis — NPV Applications","subtitle":"NPV sensitivity · Percentage change formula · Variable prioritisation · Limitations",
"theory":"<h4>Sensitivity Analysis Applied to NPV</h4><p>Sensitivity analysis is most commonly applied using NPV as the appraisal method. The question asked is: <em>'By what percentage can this variable change before I would change my decision (i.e., NPV falls to zero)?'</em></p><div class='fw'><strong>Sensitivity (%) = NPV ÷ PV of the variable × 100</strong></div><h4>Interpreting Sensitivity Results</h4><ul><li>A <strong>small percentage</strong> (e.g., 2%): the project is highly sensitive to this variable — small adverse changes could make it unviable. <strong>High risk.</strong></li><li>A <strong>large percentage</strong> (e.g., 70%): the project is relatively insensitive to this variable — a very large change would be needed to eliminate the NPV. <strong>Lower risk.</strong></li></ul><h4>Common Variables Tested</h4><ul><li>Sales volume (number of units)</li><li>Selling price</li><li>Variable cost per unit</li><li>Fixed costs</li><li>Discount rate / cost of capital</li><li>Project life</li></ul><h4>Limitations</h4><ul><li>Only considers <em>one variable at a time</em> — unrealistic (multiple variables change simultaneously in practice)</li><li>Does not assign probabilities to changes — cannot assess likelihood of variable changing</li><li>Does not account for correlations between variables</li></ul>",
"qa":[
{"q":"A project has NPV $120k. PV of sales revenue = $1,800k. PV of variable costs = $900k. PV of fixed costs = $480k. Calculate the sensitivity to each.","a":"<strong>Sensitivity to sales revenue</strong> = $120k ÷ $1,800k = <strong>6.7%</strong><br><strong>Sensitivity to variable costs</strong> = $120k ÷ $900k = <strong>13.3%</strong><br><strong>Sensitivity to fixed costs</strong> = $120k ÷ $480k = <strong>25%</strong><br>Sales revenue is the highest-risk variable (lowest sensitivity %) — only needs to fall by 6.7% to eliminate the NPV. Management should focus attention here."},
{"q":"What does a sensitivity percentage of 5% for selling price indicate?","a":"The selling price only needs to fall by 5% from its forecast level before the NPV of the project becomes zero. This indicates <strong>very high sensitivity</strong> to selling price — the project is highly risky in relation to price. Management should investigate: How certain is the selling price forecast? Is the market price volatile? Could competition reduce prices? A 5% price reduction may well occur in a competitive market, making this a critical risk factor."},
{"q":"What are the main limitations of sensitivity analysis?","a":"(1) <strong>One variable at a time</strong> — unrealistic as variables are correlated; (2) <strong>No probabilities</strong> — tells you what change would eliminate NPV but not how likely that change is; (3) <strong>No interaction effects</strong> — cannot model scenarios where multiple adverse changes occur simultaneously; (4) <strong>Qualitative judgement still required</strong> — whether a 20% sensitivity is acceptably safe depends on management's knowledge of market conditions."}
]},
{"id":"b13","icon":"🗺️","title":"TARA Framework","subtitle":"Transfer · Accept · Reduce · Avoid · Risk mapping · Impact vs probability",
"theory":"<h4>The TARA Risk Response Framework</h4><p>Once risks are identified and assessed (using probability × impact), the TARA framework determines the appropriate risk management response. Each risk is mapped based on its <strong>probability of occurrence</strong> (horizontal axis) and <strong>impact if it occurs</strong> (vertical axis).</p><table class='tbl'><tr><th>Response</th><th>When to use</th><th>Example</th></tr><tr><td><strong>Transfer</strong></td><td>High impact, Low probability</td><td>Insurance; joint ventures; outsourcing; franchising</td></tr><tr><td><strong>Accept</strong></td><td>Low impact, Low probability</td><td>Minor operational risks within normal business tolerance</td></tr><tr><td><strong>Reduce</strong></td><td>Low impact, High probability</td><td>Internal controls; hedging; process improvements</td></tr><tr><td><strong>Avoid</strong></td><td>High impact, High probability</td><td>Withdraw from the activity; do not proceed with risky project</td></tr></table><div class='kbox'><strong>TARA Risk Map</strong>Plot risks on a 2×2 matrix: High/Low Impact (vertical) × High/Low Probability (horizontal). The quadrant determines the TARA response. Multiple responses may be appropriate for complex risks, and classifications should be reviewed regularly.</div><h4>Risk Management Tools Used Alongside TARA</h4><ul><li>Business risk models — identify risk sources (strategic, operational, compliance, product, reputational)</li><li>Information systems — gather data to better understand risks</li><li>Probabilistic models — quantify the significance of identified risks</li></ul>",
"qa":[
{"q":"Name the four TARA responses and the risk map position that triggers each.","a":"<strong>Transfer</strong>: High impact, Low probability — transfer the financial consequence to a third party (insurance, joint venture).<br><strong>Avoid</strong>: High impact, High probability — the risk cannot be managed to an acceptable level; do not proceed with the activity.<br><strong>Reduce</strong>: Low impact, High probability — implement controls to reduce frequency or severity (internal controls, hedging).<br><strong>Accept</strong>: Low impact, Low probability — the risk is insignificant; accept it and monitor."},
{"q":"Give an example of 'transferring' a risk and explain how this works.","a":"Example: A manufacturing company has a significant risk of fire destroying its warehouse (high impact, low probability). The company <em>transfers</em> the financial consequence by purchasing <strong>building and stock insurance</strong>. If a fire occurs, the insurer pays for the loss rather than the company absorbing it directly. The company still faces the operational disruption (which cannot be fully transferred) but its financial exposure is capped by the insurance payout."},
{"q":"Why might a risk initially classified as 'reduce' need to be reclassified as 'avoid'?","a":"Risk classifications should be reviewed regularly because: (1) The <em>probability</em> of a risk may increase (e.g., a competitor launches a similar product, increasing the probability of market share loss significantly); (2) The <em>impact</em> may increase (e.g., regulatory penalties increase); (3) <em>Reducing</em> the risk may prove ineffective — internal controls implemented do not reduce the probability to an acceptable level. If probability and impact both rise to 'high,' the risk should be reclassified to 'avoid.'"}
]},
{"id":"b14","icon":"🌫️","title":"Conditions of Uncertainty","subtitle":"TARA application · Risk management process · Adjusting strategies · Scenario evaluation",
"theory":"<h4>Managing Under Uncertainty</h4><p>Uncertainty is unquantifiable — outcomes cannot be predicted using probabilities. This makes it fundamentally different from risk and requires different management approaches. No two organisations face exactly the same uncertainties, requiring management expertise and experience to develop appropriate strategies.</p><h4>The Risk/Uncertainty Management Process</h4><div class='fw'><ol><li><strong>Identify</strong> the risks and uncertainties faced</li><li><strong>Assess</strong> impact and probability of identified risks</li><li><strong>Develop strategies</strong> using the TARA framework</li><li><strong>Review and adjust</strong> strategies as new information emerges or conditions change</li></ol></div><h4>Reviewing TARA Responses</h4><p>TARA responses may need adjustment when:</p><ul><li>Risks are incorrectly categorised due to estimation errors</li><li>Circumstances change (market conditions, regulation, competition)</li><li>A 'reduce' response proves insufficient — risk remains too high</li><li>Management experience suggests an alternative response is more effective</li></ul><h4>Evaluating New Projects Under Uncertainty</h4><p>When evaluating a project with many risks under uncertainty: assess the overall feasibility considering all risks together (not each in isolation); determine whether the aggregate risk profile is within the organisation's risk appetite; use scenario planning rather than just EV where probabilities are highly uncertain.</p><div class='kbox'><strong>Key Principle</strong>Risk management is an ongoing process, not a one-time exercise. Strategies must be continuously monitored and adjusted as the risk environment evolves.</div>",
"qa":[
{"q":"What is the difference between risk and uncertainty in the context of decision-making?","a":"<strong>Risk</strong> is quantifiable — the possible outcomes and their probabilities can be estimated from historical data or expert judgement. Decision tools like EV, sensitivity analysis, and decision trees can be applied. <strong>Uncertainty</strong> is unquantifiable — outcomes are unknown and probabilities cannot be assigned. It requires judgement, scenario planning, and flexibility. Uncertainty is more common in novel situations where no historical data exists."},
{"q":"Why might TARA risk responses need to be adjusted after initial classification?","a":"(1) Risks may be <em>incorrectly categorised</em> initially due to incomplete information; (2) <em>Circumstances change</em> — new competition, regulation, or economic conditions shift probability or impact; (3) <em>Controls prove ineffective</em> — a 'reduce' response may not achieve sufficient reduction, requiring escalation to 'avoid'; (4) <em>Management experience</em> reveals better alternatives not initially considered. TARA is a framework requiring continuous review, not a one-time categorisation exercise."},
{"q":"When assessing a project with multiple high-impact risks, why should the overall risk profile be evaluated rather than each risk in isolation?","a":"Individual risks that appear manageable in isolation may collectively create an unacceptable aggregate risk. For example, three separately 'acceptable' risks — each with a 20% probability of causing a $200k loss — could simultaneously materialise, creating a $600k loss that exceeds the organisation's risk capacity. Evaluating the overall risk profile ensures the aggregate probability of adverse outcomes and total potential exposure is within the organisation's risk appetite."}
]}
]},
"C":{"title":"Organisational Performance","icon":"📊","lessons":[
{"id":"c1","icon":"🏛️","title":"Cost, Profit, Revenue and Investment Centres","subtitle":"Responsibility centres · Four types · Controllability principle · Divisional structures",
"theory":"<h4>Responsibility Centres</h4><p>A responsibility centre is a subunit of an organisation for which separate performance reports are prepared. Divisional managers should only be assessed on factors <em>within their control</em>. There are four types:</p><table class='tbl'><tr><th>Type</th><th>Responsible for</th><th>Performance measure</th></tr><tr><td><strong>Cost centre</strong></td><td>Costs only; produces goods/services but has no revenue responsibility</td><td>Variances from budget; cost per unit</td></tr><tr><td><strong>Revenue centre</strong></td><td>Revenue only; sells but does not control costs</td><td>Sales volume and value variances</td></tr><tr><td><strong>Profit centre</strong></td><td>Both costs and revenues; does not control capital investment</td><td>Profit; contribution; profit margin</td></tr><tr><td><strong>Investment centre</strong></td><td>Costs, revenues, and capital investment decisions</td><td>ROI; RI; ROCE</td></tr></table><div class='kbox'><strong>Controllability Principle</strong>Divisional managers should only be assessed on costs/revenues within their control. Uncontrollable costs (e.g., head office recharges, shared service allocations) should be excluded from performance evaluation to prevent demotivation and dysfunctional behaviour.</div><h4>Investment Centre Metrics</h4><ul><li><strong>Return on Investment (ROI)</strong> = Profit ÷ Capital employed × 100%</li><li><strong>Residual Income (RI)</strong> = Profit − (Capital employed × Cost of capital)</li></ul>",
"qa":[
{"q":"Distinguish between cost centres, profit centres, and investment centres.","a":"<strong>Cost centre</strong>: Only responsible for the costs it incurs; no revenue responsibility. Assessed on cost variances and cost per unit.<br><strong>Profit centre</strong>: Responsible for both costs and revenues, but not capital investment decisions. Assessed on profit, contribution, and margins.<br><strong>Investment centre</strong>: Responsible for costs, revenues, AND capital investment decisions. Assessed on ROI, RI, and ROCE — the most comprehensive form of responsibility."},
{"q":"Why should uncontrollable costs be excluded from divisional performance reports?","a":"If divisional managers are assessed on costs they cannot influence (e.g., head office recharges, shared IT costs, group-level insurance), they become demotivated and confused about what they are actually being held accountable for. This can lead to dysfunctional behaviour — e.g., focusing on minimising allocated overheads rather than improving actual divisional performance. The controllability principle ensures performance assessment is fair and motivational."},
{"q":"Calculate ROI and RI for a division with: profit $80k, capital employed $500k, cost of capital 12%.","a":"<strong>ROI</strong> = $80k ÷ $500k × 100% = <strong>16%</strong><br><strong>RI</strong> = $80k − ($500k × 12%) = $80k − $60k = <strong>$20,000</strong><br>A positive RI indicates the division earns more than the required return on its capital. ROI of 16% exceeds the 12% cost of capital — the division is creating value."},
{"q":"A manager considering a new investment with ROI 14% may reject it even if the company's cost of capital is 12%. Explain this conflict.","a":"The divisional manager's <em>personal ROI</em> is currently 16%. Accepting a new investment with ROI 14% would pull the division's average ROI down toward 15% — making the manager's performance look worse. However, from the <em>group's perspective</em>, the investment returns 14% against a 12% cost of capital, creating value (RI would be positive). This is a classic <strong>goal congruence failure</strong> — the ROI metric incentivises the manager to reject a value-creating investment."}
]},
{"id":"c2","icon":"📋","title":"Performance Reports","subtitle":"Balanced scorecard reporting · KPIs · Data analytics · Fairness and transparency",
"theory":"<h4>Effective Performance Reporting</h4><p>Performance reports enable organisations to regularly monitor divisional performance and identify issues requiring improvement. They must be based on clear, relevant, and fair performance indicators — combining financial and non-financial measures.</p><h4>Key Characteristics of Good Performance Reports</h4><ul><li><strong>Fairness and transparency:</strong> Divisional managers must understand the basis of assessment before implementation</li><li><strong>Relevant indicators:</strong> Focus on key issues specific to each division's success factors</li><li><strong>Balance:</strong> Combine financial (profit, ROCE) and non-financial indicators (customer satisfaction, defect rates)</li><li><strong>Avoid incentivising dysfunctional behaviour:</strong> Watch for arbitrary cost allocations; uncontrollable cost inclusions; excessive short-term focus</li></ul><h4>Data Analytics in Performance Reporting</h4><p>Four types of analytics support performance reporting:</p><table class='tbl'><tr><th>Type</th><th>Question answered</th></tr><tr><td><strong>Descriptive</strong></td><td>What has happened? (Historical reports)</td></tr><tr><td><strong>Diagnostic</strong></td><td>Why did it happen? (Root cause analysis)</td></tr><tr><td><strong>Predictive</strong></td><td>What might happen? (Forecasts and models)</td></tr><tr><td><strong>Prescriptive</strong></td><td>What should we do? (Decision recommendations)</td></tr></table><div class='kbox'><strong>Report Visualisation</strong>Charts, tables, and heat maps help users quickly understand complex relationships in data. Effective visualisation allows decision-makers to see performance at a glance rather than analysing raw numbers.</div>",
"qa":[
{"q":"What are the key characteristics of effective divisional performance reports?","a":"(1) <strong>Fairness and transparency</strong> — managers understand and accept the basis of assessment; (2) <strong>Relevance</strong> — indicators linked to each division's key success factors; (3) <strong>Balance</strong> — combines financial and non-financial measures; (4) <strong>Avoids dysfunctional behaviour</strong> — excludes uncontrollable costs; doesn't over-emphasise short-term metrics; (5) <strong>Participative development</strong> — where possible, managers involved in setting indicators (within limits to prevent bias)."},
{"q":"Name the four types of data analytics and give an example of each in a performance reporting context.","a":"(1) <strong>Descriptive</strong> — 'Revenue fell 8% vs last year' (what happened); (2) <strong>Diagnostic</strong> — 'Revenue fell because our largest customer switched to a competitor' (why it happened); (3) <strong>Predictive</strong> — 'Based on current trends, Q3 revenue will be 12% below target' (what will happen); (4) <strong>Prescriptive</strong> — 'To recover Q3 revenue: launch a promotional campaign targeting segment X' (what to do about it)."},
{"q":"What problems can arise when divisional managers are involved in setting their own performance targets?","a":"When divisional managers participate in setting their own targets, there is a risk of: (1) <strong>Budget padding/sandbagging</strong> — deliberately setting undemanding targets to make achievement easier and secure bonuses; (2) <strong>Pseudo-participation</strong> — manager input is sought but then ignored, creating resentment; (3) <strong>Bias</strong> — managers may focus targets on areas where they are already strong. On the positive side, participation improves realism (managers know local conditions) and motivation (ownership of targets)."}
]},
{"id":"c3","icon":"🧠","title":"Behavioural Issues with Responsibility Centres","subtitle":"Goal congruence · Short-termism · Budget padding · Dysfunctional behaviour",
"theory":"<h4>Why Decentralisation Creates Behavioural Risks</h4><p>Giving divisional managers autonomy is beneficial (speed of decisions, local knowledge, development of managers) but can lead to dysfunctional behaviour if performance measures are poorly designed.</p><h4>Four Key Behavioural Problems</h4><div class='fw'><strong>1. Lack of Goal Congruence</strong><br>Divisional managers make decisions in the division's best interest rather than the organisation's. Example: a division rejects a profitable project because it would reduce its ROI metric, even though the group ROI would increase.</div><div class='fw'><strong>2. Short-termism</strong><br>Managers make decisions to achieve short-term measures (current period profit) rather than long-term strategic goals. Example: cutting maintenance expenditure to boost this year's profit, knowing it will cause expensive breakdowns next year.</div><div class='fw'><strong>3. Restricted Growth</strong><br>Divisions refuse to invest in projects that hurt their performance metrics but benefit the group overall.</div><div class='fw'><strong>4. Demotivation</strong><br>Managers assessed on factors outside their control become demoralised and disengage from the performance improvement process.</div><h4>Budget Approaches and Their Risks</h4><ul><li><strong>Top-down (imposed) budgets:</strong> Demotivational; may be unrealistic; managers disown them</li><li><strong>Bottom-up (participative) budgets:</strong> Better buy-in; more realistic; risk of budget padding/pseudo-participation</li></ul>",
"qa":[
{"q":"What is 'goal congruence' and why is it difficult to achieve in decentralised organisations?","a":"Goal congruence means divisional managers' decisions are aligned with the overall objectives of the organisation. It is difficult to achieve because divisional managers are typically assessed on divisional metrics (divisional ROI, divisional profit) which may conflict with group-level objectives. A manager maximising their own division's profit may reject group-beneficial projects, refuse to transfer goods to another division at a fair price, or cut costs in ways that harm other divisions."},
{"q":"Give two examples of short-termism in divisional management.","a":"(1) <strong>Cutting the training budget</strong> to improve this year's divisional profit — the short-term saving damages long-term productivity and staff quality; (2) <strong>Deferring essential asset maintenance</strong> — reducing costs this period but increasing the risk of costly breakdowns and reduced asset lives in future periods. Short-termism often arises when managers are assessed and rewarded on annual financial targets without any long-term performance component."},
{"q":"What is 'budget padding' and what conditions encourage it?","a":"Budget padding (sandbagging) is the deliberate inclusion of excess costs or understated revenues in a budget to create an <em>easy-to-achieve target</em>, particularly when financial bonuses are attached to meeting the budget. Conditions that encourage it: large bonuses tied to meeting budget; inadequate scrutiny of budget submissions; managers not held accountable for forecast accuracy; a culture where 'beating the budget' is celebrated regardless of absolute performance level."}
]},
{"id":"c4","icon":"📈","title":"Key Financial Metrics","subtitle":"ROI · RI · ROCE · EVA · Profit centre ratios · Working capital management",
"theory":"<h4>Investment Centre Performance Metrics</h4><table class='tbl'><tr><th>Metric</th><th>Formula</th><th>Decision rule</th></tr><tr><td><strong>ROI</strong></td><td>Divisional profit ÷ Capital employed × 100%</td><td>Accept if ROI &gt; cost of capital</td></tr><tr><td><strong>RI (Residual Income)</strong></td><td>Divisional profit − (Capital employed × Cost of capital)</td><td>Accept if RI &gt; 0</td></tr><tr><td><strong>EVA</strong></td><td>NOPAT − (WACC × Capital)</td><td>Accept if EVA &gt; 0</td></tr></table><h4>ROI vs RI — The Key Difference</h4><p><strong>ROI problem:</strong> A manager with high existing ROI (e.g., 20%) will reject a new investment with ROI 15% even if the cost of capital is 10%. ROI incentivises rejecting value-creating investments if they dilute the average.</p><p><strong>RI solution:</strong> The same new investment with RI = profit − (capital × 10%) will be positive — so the manager is incentivised to accept it. RI is more consistent with goal congruence.</p><h4>Profit Centre Financial Ratios</h4><ul><li>Gross profit margin; operating profit margin; net profit margin</li><li>Current ratio; quick ratio (acid test)</li><li>Receivables days; payables days; inventory days</li><li>Asset turnover (Revenue ÷ Total assets)</li></ul><div class='kbox'><strong>EVA (Economic Value Added)</strong>EVA = NOPAT (Net Operating Profit After Tax) − (WACC × Capital employed). Adjustments are made to accounting profit to better reflect economic reality (e.g., add back R&amp;D capitalised, adjust for goodwill amortisation). EVA is a more sophisticated version of RI.</div>",
"qa":[
{"q":"Why does RI better incentivise goal congruence than ROI for investment decisions?","a":"<strong>ROI</strong>: A manager with current ROI of 20% will reject a new investment returning 15% ROI (above the 12% cost of capital) because it lowers the average divisional ROI — reducing the manager's performance metric.<br><strong>RI</strong>: The same new investment produces a positive RI (profit exceeds the capital charge of 12%) — so the manager is incentivised to accept it. RI aligns divisional manager decisions with group value creation: accept any investment where return exceeds cost of capital."},
{"q":"Calculate ROI and RI for two investments: Division X (profit $60k, capital $300k) and Division Y (profit $100k, capital $800k). Cost of capital = 10%.","a":"<strong>Division X:</strong> ROI = 60/300 = 20%; RI = 60 − (300 × 10%) = 60 − 30 = $30k<br><strong>Division Y:</strong> ROI = 100/800 = 12.5%; RI = 100 − (800 × 10%) = 100 − 80 = $20k<br>Division X has higher ROI and higher RI. However, Division Y still earns above the cost of capital (positive RI) — so both create value, just to different degrees."},
{"q":"What is EVA and how does it differ from standard Residual Income?","a":"EVA (Economic Value Added) = NOPAT − (WACC × Capital employed). It is conceptually similar to RI but with two key differences: (1) <em>NOPAT</em> (Net Operating Profit After Tax) replaces accounting profit — it adjusts for non-cash charges and accounting policy choices to better reflect true economic performance; (2) Multiple accounting adjustments are made to capital and profit (e.g., capitalising R&amp;D, reversing goodwill amortisation) to reflect economic reality. EVA is more sophisticated but more complex to calculate."}
]},
{"id":"c5","icon":"🏆","title":"Benchmarking","subtitle":"Internal vs external · Competitive · Strategic · Functional benchmarking",
"theory":"<h4>What is Benchmarking?</h4><p>Benchmarking involves the regular measurement of activities against their best-performing equivalents — internally or externally — to identify performance gaps and improvement opportunities.</p><h4>Internal Benchmarking</h4><ul><li>Compare divisions/departments within the same organisation</li><li>Best practice in one division is identified and rolled out to others</li><li>Most useful when divisions operate in similar markets and under similar conditions</li><li>May be difficult when divisions operate in very different sectors or life cycle stages</li></ul><h4>External Benchmarking — Three Approaches</h4><table class='tbl'><tr><th>Type</th><th>Description</th></tr><tr><td><strong>Competitive</strong></td><td>Compare against direct competitors in the same market; hardest to get data; most directly relevant</td></tr><tr><td><strong>Strategic</strong></td><td>Compare against organisations with similar strategic challenges (even in different industries)</td></tr><tr><td><strong>Functional</strong></td><td>Compare specific business functions (e.g., procurement, HR) against best-in-class regardless of industry</td></tr></table><div class='kbox'><strong>Benchmarking Progression</strong>Start internally: implement best practices across divisions → Then expand to competitive benchmarking: compare against sector peers → Then functional benchmarking: identify best-in-class globally for specific processes. Each level provides a more challenging performance target.</div>",
"qa":[
{"q":"Distinguish between internal and external benchmarking.","a":"<strong>Internal benchmarking</strong>: Compares performance between divisions or departments within the same organisation. Identifies best internal practices and spreads them. Limited by the organisation's own performance ceiling — cannot identify whether the whole organisation is competitive.<br><strong>External benchmarking</strong>: Compares against other organisations (competitors, best-in-class companies). More challenging to obtain data but reveals whether the organisation is competitive in absolute terms. More aspirational and potentially transformational."},
{"q":"Name the three types of external benchmarking and explain when each is appropriate.","a":"(1) <strong>Competitive</strong>: Compare against direct competitors — most relevant but hardest to obtain data; used when understanding relative competitive position is critical. (2) <strong>Strategic</strong>: Compare against organisations facing similar strategic challenges in different industries — useful when no direct competitor data is available or to learn from different sectors. (3) <strong>Functional</strong>: Compare a specific business function (e.g., supply chain, procurement) against the global best-in-class for that function — regardless of industry."},
{"q":"Why might internal benchmarking be unhelpful when comparing two divisions of a diversified organisation?","a":"If two divisions operate in very different industries or at different stages of their product life cycle, comparisons become meaningless: (1) Revenue growth rates differ naturally — a new product launch division will have high growth; a mature division will not; (2) Capital requirements differ significantly; (3) Market conditions are incomparable. Benchmarking only adds value when like is compared with like. Internal benchmarking works best within divisions operating under similar conditions."}
]},
{"id":"c6","icon":"🔢","title":"Reporting by Dimension","subtitle":"Segment · Channel · Product · Customer type · Multi-dimensional analysis",
"theory":"<h4>Why Report by Dimension?</h4><p>Overall organisational performance metrics mask significant variation between different segments, channels, products, or customer types. Reporting by dimension reveals <em>where</em> performance is strong or weak, enabling targeted management action.</p><h4>Four Key Dimensions</h4><table class='tbl'><tr><th>Dimension</th><th>What it reveals</th></tr><tr><td><strong>By segment</strong></td><td>Which divisions, departments, or geographies are performing well/poorly</td></tr><tr><td><strong>By channel</strong></td><td>Which distribution channels (online, retail, wholesale) generate the most value</td></tr><tr><td><strong>By product</strong></td><td>Which products/product lines are most/least profitable — enables product mix decisions</td></tr><tr><td><strong>By customer type</strong></td><td>Which customer segments generate most revenue/profit — enables customer relationship management</td></tr></table><h4>Financial and Non-Financial Dimensions</h4><ul><li><strong>Financial:</strong> Profit margins by segment; revenue growth by channel; cost per unit by product</li><li><strong>Non-financial:</strong> Customer satisfaction scores by product; defect rates by manufacturing site; employee turnover by division</li></ul><div class='kbox'><strong>Benefit of Multi-Dimensional Analysis</strong>The same data point viewed from multiple dimensions can reveal different insights. For example, an online channel that appears unprofitable when viewed by channel may be cross-subsidising high-value customers who also buy in-store — visible only when analysed by channel and customer simultaneously.</div>",
"qa":[
{"q":"What are the four key dimensions used in performance reporting and what does each reveal?","a":"(1) <strong>By segment</strong> — which divisions/departments/geographies perform best; (2) <strong>By channel</strong> — which distribution channels (online, retail, wholesale, direct) generate most value; (3) <strong>By product</strong> — which products/lines are most profitable; enables mix decisions; (4) <strong>By customer type</strong> — which customer segments generate most revenue/profit; enables targeted relationship management."},
{"q":"Why is overall organisational reporting insufficient without dimensional analysis?","a":"Overall reporting presents averages and totals that hide significant variation. A company may report acceptable overall profitability while: one division is highly profitable masking another that is loss-making; one channel is generating losses that are hidden by another's strong performance; one product subsidises several unprofitable lines. Without dimensional analysis, management cannot identify where to focus improvement efforts or allocate resources most effectively."}
]},
{"id":"c7","icon":"📌","title":"Non-Financial Performance Indicators","subtitle":"Limitations of financial measures · NFPI types · Inputs · Processes · Outputs · Customer measures",
"theory":"<h4>Limitations of Financial Performance Indicators</h4><ul><li>Encourage short-term decision-making</li><li>Distorted by accounting policy choices (depreciation method, provisioning)</li><li>Historical data — issues identified only after the damage is done</li><li>Miss important non-financial drivers of future success</li></ul><h4>Why NFPIs Add Value</h4><p>Non-financial performance indicators (NFPIs) are forward-looking — identifying problems early before they show up in financial results. Example: a fall in customer satisfaction scores predicts a future fall in revenue, allowing earlier corrective action.</p><h4>Types of NFPIs by Activity Area</h4><table class='tbl'><tr><th>Area</th><th>Example NFPIs</th></tr><tr><td><strong>Inputs</strong></td><td>Number of late supplier deliveries; raw material reject rates; supplier quality scores</td></tr><tr><td><strong>Production/Operations</strong></td><td>Defect rates; machine downtime; wastage %; capacity utilisation</td></tr><tr><td><strong>Outputs</strong></td><td>Customer returns %; on-time delivery %; order fulfilment rate</td></tr><tr><td><strong>Customer</strong></td><td>Customer satisfaction scores; repeat purchase rate; market share; complaints per 1,000 customers</td></tr><tr><td><strong>HR</strong></td><td>Staff turnover; absenteeism; training hours per employee</td></tr></table><div class='kbox'><strong>Key Principle</strong>NFPIs should be: linked to the organisation's long-term strategic objectives; easy to understand and measure; not too numerous (focus on the critical few); reviewed regularly to ensure they remain relevant as strategy evolves.</div>",
"qa":[
{"q":"What are the main limitations of using financial performance indicators as the sole measure of performance?","a":"(1) <strong>Short-termism</strong> — encourage decisions that boost immediate financial results at the expense of long-term sustainability; (2) <strong>Distorted by accounting policies</strong> — depreciation rates, provisioning, and revenue timing affect profit figures; (3) <strong>Historical</strong> — reveal problems only after they have occurred and their financial impact is already embedded; (4) <strong>Incomplete</strong> — fail to capture critical non-financial drivers of future success (customer loyalty, staff capability, innovation pipeline)."},
{"q":"Give three examples of NFPIs and explain how each provides an early warning of future financial performance.","a":"(1) <strong>Customer satisfaction score</strong>: A fall signals dissatisfied customers likely to defect, predicting future revenue decline; (2) <strong>Staff turnover rate</strong>: Rising turnover signals deteriorating culture/management, predicting future productivity falls and recruitment costs; (3) <strong>Defect rate</strong>: Increasing defects predict future external failure costs (warranty claims, product returns) and reputational damage."},
{"q":"Why should NFPIs be linked to the organisation's long-term strategic objectives?","a":"NFPIs should measure what <em>matters most</em> for achieving strategy. If the strategy is premium quality, measure: defect rates, return rates, customer satisfaction. If the strategy is lowest cost, measure: cost per unit, waste rates, process efficiency. Without strategic linkage, NFPIs may focus on easily measurable but strategically irrelevant metrics — consuming management attention without improving performance."}
]},
{"id":"c8","icon":"🎯","title":"Balanced Scorecard","subtitle":"Four perspectives · Strategy mapping · KPI linkage · Kaplan and Norton",
"theory":"<h4>What is the Balanced Scorecard?</h4><p>The Balanced Scorecard (BSC), developed by Kaplan and Norton, is a strategic planning and management system that measures and monitors progress toward strategic objectives using both financial and non-financial indicators across <strong>four perspectives</strong>.</p><h4>The Four BSC Perspectives</h4><table class='tbl'><tr><th>Perspective</th><th>Key question</th><th>Example measures</th></tr><tr><td><strong>Financial</strong></td><td>How should we look to our shareholders?</td><td>Revenue growth; ROCE; profit margin; EPS</td></tr><tr><td><strong>Customer</strong></td><td>How should we appear to our customers?</td><td>Customer satisfaction; retention rate; market share; on-time delivery</td></tr><tr><td><strong>Internal Business Processes</strong></td><td>What internal processes must we excel at?</td><td>Defect rates; process cycle times; capacity utilisation; new product introduction time</td></tr><tr><td><strong>Learning &amp; Growth</strong></td><td>Can we continue to improve and create value?</td><td>Employee training hours; staff turnover; R&amp;D investment; innovation pipeline</td></tr></table><h4>Strategy Mapping</h4><p>The four perspectives are causally linked: <em>Learning &amp; Growth</em> enables improvement in <em>Internal Processes</em>, which drives <em>Customer</em> satisfaction, which ultimately delivers <em>Financial</em> results. A strategy map makes these causal links explicit.</p><div class='kbox'><strong>Benefit of the BSC</strong>Prevents short-termism by balancing financial metrics with leading indicators (customer, process, learning) that drive future financial performance. It aligns all organisational activities with the strategic vision.</div>",
"qa":[
{"q":"Name the four perspectives of the Balanced Scorecard and give two KPIs for each.","a":"<strong>Financial:</strong> ROCE; revenue growth rate<br><strong>Customer:</strong> Customer satisfaction score; customer retention rate<br><strong>Internal Business Processes:</strong> Defect rate (%); process cycle time<br><strong>Learning &amp; Growth:</strong> Average training hours per employee; employee satisfaction score"},
{"q":"Explain the causal linkage between the four BSC perspectives.","a":"The perspectives form a cause-and-effect chain: <strong>Learning &amp; Growth</strong> (investing in people and systems) enables improvement in → <strong>Internal Processes</strong> (efficient, quality processes) which → improves <strong>Customer</strong> outcomes (satisfied, loyal customers) which → delivers strong <strong>Financial</strong> performance (revenue, profit, shareholder value). This means financial results are lagging indicators — leading indicators in the other three perspectives predict future financial performance."},
{"q":"How does the Balanced Scorecard prevent short-termism?","a":"Financial metrics alone encourage decisions that boost immediate results (cutting training, deferring maintenance) at the expense of long-term capability. The BSC prevents this by also measuring: <strong>Learning &amp; Growth</strong> (reduced training investment shows up as a red flag immediately, not years later); <strong>Internal Processes</strong> (deferred maintenance shows up in increasing defect rates); <strong>Customer</strong> (dissatisfied customers register immediately in customer metrics). Managers cannot sacrifice long-term capability for short-term profit without it showing in the BSC."}
]},
{"id":"c9","icon":"💱","title":"Transfer Pricing and Motivation of Divisional Managers","subtitle":"What is a transfer price · Capacity considerations · Goal congruence · Motivational impact",
"theory":"<h4>What is a Transfer Price?</h4><p>A transfer price is the price that one division in a company charges another division for goods or services provided internally. It simultaneously represents <em>revenue</em> to the transferring division and a <em>cost</em> to the receiving division — creating an inherent tension between them.</p><h4>Why Transfer Pricing Matters</h4><p>In a decentralised organisation, an effective transfer pricing system must: encourage divisions to transfer goods/services when this is beneficial to the group; prevent divisions from refusing internal transfers to protect their own metrics; and maintain fairness so both divisions are motivated.</p><h4>Factors Determining the Transfer Price</h4><div class='fw'><strong>1. Capacity of the transferring division:</strong><ul><li><strong>Spare capacity:</strong> Variable cost is the minimum transfer price (no opportunity cost)</li><li><strong>Full capacity:</strong> TP = Variable cost + Opportunity cost (contribution lost from external sales)</li></ul></div><div class='fw'><strong>2. Cost structure (fixed vs variable costs):</strong> Fixed costs don't change with transfers; only variable/incremental costs are relevant to the transfer decision.</div><div class='kbox'><strong>General Rule for Transfer Price (Minimum)</strong>Minimum TP = Marginal cost + Opportunity cost of not selling externally<br>This ensures the transferring division is no worse off by transferring internally than by selling externally.</div>",
"qa":[
{"q":"What is a transfer price and why does it create conflict between divisions?","a":"A transfer price is the internal price charged between divisions for inter-divisional goods/services. It creates conflict because: it is simultaneously <em>revenue to the selling division</em> (higher TP → better divisional performance) and a <em>cost to the buying division</em> (lower TP → better divisional performance). Each division seeks the price most favourable to itself — creating opposing incentives that can prevent mutually beneficial internal transfers."},
{"q":"A transferring division has variable cost of $30 and normally sells externally at $50 (contribution = $20). If it is at full capacity, what is the minimum transfer price?","a":"Minimum TP = Variable cost + Opportunity cost = $30 + $20 = <strong>$50</strong><br>At full capacity, every unit transferred internally means one fewer unit sold externally, losing $20 contribution per unit. The TP must compensate for this opportunity cost. At full capacity, the minimum TP equals the external market price."},
{"q":"A transferring division has spare capacity. Variable cost = $25, full cost = $40, market price = $55. What is the minimum transfer price?","a":"With spare capacity, there is <strong>no opportunity cost</strong> — transferring internally does not displace external sales. Minimum TP = Variable cost = <strong>$25</strong>. However, a TP below full cost ($40) means the division doesn't recover its fixed costs from this transfer. In practice, a TP between $25 and $55 would be negotiated to share the benefit of internal trade."}
]},
{"id":"c10","icon":"⚖️","title":"Transfer Pricing — Divisional and Group Profitability","subtitle":"Variable cost · Cost-plus · Market price · Negotiated price · Goal congruence",
"theory":"<h4>Transfer Pricing Methods</h4><table class='tbl'><tr><th>Method</th><th>Basis</th><th>Advantage</th><th>Problem</th></tr><tr><td><strong>Variable cost</strong></td><td>Marginal cost of production</td><td>Correct decision signal (accept any TP above variable cost)</td><td>Fails to recover fixed costs; transferring division makes no profit</td></tr><tr><td><strong>Full cost (absorption cost)</strong></td><td>Variable + Fixed cost per unit</td><td>Recovers all costs</td><td>Treats fixed costs as variable; may lead to bad decisions</td></tr><tr><td><strong>Cost-plus</strong></td><td>Full cost + profit margin</td><td>Transferring division earns profit</td><td>Inflates cost to receiving division; may distort pricing</td></tr><tr><td><strong>Market price</strong></td><td>External market price</td><td>Most objective; preserves divisional autonomy</td><td>Requires an external market; may not exist for intermediate goods</td></tr><tr><td><strong>Negotiated</strong></td><td>Agreed between divisions</td><td>Flexible; both divisions can share benefits</td><td>Time-consuming; may lead to conflict; weaker division disadvantaged</td></tr></table><h4>Group Profitability</h4><p>Transfer prices are <em>irrelevant to group profitability</em> — the selling division's revenue cancels the buying division's cost at group level. What matters to the group is: <strong>external revenue minus total costs incurred across all divisions</strong>.</p>",
"qa":[
{"q":"Explain why market price is generally considered the best transfer pricing method.","a":"Market price is considered best because: (1) It is <em>objective</em> — not based on internal cost allocations that can be manipulated; (2) It preserves <em>divisional autonomy</em> — both divisions can choose to trade internally or externally based on the market price; (3) It ensures <em>goal congruence</em> — if internal transfer is cheaper than buying externally at market price, internal transfer is preferred; (4) It eliminates inter-divisional conflict over TP setting. Limitation: requires an established external market for the intermediate good."},
{"q":"Why are transfer prices irrelevant to group profitability?","a":"At group (consolidated) level, the transferring division's revenue from the transfer and the receiving division's cost of the transfer are <em>intercompany transactions that cancel out</em>. Group profit = External revenue − Total costs across all divisions. The TP only determines how that profit is divided between divisions — it doesn't change the total amount. A higher TP gives more profit to the seller and less to the buyer, but the group total is unchanged."},
{"q":"Division A has variable cost $40 and can sell externally at $70. Division B (full capacity) can buy externally for $65. Should internal transfer occur and within what TP range?","a":"Group perspective: internal variable cost = $40; external buy price = $65. Transferring internally saves the group $25 per unit ($65 − $40) in costs. Transfer <strong>should occur</strong>.<br>TP range: Minimum (A's perspective with full capacity and external market) = Variable cost + opportunity cost = $40 + ($70 − $40) = <strong>$70</strong>. Maximum (B's perspective) = external buy price = <strong>$65</strong>. Since minimum ($70) &gt; maximum ($65), there is <strong>no mutually acceptable TP</strong> — transfer should not be forced; group HQ intervention may be needed."}
]},
{"id":"c11","icon":"🌐","title":"Transfer Pricing in Different Markets","subtitle":"Perfect market · Imperfect market · No market · Opportunity cost calculation",
"theory":"<h4>The Type of External Market Determines the Transfer Price</h4><p>The opportunity cost component of the transfer price depends on whether an external market exists for the intermediate good.</p><table class='tbl'><tr><th>Market type</th><th>Characteristics</th><th>Opportunity cost</th><th>TP formula</th></tr><tr><td><strong>No intermediate market</strong></td><td>No external demand for the good; cannot be sold outside the group</td><td>Zero</td><td>TP ≥ Variable cost</td></tr><tr><td><strong>Perfect intermediate market</strong></td><td>External market exists; price unaffected by number of units sold</td><td>Lost contribution per unit</td><td>TP = Variable cost + Lost contribution</td></tr><tr><td><strong>Imperfect intermediate market</strong></td><td>External market exists but selling more reduces the price (downward-sloping demand)</td><td>Marginal revenue lost</td><td>Requires marginal revenue analysis to find optimal external sales volume</td></tr></table><div class='kbox'><strong>Key Decision</strong>For the group, internal transfer is beneficial if: Total variable cost of internal production &lt; External market purchase price. The TP range should be: [Seller's minimum] to [Buyer's maximum]. If no TP range exists, either head office must impose a price or other solutions (subsidies) may be needed.</div>",
"qa":[
{"q":"How does the type of external intermediate market affect the minimum transfer price?","a":"<strong>No market</strong>: TP ≥ Variable cost only (no opportunity cost — nothing is foregone by not selling externally). <strong>Perfect market</strong>: TP ≥ Variable cost + contribution lost per unit transferred (opportunity cost = contribution per unit at the fixed external market price). <strong>Imperfect market</strong>: Opportunity cost depends on how many units the division would have sold externally — requires finding the optimal external sales volume using marginal revenue analysis."},
{"q":"Division X variable cost = $30. Perfect external market price = $50 (contribution $20). Division is at full capacity. What is the minimum TP?","a":"Minimum TP = Variable cost + Opportunity cost = $30 + $20 = <strong>$50</strong>. Since the external market is perfect, every unit transferred internally displaces one external sale, losing $20 contribution. The TP must fully compensate the transferring division for this lost contribution. At full capacity with a perfect external market, the minimum TP = external market price."},
{"q":"Why does an imperfect external market complicate the transfer pricing calculation?","a":"In a perfect market, price is fixed regardless of volume — opportunity cost per unit is constant. In an imperfect market, the selling division faces a downward-sloping demand curve: selling more units externally requires reducing the price. The opportunity cost of internal transfer (marginal revenue lost) therefore <em>varies depending on how many units are sold externally</em>. To determine the correct opportunity cost, the transferring division must first find the profit-maximising level of external sales, then calculate the marginal revenue lost from transferring the next unit internally."}
]},
{"id":"c12","icon":"🔄","title":"Transfer Pricing Methods and Systems","subtitle":"Variable · Full cost · Cost-plus · Market price · Negotiated · International tax considerations",
"theory":"<h4>Choosing a Transfer Pricing System</h4><p>The appropriate transfer pricing system depends on the organisation's structure, the nature of inter-divisional trade, and management priorities. The system must encourage goal-congruent behaviour while being practical to administer.</p><h4>Summary of Methods and Their Impact</h4><div class='fw'><strong>Variable cost TP:</strong> Ensures correct make-or-buy decisions (buy externally only if external price &lt; variable cost). Problem: transferring division makes no contribution to fixed costs or profit — may demotivate.</div><div class='fw'><strong>Full cost TP:</strong> Recovers all costs of the transferring division. Problem: treats fixed costs as if they were variable — can lead to incorrect make-or-buy decisions if the receiving division compares the full cost TP against an external price that is between variable and full cost.</div><div class='fw'><strong>Cost-plus TP:</strong> Adds a profit margin to cost. Provides an incentive for the transferring division but may make it uncompetitive with external suppliers.</div><div class='fw'><strong>Market price TP:</strong> Most objective; encourages both divisions to trade where beneficial. Best when an external market exists for the intermediate good.</div><div class='fw'><strong>Negotiated TP:</strong> Flexible; allows divisions to share the benefit of internal trade. Most suitable where no external market exists and variable and market prices are not applicable.</div><h4>International Transfer Pricing</h4><p>For multinational organisations, transfer prices are set between entities in different tax jurisdictions. Tax authorities require <strong>arm's length pricing</strong> — prices should reflect what unrelated parties would charge. Non-arm's length pricing can be used to shift profits to low-tax jurisdictions — attracting regulatory scrutiny and penalties.</p>",
"qa":[
{"q":"Why might a full cost transfer price lead to a suboptimal group decision?","a":"If a transferring division sets TP at full cost ($70) but the receiving division can buy externally for $65, the receiver buys externally. However, if the transferring division's variable cost is only $40 (and fixed costs are $30), the group would have saved $25 ($65 − $40) by transferring internally — only the variable cost is a true incremental cost. The full cost TP distorts the decision by including fixed costs that the group incurs regardless of the transfer decision."},
{"q":"When is a negotiated transfer price most appropriate?","a":"A negotiated TP is most appropriate when: (1) No external market exists for the intermediate good (so market price is unavailable); (2) Divisional managers have autonomy and mutual agreement is possible; (3) The benefits of internal trade can be shared between divisions through negotiation; (4) Variable cost TP is insufficient to motivate the transferring division. Limitations: time-consuming; weaker division may be disadvantaged in negotiations."},
{"q":"What is 'arm's length pricing' in the context of international transfer pricing and why do tax authorities require it?","a":"Arm's length pricing requires that transfer prices between related entities (e.g., a parent and its overseas subsidiary) reflect what <em>unrelated parties dealing at arm's length</em> would charge. Tax authorities require this because multinational companies can otherwise set artificially low TPs on goods sold to subsidiaries in high-tax countries (shifting profits out) and artificially high TPs on goods purchased from subsidiaries in low-tax countries (shifting profits in). This erodes tax revenues in high-tax countries — hence strict transfer pricing regulations and penalties for non-compliance."}
]}
]},
"D":{"title":"Pricing and Capital Investment Decisions","icon":"💸","lessons":[
{"id":"d1","icon":"🏗️","title":"Investment Decisions","subtitle":"Capital budgeting · Three-phase process · Creation · Evaluation · Selection · Governance",
"theory":"<h4>What is Capital Budgeting?</h4><p>Capital budgeting is the process through which organisations plan their spending on long-term capital investment projects (assets with lives &gt;12 months). Because initial outlays are significant and returns are earned over many years, careful evaluation is essential.</p><h4>Three Phases of the Investment Decision Process</h4><div class='fw'><strong>Phase 1 — Creation (Initiation):</strong><ol><li>Identify organisational objectives (financial and non-financial)</li><li>Seek out investment opportunities proactively</li><li>Identify 'states of nature' — uncontrollable factors affecting outcomes</li></ol></div><div class='fw'><strong>Phase 2 — Evaluation:</strong><ol><li>Identify relevant cash flows for each investment option</li><li>Apply appropriate investment appraisal technique (NPV, IRR, payback)</li><li>Perform sensitivity analysis on key variables</li><li>Consider non-financial factors</li></ol></div><div class='fw'><strong>Phase 3 — Selection:</strong><ol><li>Rank projects using appropriate method (NPV, PI)</li><li>Select the combination that maximises shareholder wealth within available funds</li><li>Document decision and approval</li></ol></div><div class='kbox'><strong>Capital Governance Framework</strong>Larger organisations typically have a committee that reviews, evaluates, and approves major capital expenditures. Effective governance ensures selected projects are those most likely to achieve cost, schedule, performance, and quality goals.</div>",
"qa":[
{"q":"Name the three phases of the capital investment decision process.","a":"(1) <strong>Creation (Initiation)</strong> — identify organisational objectives; seek investment opportunities; identify uncontrollable factors that could affect outcomes; (2) <strong>Evaluation</strong> — identify relevant cash flows; apply appraisal techniques; sensitivity analysis; consider non-financial factors; (3) <strong>Selection</strong> — rank and select projects that maximise shareholder wealth within available funds; formal approval and documentation."},
{"q":"Why do capital investment decisions require particular care compared with day-to-day operational decisions?","a":"Capital investment decisions typically involve: (1) Large initial outlays; (2) Long-term commitment — difficult and costly to reverse; (3) Returns spread over many years — subject to forecasting uncertainty; (4) Significant impact on the organisation's strategic direction and competitive position; (5) Potential for large value creation or destruction. Unlike operational decisions, poor capital investment decisions can have long-lasting financial consequences that are difficult to correct."},
{"q":"What is the role of a capital governance framework in investment decision-making?","a":"A capital governance framework: (1) Establishes clear criteria for which investments require committee-level approval (typically based on size and strategic significance); (2) Ensures consistent application of appraisal methods; (3) Provides oversight and challenge of assumptions in investment proposals; (4) Documents decisions and rationale; (5) Monitors performance against the original investment case (post-completion audit). This reduces the risk of pet projects, empire-building, and investments that destroy value."}
]},
{"id":"d2","icon":"💵","title":"Relevant Cash Flows","subtitle":"Incremental · Future · Cash flows only · Sunk costs · Opportunity costs · Tax · Inflation",
"theory":"<h4>Three Characteristics of Relevant Cash Flows</h4><div class='fw'><ol><li><strong>Future cash flows only</strong> — sunk costs already incurred are irrelevant (cannot be recovered)</li><li><strong>Incremental</strong> — only costs/revenues that arise as a <em>direct result</em> of the investment decision</li><li><strong>Cash flows, not profits</strong> — depreciation is excluded (non-cash); use actual cash movements</li></ol></div><h4>What to Include</h4><ul><li><strong>Incremental cash flows:</strong> Revenue from new products; additional variable costs; new fixed costs that only arise if the project proceeds</li><li><strong>Opportunity costs:</strong> Revenues foregone from alternative use of resources (e.g., rental income lost if a building is used for the project)</li><li><strong>Working capital:</strong> Initial investment in working capital at start; recovery at project end</li></ul><h4>What to Exclude</h4><ul><li><strong>Sunk costs:</strong> Costs already incurred (market research, design fees) — irrelevant, cannot be recovered</li><li><strong>Depreciation:</strong> Non-cash charge — replace with actual capital expenditure cash flows</li><li><strong>Apportioned fixed costs:</strong> Fixed overhead allocated to the project but not actually changing as a result of it</li></ul><h4>Adjusting for Taxation and Inflation</h4><p><strong>Taxation:</strong> Tax is a real cash outflow. Tax allowances (capital allowances/tax depreciation) are also real cash flows reducing tax payable. Include tax paid at the relevant timing. <strong>Inflation:</strong> Either use real cash flows and real discount rate, or nominal cash flows and nominal discount rate. Be consistent.</p>",
"qa":[
{"q":"What are the three characteristics that all relevant cash flows must possess?","a":"(1) <strong>Future</strong> — only costs/revenues that arise in the future; sunk costs already incurred are irrelevant; (2) <strong>Incremental</strong> — only amounts that arise as a direct result of the investment decision going ahead; (3) <strong>Cash flows</strong> — not accounting profits; depreciation is excluded (non-cash); actual capital expenditure cash flows are used instead."},
{"q":"A company spent $50,000 on market research before evaluating a new product investment. Is this relevant?","a":"<strong>No — it is a sunk cost.</strong> The $50,000 has already been incurred and cannot be recovered regardless of whether the investment proceeds or not. Including sunk costs in investment appraisal leads to poor decisions — it can make unprofitable projects appear better than they are by including costs that won't be saved if the project is rejected. Only future, incremental cash flows are relevant."},
{"q":"A company owns a building currently rented out for $30,000 per year. It plans to use this building for a new project. Is the rent relevant?","a":"<strong>Yes — it is an opportunity cost.</strong> If the building is used for the new project, the $30,000 annual rental income is foregone. This represents an incremental cash flow that arises as a direct result of the investment decision. Opportunity costs are relevant cash flows even though they are not direct cash payments — they represent the value of the best foregone alternative."},
{"q":"Why is depreciation excluded from relevant cash flows in investment appraisal?","a":"Depreciation is a <em>non-cash accounting charge</em> that spreads the cost of an asset over its useful life. The actual cash flow occurs at the time of the asset purchase (included in the initial capital expenditure). Including both the capital expenditure AND depreciation would double-count the cost of the asset. Instead, use the actual cash outflow at purchase date (time 0) and the actual residual/scrap value at disposal date."}
]},
{"id":"d3","icon":"🌿","title":"Non-Financial Factors and Qualitative Issues","subtitle":"Capital rationing · Soft vs hard rationing · Non-financial considerations · PESTEL",
"theory":"<h4>Beyond Financial Analysis</h4><p>Even a positive NPV project may be rejected if non-financial factors create concerns that are not captured in the cash flow analysis. Similarly, a marginally negative NPV project may be accepted if strategic non-financial factors justify it.</p><h4>Capital Rationing</h4><ul><li><strong>Soft capital rationing:</strong> Internally imposed limit on investment funds — the organisation has chosen to restrict its capital budget (e.g., to avoid over-extension). The constraint is removable if sufficiently attractive projects emerge.</li><li><strong>Hard capital rationing:</strong> Externally imposed limit — the organisation cannot obtain additional external funding (credit restrictions, market conditions). The constraint is fixed.</li></ul><h4>Non-Financial Factors in Investment Decisions</h4><table class='tbl'><tr><th>Category</th><th>Examples</th></tr><tr><td><strong>External</strong></td><td>Political stability of target market; regulatory environment; social acceptance; environmental impact</td></tr><tr><td><strong>Internal</strong></td><td>Workforce skills available; current technology capacity; management bandwidth; supply chain readiness</td></tr></table><div class='kbox'><strong>Key Principle</strong>Non-financial analysis is not a substitute for financial analysis — it complements it. Reviewing non-financial factors may also reveal financial implications not previously considered. All factors should be integrated before a final investment decision is made.</div>",
"qa":[
{"q":"Distinguish between soft and hard capital rationing.","a":"<strong>Soft capital rationing</strong>: An <em>internally imposed</em> limit on investment funds — management has deliberately restricted the capital budget to avoid overcommitting resources or to focus on the highest-priority projects. The constraint is self-imposed and can be relaxed for sufficiently attractive opportunities.<br><strong>Hard capital rationing</strong>: An <em>externally imposed</em> limit — the organisation cannot access additional external funding due to lender restrictions, market conditions, or credit rating constraints. The constraint cannot be removed by management decision alone."},
{"q":"A project has a positive NPV of $500k but is located in a politically unstable country. How might non-financial factors affect the decision?","a":"Non-financial factors to consider: (1) <strong>Political risk</strong> — risk of expropriation, regulatory changes, or civil unrest could destroy the investment; (2) <strong>Reputational risk</strong> — operating in a country with poor human rights record could damage the organisation's brand in home markets; (3) <strong>Operational risk</strong> — supply chain reliability, local talent availability; (4) <strong>Strategic fit</strong> — does operating in this country align with long-term strategic objectives? The positive NPV may not compensate for these risks if they materialise."},
{"q":"How might reviewing non-financial factors reveal additional financial implications?","a":"Non-financial review can uncover: (1) <strong>Skills gap</strong> — insufficient skilled workers means additional training costs not included in the financial model; (2) <strong>Regulatory compliance</strong> — new environmental regulations require capital expenditure upgrades beyond what was budgeted; (3) <strong>Supply chain issues</strong> — local supplier reliability requires additional inventory holding, increasing working capital needs; (4) <strong>Reputational impact</strong> — negative social media reaction to a controversial project could reduce sales across the whole product portfolio."}
]},
{"id":"d4","icon":"🌱","title":"Real Options","subtitle":"Option to follow-on · Option to abandon · Option to delay · Strategic flexibility",
"theory":"<h4>What Are Real Options?</h4><p>Real options are strategic <em>flexibilities</em> embedded in or available to a capital investment project that are not captured by standard NPV analysis. They can add significant value to a project by reducing risk or creating future opportunities.</p><h4>Three Types of Real Options</h4><div class='fw'><strong>Option to Follow-on:</strong> The initial investment creates opportunities for additional investments that would not otherwise be available. Example: investing in a new country establishes a brand and distribution network, enabling subsequent product launches at lower cost. The NPV of the initial project understates its true value by ignoring follow-on opportunities.</div><div class='fw'><strong>Option to Abandon:</strong> The organisation retains the right to exit the project before completion, limiting maximum losses. Example: a phased investment approach where each phase is contingent on the previous phase's results. If Phase 1 fails, Phase 2 is abandoned. The option to abandon reduces the worst-case downside.</div><div class='fw'><strong>Option to Delay:</strong> The organisation can wait for more information before committing. Example: delaying entry into a new market until market research confirms sufficient demand. Reduces uncertainty at the cost of some first-mover advantage.</div><div class='kbox'><strong>Real Options vs Financial Options</strong>Real options are <em>strategic choices</em> available in capital investment projects — NOT financial derivative instruments. The terminology borrows from financial options theory but real options are simply management strategies that provide flexibility.</div>",
"qa":[
{"q":"Name the three types of real options and briefly describe each.","a":"(1) <strong>Option to follow-on</strong>: The initial investment creates opportunities for additional future investments that would not otherwise exist. Value is understated in the initial NPV.<br>(2) <strong>Option to abandon</strong>: The right to exit the project before completion, capping maximum losses if early results are poor.<br>(3) <strong>Option to delay</strong>: The right to postpone the investment decision to gather more information and reduce uncertainty, at the potential cost of first-mover advantage."},
{"q":"How does the 'option to abandon' add value to a project?","a":"The option to abandon converts an investment with potentially unlimited downside into one with a capped maximum loss. In a phased project: if Phase 1 results are poor, the organisation abandons Phase 2 (avoiding further losses). Without this option: the organisation is committed to seeing the full project through regardless of early results. The option to abandon is particularly valuable for large, risky projects where early warning signs can be used to prevent compounding losses."},
{"q":"Why might standard NPV analysis undervalue a project that has embedded real options?","a":"NPV analysis assumes all cash flows are fixed as forecast — it doesn't capture the value of management's ability to adapt. Real options add value because management can: (1) Exploit additional opportunities that emerge (follow-on); (2) Cut losses early if results disappoint (abandon); (3) Wait for better conditions (delay). A project with NPV of −$50k might be worth undertaking if it creates a follow-on option worth $200k. Standard NPV would reject it; real options analysis might approve it."}
]},
{"id":"d5","icon":"📐","title":"Investment Appraisal Techniques","subtitle":"ARR · Payback · NPV · IRR · Advantages and disadvantages",
"theory":"<h4>Four Main Investment Appraisal Techniques</h4><table class='tbl'><tr><th>Technique</th><th>Method</th><th>Advantage</th><th>Disadvantage</th></tr><tr><td><strong>ARR</strong></td><td>Average annual profit ÷ Investment × 100%</td><td>Simple; widely understood; uses familiar profit measure</td><td>Ignores time value of money; uses profits not cash flows; subjective depreciation</td></tr><tr><td><strong>Payback</strong></td><td>Time to recover initial investment</td><td>Simple; focuses on liquidity risk; intuitive</td><td>Ignores cash flows after payback; ignores time value of money</td></tr><tr><td><strong>NPV</strong></td><td>PV of future cash flows − Initial investment</td><td>Superior method; considers time value; directly measures shareholder wealth impact; absolute measure</td><td>Requires cost of capital estimate; harder to communicate; sensitivity to discount rate</td></tr><tr><td><strong>IRR</strong></td><td>Discount rate that gives NPV = 0</td><td>Easy to compare with cost of capital; % return; intuitive</td><td>May give multiple rates; ignores project scale; can conflict with NPV for mutually exclusive projects</td></tr></table><div class='kbox'><strong>NPV is the Superior Method</strong>NPV is considered the best appraisal technique because: (1) It considers the time value of money; (2) It uses cash flows (not profits); (3) It directly measures the increase in shareholder wealth; (4) Gives an absolute measure (unlike IRR's relative %). When techniques conflict, NPV should prevail.</div>",
"qa":[
{"q":"Why is NPV considered superior to IRR for evaluating mutually exclusive projects?","a":"(1) <strong>Absolute vs relative</strong>: NPV measures the actual dollar increase in shareholder wealth; IRR measures percentage return. A small project with IRR 30% may add less value than a large project with IRR 20% — NPV correctly ranks these. (2) <strong>Multiple IRRs</strong>: Projects with non-conventional cash flows may have multiple IRRs, making the IRR ambiguous. (3) <strong>Reinvestment assumption</strong>: IRR implicitly assumes intermediate cash flows are reinvested at the IRR — often unrealistic. NPV assumes reinvestment at the cost of capital (more realistic)."},
{"q":"A project costs $100,000 and generates annual profits of $20,000 for 5 years (depreciation $18,000/year). Calculate ARR (using initial investment).","a":"Average annual profit = $20,000<br>ARR = Average annual profit ÷ Initial investment = $20,000 ÷ $100,000 = <strong>20%</strong><br>Note: Depreciation has already been deducted from the profit figure. ARR uses accounting profit, not cash flow."},
{"q":"What are the main limitations of the payback period method?","a":"(1) <strong>Ignores time value of money</strong> — $100k received in year 1 is treated the same as $100k in year 4; (2) <strong>Ignores cash flows after payback</strong> — a project with high cash flows in years 4 and 5 is undervalued if it has a long payback; (3) <strong>Arbitrary payback target</strong> — what is the 'acceptable' payback period? No objective basis; (4) <strong>No measure of total profitability</strong> — tells you when you get your money back, not how much total return you earn."}
]},
{"id":"d6","icon":"⏱️","title":"Annuities and Perpetuities","subtitle":"Annuity factor formula · Perpetuity factor · Growing perpetuity · PV calculation",
