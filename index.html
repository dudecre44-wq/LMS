<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> StudyBeam — Study Hub</title>
<style>
:root{
  --paper:#f4f1eb;--paper-deep:#ece8de;--card:#fffef8;
  --ink:#1c2b3a;--ink-soft:#3e4e5e;--muted:#7b8a97;--line:#ddd6c8;
  --gold:#b8883e;--gold-deep:#8d6422;--gold-pale:#f0e2c4;
  --green:#2e6b4f;--green-pale:#e3efe8;--blue:#1d5e88;--blue-pale:#dde9f4;
  --red:#c0392b;--red-pale:#fdecea;
  --locked:#cdc7b6;--locked-bg:#efeadf;
  --radius:14px;--radius-sm:8px;
  --shadow:0 2px 14px rgba(28,43,58,.07);--shadow-lg:0 10px 32px rgba(28,43,58,.14);
  /* per-subject accent (swapped by JS) */
  --accent:var(--gold);--accent-deep:var(--gold-deep);--accent-pale:var(--gold-pale);
}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;line-height:1.6;font-size:15px}
h1,h2,h3,h4{font-weight:700;color:var(--ink)}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
button{font-family:inherit;cursor:pointer}

/* ── TOP BAR ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 22px;background:var(--ink);color:#f2ede0;
  position:sticky;top:0;z-index:60;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.brand .seal{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(150deg,var(--gold),var(--gold-deep));
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:11px;color:#241704;line-height:1.2;text-align:center;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.3);
}
.brand .bt .t1{font-size:.95rem;font-weight:700;white-space:nowrap}
.brand .bt .t2{font-size:.68rem;opacity:.62;letter-spacing:.03em;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:12px;font-size:.76rem;flex-shrink:0}
.op-wrap{display:flex;align-items:center;gap:7px}
.op-track{width:80px;height:4px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
.op-fill{height:100%;background:linear-gradient(90deg,var(--gold),#e0b660);border-radius:3px;transition:width .4s}
.op-label{opacity:.7;font-variant-numeric:tabular-nums}

/* ── SUBJECT TAB BAR ── */
.subject-bar{
  display:flex;background:var(--paper-deep);border-bottom:2px solid var(--line);
  position:sticky;top:54px;z-index:55;overflow-x:auto;
}
.sub-tab{
  flex:1;min-width:80px;padding:10px 14px 8px;border:none;
  background:none;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;margin-bottom:-2px;
  transition:color .18s,border-color .18s,background .18s;
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.sub-tab:hover{background:var(--paper);color:var(--ink)}
.sub-tab.active{color:var(--gold-deep);border-bottom-color:var(--gold);background:var(--paper)}
.sub-icon{font-size:1.15rem}
.sub-label{font-size:.82rem;font-weight:800;letter-spacing:.02em;line-height:1}
.sub-name{font-size:.64rem;white-space:nowrap;opacity:.8}
.sub-prog{
  font-size:.62rem;font-weight:700;
  background:var(--gold-pale);color:var(--gold-deep);
  padding:1px 6px;border-radius:8px;margin-top:1px;
  transition:background .3s;
}
.sub-tab.active .sub-prog{background:var(--gold);color:#241704}

/* ── LANDING SCREEN ── */
.landing{max-width:820px;margin:0 auto;padding:46px 24px 80px;text-align:center}
.landing h1{font-size:2rem;margin:0 0 12px}
.landing p{color:var(--ink-soft);font-size:.96rem;max-width:500px;margin:0 auto 36px}
.subject-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:640px;margin:0 auto}
.sg-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 18px;cursor:pointer;transition:box-shadow .18s,border-color .18s,transform .18s;
  text-align:left;
}
.sg-card:hover{box-shadow:var(--shadow-lg);border-color:var(--gold);transform:translateY(-2px)}
.sg-card .sg-code{font-size:1.4rem;font-weight:800;color:var(--gold-deep);margin-bottom:4px}
.sg-card .sg-title{font-size:.9rem;font-weight:700;margin-bottom:4px}
.sg-card .sg-meta{font-size:.78rem;color:var(--muted)}
.sg-card .sg-bar{height:4px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.sg-card .sg-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:3px;transition:width .4s}

/* ── HOME / MODULE LIST ── */
.home-wrap{max-width:820px;margin:0 auto;padding:32px 22px 80px}
.hiw{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 28px}
.hiw-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 16px}
.hiw-card .hn{width:22px;height:22px;border-radius:50%;background:var(--gold-pale);color:var(--gold-deep);font-weight:700;font-size:.72rem;display:flex;align-items:center;justify-content:center;margin-bottom:7px}
.hiw-card h4{font-size:.87rem;margin:0 0 3px}.hiw-card p{font-size:.77rem;color:var(--muted);margin:0}
.mp-list{display:flex;flex-direction:column;gap:11px}
.mp-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:box-shadow .18s,border-color .18s,transform .18s;text-align:left}
.mp-card:hover{box-shadow:var(--shadow-lg);border-color:var(--gold);transform:translateY(-1px)}
.mp-ring{position:relative;width:52px;height:52px;flex-shrink:0}
.mp-ring svg{transform:rotate(-90deg)}.bgring{stroke:var(--line)}.fgring{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .5s}
.mp-letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;color:var(--ink)}
.mp-body{flex:1}.mp-body h3{font-size:.98rem;margin:0 0 2px}.mp-body p{font-size:.78rem;color:var(--muted);margin:0}
.mp-stat{font-size:.73rem;color:var(--gold-deep);font-weight:600;margin-top:5px}
.mp-arrow{font-size:1.1rem;color:var(--muted);flex-shrink:0}

/* ── RESUME CARD ── */
.resume-card{background:var(--card);border:1px solid var(--gold);border-radius:var(--radius);padding:15px 17px;display:flex;align-items:center;gap:13px;cursor:pointer;margin-bottom:22px;transition:box-shadow .18s,transform .18s}
.resume-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.rc-icon{width:36px;height:36px;border-radius:50%;background:linear-gradient(150deg,var(--gold),var(--gold-deep));color:#241704;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:700;flex-shrink:0}
.rc-body{flex:1}.rc-body strong{font-size:.9rem;display:block;margin-bottom:2px}
.rc-body p{font-size:.76rem;color:var(--muted);margin:0 0 7px}
.rc-prog{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:3px}
.rc-bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:3px}
.rc-label{font-size:.69rem;color:var(--muted)}
.rc-arrow{font-size:1.1rem;color:var(--gold-deep);flex-shrink:0}
.all-done{cursor:default;border-color:var(--green)}
.all-done:hover{transform:none;box-shadow:none}
.all-done .rc-icon{background:linear-gradient(150deg,var(--green),#1a4a37);color:#fff}
.btn-reset{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:999px;font-size:.74rem;font-weight:600}
.btn-reset:hover{border-color:#f5b7b1;color:#c0392b}

/* ── MODULE LAYOUT ── */
.module-layout{display:flex;min-height:calc(100vh - 106px)}
.rail{width:268px;flex-shrink:0;background:var(--paper-deep);border-right:1px solid var(--line);padding:20px 0;position:sticky;top:106px;max-height:calc(100vh - 106px);overflow-y:auto}
.rail-head{padding:0 18px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rh-ey{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-deep);font-weight:700}
.rail-head h2{font-size:1rem;margin:3px 0 7px}
.rp-track{height:4px;background:var(--line);border-radius:3px;overflow:hidden}
.rp-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:3px;transition:width .4s}
.rp-txt{font-size:.68rem;color:var(--muted);margin-top:4px}
.checkpoints{position:relative;padding:13px 18px 4px}
.checkpoints::before{content:"";position:absolute;left:30px;top:13px;bottom:13px;width:2px;background:var(--line)}
.cp-item{position:relative;display:flex;align-items:flex-start;gap:11px;padding:7px 0;cursor:pointer}
.cp-item.locked{cursor:not-allowed}
.cp-node{width:22px;height:22px;border-radius:50%;flex-shrink:0;z-index:1;display:flex;align-items:center;justify-content:center;font-size:.64rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--muted);transition:all .2s}
.cp-item.done .cp-node{background:var(--green);border-color:var(--green);color:#fff}
.cp-item.current .cp-node{background:var(--gold);border-color:var(--gold-deep);color:#241704;box-shadow:0 0 0 4px var(--gold-pale)}
.cp-item.locked .cp-node{background:var(--locked-bg);color:var(--locked);border-color:var(--locked-bg)}
.cp-text{flex:1;padding-top:1px}
.cp-title{font-size:.77rem;font-weight:600;color:var(--ink);line-height:1.3}
.cp-item.locked .cp-title{color:var(--locked)}
.cp-item.current .cp-title{color:var(--gold-deep)}
.cp-sub{font-size:.66rem;color:var(--muted);margin-top:1px}
.cp-item.locked .cp-sub{color:var(--locked)}
.cp-item:not(.locked):hover .cp-node{transform:scale(1.08)}
.rail-foot{padding:13px 18px 4px;margin-top:5px;border-top:1px solid var(--line)}
.rail-foot button{width:100%;background:none;border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px;font-size:.74rem;font-weight:600;color:var(--ink-soft);margin-bottom:5px}
.rail-foot button:hover{border-color:var(--gold);color:var(--gold-deep)}
.rail-foot button.danger:hover{border-color:#f5b7b1;color:#c0392b}

/* ── LESSON STAGE ── */
.stage{flex:1;padding:32px 40px 88px;max-width:750px}
.lesson-ey{display:flex;align-items:center;gap:9px;font-size:.71rem;letter-spacing:.07em;text-transform:uppercase;color:var(--gold-deep);font-weight:700;margin-bottom:7px}
.lesson-ey .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}
.lesson-title{font-size:1.65rem;margin:0 0 7px;line-height:1.2}
.lesson-sub{color:var(--muted);font-size:.87rem;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.sec-label{display:flex;align-items:center;gap:8px;margin:0 0 13px}
.sl-icon{width:27px;height:27px;border-radius:7px;background:var(--gold-pale);display:flex;align-items:center;justify-content:center;font-size:.86rem;flex-shrink:0}
.sec-label h3{font-size:.93rem;margin:0}

/* ── THEORY BLOCK ── */
.tc h4{font-size:.87rem;font-weight:700;color:var(--ink);margin:16px 0 5px;padding-left:9px;border-left:3px solid var(--gold)}
.tc h4:first-child{margin-top:0}
.tc p{font-size:.86rem;color:var(--ink-soft);margin:0 0 9px}
.tc ul,.tc ol{font-size:.86rem;color:var(--ink-soft);padding-left:18px;margin:0 0 9px}
.tc li{margin-bottom:3px}
.kbox{background:var(--gold-pale);border:1px solid #dfca96;border-radius:var(--radius-sm);padding:11px 13px;margin:10px 0;font-size:.84rem}
.kbox strong{display:block;color:var(--gold-deep);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.fw{background:var(--blue-pale);border:1px solid #b6d2e8;border-radius:var(--radius-sm);padding:11px 13px;margin:10px 0}
.fw strong{display:block;color:var(--blue);font-size:.85rem;margin-bottom:4px}
.fw ul,.fw ol{margin:0;padding-left:16px;font-size:.85rem;color:var(--ink-soft)}
.fw li{margin-bottom:3px}
.cartn-box{background:#f0f7f4;border:1px solid #b8d8cc;border-radius:var(--radius-sm);padding:11px 13px;margin:10px 0}
.cartn-box strong{display:block;color:var(--green);font-size:.85rem;margin-bottom:4px}
.cartn-box ul{margin:0;padding-left:16px;font-size:.85rem;color:var(--ink-soft)}
.cartn-box li{margin-bottom:3px}
.warn-box{background:var(--red-pale);border:1px solid #f5b7b1;border-radius:var(--radius-sm);padding:11px 13px;margin:10px 0}
.warn-box strong{display:block;color:var(--red);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:.83rem}
.tbl th{background:var(--gold-pale);padding:7px 10px;text-align:left;font-weight:700;border:1px solid var(--line)}
.tbl td{padding:7px 10px;border:1px solid var(--line);color:var(--ink-soft)}
.tbl tr:nth-child(even) td{background:#faf9f3}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.71rem;font-weight:600;margin:2px}
.tb{background:#dbe7f3;color:#1f4e72}.tg{background:var(--green-pale);color:var(--green)}
.ta{background:var(--gold-pale);color:var(--gold-deep)}.tr{background:var(--red-pale);color:var(--red)}

/* ── Q&A ── */
.qa-divider{display:flex;align-items:center;gap:12px;margin:32px 0 17px}
.qa-divider::after{content:"";flex:1;height:1px;background:var(--line)}
.qa-block{border:1px solid var(--line);border-radius:var(--radius-sm);margin-bottom:9px;overflow:hidden;background:var(--card)}
.qa-q{padding:11px 13px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--ink);display:flex;align-items:flex-start;gap:9px}
.qa-q:hover{background:var(--paper-deep)}
.qa-q .qm{background:var(--ink);color:#f2ede0;width:20px;height:20px;border-radius:50%;font-size:.65rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-weight:700}
.qa-q .qch{margin-left:auto;color:var(--muted);transition:transform .2s;font-size:.8rem;flex-shrink:0}
.qa-block.open .qa-q .qch{transform:rotate(180deg)}
.qa-a{display:none;padding:4px 13px 13px 41px;font-size:.84rem;color:var(--ink-soft);border-top:1px solid var(--line);background:var(--green-pale)}
.qa-a-in{padding-top:9px}
.qa-block.open .qa-a{display:block}
.qa-a ul,.qa-a ol{padding-left:16px;margin:5px 0 0}.qa-a li{margin-bottom:4px}

/* ── CTA & BUTTONS ── */
.complete-zone{margin-top:36px;padding-top:24px;border-top:2px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.complete-zone.done-state{border-top-color:var(--green)}
.cz-text{font-size:.82rem;color:var(--muted)}.cz-text strong{color:var(--ink)}
.btn-primary{background:linear-gradient(155deg,var(--gold) 0%,var(--gold-deep) 100%);color:#241704;border:none;padding:12px 22px;border-radius:999px;font-weight:700;font-size:.86rem;box-shadow:0 4px 14px rgba(141,100,34,.3);display:flex;align-items:center;gap:7px;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(141,100,34,.4)}
.btn-ghost{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.79rem}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-deep)}
.stamp-done{display:flex;align-items:center;gap:9px;color:var(--green);font-weight:700;font-size:.88rem}
.stamp-done .si{width:27px;height:27px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.83rem;flex-shrink:0}
.nav-prev{background:none;border:none;color:var(--muted);font-size:.77rem;font-weight:600;display:flex;align-items:center;gap:5px;padding:5px 0;margin-top:12px}
.nav-prev:hover{color:var(--gold-deep)}.nav-prev:disabled{opacity:0;pointer-events:none}

/* ── MODULE COMPLETE ── */
.mod-complete{max-width:500px;margin:70px auto;text-align:center;padding:0 20px}
.mc-seal{width:82px;height:82px;border-radius:50%;margin:0 auto 18px;background:linear-gradient(150deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;font-size:2.1rem;box-shadow:0 8px 22px rgba(141,100,34,.38),inset 0 2px 2px rgba(255,255,255,.3)}
.mod-complete h2{font-size:1.45rem;margin-bottom:8px}.mod-complete p{color:var(--ink-soft);font-size:.89rem;margin-bottom:24px}
.mc-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ── RESPONSIVE ── */
@media(max-width:820px){
  .module-layout{flex-direction:column}
  .rail{width:100%;position:relative;top:0;max-height:none;border-right:none;border-bottom:1px solid var(--line)}
  .stage{padding:22px 16px 68px;max-width:100%}
  .hiw{grid-template-columns:1fr}
  .subject-grid{grid-template-columns:1fr}
  .topbar{padding:10px 14px}
  .sub-name{display:none}
}
@media(max-width:480px){
  .landing{padding:30px 16px 60px}
  .home-wrap{padding:22px 14px 60px}
  .stage{padding:18px 14px 60px}
}
</style>
</head>
<body>
<!-- ── TOP BAR ── -->
<div class="topbar">
  <div class="brand" onclick="goHome()">
    <div class="seal">ML</div>
    <div class="bt">
      <div class="t1"> Management Level</div>
      <div class="t2" id="activeSubTitle">Study Hub</div>
    </div>
  </div>
  <div class="topbar-right">
    <div class="op-wrap" id="progressWrap" style="display:none">
      <div class="op-track"><div class="op-fill" id="overallFill" style="width:0%"></div></div>
      <span class="op-label" id="overallLabel"></span>
    </div>
  </div>
</div>

<!-- ── SUBJECT TABS ── -->
<div class="subject-bar">
  <button class="sub-tab" onclick="switchSubject('E2')" id="tab-E2">
    <span class="sub-icon">🏢</span>
    <span class="sub-label">E2</span>
    <span class="sub-name">Enterprise Mgmt</span>
    <span class="sub-prog" id="prog-E2">0/27</span>
  </button>
  <button class="sub-tab" onclick="switchSubject('F2')" id="tab-F2">
    <span class="sub-icon">📑</span>
    <span class="sub-label">F2</span>
    <span class="sub-name">Financial Reporting</span>
    <span class="sub-prog" id="prog-F2">0/30</span>
  </button>
  <button class="sub-tab" onclick="switchSubject('P2')" id="tab-P2">
    <span class="sub-icon">📊</span>
    <span class="sub-label">P2</span>
    <span class="sub-name">Mgmt Accounting</span>
    <span class="sub-prog" id="prog-P2">0/50</span>
  </button>
  <button class="sub-tab" onclick="switchSubject('Revision')" id="tab-Revision">
    <span class="sub-icon">🏭</span>
    <span class="sub-label">Revision</span>
    <span class="sub-name">Revise Your knowledge</span>
    <span class="sub-prog" id="prog-Revision">0/12</span>
  </button>
</div>

<div id="app"></div>
<script>




const COURSE_DATA_E2 = {"A": {"title": "Business Model", "icon": "🏢", "lessons": [{"id": "a1", "icon": "📋", "title": "Business Models", "subtitle": "CGMA Framework · Value Creation · Stakeholder Analysis", "theory": "\n<h4>What is a Business Model?</h4>\n<p>A business model is <strong>\"the way in which an organisation creates long-term value and sustained success.\"</strong> The CGMA Business Model Framework defines it as how a firm <em>continually defines, creates, delivers, and captures value</em> for its key stakeholders over time. The common theme across all definitions is <strong>value creation</strong>.</p>\n<h4>The CGMA Business Model Framework — Two Interconnected Models</h4>\n<div class=\"fw\"><strong>Strategic Model = Define + Capture</strong><ul><li><strong>Define:</strong> Identify and prioritise stakeholders; understand their needs; formulate value propositions</li><li><strong>Capture:</strong> Revenue earned must exceed costs of creating value; distribute the surplus to stakeholders</li></ul></div>\n<div class=\"fw\"><strong>Operating Model = Create + Deliver</strong><ul><li><strong>Create:</strong> Harness partners, resources, processes, activities, and outputs to produce goods/services</li><li><strong>Deliver:</strong> Get the value proposition to customers via appropriate channels at appropriate cost</li></ul></div>\n<h4>Stakeholder Analysis — Iterative 4-Step Process</h4>\n<ul>\n<li><strong>Step 1 – Identify:</strong> All stakeholders who benefit from or contribute to value (customers, shareholders, employees, suppliers)</li>\n<li><strong>Step 2 – Prioritise:</strong> Rank by Power (can impose their will), Legitimacy (actions deemed appropriate), and Urgency (immediate claims). Those with all three attributes receive highest priority. Customers typically rank first.</li>\n<li><strong>Step 3 – Identify Needs:</strong> Understand what high-priority stakeholders need through communication and data analytics</li>\n<li><strong>Step 4 – Formulate Value Propositions:</strong> Design offerings meeting those needs better than competitors</li>\n</ul>\n<h4>Value Capture</h4>\n<p>Value is captured when <strong>revenue earned from delivering value exceeds the costs of creating it</strong>. The three key considerations: the <em>cost model</em>, the <em>revenue model</em>, and the <em>distribution of surplus</em> among stakeholders.</p>\n<div class=\"kbox\"><strong>Exam Tip</strong>The CGMA Framework can be applied to: understand the current position; consider ecosystem changes; simulate new value approaches; improve decision quality; and facilitate planning and budgeting.</div>\n", "qa": [{"q": "Define a 'business model' according to the CGMA Framework.", "a": "The CGMA Business Model Framework defines a business model as <strong>\"the way in which a firm continually defines, creates, delivers, and captures value for, with, and to its key stakeholders as necessary over time.\"</strong> The common theme across all definitions is <em>value creation</em>."}, {"q": "What are the four stages of the CGMA Framework and which form the Strategic vs Operating model?", "a": "<strong>Strategic Model:</strong> Define + Capture — these go to the heart of organisational identity and funding decisions.<br/><strong>Operating Model:</strong> Create + Deliver — concerned with producing outputs and reaching customers.<br/><br/>Memory: <em>D-C-D-C: \"Define and Capture = Strategic; Create and Deliver = Operational.\"</em>"}, {"q": "List the four steps of Stakeholder Analysis and explain the prioritisation criteria.", "a": "<strong>1. Identify</strong> all stakeholders → <strong>2. Prioritise</strong> by Power, Legitimacy, and Urgency (highest priority = all three) → <strong>3. Identify Needs</strong> of high-priority stakeholders → <strong>4. Formulate Value Propositions</strong> meeting those needs.<br/><br/>Customers typically rank highest because they provide revenue (power), their interaction is socially accepted (legitimacy), and revenue loss is immediate (urgency)."}, {"q": "What are the five features of the Operating Model?", "a": "The five features that must connect and align: <strong>Partners, Resources, Processes, Activities, and Outputs.</strong> Each can be a source of competitive differentiation. All must work together to create value at an appropriate cost."}, {"q": "How is value captured under the CGMA Framework?", "a": "Value is captured when <strong>revenue earned exceeds the costs of creating value</strong>. The surplus must then be distributed among contributing stakeholders. Three issues: (1) the <em>cost model</em>, (2) the <em>revenue model</em>, (3) the <em>distribution of surplus</em>."}]}, {"id": "a2", "icon": "🌐", "title": "Business Models in Digital Ecosystems", "subtitle": "10 Digital Models · Digital Disruption · Platform Economy", "theory": "\n<h4>Traditional vs Digital Ecosystems</h4>\n<p><strong>Traditional:</strong> Supply-focused; linear path from business to customer; limited post-sale interaction; reliance on physical resources. Customers lose access once they leave the store/end the call.</p>\n<p><strong>Digital:</strong> Technology platforms create new opportunities; customers interact via websites, apps, and social media in real time; access to Big Data enables personalisation; non-linear, ecosystem-based relationships.</p>\n<div class=\"kbox\"><strong>Definition</strong>A digital ecosystem is <em>\"a group of interdependent organisations, people, and devices that share digital platforms for mutual benefit.\"</em></div>\n<h4>10 Digital Business Models</h4>\n<ul>\n<li><span class=\"tag tb\">Free</span> Revenue from ads/data, not the user. (Google, Facebook)</li>\n<li><span class=\"tag tb\">Freemium</span> Basic free; premium features paid. (LinkedIn, Fortnite)</li>\n<li><span class=\"tag ta\">Subscription</span> Monthly/annual fee for ongoing service. (Netflix, Spotify)</li>\n<li><span class=\"tag ta\">Sharing</span> Pay to use, not own. (Zipcar)</li>\n<li><span class=\"tag tg\">Peer-to-Peer</span> Platform facilitates exchanges between individuals. (eBay)</li>\n<li><span class=\"tag tg\">Supplier Model</span> Sell products via online intermediary. (Amazon Marketplace, Just Eat)</li>\n<li><span class=\"tag tb\">Omnichannel</span> Bundles products across multiple seamless channels. (Disney)</li>\n<li><span class=\"tag ta\">On-Demand</span> Immediate service access on request. (Uber, Lyft)</li>\n<li><span class=\"tag tg\">Modular Digital</span> Plug-in service across many ecosystems. (PayPal)</li>\n<li><span class=\"tag tb\">Ecosystem</span> Interdependent suite of products giving increasing value. (Apple, Alipay)</li>\n</ul>\n<h4>Digital Disruption</h4>\n<p><em>\"Transformation caused by emerging digital technologies and business models.\"</em> Board responsibilities: understand how technology disrupts the business model; innovate continuously; develop strategies quickly; view technology as an enabler; cultivate a culture of innovation; reallocate resources to best opportunities.</p>\n", "qa": [{"q": "What is a digital ecosystem and how does it differ from a traditional ecosystem?", "a": "<strong>Digital ecosystem:</strong> \"A group of interdependent organisations, people, and devices that share digital platforms for mutual benefit.\"<br/><br/><strong>Traditional:</strong> Supply-focused; linear business-to-customer path; limited post-sale interaction; physical assets dominant.<br/><strong>Digital:</strong> Platform-based; multiple real-time customer touchpoints; data analytics enables personalisation; non-linear interdependencies."}, {"q": "Name and briefly describe five digital business models with examples.", "a": "<ul><li><strong>Freemium:</strong> Basic free, premium paid (LinkedIn)</li><li><strong>Subscription:</strong> Regular fee for ongoing access (Netflix)</li><li><strong>Sharing:</strong> Pay to use, not own (Zipcar)</li><li><strong>On-Demand:</strong> Immediate service access (Uber)</li><li><strong>Ecosystem:</strong> Interdependent product suite with compounding value (Apple)</li></ul>"}, {"q": "Distinguish between the 'Omnichannel' and 'On-Demand' digital models.", "a": "<strong>Omnichannel:</strong> Bundles products and services, allowing customers to interact across multiple integrated channels (physical store, website, app, social media) for a seamless experience. Example: Disney.<br/><strong>On-Demand:</strong> Customers pay for a service they can access almost immediately, with minimal wait time. Example: Uber — request a ride and it arrives within minutes."}, {"q": "What are the board's key responsibilities in the face of digital disruption?", "a": "<ul><li>Understand the current business model and how technology may disrupt it</li><li>Innovate, improve, and view technology as an enabler</li><li>Understand and manage digital risks</li><li>Be willing to change the value proposition regularly</li><li>Cultivate a culture of innovation and change</li><li>Develop and deploy strategies quickly</li><li>Constantly reallocate resources to best opportunities</li></ul>"}]}, {"id": "a3", "icon": "⚙️", "title": "Operationalising the Business Model", "subtitle": "Strategic vs Operating Model · Value Questions · Framework Application", "theory": "\n<h4>Business Model and Strategy</h4>\n<p>The CGMA Framework makes <strong>no distinction</strong> between business model and strategy. Strategy is what keeps the business model relevant to the current ecosystem. The framework encompasses both the strategic model (Define + Capture) and the operating model (Create + Deliver).</p>\n<h4>Applying the Framework — Current Position Questions</h4>\n<div class=\"fw\"><strong>Define:</strong> What is our purpose? Who are our stakeholders and how should we prioritise them? What is our value proposition?</div>\n<div class=\"fw\"><strong>Create:</strong> For whom and with whom are we creating value? How are resources procured and converted to outputs customers want?</div>\n<div class=\"fw\"><strong>Deliver:</strong> To whom and how do we deliver value? How can technology help? How do we engage customers?</div>\n<div class=\"fw\"><strong>Capture:</strong> How do we capture value? How do we share surplus with our stakeholders? What do we reinvest?</div>\n<h4>Flexibility of the Framework</h4>\n<p>The framework can be used to: improve understanding of the current model; consider ecosystem change implications; simulate new value approaches; improve decision quality; facilitate strategic planning and budgeting; or provide a bird's-eye view of all business activities.</p>\n<div class=\"kbox\"><strong>Key Principle</strong>Strategy should be what keeps a business model relevant to its current ecosystem — including society, markets, technology, and risk and opportunity.</div>\n", "qa": [{"q": "How does the CGMA Framework relate business model to competitive strategy?", "a": "The CGMA Framework makes <strong>no distinction</strong> between them. A business model describes how the business generates value; strategy is what keeps that model relevant to the evolving ecosystem. A competitive strategy explains how the firm's value proposition will be <em>superior to rivals</em> — but this is embedded within the business model itself."}, {"q": "Give four ways the CGMA Business Model Framework can be operationalised.", "a": "<ul><li>Improve understanding of <em>how the business currently creates value</em></li><li>Consider the implications of <em>ecosystem changes</em> (new regulations, competitor moves, technology shifts)</li><li>Simulate <em>new ways the business could create value</em> (growth strategy testing)</li><li>Improve <em>decision quality</em> by enabling consequences to be identified before committing</li><li>Facilitate <em>strategic planning and budgeting</em> for major projects</li></ul>"}, {"q": "What are the five features of the Operating Model that must align?", "a": "<strong>Partners, Resources, Processes, Activities, and Outputs.</strong> These five must connect and align with each other to create value at an appropriate cost. Each can be a source of competitive differentiation that provides customers with the products, services, and experiences they require."}]}, {"id": "a4", "icon": "🌍", "title": "Organisation Ecosystems", "subtitle": "PESTEL · Porter's Five Forces · Markets · Society · Technology", "theory": "\n<h4>The Organisation Ecosystem</h4>\n<p>Every organisation operates within an <strong>ecosystem</strong> — a network of interdependent organisations, markets, and societal forces. Unlike \"environment,\" <em>ecosystem</em> emphasises mutual dependency and the need for sustainable, mutually beneficial relationships.</p>\n<h4>Four Elements of the Ecosystem</h4>\n<ul>\n<li><strong>Markets:</strong> Where organisations interact with customers, suppliers, partners, and competitors. Enables exchange, competition, and profit. Includes product markets, financial markets, and labour markets.</li>\n<li><strong>Society:</strong> Governments, regulators, communities, and civil organisations regulate through laws, customs, and norms. ESG (environmental, social, governance) issues have raised society's profile significantly.</li>\n<li><strong>Technology:</strong> Enables interaction; drives market and societal change; can create or destroy competitive advantage. Examples: Uber disrupted transport; Amazon disrupted retail.</li>\n<li><strong>Risk and Opportunity:</strong> Interactions within the ecosystem generate both risks (events preventing objectives) and opportunities (collaboration, competition, innovation possibilities).</li>\n</ul>\n<h4>PESTEL Framework — Analysing Society's Impact</h4>\n<ul>\n<li><strong>P</strong>olitical – Government policy, political stability, trade agreements</li>\n<li><strong>E</strong>conomic – Interest rates, inflation, economic growth, unemployment</li>\n<li><strong>S</strong>ocial – Demographics, cultural trends, consumer attitudes</li>\n<li><strong>T</strong>echnological – Innovation, automation, digital disruption</li>\n<li><strong>E</strong>nvironmental – Climate change, sustainability, green regulations</li>\n<li><strong>L</strong>egal – Employment law, consumer protection, health &amp; safety</li>\n</ul>\n<h4>Porter's Five Forces — Analysing Market Dynamics</h4>\n<ul>\n<li><strong>Threat of New Entrants</strong> – Ease of entering the market (barriers to entry)</li>\n<li><strong>Bargaining Power of Suppliers</strong> – Suppliers' ability to demand higher prices</li>\n<li><strong>Bargaining Power of Buyers</strong> – Customers' ability to push prices down</li>\n<li><strong>Threat of Substitutes</strong> – Availability of alternative products/services</li>\n<li><strong>Competitive Rivalry</strong> – Intensity of competition among existing players</li>\n</ul>\n<div class=\"kbox\"><strong>Key Distinction</strong>PESTEL analyses MACRO-ENVIRONMENT (society's impact). Porter's Five Forces analyses the COMPETITIVE ENVIRONMENT (market dynamics). Both are tools for ecosystem analysis.</div>\n", "qa": [{"q": "Distinguish between 'environment' and 'ecosystem' in a business context.", "a": "Both terms can be used interchangeably, but <strong>\"ecosystem\"</strong> specifically emphasises the <em>dependency of organisations on other parties</em> and the need to build <em>sustainable, mutually beneficial relationships</em>. The biological analogy highlights that organisations, like organisms, cannot thrive in isolation — they must interact with, and depend on, other participants in their environment."}, {"q": "Name Porter's Five Forces. When is this model used rather than PESTEL?", "a": "Porter's Five Forces: <strong>(1) Threat of New Entrants, (2) Bargaining Power of Suppliers, (3) Bargaining Power of Buyers, (4) Threat of Substitutes, (5) Competitive Rivalry.</strong><br/><br/>Use Porter's when analysing <em>market/competitive dynamics</em> within a specific industry. Use PESTEL when analysing <em>macro-environmental (societal) forces</em> affecting the organisation broadly."}, {"q": "What does PESTEL stand for and what aspect of the ecosystem does it analyse?", "a": "PESTEL: <strong>Political, Economic, Social, Technological, Environmental, Legal.</strong> It analyses the <em>macro-environmental (societal) impact</em> on organisations — broad external forces that all businesses must consider but cannot directly control."}]}]}, "B": {"title": "Leading & Managing People", "icon": "👥", "lessons": [{"id": "b1", "icon": "🗂️", "title": "Functions of Management", "subtitle": "Koontz & O'Donnel · 5 Functions · 3 Ts · Leading vs Lagging Indicators", "theory": "\n<h4>What is Management?</h4>\n<p>Management is the process of <strong>efficiently and effectively using resources</strong> to achieve organisational goals. Resources include people, knowledge, machinery, technology, capital, and customers. Management comprises three core essentials: Planning &amp; Organising, Aligning People, and Monitoring Performance.</p>\n<h4>Koontz &amp; O'Donnel's Five Functions</h4>\n<ul>\n<li><strong>1. Planning</strong> – Determining goals and how to achieve them; forecasting; setting objectives; developing strategies</li>\n<li><strong>2. Organising</strong> – Ensuring all resources are available and operate together; establishing structures; coordinating roles</li>\n<li><strong>3. Staffing</strong> – Recruiting, selecting, and training the right people with the right skills</li>\n<li><strong>4. Directing</strong> – Motivating and supervising staff; communicating plans; providing leadership</li>\n<li><strong>5. Controlling</strong> – Measuring actual vs. predetermined performance; taking corrective action</li>\n</ul>\n<div class=\"kbox\"><strong>Important</strong>The five functions are NOT distinct steps — they overlap and interact continuously. Controlling often triggers re-planning, re-organising, or re-staffing.</div>\n<h4>The 3 Ts of Management Resources</h4>\n<p><strong>Time, Talent, and Treasure (financial resources).</strong> Effective managers plan and organise all three in alignment with organisational goals. Highest-performing people should be assigned to the most important, highest-priority projects.</p>\n<h4>Leading vs Lagging Indicators</h4>\n<p><strong>Lagging indicators</strong> show current state / past results (e.g., quarterly revenue). <strong>Leading indicators</strong> predict future performance (e.g., sales pipeline, customer enquiries). Effective performance management uses both.</p>\n", "qa": [{"q": "Name and define Koontz &amp; O'Donnel's five functions of management.", "a": "<strong>1. Planning</strong> – Thinking about what needs to be done to meet goals<br/><strong>2. Organising</strong> – Structuring resources and roles to operate effectively<br/><strong>3. Staffing</strong> – Ensuring the right people with right skills are employed<br/><strong>4. Directing</strong> – Motivating and guiding employees; providing leadership<br/><strong>5. Controlling</strong> – Measuring actual performance vs objectives; corrective action"}, {"q": "What are the \"3 Ts\" and why do they matter?", "a": "<strong>Time, Talent, and Treasure (financial resources).</strong> Every management decision involves planning and allocating these three resources. Effective managers ensure their highest-skilled people (talent) are working on the highest-priority projects, that there is sufficient time to complete them, and that financial resources are directed where they will have maximum impact."}, {"q": "Distinguish between leading and lagging performance indicators.", "a": "<strong>Lagging indicators:</strong> Backward-looking; show results already achieved (e.g., last quarter's revenue, completed customer complaints). Tell you where you are.<br/><strong>Leading indicators:</strong> Forward-looking; predict future performance (e.g., new sales enquiries, employee satisfaction scores). Tell you where you are headed.<br/>Best practice: use a blend of both to monitor and steer performance effectively."}]}, {"id": "b2", "icon": "🎯", "title": "Leadership Styles", "subtitle": "Management vs Leadership · RACI · Direct vs Develop · Three Cs of Ethics", "theory": "\n<h4>Management vs Leadership</h4>\n<ul>\n<li><strong>Management:</strong> Focuses on processes, efficiency, and maintaining the status quo. Uses tools like RACI and KPIs. \"Keeping things running.\"</li>\n<li><strong>Leadership:</strong> Focuses on people, change, and inspiring others to achieve results beyond the ordinary. Both skill sets are essential for success.</li>\n</ul>\n<h4>The RACI Chart (Management Tool)</h4>\n<ul>\n<li><strong>R – Responsible:</strong> The person(s) who carry out the task</li>\n<li><strong>A – Accountable:</strong> The single person ultimately answerable for the result (one per task)</li>\n<li><strong>C – Consulted:</strong> Those who provide input before decisions are made</li>\n<li><strong>I – Informed:</strong> Those kept up to date after decisions are made</li>\n</ul>\n<h4>Direct vs Develop Continuum</h4>\n<p>Leaders must judge whether to direct (tell staff exactly what to do) or develop (give autonomy to grow). Five factors guide this decision:</p>\n<ul>\n<li>Employee's <strong>expertise</strong> in the specific task</li>\n<li><strong>Importance</strong> of the deliverable to the organisation</li>\n<li><strong>Time urgency</strong> of completion</li>\n<li><strong>Frequency</strong> with which the task is performed (repetition builds expertise)</li>\n<li>Criticality of the <strong>implementation plan</strong> to overall strategy</li>\n</ul>\n<h4>The Three Cs of Ethical Leadership</h4>\n<ul>\n<li><strong>Competence</strong> – Technical and leadership skills (baseline expectation)</li>\n<li><strong>Character</strong> – Trustworthiness; \"if they don't trust you, they won't follow you\"</li>\n<li><strong>Commitment</strong> – To your team's success; once you lead people, it is no longer about you — their success IS your success</li>\n</ul>\n<div class=\"kbox\"><strong>Key Fact</strong>75% of employees quit their bosses, not their jobs. Strong leadership skills are the single most important factor in talent retention.</div>\n", "qa": [{"q": "What does RACI stand for and why is one 'A' per task essential?", "a": "<strong>R – Responsible, A – Accountable, C – Consulted, I – Informed.</strong><br/>Exactly <em>one person</em> must be Accountable for each task. If accountability is shared, no one truly owns it — tasks fall through the cracks and blame becomes diffuse. The RACI chart prevents role confusion, ensures decisions involve the right people, and keeps the right people informed."}, {"q": "What five factors determine whether a leader should direct or develop?", "a": "<ol><li>Employee's <strong>expertise</strong> in this specific task</li><li><strong>Importance</strong> of the deliverable to the organisation</li><li><strong>Time urgency</strong> — how critical is the deadline?</li><li><strong>Frequency</strong> — tasks done repeatedly build expertise over time</li><li>Criticality of the <strong>implementation plan</strong> to organisational strategy</li></ol>Low expertise + urgent + critical → Direct. High expertise + frequent + lower importance → Develop and give autonomy."}, {"q": "Explain the Three Cs of ethical leadership.", "a": "<strong>Competence:</strong> Technical and leadership ability — the baseline all leaders need.<br/><strong>Character:</strong> Trust and integrity — without it, people will not follow you regardless of your title.<br/><strong>Commitment:</strong> To your team's success, not your own. The moment you lead people, you must put their development and outcomes first. Your success as a leader derives from their success."}]}, {"id": "b3", "icon": "🔄", "title": "Leading Organisational Change", "subtitle": "Incremental vs Disruptive · Rally-Drive-Sustain · Transformational Leadership", "theory": "\n<h4>Diagnosing Change</h4>\n<ul>\n<li><strong>Incremental change:</strong> Minor modifications to improve existing processes; difficult but manageable</li>\n<li><strong>Disruptive change:</strong> Radical pivot due to major external forces; very time-intensive and resource-heavy</li>\n</ul>\n<p>Also consider the organisation's lifecycle stage: startup → scale → implement processes → turnaround → sustain.</p>\n<h4>Three Common Phases of Change (Rally – Drive – Sustain)</h4>\n<ul>\n<li><strong>1. Rally (Unfreeze):</strong> Build the compelling case for change. Communicate the top 3 reasons WHY. Use stories and real human impact examples, not just statistics. Address the burning platform or compelling opportunity.</li>\n<li><strong>2. Drive (Change):</strong> Define exactly what people must do differently and why. Set clear guardrails (ideal vs acceptable vs unacceptable). Identify and engage key stakeholders inside and outside the organisation.</li>\n<li><strong>3. Sustain (Refreeze):</strong> Embed new ways of working. Use multiple channels, a clear one-sentence message, at sufficient frequency. Build your team's capability to handle future changes more effectively.</li>\n</ul>\n<h4>Transformational vs Transactional Leadership in Change</h4>\n<ul>\n<li><strong>Transformational:</strong> Inspires people to go beyond self-interest for organisational good; required for major organisational change</li>\n<li><strong>Transactional:</strong> Focuses on rewarding high performance and correcting low performance; effective for maintaining current operations but insufficient for driving major change</li>\n</ul>\n<div class=\"kbox\"><strong>Critical Statistic</strong>Less than 50% of change initiatives meet organisations' internal performance metrics. Change leadership is therefore one of the most valuable and learnable managerial skills.</div>\n", "qa": [{"q": "Distinguish between incremental and disruptive change.", "a": "<strong>Incremental change:</strong> Minor modifications to existing processes to improve performance. Difficult but manageable within existing structures, timelines, and resources.<br/><br/><strong>Disruptive change:</strong> A fundamental pivot in strategy or operations, triggered by major external forces (new technology, regulatory shift, market disruption). Very time-intensive, resource-heavy, and requires strong transformational leadership."}, {"q": "Describe the three phases of change (Rally – Drive – Sustain) and give a key action for each.", "a": "<strong>Rally:</strong> Build the case. Communicate the top three reasons for change (the \"why\"). Use stories that connect to real people, not just data slides.<br/><strong>Drive:</strong> Define what changes, and set guardrails. Identify key stakeholders and get them involved. Make clear what \"ideal,\" \"acceptable,\" and \"unacceptable\" looks like.<br/><strong>Sustain:</strong> Choose the right channels, a consistent headline message (one sentence), and appropriate frequency. Keep repeating until people have truly internalised the change."}, {"q": "Why is the \"why\" more important than the \"what\" in change leadership?", "a": "People cannot engage meaningfully with what needs to change until they understand <em>why</em> it is necessary. Without a compelling \"why\" — a burning platform or compelling opportunity — people assume change is arbitrary, resist it, and revert to old habits once pressure decreases. The \"why\" provides emotional motivation that sustains commitment through the hard phases of change."}]}, {"id": "b4", "icon": "🧘", "title": "Managing Yourself", "subtitle": "Emotional Intelligence · Goleman's 5 Components · Time Management", "theory": "\n<h4>Emotional Intelligence (EI) — Goleman's 5 Components</h4>\n<ul>\n<li><strong>Self-Awareness:</strong> Recognising your own emotions and understanding how they affect your thoughts and behaviour and impact on others</li>\n<li><strong>Self-Regulation:</strong> Controlling disruptive impulses and emotions; thinking before acting; maintaining professionalism under pressure</li>\n<li><strong>Motivation:</strong> Intrinsic drive to achieve beyond money and status; passion for work itself; optimism and resilience</li>\n<li><strong>Empathy:</strong> Understanding and considering others' emotions when making decisions; essential for managing diverse teams</li>\n<li><strong>Social Skills:</strong> Building networks; managing relationships to move people in desired directions; effective communication and influence</li>\n</ul>\n<div class=\"kbox\"><strong>Why EI Matters</strong>Leaders with high EI retain talent longer, manage conflict more constructively, adapt their style to situations, and build higher-performing teams. Technical skill gets you promoted; EI determines your success as a leader.</div>\n<h4>Time and Priority Management</h4>\n<p>Effective self-management requires distinguishing <strong>urgent vs important</strong> tasks (Eisenhower Matrix). Leaders must delegate tasks others can do well, freeing themselves for high-impact leadership activities only they can perform. Personal priorities must align with organisational goals.</p>\n<h4>Continuous Personal Development</h4>\n<p>Effective managers actively seek feedback, reflect on performance, identify skill gaps, and create structured Personal Development Plans (PDPs) linked to both current role needs and career aspirations.</p>\n", "qa": [{"q": "Name and explain Goleman's five components of Emotional Intelligence.", "a": "<strong>1. Self-Awareness:</strong> Knowing your emotions and how they affect others<br/><strong>2. Self-Regulation:</strong> Controlling impulses; managing emotions constructively under pressure<br/><strong>3. Motivation:</strong> Inner drive to achieve beyond external rewards; optimism; resilience<br/><strong>4. Empathy:</strong> Understanding others' feelings and perspectives when making decisions<br/><strong>5. Social Skills:</strong> Managing relationships; influencing; communicating; building teams"}, {"q": "Why does emotional intelligence become more important as seniority increases?", "a": "At higher levels, technical skills become assumed and less differentiating. Success depends increasingly on: motivating diverse teams; navigating organisational politics; managing complex stakeholder relationships; leading through uncertainty; and inspiring commitment rather than just compliance. All of these rely on EI. Research consistently shows EI accounts for a larger proportion of leadership effectiveness than IQ at senior levels."}]}, {"id": "b5", "icon": "🌟", "title": "Strategic Talent Management", "subtitle": "EVP · Critical Roles · 80-20 Rule · Capability Planning", "theory": "\n<h4>What is Strategic Talent Management?</h4>\n<p>Linking your team's capabilities to the organisation's strategy — ensuring you have the right people with the right skills to execute both today's and tomorrow's strategy. Effective leaders treat talent as a <strong>strategic differentiator</strong>.</p>\n<h4>Three Core Questions</h4>\n<ul>\n<li>What is <strong>today's strategy vs tomorrow's strategy</strong> — and what is the gap?</li>\n<li>What <strong>capabilities</strong> are needed now and in the future?</li>\n<li>Which <strong>roles</strong> are most critical to executing the strategy?</li>\n</ul>\n<h4>The 80-20 Rule in Talent</h4>\n<p>20% of roles have 80% of the strategic impact. Identify your <strong>critical roles</strong>, assess bench strength in them, and concentrate talent investment there. Not all roles — and not all people — have equal strategic impact.</p>\n<h4>Employee Value Proposition (EVP)</h4>\n<p>To attract and retain top talent, organisations must offer a compelling answer to: <em>\"Why should I choose your organisation?\"</em></p>\n<ul>\n<li><strong>Great Company:</strong> Shared values, culture, purpose, reputation, work environment</li>\n<li><strong>Great Job:</strong> Meaningful, challenging work with autonomy and recognition</li>\n<li><strong>Great Career:</strong> Learning, growth opportunities, and advancement potential</li>\n</ul>\n<div class=\"kbox\"><strong>Best Practice</strong>Growing existing employees is the most effective talent strategy. They already know the mission, are committed, and you have already invested in them. Upskilling in critical roles builds bench strength and competitive advantage.</div>\n", "qa": [{"q": "What is the Employee Value Proposition (EVP) and why does it matter?", "a": "The EVP is the compelling set of reasons why talented individuals should choose to work for an organisation over competitors. It has three components:<br/><strong>1. Great Company</strong> – Values, culture, purpose, and work environment that resonate<br/><strong>2. Great Job</strong> – Meaningful, challenging work with autonomy and recognition<br/><strong>3. Great Career</strong> – Learning, progression, and long-term growth opportunities<br/><br/>It matters because in competitive talent markets, candidates have multiple offers. A strong EVP differentiates the organisation and reduces costly turnover."}, {"q": "How does the 80-20 rule apply to strategic talent management?", "a": "Only 20% of roles within an organisation deliver 80% of strategic value. Leaders should: (1) identify these <em>critical roles</em>; (2) assess current bench strength in them; (3) prioritise upskilling, development, and recruitment to fill gaps in exactly those roles. Spreading talent investment equally across all roles is inefficient — concentrate it where it will most powerfully drive the strategy."}]}, {"id": "b6", "icon": "🏛️", "title": "Organisational Culture", "subtitle": "Handy's 4 Types · Schein's 3 Levels · Culture Diamond · Change", "theory": "\n<h4>What is Organisational Culture?</h4>\n<p>Charles Handy: <em>\"The way we do things around here.\"</em> Culture is a system of customs, values, beliefs, and assumptions that guides behaviour. It is <strong>pervasive</strong> (affects everyone), <strong>enduring</strong> (persists through personnel changes), and <strong>hardwired</strong> (embedded in daily practice).</p>\n<h4>Schein's Three Levels of Culture (Iceberg Model)</h4>\n<ul>\n<li><strong>Artefacts</strong> – Visible surface level: logos, dress code, office layout, rituals. Easy to observe but hard to interpret.</li>\n<li><strong>Espoused Values</strong> – Stated beliefs, standards, codes of conduct, and organisational philosophy (what the company claims to believe)</li>\n<li><strong>Basic Assumptions</strong> – Deeply held, unconscious, automatic beliefs that actually drive behaviour (what the company <em>really</em> believes, often unstated). The most powerful level.</li>\n</ul>\n<div class=\"kbox\"><strong>Iceberg Analogy</strong>Artefacts are above the waterline (visible). Espoused values and basic assumptions are below — the largest and most powerful part of culture is usually invisible.</div>\n<h4>Handy's Four Culture Types</h4>\n<ul>\n<li><strong>Power Culture:</strong> Centralised around one key individual or group; fast decisions; spider's web structure; common in small entrepreneurial firms</li>\n<li><strong>Role Culture:</strong> Bureaucratic; well-defined roles and procedures; suited to stable environments; progress by position</li>\n<li><strong>Task Culture:</strong> Team and project-focused; flexible; matrix structure; emphasis on expertise; common in consultancies</li>\n<li><strong>Person Culture:</strong> Individuals are central; organisation exists to serve them; common among professionals (doctors, barristers)</li>\n</ul>\n<h4>Culture Diamond Framework</h4>\n<p>Two axes: <strong>Independence vs Interdependence</strong> (vertical) and <strong>Stability vs Flexibility</strong> (horizontal). Four quadrants identify winning, systemic, collaborative, and innovative culture orientations.</p>\n", "qa": [{"q": "Describe Schein's three levels of organisational culture.", "a": "<strong>1. Artefacts</strong> – What you can see, hear, and feel at surface level (logos, dress code, office design). Easy to observe but hard to interpret accurately.<br/><strong>2. Espoused Values</strong> – Explicitly stated beliefs, values, codes of conduct — what the organisation says it stands for.<br/><strong>3. Basic Assumptions</strong> – Deeply ingrained, unconscious beliefs that automatically guide behaviour — what the organisation actually does, regardless of what it says."}, {"q": "Name and describe Handy's four culture types.", "a": "<strong>Power:</strong> Centralised decision-making around a powerful individual; fast but potentially inconsistent; spider's web structure.<br/><strong>Role:</strong> Bureaucratic; rules-based; clear hierarchy; best in stable environments.<br/><strong>Task:</strong> Team/project-focused; flexible matrix structure; expertise matters more than position.<br/><strong>Person:</strong> Individual professionals are the central focus; the organisation exists to support them (doctors' practices, barristers' chambers)."}, {"q": "Why is culture change so difficult to achieve?", "a": "Culture operates at the level of <em>basic assumptions</em> — deeply embedded, often unconscious beliefs that feel like \"the natural way things are.\" These are resistant to change because: they are self-reinforcing through daily habits; employees who identify with the culture will resist changes to it; and cultural conflict is especially severe in mergers and acquisitions. Sustained culture change typically takes years and requires consistent behaviour modelling from leadership."}]}, {"id": "b7", "icon": "🌎", "title": "National Culture", "subtitle": "Hofstede's 6-D Model · Power Distance · Individualism · Uncertainty Avoidance", "theory": "\n<h4>Hofstede's 6-D Model of National Culture</h4>\n<p>Based on research with IBM employees across 70+ countries. Six cultural dimensions explain how national values influence workplace behaviours:</p>\n<ul>\n<li><strong>Power Distance:</strong> Acceptance of unequal power distribution. High: Asia, Arab, Africa. Low: Northern Europe, UK, US, Australia.</li>\n<li><strong>Individualism vs Collectivism:</strong> Degree of individual independence vs group integration. Individualist: US, Australia, Western Europe. Collectivist: China, Japan, Korea.</li>\n<li><strong>Uncertainty Avoidance:</strong> Tolerance for ambiguity and change. High (avoid uncertainty): Germany, Belgium. Low (embrace change): Sweden, Denmark, Singapore.</li>\n<li><strong>Masculinity vs Femininity:</strong> Masculinity = achievement, assertiveness, material rewards. Femininity = cooperation, caring, quality of life. High masculinity: Japan, China, UK, US. Low: Scandinavia.</li>\n<li><strong>Long-term vs Short-term Orientation:</strong> Long-term = adaptation, pragmatism, future reward (East Asia). Short-term = tradition, present gratification (US, Latin America).</li>\n<li><strong>Indulgence vs Restraint:</strong> Freedom and enjoyment vs duty and control. Indulgent: Latin America, US, Australia. Restrained: East Asia, Eastern Europe.</li>\n</ul>\n<div class=\"kbox\"><strong>Caution</strong>Use the model as a guideline, not a rigid rule. Significant within-country variation exists. Avoid stereotyping individuals based on national origin. Cultures also evolve over time due to globalisation.</div>\n<h4>Business Applications</h4>\n<p>Understanding national culture is essential when: managing cross-cultural teams; expanding globally; negotiating with international partners; executing mergers and acquisitions across borders; and adapting communication and HR practices for different markets.</p>\n", "qa": [{"q": "Name Hofstede's six cultural dimensions with an example country for each.", "a": "<strong>1. Power Distance</strong> – High: China; Low: Denmark<br/><strong>2. Individualism vs Collectivism</strong> – Individualist: USA; Collectivist: Japan<br/><strong>3. Uncertainty Avoidance</strong> – High: Germany; Low: Singapore<br/><strong>4. Masculinity vs Femininity</strong> – Masculine: Japan; Feminine: Sweden<br/><strong>5. Long-term vs Short-term</strong> – Long-term: China; Short-term: USA<br/><strong>6. Indulgence vs Restraint</strong> – Indulgent: Australia; Restrained: China"}, {"q": "How does high vs low power distance affect management practice?", "a": "<strong>High power distance cultures</strong> (Asia, Arab world): employees expect clear hierarchy; subordinates defer to superiors; participative management may feel uncomfortable or inappropriate; decisions flow top-down.<br/><strong>Low power distance cultures</strong> (Northern Europe, US): employees expect to contribute to decisions; flat structures are preferred; managers who behave autocratically face resistance; open challenge of authority is more acceptable."}]}, {"id": "b8", "icon": "⚡", "title": "Leading & Motivating Professionals", "subtitle": "McGregor · Theory X & Y · Vroom's Expectancy Theory · Professional Motivation", "theory": "\n<h4>McGregor's Theory X and Theory Y</h4>\n<ul>\n<li><strong>Theory X:</strong> People inherently dislike work; must be controlled, coerced, directed, and threatened; avoid responsibility. Leads to authoritarian, micromanaging style.</li>\n<li><strong>Theory Y:</strong> People find work natural; exercise self-direction; seek responsibility; are creative when engaged. Leads to participative, empowering management style.</li>\n</ul>\n<div class=\"kbox\"><strong>Implication</strong>Most professionals — including accountants — respond much better to Theory Y approaches. Treating professionals as Theory X individuals damages motivation, creativity, and retention.</div>\n<h4>Vroom's Expectancy Theory</h4>\n<p><strong>Motivation = Expectancy × Instrumentality × Valence</strong></p>\n<ul>\n<li><strong>Expectancy:</strong> \"Will my effort lead to the required performance level?\" (Effort → Performance)</li>\n<li><strong>Instrumentality:</strong> \"If I perform well, will I actually receive the promised reward?\" (Performance → Reward)</li>\n<li><strong>Valence:</strong> \"Do I actually value that reward?\" (Reward → Personal Value)</li>\n</ul>\n<p>If any factor equals zero, total motivation = zero. This explains why unclear goals, unfair reward systems, or misaligned incentives kill motivation even when the other factors are strong.</p>\n<h4>Motivating Finance Professionals Specifically</h4>\n<ul>\n<li>Provide meaningful work with clear business impact</li>\n<li>Offer autonomy in how work is completed (professional discretion)</li>\n<li>Support continuous professional development and CPD</li>\n<li>Create a culture where challenge and expertise are respected</li>\n<li>Provide clear career advancement pathways</li>\n</ul>\n", "qa": [{"q": "Distinguish between McGregor's Theory X and Theory Y assumptions.", "a": "<strong>Theory X:</strong> People inherently dislike work, are lazy, avoid responsibility, and must be controlled, directed, and threatened with punishment to perform. Leads to authoritarian management.<br/><br/><strong>Theory Y:</strong> Work is as natural as play; people are self-directed when committed to goals; they seek responsibility; creativity is widespread. Leads to participative, trust-based management focused on engagement and empowerment."}, {"q": "Explain Vroom's Expectancy Theory using the formula.", "a": "<strong>Motivation = Expectancy × Instrumentality × Valence</strong><br/><ul><li><em>Expectancy:</em> Does the employee believe effort will produce the required performance?</li><li><em>Instrumentality:</em> Does the employee believe good performance will be rewarded?</li><li><em>Valence:</em> Does the employee actually value the reward on offer?</li></ul>Because this is a multiplication: if any factor = 0, total motivation = 0. Therefore all three must be managed simultaneously. Implication: set clear goals (E), deliver promised rewards fairly (I), and understand what employees actually value (V)."}]}, {"id": "b9", "icon": "🏅", "title": "Performance Appraisal & Reward", "subtitle": "360-Degree Feedback · Financial vs Non-financial Rewards · Fair Reward Systems", "theory": "\n<h4>Performance Appraisal Methods</h4>\n<ul>\n<li><strong>360-Degree Feedback:</strong> Input collected from peers, subordinates, line managers, and self-assessment. Provides a well-rounded view. Requires psychological safety and anonymity to be effective.</li>\n<li><strong>Management by Objectives (MBO):</strong> Employee and manager jointly set SMART objectives aligned to organisational goals. Performance assessed against agreed goals.</li>\n<li><strong>Behavioural Rating Scales (BARS):</strong> Rate specific observable behaviours rather than just results. Reduces subjectivity.</li>\n<li><strong>Ranking/Forced Distribution:</strong> Rank employees relative to each other. Controversial due to impact on collaboration and morale.</li>\n</ul>\n<h4>Reward Systems</h4>\n<div class=\"fw\"><strong>Financial Rewards</strong><ul><li>Base salary, performance bonuses, profit-sharing schemes, share options/equity</li></ul></div>\n<div class=\"fw\"><strong>Non-Financial Rewards</strong><ul><li>Recognition, praise, career development opportunities, increased autonomy, flexible working, prestigious project assignments</li></ul></div>\n<div class=\"kbox\"><strong>Key Principle</strong>Effective reward systems must be: perceived as fair and transparent; aligned with behaviours the organisation actually wants; tailored to what <em>employees</em> value (not just what management assumes they value). Link to Herzberg: salary is a hygiene factor; recognition and growth are true motivators.</div>\n", "qa": [{"q": "What are the benefits and limitations of 360-degree feedback?", "a": "<strong>Benefits:</strong> Provides a rounded view from multiple perspectives; identifies blind spots; reduces bias from single-rater systems; increases self-awareness; useful for development rather than just evaluation.<br/><strong>Limitations:</strong> Can be costly and time-consuming; may be gamed if not anonymous; can create anxiety; qualitative responses hard to aggregate; requires a psychologically safe culture to be effective."}, {"q": "Why must reward systems be aligned with what employees actually value?", "a": "Based on Vroom's Expectancy Theory, the <em>Valence</em> component — the subjective value an employee places on a reward — determines whether the reward motivates. If an organisation offers a bonus but an employee values flexible working more, the bonus has low valence and will not drive the desired behaviour. Managers must understand individual employee preferences and design reward systems accordingly."}]}, {"id": "b10", "icon": "📈", "title": "Performance Management", "subtitle": "Maslow · Herzberg Two-Factor · SMART Objectives · MBO · Control Levels", "theory": "\n<h4>Maslow's Hierarchy of Needs</h4>\n<p>Five levels (lowest to highest): <strong>Physiological → Safety → Social/Belonging → Esteem → Self-Actualisation.</strong> Lower needs must be met before higher needs motivate. A threat to a lower need (e.g., job security) causes focus to regress to that level.</p>\n<h4>Herzberg's Two-Factor (Motivation-Hygiene) Theory</h4>\n<ul>\n<li><strong>Motivators (intrinsic):</strong> Achievement, recognition, responsibility, advancement, growth, meaningful work. Presence creates positive satisfaction; absence causes mild dissatisfaction.</li>\n<li><strong>Hygiene Factors (extrinsic):</strong> Company policy, supervision, salary, working conditions, job security, relationships. Absence causes strong dissatisfaction; presence is merely expected, NOT motivating.</li>\n</ul>\n<div class=\"kbox\"><strong>Key Insight</strong>Satisfaction and dissatisfaction are independent scales, not opposites. Improving hygiene factors (e.g., raising salary) removes dissatisfaction but does NOT create motivation. Only motivators truly motivate. Implication: job enrichment (adding motivators) is more effective than pay rises alone.</div>\n<h4>SMART Objectives</h4>\n<ul><li><strong>S</strong>pecific – Precise about what, where, how, and when</li><li><strong>M</strong>easurable – Quantifiable; progress can be tracked</li><li><strong>A</strong>chievable – Realistic given available resources</li><li><strong>R</strong>elevant – Aligned with team and organisational vision</li><li><strong>T</strong>ime-oriented – Clear, realistic deadline</li></ul>\n<h4>Management by Objectives (MBO) — Peter Drucker</h4>\n<p>Cascading goal-setting: Organisation goals → Team goals → Individual goals. Employees participate in setting their own objectives, increasing commitment and alignment.</p>\n<h4>Three Levels of Management Control</h4>\n<ul><li><strong>Strategic:</strong> Board-level; oversight of strategy, structure, policy</li><li><strong>Tactical:</strong> Implementing strategy; budgeting; training; monitoring risk</li><li><strong>Operational:</strong> Structured, repetitive activities at lower organisational levels</li></ul>\n", "qa": [{"q": "Describe Maslow's Hierarchy of Needs and its management implications.", "a": "Five levels: <strong>Physiological (food, shelter) → Safety (job security) → Social (belonging, friendship) → Esteem (recognition, status) → Self-Actualisation (reaching full potential).</strong><br/><br/>Management implication: Lower needs must be met before higher-level rewards motivate. An employee worried about job security (safety) will not be motivated by praise (esteem). Managers must identify which level each employee is at and address those needs first."}, {"q": "Classify these as Motivators or Hygiene Factors: salary, achievement, recognition, job security, responsibility, working conditions.", "a": "<strong>Motivators (intrinsic):</strong> Achievement ✓, Recognition ✓, Responsibility ✓<br/><strong>Hygiene Factors (extrinsic):</strong> Salary ✓, Job Security ✓, Working Conditions ✓<br/><br/>Motivators relate to job content (what you do). Hygiene factors relate to job context (environment and conditions). Improving hygiene eliminates dissatisfaction; only motivators create positive satisfaction and drive performance."}, {"q": "What does SMART stand for in objective-setting?", "a": "<strong>S – Specific:</strong> Clear about exactly what needs to be achieved<br/><strong>M – Measurable:</strong> Progress can be quantified and tracked<br/><strong>A – Achievable:</strong> Realistic given available time, skills, and resources<br/><strong>R – Relevant:</strong> Aligned with team and organisational goals<br/><strong>T – Time-oriented:</strong> Has a clear and realistic deadline"}]}, {"id": "b11", "icon": "⚠️", "title": "Corrective Action & Discipline", "subtitle": "Progressive Discipline · 8 Steps · Performance vs Conduct · Fair Procedures", "theory": "\n<h4>Key Principles</h4>\n<ul>\n<li><strong>Performance vs Conduct:</strong> Performance = how well the job is done. Conduct = personal behaviour in the workplace. Different issues may require different approaches.</li>\n<li><strong>Fairness:</strong> Equal, unbiased treatment for all employees under the policy</li>\n<li><strong>Transparency:</strong> Clear, published standards; stated consequences for violations</li>\n<li><strong>Timeliness:</strong> Prompt communication of underperformance; timely grievance resolution</li>\n<li><strong>Written policies:</strong> Must be documented, public, and accessible</li>\n</ul>\n<h4>8 Steps of Progressive Discipline</h4>\n<ol>\n<li><strong>Develop and disseminate a clear written policy</strong></li>\n<li><strong>Praise (Micro-intervention):</strong> Catch employees doing something well; specific positive reinforcement</li>\n<li><strong>Counsel (Micro-intervention):</strong> Identify specific behaviours falling short; coach informally; ascertain whether employee understands requirements</li>\n<li><strong>Verbal Reprimand:</strong> Formal oral warning; supervisor documents in their own files</li>\n<li><strong>Written Reprimand:</strong> Formal written warning; copy to employee; make clear next step is suspension</li>\n<li><strong>Suspension without Pay:</strong> Time-limited; inform employee termination follows if no improvement; involve legal counsel</li>\n<li><strong>Termination:</strong> Witness present; employee collects belongings and leaves immediately</li>\n<li><strong>Grievance Process:</strong> Employee's right to contest any disciplinary action through established procedures</li>\n</ol>\n<div class=\"kbox\"><strong>Goal</strong>Progressive discipline is NOT punishment. Its purpose is to help the employee overcome performance problems and become an effectively contributing member of the organisation. Context and extenuating circumstances must always be considered.</div>\n", "qa": [{"q": "What is progressive discipline and what is its primary goal?", "a": "Progressive discipline is a system for dealing with job-related performance shortfalls through a series of increasingly formal steps. Its primary goal is <strong>NOT punishment</strong> — it is to help the employee <em>understand the performance problem, recognise improvement opportunities, and succeed</em> within the organisation. The \"progressive\" refers to escalating formality, not to enlightened thinking."}, {"q": "What actions must occur BEFORE a written reprimand in progressive discipline?", "a": "Before a written reprimand: (1) Clear written policy must exist and be communicated; (2) Micro-intervention: Praise good behaviours; (3) Micro-intervention: Informal counselling to address the specific behaviour; (4) <strong>Verbal Reprimand</strong> — a formal oral warning, documented in the supervisor's records but not yet in company files.<br/><br/>Only after all these steps have been taken and the problem persists should a written reprimand be issued."}, {"q": "What principles must underpin any corrective action system?", "a": "<ul><li><strong>Fairness</strong> – Equal, unbiased treatment for all</li><li><strong>Transparency</strong> – Policies are clear, public, and state consequences explicitly</li><li><strong>Timeliness</strong> – Prompt feedback and prompt grievance resolution</li><li><strong>Written documentation</strong> – All policies and actions formally recorded</li><li><strong>Employee right of appeal</strong> – Grievance procedures available to all employees</li></ul>"}]}, {"id": "b12", "icon": "🤝", "title": "Team Building", "subtitle": "Tuckman's 5 Stages · Belbin's 9 Roles · Stage-Appropriate Actions", "theory": "\n<h4>Tuckman's Five Stages of Team Development</h4>\n<ul>\n<li><strong>1. Forming:</strong> Initial stage; roles undefined; high dependency on leader; low effectiveness. <em>Actions: team-building activities, informal discussions, introductions.</em></li>\n<li><strong>2. Storming:</strong> Conflict and power struggles; decision-making difficult; individuals challenge each other. <em>Actions: structured discussion of all views, conflict management, strong communication and compromise.</em></li>\n<li><strong>3. Norming:</strong> Roles defined; mutual respect established; commitment to shared goals; effectiveness improving. <em>Actions: reinforce positive norms, continue building cohesion.</em></li>\n<li><strong>4. Performing:</strong> Most effective stage; team operates optimally; members support each other; goals achieved efficiently.</li>\n<li><strong>5. Dorming/Adjourning:</strong> Added later by Tuckman. Effectiveness drops due to complacency and groupthink if the team stays together too long. <em>Action: refresh team composition or formally adjourn the team.</em></li>\n</ul>\n<h4>Belbin's Nine Team Roles</h4>\n<ul>\n<li><strong>Co-ordinator:</strong> Confident; sets goals; delegates. Can over-delegate.</li>\n<li><strong>Resource Investigator:</strong> Enthusiastic; generates ideas; outgoing. Loses interest over time.</li>\n<li><strong>Teamworker:</strong> Cooperative; diffuses conflict; builds relationships. Indecisive under pressure.</li>\n<li><strong>Plant:</strong> Creative; unorthodox problem-solver. Poor communicator; ignores practicalities.</li>\n<li><strong>Monitor Evaluator:</strong> Analytical; objective; critical thinker. Lacks drive; overly sceptical.</li>\n<li><strong>Specialist:</strong> Deep expert knowledge. Limited breadth of contribution.</li>\n<li><strong>Shaper:</strong> Challenges and drives team; thrives under pressure. Can be abrasive and aggressive.</li>\n<li><strong>Implementer:</strong> Reliable; efficient; turns decisions into actions. Slow to adapt; inflexible.</li>\n<li><strong>Completer-Finisher:</strong> Perfectionist; ensures deadlines met. Anxious; reluctant to delegate.</li>\n</ul>\n<div class=\"kbox\"><strong>Key Insight</strong>A well-balanced team needs a mix of all nine role types. In smaller teams, individuals may need to fill more than one role. A team lacking any role type will struggle in that area.</div>\n", "qa": [{"q": "Describe Tuckman's five stages and the leader's key action at each.", "a": "<strong>Forming:</strong> Coming together; use team-building activities and informal discussions.<br/><strong>Storming:</strong> Conflict/power struggles; leader must manage through communication, structured discussion, and compromise.<br/><strong>Norming:</strong> Agreement on roles and norms; reinforce positive behaviours.<br/><strong>Performing:</strong> Optimal effectiveness; enable autonomy; celebrate achievements.<br/><strong>Dorming/Adjourning:</strong> Complacency sets in; refresh team composition or formally close the team before groupthink takes hold."}, {"q": "What is groupthink and at which Tuckman stage is it most likely?", "a": "Groupthink is the phenomenon where a highly cohesive team prioritises consensus and harmony over critical analysis. Dissenting views are suppressed, leading to poor-quality decisions. It is most likely at the <strong>Dorming stage</strong> — when a team that has been together too long becomes too comfortable, complacent, and unwilling to challenge each other or reinvent their approach."}, {"q": "Name all nine Belbin team roles and identify three that focus primarily on social/interpersonal functions.", "a": "Nine roles: Co-ordinator, Resource Investigator, Teamworker, Plant, Monitor Evaluator, Specialist, Shaper, Implementer, Completer-Finisher.<br/><br/>Three with primarily interpersonal/social focus: <strong>Co-ordinator</strong> (delegates, facilitates), <strong>Teamworker</strong> (diffuses conflict, builds relationships), and <strong>Resource Investigator</strong> (networks, builds external contacts)."}]}, {"id": "b13", "icon": "🏆", "title": "High Performing Teams", "subtitle": "Groups vs Teams · Merits · New Team Kickoff · Virtual Teams", "theory": "\n<h4>Groups vs Teams — The Key Difference</h4>\n<ul>\n<li><strong>Group:</strong> Collection of individuals; tasks are <em>independent</em> of each other; one person's outcome does not directly affect others</li>\n<li><strong>Team:</strong> Collection of individuals with <em>interdependent</em> tasks working towards a shared goal; if one member fails, the whole team is affected</li>\n</ul>\n<p><em>Analogy: Airline passengers = group (independent). Flight crew = team (if the pilot is missing, no one flies).</em></p>\n<h4>Eight Common Team Challenges</h4>\n<p>Purpose, Strategy, Roles, Technology, Communication, Operations, People, and Performance — each must be explicitly addressed in any new team setup.</p>\n<h4>Merits of Using Teams</h4>\n<ul>\n<li><strong>Efficiency and Synergy:</strong> Parallel working and complementary skills create the 2+2=5 effect</li>\n<li><strong>Focus:</strong> Individual members concentrate on specific tasks; team leader maintains the \"bigger picture\"</li>\n<li><strong>Job Satisfaction and Motivation:</strong> Belonging, peer support, shared identity, and collective pride</li>\n<li><strong>Control:</strong> Team norms guide behaviour; peer pressure enforces standards without formal management intervention</li>\n</ul>\n<h4>New Team Kickoff Checklist (3 Cs)</h4>\n<ul>\n<li><strong>Clarify:</strong> Goals, expectations, resources (3 Ts), metrics, and WIIFM (What's In It For Me)</li>\n<li><strong>Compose:</strong> Ideal size 3–5; maximise diversity; balance Belbin roles</li>\n<li><strong>Comm
