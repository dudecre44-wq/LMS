"theory":"<h4>Annuity — Definition and Factor</h4><p>An annuity is a <strong>constant cash flow</strong> that recurs at regular intervals over a defined period. Instead of discounting each cash flow individually, an Annuity Factor (AF) allows calculation of the PV of all annuities in one step.</p><div class='fw'><strong>Annuity Factor (AF) Formula:</strong><br>AF = [1 − (1 + r)⁻ⁿ] ÷ r<br>Where r = cost of capital (as a del); n = number of periods<br><br><strong>PV of annuity = Annual cash flow × AF(r, n)</strong></div><h4>Perpetuity — Definition and Factor</h4><p>A perpetuity is a constant cash flow that continues <strong>indefinitely</strong> (no end date).</p><div class='fw'><strong>Perpetuity Factor (PF) = 1 ÷ r</strong><br><strong>PV of perpetuity = Annual cash flow ÷ r</strong></div><h4>Growing Perpetuity (Dividend Growth Model)</h4><div class='fw'><strong>Growing Perpetuity Factor = 1 ÷ (r − g)</strong><br>Where g = constant growth rate per period<br><strong>PV = Cash flow ÷ (r − g)</strong><br>Applicable when r &gt; g</div><div class='kbox'><strong>When to Use</strong>Annuity factors: projects where the same cash flow recurs for a set number of years (leases, regular savings). Perpetuity factors: projects where income continues indefinitely (e.g., property rentals, shares under the dividend growth model). Both save significant calculation time vs discounting each period individually.</div>",
"qa":[
{"q":"A project generates $50,000 per year for 6 years. Cost of capital = 8%. AF(8%,6) = 4.623. Calculate the PV.","a":"PV = Annual cash flow × Annuity Factor<br>PV = $50,000 × 4.623 = <strong>$231,150</strong>"},
{"q":"A property generates $30,000 rent per year in perpetuity. Cost of capital = 6%. Calculate the PV.","a":"PV of perpetuity = Annual cash flow ÷ r<br>PV = $30,000 ÷ 0.06 = <strong>$500,000</strong>"},
{"q":"A dividend of $4 per share is expected to grow at 3% per year in perpetuity. Cost of capital = 11%. Calculate the share's intrinsic value.","a":"PV = D₁ ÷ (r − g)<br>D₁ (next year's dividend) = $4 × 1.03 = $4.12<br>PV = $4.12 ÷ (0.11 − 0.03) = $4.12 ÷ 0.08 = <strong>$51.50 per share</strong>"},
{"q":"When is it preferable to use an annuity factor rather than discounting individual cash flows?","a":"Annuity factors are preferred when: (1) Cash flows are <em>constant</em> over all periods; (2) The number of periods is <em>large</em> (e.g., 20 years — discounting 20 individual cash flows is tedious); (3) <em>Accuracy</em> is not compromised — the AF calculation produces the same result as summing individual discount factors. They reduce calculation time significantly in examinations and in practice."}
]},
{"id":"d7","icon":"📊","title":"Profitability Index","subtitle":"PI formula · Capital rationing · Project ranking · Divisibility · Multi-period rationing",
"theory":"<h4>What is the Profitability Index?</h4><p>The Profitability Index (PI) calculates the NPV generated per unit of capital invested. It is used to rank competing projects when there is a <strong>capital rationing constraint</strong> (insufficient funds to invest in all positive-NPV projects).</p><div class='fw'><strong>PI = NPV ÷ Initial Capital Investment</strong><br>Rank projects from highest to lowest PI — select highest-ranked projects until funds are exhausted.</div><h4>Single-Period Capital Rationing — Process</h4><ol><li>Calculate NPV for all available projects</li><li>Calculate PI = NPV ÷ Capital required</li><li>Rank by PI (highest first)</li><li>Select projects in PI order until capital is exhausted</li><li>If a project is <em>divisible</em>: take a partial investment; earn a proportional NPV</li><li>If <em>indivisible</em>: cannot be partially undertaken — test alternative combinations</li></ol><div class='kbox'><strong>Divisibility Assumption</strong>If projects are divisible, the PI ranking always gives the optimal solution. If projects are indivisible (invest fully or not at all), test combinations of projects that use available capital fully — the combination maximising total NPV is optimal.</div><h4>Other Considerations</h4><ul><li>Non-financial factors may override PI ranking</li><li>Additional funding may become available — consider hybrid solutions</li><li>Multi-period rationing requires linear programming, not simple PI ranking</li></ul>",
"qa":[
{"q":"Three divisible projects: A (NPV $60k, cost $200k), B (NPV $50k, cost $100k), C (NPV $30k, cost $150k). Available capital = $300k. Rank by PI and determine optimal investment.","a":"PI: A = 60/200 = <strong>0.30</strong>; B = 50/100 = <strong>0.50</strong>; C = 30/150 = <strong>0.20</strong><br>Ranking: B (PI 0.50) → A (PI 0.30) → C (PI 0.20)<br>Invest: B = $100k (NPV $50k); A = $200k (NPV $60k); funds used = $300k.<br><strong>Total NPV = $110,000.</strong> No funds remain for C."},
{"q":"Why does the PI ranking not work for indivisible projects?","a":"If projects cannot be partially undertaken, the highest-PI projects may not use available capital fully — leaving 'slack' that could be used by a lower-PI project. Example: if available capital is $300k and the top two projects require $250k total, the remaining $50k is wasted under PI ranking. Testing all feasible combinations of complete projects that use the $300k identifies whether a different combination generates more total NPV."},
{"q":"When is PI insufficient and linear programming required instead?","a":"PI only works for <em>single-period capital rationing</em> (one period of restricted capital). If capital is restricted in <em>multiple periods simultaneously</em> — e.g., capital is limited in both Year 0 and Year 1 — projects cannot be ranked by a single PI ratio. Linear programming must be used to identify the combination of projects that maximises total NPV subject to the capital constraints in all restricted periods."}
]},
{"id":"d8","icon":"⏳","title":"Comparing Projects with Different Life Spans","subtitle":"Equivalent Annual Cost · EAC formula · Replacement cycle decisions · Annuity factor application",
"theory":"<h4>Why Different Life Spans Create a Problem</h4><p>When two projects have different durations and are part of a recurring replacement cycle, their NPVs cannot be directly compared — a longer project naturally has higher total costs/NPVs. The solution is the <strong>Equivalent Annual Cost (EAC)</strong>.</p><h4>Equivalent Annual Cost (EAC)</h4><div class='fw'><strong>EAC = Total PV of costs ÷ Annuity Factor (r, n)</strong><br>This converts the total PV of costs over the full project life into its <em>annual equivalent</em>, enabling fair comparison between options with different lifespans on a per-year basis.</div><h4>When to Use EAC</h4><ul><li>Comparing replacement cycles for recurring assets (fleets, equipment)</li><li>When the same type of asset will be replaced indefinitely</li><li>NOT for one-off projects with different lives — use NPV directly there</li></ul><h4>Example Application</h4><p>Vehicle A: Total PV of costs $1,280,780; life = 8 years; AF(7%, 8) = 5.971<br>EAC(A) = $1,280,780 ÷ 5.971 = $214,540 per year<br>Vehicle B: Total PV of costs $914,710; life = 5 years; AF(7%, 5) = 4.100<br>EAC(B) = $914,710 ÷ 4.100 = $223,100 per year<br>Vehicle A is cheaper in annual equivalent terms — choose A.</p>",
"qa":[
{"q":"Why can't you simply compare the total PV of costs for two assets with different lifespans?","a":"The total PV of costs is larger for a longer-lived asset simply because it covers more years of operation. Comparing them directly is unfair — Vehicle A (8 years, $1.28m total PV) costs more in total than Vehicle B (5 years, $0.91m total PV) partly because it covers 3 additional years. EAC converts both to a comparable annual cost basis, eliminating the distortion caused by different time periods."},
{"q":"Vehicle A: PV of costs $900,000, life = 6 years, AF(10%,6) = 4.355. Vehicle B: PV of costs $700,000, life = 4 years, AF(10%,4) = 3.170. Calculate EAC and recommend.","a":"EAC(A) = $900,000 ÷ 4.355 = <strong>$206,658 per year</strong><br>EAC(B) = $700,000 ÷ 3.170 = <strong>$220,820 per year</strong><br>Vehicle A has a lower annual equivalent cost → <strong>choose Vehicle A</strong>."},
{"q":"When should EAC be used rather than simply comparing NPVs?","a":"EAC should be used when: (1) The projects are part of a <em>recurring replacement cycle</em> — the same type of asset will be replaced repeatedly; (2) The projects have <em>different lifespans</em> — making direct NPV comparison unfair. For one-off projects that will not be repeated, or for projects of the same duration, direct NPV comparison is appropriate and EAC is unnecessary."}
]},
{"id":"d9","icon":"🔀","title":"Mutually Exclusive Projects","subtitle":"NPV vs IRR conflict · Scale differences · When to use NPV · Incremental approach",
"theory":"<h4>What are Mutually Exclusive Projects?</h4><p>Mutually exclusive projects are those where only ONE can be selected — the choice of one precludes the others. This may arise due to: limited capacity; limited capital; incompatible outcomes; or the projects serving the same strategic objective.</p><h4>Selecting Between Mutually Exclusive Projects</h4><ul><li><strong>Use NPV:</strong> Always select the project with the highest NPV when choosing between mutually exclusive projects. NPV directly measures the increase in shareholder wealth.</li><li><strong>Problem with IRR:</strong> IRR can give the wrong ranking when projects differ in scale. A small project with higher IRR may add less total value than a larger project with lower IRR.</li></ul><h4>Why IRR Can Mislead for Mutually Exclusive Projects</h4><div class='fw'>Project A: Cost $20k, NPV $15k, IRR 35%<br>Project B: Cost $100k, NPV $40k, IRR 28%<br>IRR ranking: A &gt; B. NPV ranking: B &gt; A.<br><strong>Correct choice: Project B</strong> — adds $40k to shareholder wealth vs $15k for A.<br>IRR is misleading because it ignores the scale of investment.</div><div class='kbox'><strong>When Techniques Conflict</strong>Always use NPV when NPV and IRR give conflicting rankings for mutually exclusive projects. Non-financial considerations (risk, reputation, strategic fit) should also be evaluated before the final decision.</div>",
"qa":[
{"q":"Why should NPV be used rather than IRR when choosing between mutually exclusive projects?","a":"NPV measures the <em>absolute increase in shareholder wealth</em> — the actual dollar value added by each project. IRR measures the <em>percentage return</em>, which ignores scale. A small project with high IRR may add far less value than a large project with lower IRR. For mutually exclusive decisions — where the goal is to maximise value creation — NPV correctly identifies the most valuable project."},
{"q":"Project X: NPV $30k, IRR 22%. Project Y: NPV $55k, IRR 18%. Cost of capital = 12%. Which should be chosen?","a":"Both projects have IRR &gt; cost of capital (12%), so both are individually viable. Since they are mutually exclusive: IRR ranking → X; NPV ranking → Y. <strong>Choose Project Y</strong> — NPV of $55k maximises shareholder wealth. Project X's higher IRR does not compensate for the additional $25k of value ($55k − $30k) created by Project Y."},
{"q":"What non-financial factors should be considered alongside NPV when choosing between mutually exclusive projects?","a":"(1) <strong>Risk profile</strong> — one project may have higher NPV but also higher variance (more uncertain outcomes); (2) <strong>Strategic fit</strong> — which project better aligns with the long-term strategic direction? (3) <strong>Reputation</strong> — does either project carry reputational risk? (4) <strong>Operational feasibility</strong> — does the organisation have the skills, technology, and management capacity to execute? (5) <strong>Political/social factors</strong> — regulatory, environmental, or community considerations."}
]},
{"id":"d10","icon":"💲","title":"Profit Maximising Selling Price","subtitle":"Demand curve · Marginal revenue · Marginal cost · MR = MC rule · Price equation",
"theory":"<h4>Profit Maximisation Rule</h4><p>Economic theory states: <strong>profit is maximised when Marginal Revenue = Marginal Cost (MR = MC)</strong>. Marginal revenue is the additional revenue from selling one more unit. Marginal cost is the additional cost of producing one more unit.</p><h4>The Demand (Price) Equation</h4><p>In economics, the relationship between price and quantity follows a linear demand curve:</p><div class='fw'><strong>P = a − bQ</strong><br>Where: P = selling price; Q = quantity; a = price at which demand = 0 (y-intercept); b = change in price per unit change in quantity<br>b = Change in price ÷ Change in quantity</div><h4>Marginal Revenue Equation</h4><p>For a linear demand curve P = a − bQ, the MR equation is: <strong>MR = a − 2bQ</strong> (same intercept, twice the slope).</p><h4>Finding the Profit-Maximising Price and Quantity</h4><div class='fw'><ol><li>Establish the demand equation: P = a − bQ</li><li>Derive MR: MR = a − 2bQ</li><li>Set MR = MC and solve for Q (profit-maximising quantity)</li><li>Substitute Q back into the demand equation P = a − bQ to find the profit-maximising price</li></ol></div>",
"qa":[
{"q":"What is the profit maximisation rule and why does it work?","a":"Profit is maximised when <strong>Marginal Revenue = Marginal Cost (MR = MC)</strong>. If MR &gt; MC: producing one more unit adds more revenue than cost — producing more increases profit. If MR &lt; MC: producing one more unit costs more than it earns — producing more reduces profit. Therefore, the profit-maximising quantity is precisely where MR = MC — the point where the contribution from the last unit equals zero."},
{"q":"Price falls from $80 to $70 when quantity increases from 100 to 120 units. Derive the demand equation P = a − bQ.","a":"b = Change in P ÷ Change in Q = ($80 − $70) ÷ (120 − 100) = $10 ÷ 20 = <strong>0.5</strong><br>Using P = a − bQ with one point (Q=100, P=$80): $80 = a − 0.5(100) → a = $80 + $50 = <strong>$130</strong><br>Demand equation: <strong>P = 130 − 0.5Q</strong>"},
{"q":"Using P = 130 − 0.5Q and MR = 130 − Q. If MC = $30, find the profit-maximising quantity and price.","a":"Set MR = MC: 130 − Q = 30 → Q = 100 units<br>Price: P = 130 − 0.5(100) = 130 − 50 = <strong>$80</strong><br>Profit-maximising price = $80, quantity = 100 units."}
]},
{"id":"d11","icon":"📏","title":"Price Elasticity of Demand","subtitle":"PED formula · Elastic vs inelastic · Factors affecting PED · Revenue implications",
"theory":"<h4>What is Price Elasticity of Demand (PED)?</h4><p>PED measures the responsiveness of demand to a change in price:</p><div class='fw'><strong>PED = % Change in Quantity ÷ % Change in Price</strong><br>Or: PED = [(Q₂ − Q₁) ÷ Q₁] ÷ [(P₂ − P₁) ÷ P₁]<br>(Result is typically negative — inverse relationship between price and demand)</div><h4>Interpreting PED</h4><table class='tbl'><tr><th>|PED|</th><th>Classification</th><th>Implication</th></tr><tr><td>&gt; 1</td><td>Price elastic</td><td>% change in demand &gt; % change in price; raising price reduces total revenue</td></tr><tr><td>= 1</td><td>Unit elastic</td><td>Revenue unchanged; % changes equal</td></tr><tr><td>&lt; 1</td><td>Price inelastic</td><td>% change in demand &lt; % change in price; raising price increases total revenue</td></tr></table><h4>Factors Affecting PED</h4><ul><li><strong>Necessity vs luxury:</strong> Necessities are more inelastic (demand persists despite price rises)</li><li><strong>Availability of substitutes:</strong> More substitutes = more elastic demand</li><li><strong>Brand loyalty:</strong> Strong brand = more inelastic demand</li><li><strong>Proportion of income:</strong> High-cost items tend to be more elastic (consumers research carefully)</li><li><strong>Time:</strong> Demand is more elastic in the long run as consumers find alternatives</li></ul>",
"qa":[
{"q":"Price increases from $50 to $55. Quantity falls from 1,000 to 900 units. Calculate PED.","a":"% change in quantity = (900 − 1,000) ÷ 1,000 × 100 = −10%<br>% change in price = (55 − 50) ÷ 50 × 100 = +10%<br>PED = −10% ÷ +10% = <strong>−1.0</strong> (unit elastic)"},
{"q":"Demand is price elastic (|PED| = 2). If the company raises price by 5%, what happens to total revenue?","a":"With PED = 2 (elastic), a 5% price rise causes a 10% fall in quantity demanded. Total revenue = Price × Quantity. Price rises 5% but quantity falls 10% — the volume loss dominates. <strong>Total revenue falls</strong>. For elastic products, price increases reduce total revenue — the organisation should consider price reductions to increase revenue."},
{"q":"Name four factors that make demand more price inelastic and briefly explain each.","a":"(1) <strong>Necessity</strong> — people buy regardless of price (medicine, basic food); (2) <strong>Few substitutes</strong> — no alternatives available so consumers must pay the higher price; (3) <strong>Brand loyalty</strong> — customers prefer the brand and are unwilling to switch; (4) <strong>Small proportion of income</strong> — consumers don't notice or care about small price changes on low-cost items."}
]},
{"id":"d12","icon":"🎪","title":"Pricing Strategies and Their Financial Consequences","subtitle":"Market skimming · Penetration · Cost-plus · Contribution · Complementary · Loss leaders",
"theory":"<h4>Key Pricing Strategies</h4><table class='tbl'><tr><th>Strategy</th><th>Description</th><th>Best used when</th></tr><tr><td><strong>Market skimming</strong></td><td>High initial price; reduce over time</td><td>Novel product; inelastic early adopters; recovering development costs quickly</td></tr><tr><td><strong>Penetration pricing</strong></td><td>Low initial price to build market share; raise later</td><td>Elastic demand; high competition; need for rapid market share gain</td></tr><tr><td><strong>Cost-plus</strong></td><td>Cost + fixed markup %</td><td>Stable, predictable costs; B2B contracts; justifying pricing to customers</td></tr><tr><td><strong>Marginal/contribution pricing</strong></td><td>Price &gt; variable cost; contributes to fixed costs</td><td>Spare capacity; tender situations; short-term opportunities</td></tr><tr><td><strong>Complementary pricing</strong></td><td>Low-price product drives sales of high-margin add-ons</td><td>Printers + ink cartridges; razors + blades; gaming consoles + games</td></tr><tr><td><strong>Loss leader</strong></td><td>Price below cost to generate footfall/complementary sales</td><td>Supermarkets; retail; cross-subsidised product ranges</td></tr></table><div class='kbox'><strong>Financial Consequences of Pricing Strategies</strong>Each strategy has different implications for short-term vs long-term profit, cash flow, and market share. The choice must align with the product's position in its life cycle, the competitive environment, and the organisation's strategic objectives.</div>",
"qa":[
{"q":"Distinguish between market skimming and penetration pricing and state when each is appropriate.","a":"<strong>Market skimming</strong>: Launch at a high price targeting innovators willing to pay a premium; reduce progressively. Best when: product is novel/patented; early adopters are price inelastic; the organisation needs to recover high development costs quickly. <strong>Penetration pricing</strong>: Launch at a low price to rapidly build market share; raise price later once established. Best when: demand is highly price elastic; competition is intense; the organisation seeks volume quickly and has low unit costs that enable profitability at low prices."},
{"q":"What is contribution pricing and in what circumstances is it appropriate?","a":"Contribution pricing sets the price above variable cost — the product 'contributes' to fixed costs and profit without necessarily covering full cost. Appropriate when: (1) The organisation has <em>spare capacity</em> — incremental fixed costs are zero, so any contribution is profit; (2) <em>One-off tender situations</em> — competing for a specific contract; (3) <em>Short-term opportunities</em> — filling capacity that would otherwise be idle. Important: contribution pricing is only appropriate short-term — prices must cover full costs in the long run."},
{"q":"What is complementary pricing and what are the financial consequences?","a":"Complementary pricing prices a 'base' product cheaply (or even at a loss) to drive sales of high-margin complementary products. Examples: printer at low price → high-margin ink cartridges; razors cheaply → blade cartridges. Financial consequences: (1) Initial loss on the base product is offset by high long-term margins on consumables; (2) Creates customer lock-in reducing price sensitivity of the complementary product; (3) Revenue is recurring (consumables are repurchased regularly); (4) Risk: customers may find compatible third-party consumables, eliminating the strategy's benefit."}
]}
]}
};

"theory":"<h4>Your Role in the Exam</h4><p>You are a <strong>Financial Manager at Cartn&apos;s Head Office</strong>, reporting to Elizabeth Maenda (Senior Financial Manager). Your primary responsibilities are in management accounting. Every answer you write must be from this perspective — not as a student, but as a professional finance manager advising the business.</p><h4>Who is Cartn?</h4><p>Cartn is one of the world&apos;s largest manufacturers of food packaging. It specialises in cartons and tubs used across the food and beverage industry — dairy products, fruit juices, and frozen foods. It is based in the fictional country of <strong>Harrland</strong> (currency: H$), and prepares financial statements under <strong>IFRS</strong>.</p><div class='cartn-box'><strong>Cartn at a Glance</strong><ul><li>27 factories worldwide</li><li>~23,000 employees globally</li><li>Revenue 2026: H$1,236.2m (up 7.5%)</li><li>Operating profit 2026: H$140.0m (up 52.3%)</li><li>One of six major carton/tub manufacturers</li><li>Listed on Harrland stock exchange</li></ul></div><h4>The Dual Business Model</h4><p>Cartn operates two interconnected revenue streams:</p><div class='fw'><strong>Manufacturing Division</strong><ul><li>Produces cartons and tubs from paperboard, plastic, and aluminium layers</li><li>Supplies food manufacturers globally</li><li>Holds many patents on packaging technology</li></ul></div><div class='fw'><strong>Engineering Consultancy Division</strong><ul><li>Supports food manufacturers in designing and installing packaging systems</li><li>Consultancy clients often become long-term manufacturing customers</li><li>Cartn is then positioned as a &apos;solutions partner&apos;, not just a supplier</li></ul></div><div class='kbox'><strong>Key Exam Tension</strong>Valboxx — Cartn&apos;s nearest competitor — is manufacturing-only and earns a significantly higher operating margin (16.6% vs Cartn&apos;s 11.3%). The exam will test whether Cartn&apos;s consultancy division adds enough strategic value to justify its lower margin. Always argue the consultancy&apos;s long-term customer lock-in value, not just its current profit contribution.</div>",

{"q":"Describe Cartn&apos;s dual business model and explain the strategic advantage of combining manufacturing with consultancy.","a":"Cartn operates two divisions: <strong>Manufacturing</strong> (producing cartons and tubs from layered materials for food/beverage companies) and <strong>Engineering Consultancy</strong> (designing and installing packaging systems for food manufacturers).<br>Strategic advantage: consultancy clients build a deep technical dependency on Cartn&apos;s systems — they then become long-term manufacturing customers. This creates <em>customer lock-in</em>, more stable revenue, and positions Cartn as a &apos;solutions partner&apos; rather than a commodity supplier — justifying price premiums and reducing churn."},
{"q":"Why does Cartn&apos;s lower operating margin vs Valboxx represent a potential exam trigger?","a":"Valboxx earns a 16.6% operating margin vs Cartn&apos;s 11.3% — a significant 5.3 percentage point gap. Valboxx achieves this with manufacturing-only operations and no consultancy overhead. This triggers exam scenarios about: (1) whether Cartn&apos;s consultancy division adds sufficient value to justify its costs; (2) whether Cartn should consider refocusing on manufacturing-only; (3) benchmarking and competitive positioning analysis. The correct response: argue that consultancy&apos;s long-term customer relationships and lock-in value are not captured in current-year margin."},
{"q":"What packaging materials does Cartn use and why does this create a strategic challenge?","a":"Cartn&apos;s products are made from <strong>layers of paperboard, plastic, and aluminium</strong>. The multi-layer structure provides excellent protection and shelf-life extension — but makes recycling complex and expensive. This creates a strategic challenge as sustainability pressure increases: (1) regulators are demanding recyclable packaging; (2) customers are scrutinising environmental credentials; (3) Cartn must invest in developing recyclable alternatives while maintaining product performance. This tension between functionality and sustainability is a key exam theme."}

{"id":"m2","icon":"🌍","title":"The Food Packaging Industry — PESTEL Analysis","subtitle":"Market trends · Growth drivers · Sustainability pressures · Regulatory environment · Technology",
"theory":"<h4>The Global Food Packaging Market</h4><p>The global food packaging market was valued at approximately <strong>$400 billion in 2024</strong> and is forecast to grow at 5.3% CAGR to over $565 billion by 2030. The aseptic carton segment (Cartn&apos;s core niche) is growing even faster at 7.8% CAGR — 75% of EU milk and 59% of EU juices are packaged in cartons.</p><h4>Three Functions of Food Packaging</h4><ul><li><strong>Protection:</strong> Prevents contamination, extends shelf life</li><li><strong>Distribution:</strong> Enables safe transport through supply chains</li><li><strong>Marketing/branding:</strong> Key communication channel at point of sale</li></ul><h4>PESTEL Applied to Cartn</h4><table class='tbl'><tr><th>Factor</th><th>Impact on Cartn</th><th>Risk/Opp</th></tr><tr><td><strong>Political</strong></td><td>International trade agreements; stability of markets in 27 factory locations</td><td><span class='tag tr'>Risk</span></td></tr><tr><td><strong>Economic</strong></td><td>Commodity prices (aluminium, paperboard) volatile; foreign exchange exposure from 27 factories; food consumption grows with middle-class expansion</td><td><span class='tag ta'>Both</span></td></tr><tr><td><strong>Social</strong></td><td>Consumer demand for packaged food rising (urbanisation, convenience lifestyle); increasing environmental consciousness</td><td><span class='tag tg'>Opp</span></td></tr><tr><td><strong>Technological</strong></td><td>New recyclable packaging materials; automation reducing manufacturing costs; smart packaging innovation</td><td><span class='tag tg'>Opp</span></td></tr><tr><td><strong>Environmental</strong></td><td>EU PPWR requires all packaging recyclable by 2030; consumer scrutiny of recyclability claims; carbon footprint reporting</td><td><span class='tag tr'>Risk</span></td></tr><tr><td><strong>Legal</strong></td><td>Food safety regulations; IFRS reporting requirements; IP protection for patents; data protection</td><td><span class='tag tr'>Risk</span></td></tr></table><div class='kbox'><strong>Exam Application</strong>When discussing external factors in your answers, always link them specifically to Cartn — don&apos;t just list PESTEL factors abstractly. For example: &apos;Rising aluminium prices (economic factor) will directly increase Cartn&apos;s COS as one of three laminate layers, compressing the gross margin if selling prices cannot be raised.&apos;</div>",
"qa":[
{"q":"What are the three levels of food packaging and which does Cartn primarily operate in?","a":"<strong>Primary packaging:</strong> Direct contact with food (cartons, cans, containers) — must meet strict food safety standards. <strong>Secondary packaging:</strong> Surrounds primary packaging; used for branding and multi-pack presentation. <strong>Tertiary packaging:</strong> Used for transport and logistics (pallets, shrink-wrap).<br>Cartn primarily operates in <strong>primary packaging</strong> — its cartons and tubs are in direct contact with food products, requiring the highest safety and quality standards."},
{"q":"How should a candidate use PESTEL analysis in a Cartn Revision exam answer?","a":"Never list PESTEL factors in isolation — always apply them specifically to Cartn. Structure: (1) Name the factor type; (2) State the specific event or trend; (3) Explain the direct impact on Cartn&apos;s operations, financials, or strategy.<br>Example: &apos;The EU Packaging and Packaging Waste Regulation (Environmental/Legal) requires all packaging to be recyclable by 2030. For Cartn, this creates a significant investment requirement to redesign multi-layer cartons or develop mono-material alternatives, increasing R&amp;D and capex spend while maintaining product performance.&apos;"},
{"q":"Why is the food packaging market&apos;s growth rate important context for Cartn&apos;s exam scenarios?","a":"The global food packaging market growing at 5.3% CAGR (aseptic cartons at 7.8% CAGR) provides Cartn with a positive external backdrop. This context matters in exam answers because: (1) It justifies investment decisions — the market has a long growth runway; (2) It provides cover for revenue growth projections in NPV analyses; (3) It shifts the strategic question from &apos;Is there demand?&apos; to &apos;How can Cartn capture more of this growth?&apos; — which is where management accounting competencies apply."},
{"q":"What economic factors create the most significant risks for Cartn and how should they be quantified?","a":"<strong>Commodity price risk:</strong> Aluminium and paperboard prices are volatile. Cartn&apos;s multi-layer cartons use both — a 10% rise in aluminium prices directly increases COS. Quantify by: calculate aluminium as a % of COS and apply the price change. <strong>Foreign exchange risk:</strong> With 27 factories in multiple countries, Cartn has significant translation and transaction FX exposure. Quantify by: identify which currency the sales/costs are in and apply exchange rate movement scenarios."}
]},
{"id":"m3","icon":"⚔️","title":"Porter&apos;s Five Forces — Cartn&apos;s Competitive Position","subtitle":"Industry rivalry · Buyer power · Supplier power · New entrants · Substitutes · Oligopoly dynamics",
"theory":"<h4>Industry Structure — An Oligopoly</h4><p>The food carton market is dominated by a small number of global players — a classic oligopoly. Real-world comparators include Tetra Pak, SIG, and Elopak. In the pre-seen, Cartn is one of six major manufacturers, with Valboxx as its closest named rival. High barriers to entry and capital requirements limit new competition.</p><h4>Porter&apos;s Five Forces Applied to Cartn</h4><table class='tbl'><tr><th>Force</th><th>Assessment for Cartn</th><th>Level</th></tr><tr><td><strong>Competitive Rivalry</strong></td><td>Six major players; Valboxx outperforms on margin; competition on cost, quality, sustainability, and service</td><td><span class='tag tr'>High</span></td></tr><tr><td><strong>Threat of New Entrants</strong></td><td>Very high capital requirements (27 factories takes decades to build); deep customer relationships; significant IP (patents); aseptic technology requires specialist expertise</td><td><span class='tag tg'>Low</span></td></tr><tr><td><strong>Bargaining Power of Buyers</strong></td><td>Large food manufacturers have purchasing power; some may dual-source; but Cartn&apos;s consultancy creates switching costs and lock-in</td><td><span class='tag ta'>Medium</span></td></tr><tr><td><strong>Bargaining Power of Suppliers</strong></td><td>Aluminium, paperboard, and plastic are commodity inputs with limited dedicated suppliers for food-grade materials; commodity price volatility is a risk</td><td><span class='tag ta'>Medium</span></td></tr><tr><td><strong>Threat of Substitutes</strong></td><td>Alternative packaging: glass, metal cans, flexible pouches, plastic bottles; but aseptic cartons have unique cost/shelf-life advantages; substitutes growing slowly</td><td><span class='tag ta'>Medium</span></td></tr></table><div class='cartn-box'><strong>Cartn&apos;s Competitive Advantages</strong><ul><li>Patents and proprietary technology</li><li>Engineering consultancy creates customer lock-in</li><li>27-factory global network provides scale and geographic reach</li><li>Integrated solutions provider (not just commodity supplier)</li></ul></div><div class='kbox'><strong>Exam Tip</strong>When applying Porter&apos;s Five Forces in the exam, always connect back to Cartn&apos;s financial implications. E.g.: &apos;Medium buyer power limits Cartn&apos;s ability to pass rising input costs to customers, as price increases could trigger buyer switching — compressing gross margin.&apos;</div>",
"qa":[
{"q":"Assess the threat of new entrants into the food carton manufacturing market for Cartn.","a":"The threat of new entrants is <strong>low</strong>. Barriers include: (1) <em>Capital intensity</em> — building 27 factories globally requires billions in investment accumulated over decades; (2) <em>Technology and IP</em> — aseptic packaging requires specialist knowledge and Cartn holds multiple patents; (3) <em>Customer relationships</em> — deep consultancy relationships with food manufacturers create switching costs; (4) <em>Regulatory compliance</em> — food safety certifications are complex and time-consuming to obtain. A new entrant cannot quickly replicate Cartn&apos;s scale, IP, or relationships."},
{"q":"Why does Cartn&apos;s consultancy division reduce buyer bargaining power?","a":"Without consultancy, food manufacturers could switch to another carton supplier relatively easily based on price alone. Cartn&apos;s consultancy creates <em>switching costs</em>: (1) Cartn&apos;s engineers design and install the packaging lines — deeply integrated with the customer&apos;s production process; (2) Switching supplier would require replacing or adapting production line equipment; (3) Staff would need retraining; (4) New supplier quality validation takes time. This technical lock-in means customers who have used Cartn&apos;s consultancy are unlikely to switch, effectively reducing buyer bargaining power."},
{"q":"What is the significance of the competitive rivalry between Cartn and Valboxx for exam answers?","a":"Valboxx is manufacturing-only and earns a 16.6% operating margin vs Cartn&apos;s 11.3%. This rivalry matters because: (1) It provides a <em>ready-made benchmark</em> — any exam question on profitability analysis can be answered by comparing Cartn ratios to Valboxx; (2) It raises the strategic question of whether Cartn&apos;s model is optimal; (3) It drives potential scenarios about whether Cartn should discontinue consultancy; (4) Cartn is growing faster than Valboxx — suggesting its model builds long-term customer value even if current margins are lower."}
]},
{"id":"m4","icon":"📊","title":"Financial Analysis — Cartn&apos;s Performance","subtitle":"Revenue growth · Operating leverage · Profitability ratios · Working capital · Capital structure",
"theory":"<h4>Key Financial Results (Year ended 31 March 2026)</h4><table class='tbl'><tr><th>Item</th><th>2026 (H$m)</th><th>2025 (H$m)</th><th>Change</th></tr><tr><td>Revenue</td><td>1,236.2</td><td>1,149.7</td><td>+7.5%</td></tr><tr><td>Gross Profit</td><td>272.0</td><td>229.9</td><td>+18.3%</td></tr><tr><td>Operating Profit</td><td>140.0</td><td>91.9</td><td>+52.3%</td></tr><tr><td>Profit for the year</td><td>111.1</td><td>68.7</td><td>+61.7%</td></tr><tr><td>Total assets</td><td>674.8</td><td>650.6</td><td>+3.7%</td></tr><tr><td>Equity</td><td>386.4</td><td>353.5</td><td>+9.3%</td></tr><tr><td>Long-term loans</td><td>154.3</td><td>161.7</td><td>-4.6%</td></tr></table><h4>Key Profitability Ratios</h4><table class='tbl'><tr><th>Ratio</th><th>2026</th><th>2025</th></tr><tr><td>Gross Profit Margin</td><td>22.0%</td><td>20.0%</td></tr><tr><td>Operating Profit Margin</td><td>11.3%</td><td>8.0%</td></tr><tr><td>Return on Assets (ROA)</td><td>16.5%</td><td>10.6%</td></tr><tr><td>Return on Equity (ROE)</td><td>28.7%</td><td>19.4%</td></tr><tr><td>Asset Turnover</td><td>1.83x</td><td>1.77x</td></tr><tr><td>Debt-to-Equity</td><td>0.40</td><td>0.46</td></tr><tr><td>Current Ratio</td><td>2.04</td><td>1.98</td></tr></table><div class='cartn-box'><strong>The Operating Leverage Story</strong><ul><li>Revenue up 7.5% (+H$86.5m)</li><li>Administrative expenses actually FELL by H$6m</li><li>Operating profit surged 52.3% — classic fixed-cost operating leverage</li><li>This means Cartn&apos;s cost base is mostly fixed — incremental revenue flows almost entirely to profit</li></ul></div><div class='kbox'><strong>Critical Exam Number</strong>Dividends paid in 2026 = H$87.8m. Profit for the year = H$111.1m. Dividend cover = 111.1 ÷ 87.8 = 1.27x — quite thin. Any question about dividend sustainability or capital allocation should flag this.</div>",
"qa":[
{"q":"Calculate Cartn&apos;s gross profit margin and operating profit margin for 2026 and explain the difference between them.","a":"<strong>GPM</strong> = 272.0 ÷ 1,236.2 × 100% = <strong>22.0%</strong><br><strong>OPM</strong> = 140.0 ÷ 1,236.2 × 100% = <strong>11.3%</strong><br>The gap (10.7%) represents <em>operating expenses</em> (administration, R&amp;D, consultancy overhead). The OPM improved dramatically from 8.0% to 11.3% — driven by administrative expenses falling H$6m while revenue grew H$86.5m, demonstrating strong operating leverage."},
{"q":"What does operating leverage mean in Cartn&apos;s context and what are the risks?","a":"Operating leverage means Cartn has a large proportion of <em>fixed costs</em>. Revenue grew 7.5% but operating profit grew 52.3% — because fixed costs don&apos;t increase with revenue, incremental revenue flows almost entirely to profit. <strong>Risk:</strong> The same leverage works in reverse. If revenue falls (e.g., loss of a major customer), operating profit will fall disproportionately — Cartn must cover its fixed cost base regardless of volume. This is a key risk to flag in any scenario involving revenue uncertainty."},
{"q":"Cartn&apos;s debt-to-equity ratio fell from 0.46 to 0.40. What does this mean and is it a positive sign?","a":"The fall from 0.46 to 0.40 means Cartn is less reliant on debt financing — long-term loans fell from H$161.7m to H$154.3m while equity grew from H$353.5m to H$386.4m (retained profits). <strong>Positive signs:</strong> Reduced financial risk; lower interest burden; improved financial stability; gives borrowing capacity for future investment. <strong>Caveat:</strong> At 0.40, gearing remains moderate — there is room for strategic debt-funded investment if needed. The reduction appears driven by profit retention rather than forced deleveraging."},
{"q":"Cartn paid H$87.8m in dividends while earning H$111.1m profit. Evaluate this dividend policy.","a":"Dividend cover = H$111.1m ÷ H$87.8m = <strong>1.27x</strong> — this is thin (below the typical comfortable level of 2x). The payout ratio = 87.8 ÷ 111.1 = 79% — very high. Implications: (1) Limited retained earnings for reinvestment in sustainability and innovation; (2) If profits fall (e.g., due to commodity price spikes), the dividend would need to be cut; (3) High dividends signal confidence to shareholders but constrain future growth investment. An exam question on capital allocation or financing strategy should flag this tension."}
]},
{"id":"m5","icon":"🆚","title":"Competitor Analysis — Cartn vs Valboxx","subtitle":"Benchmarking · Margin gap analysis · Business model differences · Strategic implications",
"theory":"<h4>Valboxx — Cartn&apos;s Closest Listed Competitor</h4><div class='fw'><strong>Valboxx 2026 Financial Summary:</strong><ul><li>Revenue: H$1,322.7m (7% larger than Cartn)</li><li>Operating Profit: H$220.2m (57% higher than Cartn&apos;s H$140.0m)</li><li>Profit for the Year: H$180.4m</li><li>Operating Margin: 16.6% (vs Cartn&apos;s 11.3%)</li></ul></div><h4>Head-to-Head Comparison</h4><table class='tbl'><tr><th>Metric</th><th>Cartn</th><th>Valboxx</th><th>Difference</th></tr><tr><td>Revenue</td><td>H$1,236.2m</td><td>H$1,322.7m</td><td>Valboxx +7%</td></tr><tr><td>Operating Profit</td><td>H$140.0m</td><td>H$220.2m</td><td>Valboxx +57%</td></tr><tr><td>Operating Margin</td><td>11.3%</td><td>16.6%</td><td>Valboxx +5.3pp</td></tr><tr><td>Business Model</td><td>Manufacturing + Consultancy</td><td>Manufacturing only</td><td>Different</td></tr><tr><td>Revenue Growth</td><td>+7.5%</td><td>Not given</td><td>Cartn shows strong growth</td></tr></table><h4>Why is Valboxx&apos;s Margin Higher?</h4><p>Valboxx focuses purely on manufacturing — no consultancy overhead. Possible explanations: more efficient production processes; stronger economies of scale; better raw material procurement; different product mix (potentially higher margin segments); no investment in consultancy infrastructure.</p><div class='warn-box'><strong>Exam Warning</strong>Never conclude that Cartn should simply copy Valboxx and drop consultancy. Always argue that: (1) consultancy creates long-term customer lock-in not visible in current-year margins; (2) Cartn&apos;s revenue is growing faster; (3) the integrated model is a strategic differentiator. Propose investigating the consultancy division&apos;s profitability separately rather than eliminating it.</div>",
"qa":[
{"q":"Cartn&apos;s operating margin is 11.3% vs Valboxx&apos;s 16.6%. Does this mean Cartn is underperforming?","a":"Not necessarily. The 5.3 percentage point difference partly reflects Cartn&apos;s <em>consultancy division overhead</em> — costs Valboxx simply doesn&apos;t incur. Cartn&apos;s consultancy creates: (1) long-term customer lock-in (Cartn becomes integral to the customer&apos;s production process); (2) more stable and predictable revenue; (3) premium positioning as a &apos;solutions partner&apos; rather than a commodity supplier. To fairly evaluate, Cartn should produce a divisional breakdown — if consultancy itself earns an acceptable margin, the blended margin comparison with a manufacturing-only competitor is misleading."},
{"q":"What benchmarking analysis should Cartn perform in response to Valboxx&apos;s superior margins?","a":"Cartn should: (1) <em>Segment analysis</em> — produce separate profitability statements for manufacturing vs consultancy to understand whether consultancy is dragging down margins; (2) <em>Activity analysis</em> — use ABC to identify which activities drive costs in manufacturing vs Valboxx; (3) <em>Industry benchmarking</em> — compare specific cost ratios (COS as % of revenue, admin costs per unit) against Valboxx and other industry players; (4) <em>Investigate structural differences</em> — does Valboxx have a fundamentally different cost structure (e.g., more automation)? Recommendations should then be made based on findings."},
{"q":"What are three scenarios the Revision exam might test using the Cartn vs Valboxx comparison?","a":"(1) <strong>Benchmarking analysis</strong> — calculate and interpret profitability ratios for both; explain differences; recommend actions to close the margin gap.<br>(2) <strong>Discontinue consultancy decision</strong> — evaluate whether Cartn should stop consultancy to improve margins; quantify the short-term vs long-term impact; identify non-financial factors.<br>(3) <strong>Investment in manufacturing efficiency</strong> — should Cartn invest in automation to reduce manufacturing costs toward Valboxx&apos;s level? Evaluate using NPV with sensitivity analysis."}
]},
{"id":"m6","icon":"🌿","title":"Sustainability and Ethics — The Recyclability Challenge","subtitle":"Multi-layer cartons · EU PPWR 2030 · ESG reporting · Ethical dilemmas · IFRS S2",
"theory":"<h4>Why Sustainability is Cartn&apos;s Biggest Strategic Challenge</h4><p>Cartn&apos;s cartons are made from <strong>laminated layers of paperboard, aluminium, and plastic</strong>. Each layer provides a specific function (paperboard = structure, aluminium = barrier, plastic = sealing). However, this multi-layer structure is extremely difficult to recycle without specialist infrastructure — currently very limited globally.</p><h4>The Recyclability Problem</h4><div class='fw'><strong>The Issue:</strong><ul><li>Many &apos;recycled&apos; cartons are actually <em>repurposed</em> (turned into lower-value products like building insulation) — not truly recycled</li><li>Repurposing still requires new virgin materials to replace the repurposed ones</li><li>Consumer and media scrutiny of &apos;greenwashing&apos; claims is intense</li><li>The EU Packaging and Packaging Waste Regulation (PPWR) requires all packaging to be recyclable by 2030</li></ul></div><h4>Cartn&apos;s Sustainability Governance</h4><ul><li>The Board accepts full responsibility for sustainability</li><li>A Director of Product Development has specific responsibility for sustainability oversight</li><li>Sustainability information is reported by department</li></ul><h4>Ethical Dimensions</h4><ul><li><strong>Marketing ethics:</strong> Describing products as &apos;recyclable&apos; when the infrastructure doesn&apos;t exist to process them could be misleading</li><li><strong>Stakeholder responsibility:</strong> Customers, communities, and investors are demanding credible environmental progress</li><li><strong>IFRS S2:</strong> Climate-related disclosures (effective 2024) require Cartn to report physical and transition risks — multi-layer carton recyclability is directly relevant</li></ul><div class='kbox'><strong>Exam Approach for Ethics Questions</strong>Use the 5  ethical principles: Integrity (don&apos;t mislead on recyclability), Objectivity (base sustainability claims on evidence), Professional competence (ensure sustainability disclosures are accurate), Confidentiality, and Professional behaviour. Apply each to the specific Cartn scenario in the question.</div>",
"qa":[
{"q":"Why is the recyclability of Cartn&apos;s multi-layer cartons a significant sustainability issue?","a":"Cartn&apos;s cartons use layers of paperboard, aluminium, and plastic — each providing specific functional properties. The <em>problem</em>: separating these materials for recycling requires specialist equipment that is currently unavailable in most markets globally. As a result, most &apos;recycled&apos; cartons are actually repurposed into lower-value products. This means: (1) True circular economy claims cannot be supported; (2) The EU PPWR requires genuine recyclability by 2030 — forcing investment in redesign; (3) Consumers and media may accuse Cartn of greenwashing if claims are exaggerated."},
{"q":"How should Cartn respond to the EU Packaging and Packaging Waste Regulation (PPWR) requiring recyclable packaging by 2030?","a":"Cartn should: (1) <em>R&amp;D investment</em> — develop mono-material or easily separable multi-layer alternatives that meet food safety requirements; (2) <em>Invest in recycling infrastructure</em> — partner with or invest in specialist carton recycling facilities to enable genuine recyclability; (3) <em>Cost-benefit analysis</em> — evaluate capital investment required vs regulatory risk of non-compliance (fines, market exclusion); (4) <em>Stakeholder communication</em> — be transparent with customers about current limitations and the roadmap to full recyclability; (5) <em>Phased approach</em> — prioritise the highest-volume markets first."},
{"q":"Cartn is considering describing its products as &apos;eco-friendly&apos; in marketing materials despite recyclability limitations. What ethical issues does this raise?","a":"This raises significant integrity concerns under &apos;s ethical code: <strong>Integrity</strong> — describing products as eco-friendly when recycling infrastructure doesn&apos;t exist to process them is misleading; <strong>Objectivity</strong> — marketing claims should be based on verifiable evidence, not aspirational descriptions; <strong>Professional behaviour</strong> — potential regulatory breach (advertising standards, consumer protection laws) discredits the profession. Recommended approach: describe exactly what the packaging can and cannot do currently; communicate the specific 2030 improvement roadmap; avoid broad sustainability claims that cannot be substantiated."},
{"q":"How does IFRS S2 apply to Cartn and what disclosures would be required?","a":"IFRS S2 (Climate-related Disclosures, effective Jan 2024) requires Cartn to disclose: <strong>Governance</strong> — board oversight of climate risks (already exists via Director of Product Development); <strong>Strategy</strong> — how multi-layer recyclability and EU PPWR requirements affect Cartn&apos;s business model and financial planning; <strong>Risk management</strong> — how Cartn identifies and manages physical risks (e.g., aluminium supply disruption from climate-affected mines) and transition risks (PPWR regulation, consumer preference shifts); <strong>Metrics and targets</strong> — GHG emissions from manufacturing, recycling targets, progress vs PPWR 2030 deadline."}
]},
{"id":"m7","icon":"🔍","title":"SWOT Analysis — Applied to Cartn","subtitle":"Strengths · Weaknesses · Opportunities · Threats · Connecting to exam scenarios",
"theory":"<h4>SWOT Analysis — Cartn</h4><div class='fw'><strong>STRENGTHS</strong><ul><li>Global manufacturing scale: 27 factories, 23,000 employees</li><li>Dual business model: manufacturing + consultancy integration</li><li>Strong patent portfolio and proprietary technology</li><li>Improving financial performance (revenue +7.5%, operating profit +52.3%)</li><li>Strong balance sheet: current ratio 2.04, moderate gearing (D/E 0.40)</li><li>Customer lock-in via engineering consultancy</li><li>One of only six major global carton manufacturers (oligopoly protection)</li></ul></div><div class='fw'><strong>WEAKNESSES</strong><ul><li>Lower operating margin (11.3%) vs competitor Valboxx (16.6%)</li><li>Multi-layer packaging difficult to recycle — sustainability vulnerability</li><li>High dividend payout (79%) limits retained earnings for reinvestment</li><li>Thin dividend cover (1.27x) — vulnerable if profits fall</li><li>Dependence on volatile commodity inputs (aluminium, paperboard, plastic)</li><li>Consultancy profitability not separately disclosed — unclear contribution</li></ul></div><div class='fw'><strong>OPPORTUNITIES</strong><ul><li>Global food packaging market growing at 5.3% CAGR to 2030</li><li>Aseptic carton segment growing at 7.8% CAGR</li><li>Rising urbanisation and convenience food demand</li><li>Innovation in recyclable/mono-material packaging</li><li>Geographic expansion into emerging markets</li><li>Technology partnerships to develop smart packaging</li></ul></div><div class='fw'><strong>THREATS</strong><ul><li>EU PPWR 2030 recyclability requirement — major compliance investment needed</li><li>Valboxx and other competitors with superior margins</li><li>Commodity price volatility (aluminium, paperboard)</li><li>Consumer backlash against non-recyclable packaging / greenwashing accusations</li><li>Potential for substitute packaging (flexible pouches, glass) to grow</li><li>Foreign exchange exposure across 27 global manufacturing locations</li></ul></div>",
"qa":[
{"q":"What are Cartn&apos;s three most significant strengths and why do they matter for exam scenarios?","a":"(1) <strong>27-factory global network</strong> — scale creates cost advantages and serves global customers in multiple markets; relevant to investment, expansion, and efficiency scenarios. (2) <strong>Consultancy integration</strong> — creates customer lock-in and long-term relationships; relevant to any scenario questioning the business model or profitability. (3) <strong>Strong 2026 financial performance</strong> — provides financial firepower for investment; ROE of 28.7% and improving margins support strategic growth decisions."},
{"q":"What are Cartn&apos;s three most significant threats and how should they be addressed in exam answers?","a":"(1) <strong>EU PPWR 2030 recyclability</strong> — requires major R&amp;D and capex investment; address by evaluating cost-benefit and proposing a phased investment roadmap. (2) <strong>Commodity price volatility</strong> — aluminium and paperboard are global commodities; address by discussing hedging strategies, supplier diversification, and passing costs through to customers. (3) <strong>Valboxx&apos;s higher margins</strong> — competitive pressure; address by benchmarking, divisional analysis, and identifying specific efficiency improvement opportunities."},
{"q":"How should you use the SWOT framework in a Cartn exam answer?","a":"The SWOT framework should never be presented as a list in isolation. Instead: (1) <em>Identify the relevant strength/weakness/opportunity/threat</em> linked to the scenario; (2) <em>Quantify where possible</em> using Cartn&apos;s actual financial data; (3) <em>Recommend an action</em> addressing the weakness or threat, or exploiting the strength or opportunity; (4) <em>Consider implications</em> for financial performance, risk, and stakeholders. The examiners want applied analysis, not generic SWOT lists."}
]},
{"id":"m8","icon":"🎓","title":"E2 Theory Applied to Cartn","subtitle":"Value chain · Business model · Leadership · Stakeholders · Digital ecosystems · Change management",
"theory":"<h4>Applying E2 Concepts to Cartn</h4><p>The Revision exam expects you to draw on E2, F2, and P2 knowledge to analyse Cartn scenarios. Here are the key E2 frameworks and how they apply specifically to Cartn.</p><h4>CGMA Business Model Framework — Cartn</h4><div class='fw'><strong>Define:</strong> Cartn&apos;s stakeholders = food manufacturers (customers), shareholders, 23,000 employees, regulators, local communities. Value proposition = reliable, innovative packaging solutions + engineering expertise.<br><strong>Create:</strong> 27 factories convert raw materials (paperboard, aluminium, plastic) → cartons and tubs. Consultancy creates design and installation value.<br><strong>Deliver:</strong> Global distribution network; direct to food manufacturer customers; consultancy projects on-site at customer facilities.<br><strong>Capture:</strong> Revenue from product sales + consultancy fees; profit margin must exceed cost of capital.</div><h4>Porter&apos;s Value Chain — Cartn Application</h4><ul><li><strong>Inbound logistics:</strong> Raw material procurement (aluminium, paperboard, plastic) — commodity price risk</li><li><strong>Operations:</strong> 27 factories manufacturing cartons and tubs — efficiency vs Valboxx is key</li><li><strong>Outbound logistics:</strong> Delivering packaging to food manufacturer customers globally</li><li><strong>Marketing &amp; Sales:</strong> Consultancy as a sales tool; patent portfolio as differentiator</li><li><strong>After-sales service:</strong> Engineering support for packaging line maintenance</li></ul><h4>Change Management — Cartn Context</h4><p>Cartn faces several change imperatives: (1) Developing recyclable packaging (technical transformation); (2) Potentially restructuring the consultancy division if it proves unprofitable; (3) Expanding into new markets. Each requires the Rally-Drive-Sustain change model. For sustainability change specifically: Rally = build the case using PPWR compliance imperative; Drive = define exact product redesign changes; Sustain = embed new materials and processes permanently.</p><div class='kbox'><strong>Stakeholder Analysis for Cartn</strong>Prioritise: customers (revenue = power + urgency + legitimacy); shareholders (provided capital); regulators (legal power). Employees (legitimacy + large group) should also feature in any change scenario.</div>",
"qa":[
{"q":"Apply the CGMA Business Model Framework to Cartn — describe how value is defined, created, delivered, and captured.","a":"<strong>Define:</strong> Key stakeholders are food manufacturer customers, shareholders, and regulators. Value proposition = technically superior, food-safe packaging solutions + engineering expertise that integrates with customers&apos; production.<br><strong>Create:</strong> 27 global factories convert aluminium, paperboard, and plastic into cartons/tubs; engineering consultancy creates value through system design and installation.<br><strong>Deliver:</strong> Products shipped directly to global food manufacturer customers; consultancy engineers work on-site at customer facilities.<br><strong>Capture:</strong> Revenue from product sales + consultancy fees, less total costs; surplus distributed as dividends (H$87.8m) or retained for reinvestment."},
{"q":"How would you apply Lewin&apos;s 3-stage change model to Cartn&apos;s sustainability transformation?","a":"<strong>Unfreeze (Rally):</strong> Communicate the compelling case for change — EU PPWR 2030 compliance is mandatory; greenwashing risk is real; growing customer ESG demands. Quantify the cost of inaction (fines, market exclusion, reputational damage).<br><strong>Change (Drive):</strong> Fund R&amp;D into mono-material or easily separable packaging alternatives; pilot in highest-volume markets first; invest in recycling partnerships; retrain engineers.<br><strong>Refreeze (Sustain):</strong> Embed new sustainable materials into standard product specifications; link performance targets to sustainability KPIs; communicate progress to stakeholders via IFRS S2 disclosures."},
{"q":"How does Cartn&apos;s consultancy division relate to the &apos;Social and Relationship Capital&apos; in the Integrated Reporting Six Capitals model?","a":"The consultancy division directly builds Cartn&apos;s <strong>Social and Relationship Capital</strong> — it creates deep, long-term relationships with food manufacturer customers that extend beyond simple product supply. These relationships represent: trust (customers rely on Cartn&apos;s engineers for critical production infrastructure); reciprocity (consultancy clients become manufacturing customers); reputation (Cartn is known as a solutions partner). This intangible capital is not visible in financial statements but is a key source of competitive advantage and future revenue sustainability."}
]},
{"id":"m9","icon":"⚙️","title":"P2 Techniques Applied to Cartn","subtitle":"ABC · Target costing · Performance measures · Risk management · Transfer pricing",
"theory":"<h4>Applying P2 Management Accounting to Cartn</h4><p>The Revision exam will present scenarios requiring specific P2 techniques applied to Cartn&apos;s real numbers and context.</p><h4>Activity-Based Costing (ABC) at Cartn</h4><p>Cartn&apos;s manufacturing involves multiple activities: raw material procurement, lamination, forming, filling, sealing, quality inspection, distribution. ABC would allocate overhead costs using specific drivers for each activity (e.g., number of quality inspections as driver for QC costs, machine set-ups for changeover costs). This would reveal the true cost of serving different customers — some customers requiring bespoke sizes or frequent small orders may be less profitable than they appear.</p><h4>Target Costing Applied to Cartn</h4><p>When developing a new eco-friendly packaging product: Market price (what customers will pay for sustainable packaging) minus desired margin = Target cost. If expected cost of new recyclable design exceeds target cost → cost gap must be closed by: value engineering (remove functions customers don&apos;t value); material substitution; design simplification.</p><h4>Risk Management — TARA Applied to Cartn</h4><table class='tbl'><tr><th>Risk</th><th>TARA Response</th><th>Specific Action</th></tr><tr><td>Commodity price (aluminium)</td><td><span class='tag ta'>Reduce</span></td><td>Commodity price hedging; supplier contracts</td></tr><tr><td>PPWR 2030 non-compliance</td><td><span class='tag tg'>Reduce/Avoid</span></td><td>R&amp;D investment now; avoid being caught non-compliant</td></tr><tr><td>Currency risk</td><td><span class='tag tb'>Transfer</span></td><td>FX hedging instruments; natural hedging</td></tr><tr><td>Factory fire/disaster</td><td><span class='tag tb'>Transfer</span></td><td>Insurance; business continuity plans</td></tr></table><h4>Performance Management — KPIs for Cartn</h4><p>Financial KPIs: OPM %; GPM %; Revenue growth %; ROE; Dividend cover. Non-financial KPIs: Recyclability % of products; Customer retention rate; Factory utilisation %; Employee turnover; Defect rate (PPM - parts per million).</p>",
"qa":[
{"q":"How would ABC improve Cartn&apos;s understanding of product and customer profitability?","a":"Traditional costing might allocate manufacturing overhead by production volume, making high-volume standard cartons appear to absorb more overhead than small bespoke orders. ABC would identify specific cost drivers: (1) <em>Set-up costs</em> — driven by number of production runs (small bespoke orders have more set-ups per unit); (2) <em>Quality inspection costs</em> — driven by number of inspections; (3) <em>Procurement costs</em> — driven by number of purchase orders. ABC would reveal that some bespoke or low-volume customers are actually loss-making once their true overhead consumption is allocated — enabling Cartn to reprice or renegotiate with these customers."},
{"q":"Apply target costing to Cartn&apos;s development of a new 100% recyclable carton.","a":"Target selling price: H$X per 1,000 units (researched from customer willingness to pay for eco-credentials — likely a small premium over standard cartons).<br>Target margin: 15% (matching Valboxx-comparable profitability).<br>Target cost = H$X × (1 − 15%)<br>If expected production cost of new recyclable design exceeds target cost, close the gap by: (1) Value engineering — identify carton functions customers value vs those they don&apos;t (can any layers be reduced?); (2) Material substitution — test mono-material alternatives; (3) Process redesign — can new materials be processed on existing equipment? (4) Scale — higher volumes reduce per-unit overhead."},
{"q":"What non-financial KPIs should Cartn use to measure sustainability performance?","a":"(1) <strong>% of products meeting recyclability standards</strong> — tracks progress toward PPWR 2030 compliance; (2) <strong>GHG emissions per tonne of product manufactured</strong> — Scope 1, 2, and 3 emissions (required by IFRS S2); (3) <strong>% of raw materials from certified sustainable sources</strong> — paperboard from FSC-certified forests; (4) <strong>Customer satisfaction scores on sustainability</strong> — do customers perceive Cartn as a sustainable partner? (5) <strong>Number of sustainability-related complaints or media incidents</strong> — tracks reputational risk."}
]},
{"id":"m10","icon":"📑","title":"F2 Techniques Applied to Cartn","subtitle":"Financial ratios · Intangibles (IAS 38) · Foreign currency · Investment appraisal · Segment reporting",
"theory":"<h4>Applying F2 Financial Reporting to Cartn</h4><p>Many Revision exam scenarios will require application of F2 knowledge — interpreting Cartn&apos;s financial statements, evaluating investments, and applying IFRS standards to Cartn&apos;s specific situation.</p><h4>IAS 38 Intangible Assets — Cartn&apos;s Patents</h4><p>Cartn holds <em>many patents</em> on packaging technology. IAS 38 implications: (1) Externally acquired patents: recognise at cost, amortise over useful life; (2) Internally developed patents (from R&amp;D): only capitalise if all 6 PIRATE development-phase criteria are met; (3) R&amp;D expense can be significant — an exam scenario might ask whether Cartn should capitalise more R&amp;D. Critically: internally generated brands and goodwill cannot be recognised — Cartn&apos;s consultancy brand value is an unrecognised intangible.</p><h4>Foreign Currency — Cartn&apos;s International Operations</h4><p>With 27 factories globally reporting in H$, Cartn has: (1) <em>Translation risk</em> — overseas subsidiary results are translated at closing/average rates, creating foreign currency reserves in equity; (2) <em>Transaction risk</em> — purchasing commodities (aluminium priced in USD globally) and selling to international customers creates FX exposure. The pre-seen shows a <em>Currency Reserve</em> in equity — this reflects translation differences.</p><h4>NPV Investment Appraisal at Cartn</h4><p>Key applications: building new factories; upgrading to eco-friendly packaging technology; expanding consultancy into new markets; acquiring a competitor. All require: incremental cash flows only; discount at Cartn&apos;s WACC; sensitivity analysis on key variables (raw material prices, exchange rates, market growth).</p><div class='kbox'><strong>F2 Ratios Examiners Test on Cartn</strong>Always use Cartn&apos;s actual 2026 numbers: GPM (22%), OPM (11.3%), ROE (28.7%), Current Ratio (2.04), Debt-to-Equity (0.40). Compare to Valboxx for benchmarking. Explain movements year-on-year.</div>",
"qa":[
{"q":"How does IAS 38 apply to Cartn&apos;s patent portfolio and R&D expenditure?","a":"Cartn&apos;s patents are intangible assets under IAS 38: (1) <em>Externally purchased patents</em>: recognised at cost, amortised over legal life (typically 20 years) or useful economic life (whichever shorter); (2) <em>Internally developed IP</em>: R&amp;D costs must be split — research phase costs are always expensed; development phase costs are capitalised only if all 6 PIRATE criteria are met (probable completion, intention, resources available, ability to use/sell, technical feasibility, economic benefits expected); (3) Cartn cannot capitalise internally generated goodwill or brand value from its consultancy reputation — these are off-balance sheet despite being economically valuable."},
{"q":"Cartn reports a currency translation reserve in equity. Explain what this represents and how it arises.","a":"Cartn operates 27 factories in multiple countries. When consolidating these foreign subsidiaries into H$ reporting: (1) Assets and liabilities of foreign operations are translated at the <em>closing exchange rate</em>; (2) Income and expenses are translated at the <em>average rate</em> for the year; (3) The difference between opening and closing rates creates a <em>translation gain or loss</em> that goes to Other Comprehensive Income (OCI) — accumulated in the Currency Translation Reserve in equity. This is not a cash flow — it is a bookkeeping adjustment. If H$ strengthens vs foreign currencies, the reserve will decrease (foreign assets worth less in H$)."},
{"q":"A new packaging production line costs H$80m, generates H$15m incremental OCF per year for 8 years, with H$5m residual value. Cost of capital = 10%. AF(10%,8) = 5.335. Calculate NPV and advise Cartn.","a":"PV of cash flows = H$15m × 5.335 = H$80.0m<br>PV of residual value = H$5m × (1/1.1⁸) = H$5m × 0.4665 = H$2.3m<br>Total PV of inflows = H$82.3m<br>Initial outflow = H$80.0m<br><strong>NPV = H$82.3m − H$80.0m = H$2.3m (positive)</strong><br>Recommendation: Accept the investment — it generates a positive NPV, adding H$2.3m to shareholder wealth. However, with a thin positive NPV, perform sensitivity analysis. A 3% fall in OCF would eliminate the NPV — management should stress-test the revenue assumptions before committing."}
]},
{"id":"m11","icon":"🎯","title":"Exam Competency Framework and Technique","subtitle":"&apos;I Can&apos; statements · Four competencies · Scoring · Verb hierarchy · Writing structure",
"theory":"<h4>The Revision Competency Framework</h4><p>The Revision exam is marked against a specific <strong>competency framework</strong> — not just technical knowledge. You must demonstrate each competency at a sufficient level to pass.</p><table class='tbl'><tr><th>Competency</th><th>What it tests</th><th>Approx marks</th></tr><tr><td><strong>Technical Skills</strong></td><td>Application of E2, F2, P2 knowledge</td><td>~25%</td></tr><tr><td><strong>Business Skills</strong></td><td>Commercial analysis; industry context; recommendations</td><td>~30%</td></tr><tr><td><strong>People Skills</strong></td><td>Stakeholder awareness; communication; leadership considerations</td><td>~20%</td></tr><tr><td><strong>Leadership Skills</strong></td><td>Strategic thinking; decision-making; integration</td><td>~25%</td></tr></table><div class='warn-box'><strong>Minimum Threshold Rule</strong>You must score approximately 1/3 of marks available in EACH competency to pass. You cannot compensate poor Business Skills with excellent Technical Skills. All four must be demonstrated.</div><h4>The Verb Hierarchy</h4><p>Revision requires <em>higher-order</em> verbs — not just describing or explaining: <strong>Analyse</strong> (break into components, identify causes), <strong>Evaluate</strong> (judge the significance, weigh pros and cons), <strong>Recommend</strong> (propose a specific course of action with justification). Never just list — always analyse and recommend.</p><h4>Answer Structure — The PACER Approach</h4><div class='fw'><strong>P — Point:</strong> State your key point or recommendation upfront<br><strong>A — Application:</strong> Apply it specifically to Cartn using actual data<br><strong>C — Consequence:</strong> Explain the financial/operational consequences<br><strong>E — Evidence:</strong> Quote specific numbers from Cartn&apos;s pre-seen<br><strong>R — Recommendation:</strong> Give a clear, actionable recommendation</div>",
"qa":[
{"q":"What are the four competency areas in the Revision exam and why must all four be demonstrated?","a":"<strong>Technical Skills</strong> (~25%): Applying E2/F2/P2 knowledge accurately. <strong>Business Skills</strong> (~30%): Commercial analysis, industry context, business-focused recommendations. <strong>People Skills</strong> (~20%): Stakeholder awareness, communication, organisational factors. <strong>Leadership Skills</strong> (~25%): Strategic thinking, integration of multiple factors, sound judgment.<br>All four must be demonstrated because there is a <em>minimum threshold</em> of approximately 1/3 of available marks per competency. Failing to demonstrate any competency adequately risks failing the paper even with high marks elsewhere."},
{"q":"What is the difference between a Level 1, Level 2, and Level 3 answer in the Revision exam?","a":"<strong>Level 1:</strong> Generic or knowledge-based — identifies concepts but does not apply them to Cartn. Example: &apos;Operating leverage means fixed costs&apos;. Lowest marks.<br><strong>Level 2:</strong> Applied to Cartn but lacks depth or recommendation. Example: &apos;Cartn has operating leverage because revenue grew 7.5% but operating profit grew 52.3%&apos;.<br><strong>Level 3:</strong> Full analysis with quantification, consequence, and recommendation specific to Cartn. Example: &apos;Cartn&apos;s 52.3% operating profit growth on 7.5% revenue growth reveals high operating leverage — the fixed cost base means any revenue decline will disproportionately reduce profit. Management should [specific recommendation]. This risk is quantified by [calculation].&apos; Highest marks — always aim for Level 3."},
{"q":"A question asks you to &apos;evaluate&apos; Cartn&apos;s decision to pay H$87.8m in dividends. How should you structure your answer?","a":"Using PACER: <strong>Point</strong>: Dividends of H$87.8m represent a 79% payout ratio on H$111.1m profit — a high but sustainable short-term policy given strong performance.<br><strong>Application</strong>: Dividend cover = 1.27x — thin vs the typically comfortable 2x. Operating leverage means profits are sensitive to revenue falls.<br><strong>Consequence</strong>: Limited reinvestment funds for R&amp;D (PPWR compliance), factory investment, or new market entry. A 15% revenue fall could make the dividend unsustainable.<br><strong>Evidence</strong>: H$87.8m dividends; H$111.1m profit; OPM 11.3%; thin current ratio improvement (2.04).<br><strong>Recommendation</strong>: Review dividend policy to reduce payout to 50-60%, retaining H$20-30m more per year for sustainability investment and strategic growth."}
]},

v class='kbox'><strong>Scenario 2 Model Calculation</strong>NPV = (H$8m × 6.145) − H$50m = H$49.16m − H$50m = <strong>−H$0.84m (marginally negative)</strong>. The project fails NPV on financial grounds alone — but non-financial benefits (PPWR compliance, brand protection, market positioning) may justify proceeding. Always discuss both the financial and non-financial case.</div>",
